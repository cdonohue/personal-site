<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 01 — Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* ── Unit 01 tokens ─────────────────────────────────────────── */
:root, [data-theme="light"] {
  --chassis:#ffffff; --panel:#ffffff; --panel-sunk:#f0f0ee; --ink:#000000; --ink-muted:#5f5f5c; --line:#c8c8c4; --rule:var(--ink);
  --signal:#ff5a1f; --signal-text:#a83400; --on-signal:#000000; --blue:#3a63d8; --on-blue:#ffffff; --yellow:#f5c400; --on-yellow:#111111;
  --key:#e6e6e3; --lcd:#0b0b0b; --lcd-ink:#f2f2ef; --lcd-muted:#8f8f8a; --lcd-dim:#2a2a2a; --focus:var(--ink);
  --shadow-key:0 2px 0 #00000040; --shadow-key-pressed:0 0 0 #00000040;
}
[data-theme="dark"] {
  --chassis:#000000; --panel:#000000; --panel-sunk:#161616; --ink:#ffffff; --ink-muted:#9b9b97; --line:#3a3a3a; --key:#262626; --rule:var(--ink);
  --signal-text:#ff7a45; --shadow-key:0 2px 0 #ffffff26; --shadow-key-pressed:0 0 0 #ffffff26;
}
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-0:0; --radius-sm:2px; --radius-md:6px; --radius-full:9999px;
  --font-sans:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* ── Unit 01 components (vanilla port of the bundle) ────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); background: var(--chassis); color: var(--ink); -webkit-font-smoothing: antialiased; }
:where(button, input, [role="slider"]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.u-label { display: inline-flex; gap: var(--space-2); align-items: baseline; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.u-label b { font-weight: 700; color: var(--ink); }
.u-value { font-family: var(--font-mono); font-size: 13px; line-height: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
.u-led { display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--line); flex: none; }
.u-key .u-led, .u-selector__opt .u-led { background: var(--line); }
.is-on > .u-led, .u-led.is-lit { background: var(--signal); }

.u-key { appearance: none; position: relative; display: inline-flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  min-width: 0; padding: var(--space-2); border: 0; border-radius: var(--radius-0); background: var(--key); color: var(--ink);
  font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: left;
  box-shadow: var(--shadow-key); cursor: pointer; transition: transform 60ms linear, box-shadow 60ms linear; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.u-key:active, .u-key.is-hit, .u-key[aria-pressed="true"] { transform: translateY(2px); box-shadow: var(--shadow-key-pressed); }
.u-key--ink { background: var(--ink); color: var(--chassis); }
.u-key--signal { background: var(--signal); color: var(--on-signal); }
.u-key--blue { background: var(--blue); color: var(--on-blue); }
.u-key--yellow { background: var(--yellow); color: var(--on-yellow); }
.u-key__top { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: var(--space-1); }
.u-key__index { font-family: var(--font-mono); font-weight: 500; font-size: 9px; line-height: 12px; letter-spacing: .1em; opacity: .75; }
.u-key__glyph { align-self: center; display: flex; }
.u-key__glyph svg { width: 22px; height: 22px; fill: currentColor; }
.u-key--sm { width: 40px; height: 40px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; }

.u-panel { background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: var(--radius-0); min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
.u-panel__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-3); }
.u-panel__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel__body { padding: 0 0 var(--space-2); display: flex; flex-direction: column; gap: var(--space-4); flex: 1; }

.u-display { background: var(--lcd); color: var(--lcd-ink); border: 1px solid var(--line); border-radius: var(--radius-0); font-family: var(--font-mono); }
.u-display__label { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--lcd-muted); white-space: nowrap; }
.u-display__unit { font-size: 13px; line-height: 16px; color: var(--lcd-muted); text-transform: uppercase; letter-spacing: .08em; }

.u-selector { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-selector__row { display: flex; gap: 2px; border-radius: var(--radius-0); }
.u-selector__opt { appearance: none; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-2);
  background: var(--key); color: var(--ink); border: 0; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.u-selector__opt:first-child { border-left: 0; }
.u-selector__opt.is-on { background: var(--ink); color: var(--chassis); }
.u-selector__opt:focus-visible { outline-offset: -4px; }

.u-switch { appearance: none; display: inline-flex; align-items: center; gap: var(--space-3); padding: var(--space-1) 0; background: none; border: 0; color: var(--ink); cursor: pointer; }
.u-switch__track { position: relative; width: 40px; height: 20px; background: var(--panel-sunk); border: 1px solid var(--ink); border-radius: var(--radius-sm); flex: none; }
.u-switch__thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 14px; background: var(--ink); border-radius: var(--radius-sm); transition: left 80ms linear; }
.u-switch[aria-checked="true"] .u-switch__track { background: var(--signal); }
.u-switch[aria-checked="true"] .u-switch__thumb { left: 20px; background: var(--on-signal); }
.u-switch__state { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; min-width: 3ch; }

.u-fader { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-fader__head { display: flex; justify-content: space-between; align-items: baseline; }
.u-fader__input { appearance: none; -webkit-appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: ew-resize; }
.u-fader__input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-moz-range-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 28px; margin-top: -13px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }
.u-fader__input::-moz-range-thumb { width: 14px; height: 28px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }

.u-knob { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.u-knob__dial { border-radius: var(--radius-full); cursor: grab; touch-action: none; line-height: 0; }
.u-knob__tick { stroke: var(--line); stroke-width: 1.5; }
.u-knob__track { fill: none; stroke: var(--panel-sunk); stroke-width: 3; }
.u-knob__arc { fill: none; stroke: var(--signal); stroke-width: 3; }
.u-knob__cap { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.u-knob__ind { stroke: var(--ink); stroke-width: 3; stroke-linecap: square; }
.u-knob__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; }


/* ── Shared app shell (Unit 01 apps, fork C) ── */
.shell { height: 100dvh; overflow: auto; container: shell / size; }
.device { min-height: 100%; display: grid; gap: var(--space-2); padding: var(--space-2); grid-template-columns: minmax(0, 1fr); }
.bar { display: none; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-1) var(--space-1) 0; container: bar / inline-size; min-width: 0; grid-area: bar; }
.bar__title { display: inline-flex; align-items: flex-start; gap: var(--space-2); font: 800 clamp(18px, 4.2cqi, 34px)/1 var(--font-sans); letter-spacing: -.025em; white-space: nowrap; }
.bar__idx { font: 500 9px/12px var(--font-mono); letter-spacing: .1em; color: var(--ink-muted); }
.bar__right { display: flex; align-items: center; gap: var(--space-4); min-width: 0; }
.bar__meta { display: none; }
@container bar (min-width: 420px) { .bar__meta { display: inline-flex; } }
.section { border-top: 2px solid var(--rule); padding-top: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; min-height: 0; }
.section__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.section__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.u-field__input { box-sizing: border-box; width: 100%; min-width: 0; height: 40px; padding: 0 var(--space-3); background: var(--panel-sunk); color: var(--ink); border: 0; border-bottom: 2px solid var(--ink); border-radius: var(--radius-0); font: 400 15px/22px var(--font-sans); }
.u-field__input--mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.u-field__input::placeholder { color: var(--ink-muted); }
.u-pick { appearance: none; -webkit-appearance: none; width: 100%; height: 40px; min-width: 0; padding: 0 28px 0 var(--space-3); background: var(--key) linear-gradient(45deg, transparent 50%, var(--ink) 50%) no-repeat right 14px center / 6px 6px; color: var(--ink); border: 0; border-radius: var(--radius-0); box-shadow: var(--shadow-key);
  font: 700 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.row { display: flex; gap: var(--space-2); align-items: center; min-width: 0; }
.grow { flex: 1 1 0; min-width: 0; }
.k-row { height: 40px; flex-direction: row; align-items: center; justify-content: center; }
.k-x { width: 32px; height: 32px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; flex: none; }
.is-armed { background: var(--ink) !important; color: var(--chassis) !important; }
.u-panel { min-height: 0; }
.u-panel__body { min-height: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.hero { grid-area: hero; } .transport { grid-area: transport; } .chips { grid-area: chips; } .p-step { grid-area: step; } .p-list { grid-area: list; } .p-hist { grid-area: hist; }
.device { grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "hero" "transport"; }
.chips, .p-step, .p-list, .p-hist { display: none; }

/* Hero */
.hero { container: hero / inline-size; display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-2); padding: var(--space-3); min-height: 0; overflow: hidden; }
.hero__top { display: flex; justify-content: space-between; gap: var(--space-3); }
.hero__pos, .hero__goal { display: none; }
.hero__name { overflow: hidden; text-overflow: ellipsis; }
.hero__main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.big { font: 800 clamp(40px, min(34cqi, 26cqb), 300px)/.9 var(--font-sans); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.meter { display: none; grid-template-columns: repeat(20, 1fr); gap: clamp(2px, .8cqi, 6px); }
.hero.has-goal .meter { display: grid; }
.seg { height: clamp(6px, 2.4cqi, 16px); background: var(--lcd-dim); }
.seg.is-lit { background: var(--lcd-ink); }
.hero.is-goal .seg.is-lit { background: var(--signal); }
.hero__bottom { display: none; justify-content: space-between; }
.hero.has-goal .hero__bottom { display: flex; }
.hero.is-goal .goal-flag { color: var(--signal); }
@container hero (min-width: 260px) { .hero { padding: var(--space-4); } .hero__goal { display: inline; } }
@container hero (min-width: 380px) { .hero__pos { display: inline; } }

/* Transport */
.transport { container: transport / inline-size; display: flex; gap: var(--space-2); min-width: 0; }
.transport .u-key { flex: 1 1 0; height: clamp(56px, 22cqi, 120px); }
.transport .k-plus { flex-grow: 2.2; }
.transport .k-reset { display: none; }
.k-big .u-key__glyph { align-self: center; font: 800 clamp(22px, 9cqi, 56px)/1 var(--font-sans); }
@container transport (max-width: 199px) { .transport .u-key__text { display: none; } .transport .u-key { align-items: center; justify-content: center; } }

/* Chips */
.chips__row { display: flex; gap: 2px; overflow-x: auto; }
.chip { appearance: none; flex: 0 0 auto; display: inline-flex; align-items: center; gap: var(--space-2); height: 36px; padding: 0 var(--space-3); background: var(--key); color: var(--ink); border: 0; font: 700 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.chip .u-value { color: inherit; font-size: 11px; }
.chip.is-on { background: var(--ink); color: var(--chassis); }

/* List */
.p-list { container: list / inline-size; }
.p-list .u-panel__body { overflow: auto; }
.cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-2); }
.card { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; align-items: center; gap: var(--space-2); padding: var(--space-2) 0; border-bottom: 1px solid var(--line); }
.card__sel { appearance: none; background: none; border: 0; padding: 0; text-align: left; color: var(--ink); cursor: pointer; min-width: 0; display: flex; align-items: center; gap: var(--space-2); font: 700 13px/16px var(--font-sans); letter-spacing: .02em; }
.card__sel span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card.is-active .card__sel { color: var(--ink); }
.card__val { font: 400 22px/1 var(--font-mono); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
.card .k-x { width: 36px; height: 36px; }
.card .k-pm { display: none; }
.add { display: flex; gap: var(--space-2); align-items: flex-end; }
@container list (min-width: 400px) {
  .cards { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .card { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "sel x" "val val" "pm pm"; border-bottom: 0; border-top: 2px solid var(--rule); padding: var(--space-2) 0 var(--space-3); row-gap: var(--space-2); }
  .card__sel { grid-area: sel; } .card .k-del { grid-area: x; }
  .card__val { grid-area: val; text-align: left; font: 800 44px/1 var(--font-sans); letter-spacing: -.04em; }
  .card .k-pm { display: flex; grid-area: pm; gap: var(--space-2); }
  .card .k-pm .u-key { flex: 1; height: 40px; align-items: center; justify-content: center; font-size: 15px; }
}

/* Step panel */
.stepper-row { display: flex; gap: var(--space-2); align-items: flex-end; }

/* History */
.hist { display: flex; flex-direction: column; gap: 0; overflow: auto; min-height: 0; }
.hist__row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: var(--space-3); align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.hist__row .u-value { font-size: 12px; }
.hist__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist__empty { color: var(--ink-muted); font-size: 13px; }
.d-up { color: var(--ink); } .d-down { color: var(--ink-muted); }

/* Tiers */
@container shell (min-width: 300px) and (min-height: 360px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar" "hero" "transport"; }
  .bar { display: flex; }
}
@container shell (min-width: 300px) { .transport .k-reset { display: inline-flex; } }
@container shell (min-width: 300px) and (min-height: 540px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar" "hero" "chips" "transport"; }
  .chips { display: flex; }
}
@container shell (min-width: 520px) and (min-height: 760px) {
  .device { gap: var(--space-4); padding: var(--space-4); grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: auto minmax(0, 1fr) auto auto auto; grid-template-areas: "bar bar" "hero hero" "chips chips" "transport transport" "step list"; }
  .p-step, .p-list { display: flex; }
  .p-list { max-height: 300px; }
}
@container shell (min-width: 560px) and (max-height: 359px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(200px, 34cqi, 340px); grid-template-rows: minmax(0, 1fr); grid-template-areas: "hero transport"; }
}
@container shell (min-width: 560px) and (min-height: 360px) and (max-height: 539px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(220px, 34cqi, 360px); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "hero transport" "chips transport"; }
  .chips { display: flex; }
}
@container shell (min-width: 560px) and (max-height: 539px) {
  .transport { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 2fr 1fr; grid-template-areas: "plus plus" "minus reset"; }
  .transport .u-key { height: auto; }
  .k-plus { grid-area: plus; } .k-minus { grid-area: minus; } .k-reset { grid-area: reset; }
}
@container shell (min-width: 820px) and (min-height: 540px) {
  .device { gap: var(--space-4); padding: var(--space-6); grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "hero list" "transport step"; }
  .chips { display: none; }
  .p-step, .p-list { display: flex; }
  .p-list { max-height: none; }
}
@container shell (min-width: 820px) and (max-height: 759px) {
  .device { padding: var(--space-4); }
  .u-panel__head { padding: var(--space-1) 0 var(--space-2); }
  .u-panel__body { padding: 0; gap: var(--space-3); }
}
@container shell (min-width: 1180px) and (min-height: 760px) {
  .device { padding: var(--space-8); grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr) minmax(260px, .7fr);
    grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar bar" "hero list hist" "transport step hist"; }
  .p-hist { display: flex; }
}
/* iOS zooms into any field under 16px: keep every text field at 16px or more */
input#goal, input#newName, input#rename { font-size: 16px !important; }
</style>
</head>
<body>
<div class="shell">
<main class="device">

  <header class="bar">
    <span class="bar__title"><span class="bar__idx">10</span>Counter</span>
    <div class="bar__right">
      <span class="u-label bar__meta" id="barMeta">Step 1</span>
      <button class="u-switch" role="switch" aria-checked="false" id="themeSw" aria-label="Dark theme">
        <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
        <span class="u-label">Dark</span>
      </button>
    </div>
  </header>

  <section class="hero u-display" id="hero" aria-label="Active counter">
    <div class="hero__top">
      <span class="u-display__label hero__name" id="heroName">Reps</span>
      <span class="u-display__label hero__pos" id="heroPos">01 / 01</span>
      <span class="u-display__label hero__goal" id="heroGoal">No goal</span>
    </div>
    <div class="hero__main"><output class="big" id="big" aria-live="polite">0</output></div>
    <div>
      <div class="meter" id="meter" aria-hidden="true"></div>
    </div>
    <div class="hero__bottom">
      <span class="u-display__label" id="goalPct">0%</span>
      <span class="u-display__label goal-flag" id="goalFlag">To go</span>
    </div>
  </section>

  <section class="chips section" aria-label="Switch counter">
    <div class="section__head"><span class="u-label"><b>01</b> Counters</span><span class="u-label" id="chipCount"></span></div>
    <div class="chips__row" id="chips" role="radiogroup" aria-label="Active counter"></div>
  </section>

  <section class="transport" aria-label="Count">
    <button class="u-key k-minus k-big" id="minus" aria-label="Count down"><span class="u-key__glyph" aria-hidden="true">−</span><span class="u-key__text" id="minusText">−1</span></button>
    <button class="u-key u-key--signal k-plus k-big" id="plus" aria-label="Count up"><span class="u-key__top"><span class="u-key__index">Space</span></span><span class="u-key__glyph" aria-hidden="true">+</span><span class="u-key__text" id="plusText">+1</span></button>
    <button class="u-key k-reset" id="reset" aria-label="Reset counter"><span class="u-key__top"><span class="u-key__index">0</span></span><span class="u-key__text">Reset</span></button>
  </section>

  <section class="u-panel p-step" aria-label="Step and goal">
    <header class="u-panel__head"><span class="u-label"><b>02</b> Step &amp; goal</span></header>
    <div class="u-panel__body">
      <div class="u-selector">
        <span class="u-label" id="stepLbl">Step</span>
        <div class="u-selector__row" role="radiogroup" aria-labelledby="stepLbl" id="stepSel">
          <button class="u-selector__opt" role="radio" data-v="1"><span class="u-led"></span>1</button>
          <button class="u-selector__opt" role="radio" data-v="5"><span class="u-led"></span>5</button>
          <button class="u-selector__opt" role="radio" data-v="10"><span class="u-led"></span>10</button>
        </div>
      </div>
      <div class="stepper-row">
        <label class="u-field grow"><span class="u-label">Goal (blank = none)</span><input class="u-field__input u-field__input--mono" id="goal" type="number" min="1" inputmode="numeric" placeholder="e.g. 100"></label>
        <label class="u-field grow"><span class="u-label">Name</span><input class="u-field__input" id="rename" type="text" maxlength="24"></label>
      </div>
    </div>
  </section>

  <section class="u-panel p-list" aria-label="All counters">
    <header class="u-panel__head"><span class="u-label"><b>03</b> All counters</span><span class="u-label" id="listCount"></span></header>
    <div class="u-panel__body">
      <div class="cards" id="cards"></div>
      <form class="add" id="addForm">
        <label class="u-field grow"><span class="u-label">New counter</span><input class="u-field__input" id="newName" type="text" maxlength="24" placeholder="Laps, stitches…"></label>
        <button class="u-key k-row" type="submit" style="width:72px"><span class="u-key__text">Add</span></button>
      </form>
    </div>
  </section>

  <section class="u-panel p-hist" aria-label="History">
    <header class="u-panel__head"><span class="u-label"><b>04</b> History</span><span class="u-label">Last 20</span></header>
    <div class="u-panel__body"><div class="hist" id="hist"></div></div>
  </section>

</main>
</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n, w) { n = String(Math.max(0, Math.floor(Math.abs(n)))); while (n.length < w) n = '0' + n; return n; };
  var clamp = function (n, a, b) { return Math.min(b, Math.max(a, n)); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function load(key, state) { try { var s = JSON.parse(localStorage.getItem(key) || 'null'); if (s) Object.assign(state, s); } catch (e) {} }
  function saver(key, state) { return function () { try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {} }; }
  function themeInit(state, save) {
    function apply() {
      var dark = state.theme ? state.theme === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      $('themeSw').setAttribute('aria-checked', String(dark));
    }
    $('themeSw').addEventListener('click', function () { state.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; apply(); save(); });
    apply();
  }
  function bindSwitch(el, get, set) {
    var sync = function () { el.setAttribute('aria-checked', String(!!get())); };
    el.addEventListener('click', function () { set(!get()); sync(); });
    sync(); return sync;
  }
  function selector(el, get, set) {
    var opts = Array.prototype.slice.call(el.querySelectorAll('[role=radio]'));
    function sync() { opts.forEach(function (o) { var on = o.dataset.v === String(get()); o.classList.toggle('is-on', on); o.setAttribute('aria-checked', String(on)); o.tabIndex = on ? 0 : -1; }); }
    opts.forEach(function (o, i) {
      o.addEventListener('click', function () { set(o.dataset.v); sync(); });
      o.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
        if (!d) return; e.preventDefault(); var j = (i + d + opts.length) % opts.length; opts[j].click(); opts[j].focus();
      });
    });
    sync(); return sync;
  }
  function inControl(t) { return t.closest && t.closest('button, input, select, textarea, [role="slider"]'); }
  function armed(btn, label, ms, onConfirm) {
    var timer = null, orig = null;
    btn.addEventListener('click', function () {
      var tx = btn.querySelector('.u-key__text');
      if (btn.classList.contains('is-armed')) { clearTimeout(timer); btn.classList.remove('is-armed'); tx.textContent = orig; onConfirm(); return; }
      orig = tx.textContent;
      btn.classList.add('is-armed'); tx.textContent = label;
      timer = setTimeout(function () { btn.classList.remove('is-armed'); tx.textContent = orig; }, ms || 2000);
    });
  }

  var KEY = 'unit01-counter';
  var state = { counters: [{ id: 1, name: 'Reps', value: 0, goal: null }], active: 1, step: 1, nextId: 2, history: [], theme: null };
  load(KEY, state); var save = saver(KEY, state);
  if (!state.counters.length) state.counters = [{ id: 1, name: 'Reps', value: 0, goal: null }];
  themeInit(state, save);

  var cur = function () { return state.counters.filter(function (c) { return c.id === state.active; })[0] || state.counters[0]; };
  var meter = $('meter');
  for (var i = 0; i < 20; i++) { var s = document.createElement('span'); s.className = 'seg'; meter.appendChild(s); }

  function change(c, delta) {
    var before = c.value; c.value = Math.max(0, c.value + delta);
    if (c.value === before) return;
    state.history.unshift({ t: Date.now(), name: c.name, d: c.value - before, v: c.value });
    state.history = state.history.slice(0, 20);
    save(); render();
  }
  function renderHero() {
    var c = cur(), idx = state.counters.indexOf(c);
    $('big').textContent = c.value;
    $('heroName').textContent = c.name;
    $('heroPos').textContent = pad(idx + 1, 2) + ' / ' + pad(state.counters.length, 2);
    var hero = $('hero'), g = c.goal;
    hero.classList.toggle('has-goal', !!g);
    $('heroGoal').textContent = g ? 'Goal ' + g : 'No goal';
    if (g) {
      var f = Math.min(1, c.value / g), lit = Math.round(f * 20), done = c.value >= g;
      Array.prototype.forEach.call(meter.children, function (s, j) { s.classList.toggle('is-lit', j < lit); });
      hero.classList.toggle('is-goal', done);
      $('goalPct').textContent = Math.round(f * 100) + '%';
      $('goalFlag').textContent = done ? 'Goal reached' : (g - c.value) + ' to go';
    } else hero.classList.remove('is-goal');
    var st = state.step;
    $('plusText').textContent = '+' + st; $('minusText').textContent = '−' + st;
    $('plus').setAttribute('aria-label', 'Count up by ' + st); $('minus').setAttribute('aria-label', 'Count down by ' + st);
    $('barMeta').textContent = 'Step ' + st + ' · ' + state.counters.length + ' counter' + (state.counters.length > 1 ? 's' : '');
    if (document.activeElement !== $('rename')) $('rename').value = c.name;
    if (document.activeElement !== $('goal')) $('goal').value = c.goal || '';
  }
  function renderChips() {
    var row = $('chips'); row.innerHTML = '';
    state.counters.forEach(function (c) {
      var b = document.createElement('button'); b.className = 'chip' + (c.id === state.active ? ' is-on' : '');
      b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(c.id === state.active));
      b.innerHTML = esc(c.name) + ' <span class="u-value">' + c.value + '</span>';
      b.addEventListener('click', function () { state.active = c.id; save(); render(); });
      row.appendChild(b);
    });
    $('chipCount').textContent = state.counters.length + ' total';
  }
  function renderCards() {
    var box = $('cards'); box.innerHTML = '';
    state.counters.forEach(function (c) {
      var el = document.createElement('div'); el.className = 'card' + (c.id === state.active ? ' is-active' : '');
      el.innerHTML = '<button class="card__sel" aria-pressed="' + (c.id === state.active) + '"><span class="u-led' + (c.id === state.active ? ' is-lit' : '') + '"></span><span>' + esc(c.name) + '</span></button>' +
        '<span class="card__val">' + c.value + '</span>' +
        '<span class="k-pm"><button class="u-key" data-d="-1" aria-label="' + esc(c.name) + ' down">−</button><button class="u-key" data-d="1" aria-label="' + esc(c.name) + ' up">+</button></span>' +
        '<button class="u-key k-x k-del" aria-label="Delete ' + esc(c.name) + '"><span class="u-key__text">×</span></button>';
      el.querySelector('.card__sel').addEventListener('click', function () { state.active = c.id; save(); render(); });
      el.querySelectorAll('.k-pm .u-key').forEach(function (k) { k.addEventListener('click', function () { change(c, +k.dataset.d * state.step); }); });
      var del = el.querySelector('.k-del');
      if (state.counters.length > 1) armed(del, '?', 2000, function () {
        state.counters = state.counters.filter(function (x) { return x.id !== c.id; });
        if (state.active === c.id) state.active = state.counters[0].id;
        save(); render();
      }); else del.disabled = true;
      box.appendChild(el);
    });
    $('listCount').textContent = state.counters.length;
  }
  function renderHist() {
    var h = $('hist');
    if (!state.history.length) { h.innerHTML = '<span class="hist__empty">Nothing counted yet.</span>'; return; }
    h.innerHTML = state.history.map(function (e) {
      var d = new Date(e.t);
      return '<div class="hist__row"><span class="u-value">' + pad(d.getHours(), 2) + ':' + pad(d.getMinutes(), 2) + ':' + pad(d.getSeconds(), 2) + '</span>' +
        '<span class="hist__name">' + esc(e.name) + '</span><span class="u-value ' + (e.d > 0 ? 'd-up' : 'd-down') + '">' + (e.d > 0 ? '+' : '−') + Math.abs(e.d) + '</span><span class="u-value">' + e.v + '</span></div>';
    }).join('');
  }
  function render() { renderHero(); renderChips(); renderCards(); renderHist(); }

  $('plus').addEventListener('click', function () { change(cur(), state.step); });
  $('minus').addEventListener('click', function () { change(cur(), -state.step); });
  armed($('reset'), 'Tap again', 2000, function () { var c = cur(); change(c, -c.value); });
  selector($('stepSel'), function () { return state.step; }, function (v) { state.step = +v; save(); renderHero(); });
  $('goal').addEventListener('input', function (e) { var v = parseInt(e.target.value, 10); cur().goal = v > 0 ? v : null; save(); renderHero(); });
  $('rename').addEventListener('input', function (e) { var v = e.target.value.trim(); if (v) { cur().name = v; save(); renderHero(); renderChips(); renderCards(); } });
  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault(); var n = $('newName').value.trim(); if (!n) { $('newName').focus(); return; }
    var c = { id: state.nextId++, name: n, value: 0, goal: null }; state.counters.push(c); state.active = c.id;
    $('newName').value = ''; save(); render();
  });

  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t.closest && t.closest('input, select, textarea, [role="slider"], [role="radio"]')) return;
    if (inControl(t) && (e.key === ' ' || e.key === 'Enter' || e.key === 'Backspace')) return;
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === '+' || e.key === '=') { e.preventDefault(); $('plus').click(); flash($('plus')); }
    else if (e.key === 'ArrowDown' || e.key === 'Backspace' || e.key === '-') { e.preventDefault(); $('minus').click(); flash($('minus')); }
  });
  function flash(k) { k.classList.add('is-hit'); setTimeout(function () { k.classList.remove('is-hit'); }, 80); }
  render();
})();
</script>
</body>
</html>
