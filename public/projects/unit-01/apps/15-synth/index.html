<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 01 — Synth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* ── Unit 01 tokens ─────────────────────────────────────────── */
:root, [data-theme="light"] {
  --chassis:#ffffff; --panel:#ffffff; --panel-sunk:#f0f0ee; --ink:#000000; --ink-muted:#5f5f5c; --line:#c8c8c4; --rule:var(--ink);
  --signal:#ff5a1f; --signal-text:#a83400; --on-signal:#000000; --blue:#3a63d8; --on-blue:#ffffff; --yellow:#f5c400; --on-yellow:#111111;
  --key:#e6e6e3; --lcd:#0b0b0b; --lcd-ink:#f2f2ef; --lcd-muted:#8f8f8a; --lcd-dim:#2a2a2a; --focus:var(--ink);
  --shadow-key:0 2px 0 #00000040; --shadow-key-pressed:0 0 0 #00000040;
}
[data-theme="dark"] {
  --chassis:#000000; --panel:#000000; --panel-sunk:#161616; --ink:#ffffff; --ink-muted:#9b9b97; --line:#3a3a3a; --key:#262626; --rule:var(--ink);
  --signal-text:#ff7a45; --shadow-key:0 2px 0 #ffffff26; --shadow-key-pressed:0 0 0 #ffffff26;
}
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-0:0; --radius-sm:2px; --radius-md:6px; --radius-full:9999px;
  --font-sans:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* ── Unit 01 components (vanilla port of the bundle) ────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); background: var(--chassis); color: var(--ink); -webkit-font-smoothing: antialiased; }
:where(button, input, [role="slider"]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.u-label { display: inline-flex; gap: var(--space-2); align-items: baseline; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.u-label b { font-weight: 700; color: var(--ink); }
.u-value { font-family: var(--font-mono); font-size: 13px; line-height: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
.u-led { display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--line); flex: none; }
.u-key .u-led, .u-selector__opt .u-led { background: var(--line); }
.is-on > .u-led, .u-led.is-lit { background: var(--signal); }

.u-key { appearance: none; position: relative; display: inline-flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  min-width: 0; padding: var(--space-2); border: 0; border-radius: var(--radius-0); background: var(--key); color: var(--ink);
  font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: left;
  box-shadow: var(--shadow-key); cursor: pointer; transition: transform 60ms linear, box-shadow 60ms linear; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.u-key:active, .u-key.is-hit, .u-key[aria-pressed="true"] { transform: translateY(2px); box-shadow: var(--shadow-key-pressed); }
.u-key--ink { background: var(--ink); color: var(--chassis); }
.u-key--signal { background: var(--signal); color: var(--on-signal); }
.u-key--blue { background: var(--blue); color: var(--on-blue); }
.u-key--yellow { background: var(--yellow); color: var(--on-yellow); }
.u-key__top { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: var(--space-1); }
.u-key__index { font-family: var(--font-mono); font-weight: 500; font-size: 9px; line-height: 12px; letter-spacing: .1em; opacity: .75; }
.u-key__glyph { align-self: center; display: flex; }
.u-key__glyph svg { width: 22px; height: 22px; fill: currentColor; }
.u-key--sm { width: 40px; height: 40px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; }

.u-panel { background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: var(--radius-0); min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
.u-panel__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-3); }
.u-panel__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel__body { padding: 0 0 var(--space-2); display: flex; flex-direction: column; gap: var(--space-4); flex: 1; }

.u-display { background: var(--lcd); color: var(--lcd-ink); border: 1px solid var(--line); border-radius: var(--radius-0); font-family: var(--font-mono); }
.u-display__label { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--lcd-muted); white-space: nowrap; }
.u-display__unit { font-size: 13px; line-height: 16px; color: var(--lcd-muted); text-transform: uppercase; letter-spacing: .08em; }

.u-selector { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-selector__row { display: flex; gap: 2px; border-radius: var(--radius-0); }
.u-selector__opt { appearance: none; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-2);
  background: var(--key); color: var(--ink); border: 0; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.u-selector__opt:first-child { border-left: 0; }
.u-selector__opt.is-on { background: var(--ink); color: var(--chassis); }
.u-selector__opt:focus-visible { outline-offset: -4px; }

.u-switch { appearance: none; display: inline-flex; align-items: center; gap: var(--space-3); padding: var(--space-1) 0; background: none; border: 0; color: var(--ink); cursor: pointer; }
.u-switch__track { position: relative; width: 40px; height: 20px; background: var(--panel-sunk); border: 1px solid var(--ink); border-radius: var(--radius-sm); flex: none; }
.u-switch__thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 14px; background: var(--ink); border-radius: var(--radius-sm); transition: left 80ms linear; }
.u-switch[aria-checked="true"] .u-switch__track { background: var(--signal); }
.u-switch[aria-checked="true"] .u-switch__thumb { left: 20px; background: var(--on-signal); }
.u-switch__state { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; min-width: 3ch; }

.u-fader { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-fader__head { display: flex; justify-content: space-between; align-items: baseline; }
.u-fader__input { appearance: none; -webkit-appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: ew-resize; }
.u-fader__input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-moz-range-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 28px; margin-top: -13px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }
.u-fader__input::-moz-range-thumb { width: 14px; height: 28px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }

.u-knob { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.u-knob__dial { border-radius: var(--radius-full); cursor: grab; touch-action: none; line-height: 0; }
.u-knob__tick { stroke: var(--line); stroke-width: 1.5; }
.u-knob__track { fill: none; stroke: var(--panel-sunk); stroke-width: 3; }
.u-knob__arc { fill: none; stroke: var(--signal); stroke-width: 3; }
.u-knob__cap { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.u-knob__ind { stroke: var(--ink); stroke-width: 3; stroke-linecap: square; }
.u-knob__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; }


/* ── Shared app shell (Unit 01 apps) ── */
.shell { height: 100dvh; overflow: auto; container: shell / size; }
.device { min-height: 100%; display: grid; gap: var(--space-2); padding: var(--space-2); grid-template-columns: minmax(0, 1fr); }
.bar { align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-1) var(--space-1) 0; container: bar / inline-size; min-width: 0; }
.bar__title { display: inline-flex; align-items: flex-start; gap: var(--space-2); font: 800 clamp(18px, 4.2cqi, 34px)/1 var(--font-sans); letter-spacing: -.025em; }
.bar__idx { font: 500 9px/12px var(--font-mono); letter-spacing: .1em; color: var(--ink-muted); }
.bar__right { display: flex; align-items: center; gap: var(--space-4); }
.bar__meta { display: none; }
@container bar (min-width: 400px) { .bar__meta { display: inline-flex; } }

.hero { container: hero / inline-size; display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-2); padding: var(--space-3); min-height: 0; overflow: hidden; transition: background 60ms linear; }
.hero__top, .hero__bottom { display: flex; justify-content: space-between; gap: var(--space-3); min-width: 0; }
.hero__main { flex: 1; display: flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: 0; }
.hero__big { font-family: var(--font-sans); font-weight: 800; line-height: .9; letter-spacing: -.045em; font-variant-numeric: tabular-nums; font-size: clamp(36px, min(30cqi, 24cqb), 280px); }
.hide-xs { display: none; }
.show-m { display: none; }
@container hero (min-width: 260px) { .hero { padding: var(--space-4); } .hide-xs { display: inline; } }
@container hero (min-width: 380px) { .show-m { display: inline; } }

.transport { container: transport / inline-size; display: flex; gap: var(--space-2); min-width: 0; }
.transport .u-key { flex: 1 1 0; height: clamp(56px, 20cqi, 112px); }
.transport .k-main { flex-grow: 2; }
.transport .k-extra { display: none; }
.k-main .u-key__glyph svg { width: clamp(20px, 6cqi, 36px); height: clamp(20px, 6cqi, 36px); }
.k-main .is-stop { display: none; }
.k-main[aria-pressed="true"] .is-stop { display: block; }
.k-main[aria-pressed="true"] .is-play { display: none; }
.k-step .u-key__glyph { font-size: clamp(18px, 5cqi, 28px); line-height: 1; }
@container transport (max-width: 199px) { .transport .u-key__text { display: none; } .transport .u-key { align-items: center; justify-content: center; } }
@container shell (min-width: 300px) { .transport .k-extra { display: inline-flex; } }

.section { border-top: 2px solid var(--rule); padding-top: var(--space-2); flex-direction: column; gap: var(--space-2); min-width: 0; }
.section__head { display: flex; justify-content: space-between; gap: var(--space-3); }
.stepper { display: flex; align-items: center; gap: var(--space-2); }
.stepper__val { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 22px; line-height: 40px; height: 40px; background: var(--panel-sunk); font-variant-numeric: tabular-nums; }
.row-split { display: flex; flex-direction: column; gap: var(--space-4); }
.knobs { display: flex; flex-wrap: wrap; gap: var(--space-4); justify-content: space-between; }
.mini { padding: var(--space-3); display: flex; justify-content: space-between; align-items: baseline; }
.mini__num { font-size: 28px; line-height: 28px; font-variant-numeric: tabular-nums; }
.k-flat { height: 44px; width: 100%; flex-direction: row; align-items: center; padding: 0 var(--space-3); }
.keyrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: var(--space-2); }
.keyrow .u-key { height: 44px; align-items: center; justify-content: center; }
.keyrow .u-key.is-on { background: var(--ink); color: var(--chassis); }
@container (min-width: 440px) { .row-split { flex-direction: row; } .row-split > * { flex: 1; } }
@container (max-width: 300px) { .u-selector__opt .u-led { display: none; } }
@container shell (min-width: 820px) and (max-height: 759px) {
  .device { padding: var(--space-4); }
  .u-panel__head { padding: var(--space-1) 0 var(--space-2); }
  .u-panel__body { padding: 0; gap: var(--space-3); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ── 15 Synth ── */
.device { grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "hero" "kb"; }
.bar { grid-area: bar; } .hero { grid-area: hero; } .kb-wrap { grid-area: kb; } .transport { grid-area: transport; } .presets { grid-area: presets; }
.p-osc { grid-area: osc; } .p-filter { grid-area: filter; } .p-env { grid-area: env; } .p-fx { grid-area: fx; }
.bar, .transport, .presets, .p-osc, .p-filter, .p-env, .p-fx { display: none; }

/* Hero */
.note { display: flex; align-items: flex-start; }
.note__name.is-idle { font-size: .4em; color: var(--lcd-muted); align-self: center; letter-spacing: .1em; }
.note__acc { font-size: .45em; margin-top: .05em; }
.note__oct { font-size: .3em; align-self: flex-end; margin-bottom: .05em; color: var(--lcd-muted); font-weight: 500; }
.scope { width: 100%; height: clamp(28px, 18cqi, 120px); display: block; }
.scope__mid { stroke: var(--lcd-dim); stroke-width: 1; vector-effect: non-scaling-stroke; }
.scope__line { fill: none; stroke: var(--lcd-ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.hero.is-on .scope__line { stroke: var(--signal); }

/* Keyboard */
.kb-wrap { container: kb / inline-size; display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.kb { --cols: 32; position: relative; display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-template-rows: 58fr 42fr;
  height: clamp(64px, min(32cqi, 26cqb), 170px); gap: 0 2px; touch-action: none; user-select: none; -webkit-user-select: none; }
.k { position: relative; border: 0; padding: 0 0 var(--space-1); display: flex; align-items: flex-end; justify-content: center;
  font: 700 9px/12px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.k--w { grid-row: 1 / 3; background: var(--key); color: var(--ink-muted); box-shadow: var(--shadow-key); z-index: 1; }
.k--b { grid-row: 1 / 2; background: var(--lcd); color: var(--lcd-ink); z-index: 2; margin: 0 1px; }
[data-theme="dark"] .k--b { box-shadow: inset 0 0 0 1px var(--line); }
.k.is-down { background: var(--signal); color: var(--on-signal); box-shadow: var(--shadow-key-pressed); transform: translateY(2px); }
.k__lbl { display: none; }
.o2, .o3 { display: none; }
@container kb (min-width: 340px) { .k--w .k__lbl.is-c { display: block; } }
@container kb (min-width: 520px) { .kb { --cols: 60; } .o2 { display: flex; } }
@container kb (min-width: 1040px) { .kb { --cols: 88; } .o3 { display: flex; } }
@container kb (min-width: 620px) { .k__lbl { display: block; } }
.kb-hint { display: none; justify-content: space-between; gap: var(--space-3); }
@container kb (min-width: 420px) { .kb-hint { display: flex; } }

/* Transport */
.transport .u-key { height: clamp(48px, 14cqi, 72px); }
.oct-disp { flex: 1.4 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; padding: var(--space-2) var(--space-3); height: clamp(48px, 14cqi, 72px); }
.oct-disp__v { font: 800 clamp(15px, 4.5cqi, 24px)/1 var(--font-sans); letter-spacing: -.02em; white-space: nowrap; }

/* Presets */
.presets { flex-direction: column; gap: var(--space-2); }
.presets .keyrow { grid-template-columns: repeat(4, 1fr); }
.presets .keyrow .u-key { height: 40px; }

/* Panels */
.knobs--4 { display: grid; grid-template-columns: repeat(4, 1fr); justify-items: center; gap: var(--space-2); }
.knobs--3 { display: grid; grid-template-columns: repeat(3, 1fr); justify-items: center; gap: var(--space-2); }
.knobs--2 { display: grid; grid-template-columns: repeat(2, 1fr); justify-items: center; gap: var(--space-2); }
@container (max-width: 290px) { .knobs--4 { grid-template-columns: repeat(2, 1fr); } }
.u-panel .u-selector__opt { height: 36px; }
.osc-row { display: grid; grid-template-columns: minmax(0, 1.2fr) 1fr 1fr; gap: var(--space-3); align-items: center; justify-items: center; }
.osc-row .u-selector { justify-self: stretch; }
@container (max-width: 300px) { .osc-row { grid-template-columns: 1fr 1fr; } .osc-row .u-selector { grid-column: 1 / -1; } }
.p-osc .u-panel__body, .p-filter .u-panel__body, .p-env .u-panel__body, .p-fx .u-panel__body { justify-content: flex-start; }

/* ── Tiers ── */
@container shell (max-height: 359px) { .kb-hint { display: none !important; } }
@container shell (max-height: 259px) { .hero__top { display: none; } .hero { padding: var(--space-2) var(--space-3); } .scope { display: none; } }
@container shell (min-width: 300px) and (min-height: 360px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar" "hero" "kb" "transport"; }
  .bar, .transport { display: flex; }
}
@container shell (min-width: 300px) and (min-height: 600px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto auto auto; grid-template-areas: "bar" "hero" "presets" "kb" "transport"; }
  .presets { display: flex; }
}
@container shell (min-width: 520px) and (min-height: 800px) {
  .device { gap: var(--space-4); padding: var(--space-4); grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: auto minmax(0, 1fr) auto auto auto auto;
    grid-template-areas: "bar bar" "hero hero" "osc filter" "presets presets" "kb kb" "transport transport"; }
  .p-osc, .p-filter { display: flex; }
}
@container shell (min-width: 560px) and (max-height: 359px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(180px, 30cqi, 300px); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "hero transport" "kb kb"; }
  .transport { display: grid; }
}
@container shell (min-width: 560px) and (min-height: 360px) and (max-height: 599px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(200px, 30cqi, 320px); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "hero transport" "kb kb"; }
}
@container shell (min-width: 560px) and (max-height: 599px) {
  .transport { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: var(--space-2); grid-template-areas: "disp disp" "down up" "hold hold"; }
  .transport .u-key, .transport .oct-disp { height: auto; }
  .oct-disp { grid-area: disp; } #octDown { grid-area: down; } #octUp { grid-area: up; } #hold { grid-area: hold; }
}
@container shell (min-width: 820px) and (min-height: 600px) {
  .device { gap: var(--space-4); padding: var(--space-6); grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto auto auto;
    grid-template-areas: "bar bar" "hero osc" "hero filter" "presets env" "kb env" "transport env"; }
  .presets, .p-osc, .p-filter, .p-env { display: flex; }
  .transport { display: flex; }
}
@container shell (min-width: 820px) and (max-height: 759px) { .device { gap: var(--space-3); padding: var(--space-4); } .presets .keyrow .u-key { height: 36px; } .transport .u-key, .transport .oct-disp { height: 48px; } .kb { height: clamp(64px, 18cqi, 120px); } }
@container shell (min-width: 1180px) and (min-height: 760px) {
  .device { padding: var(--space-8); grid-template-columns: minmax(280px, .9fr) minmax(0, 1.6fr) minmax(300px, .9fr);
    grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr) auto auto auto;
    grid-template-areas: "bar bar bar" "osc hero filter" "env hero fx" "presets presets presets" "kb kb kb" "transport transport transport"; }
  .presets, .p-osc, .p-filter, .p-env, .p-fx { display: flex; }
  .presets .keyrow .u-key { height: 40px; }
  .kb { height: clamp(64px, 12cqi, 140px); }
  .transport .u-key, .transport .oct-disp { height: 56px; }
}

.u-knob__dial.is-turning { outline: 1px dashed var(--ink-muted); outline-offset: 3px; }
</style>
</head>
<body>
<div class="shell">
<main class="device">

  <header class="bar">
    <span class="bar__title"><span class="bar__idx">15</span>Synth</span>
    <div class="bar__right">
      <span class="u-label bar__meta" id="barMeta">Lead · Mono</span>
      <button class="u-switch" role="switch" aria-checked="false" id="themeSw" aria-label="Dark theme">
        <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
        <span class="u-label">Dark</span>
      </button>
    </div>
  </header>

  <section class="hero u-display" id="hero" aria-label="Synth display">
    <div class="hero__top">
      <span class="u-display__label">Note</span>
      <span class="u-display__label show-m" id="modeOut">Mono · Saw</span>
      <span class="u-display__label hide-xs" id="octOut">Oct 3</span>
    </div>

  var kb = $('kb'), keyEls = {};
  var WHITE = [0, 2, 4, 5, 7, 9, 11];
  function base() { return (state.oct + 1) * 12; }
  function buildKeys() {
    kb.innerHTML = ''; keyEls = {};
    var w = 0, b0 = base();
    for (var o = 0; o <= 3; o++) {
      for (var n = 0; n < 12; n++) {
        if (o === 3 && n > 0) break;
        var m = b0 + o * 12 + n, white = WHITE.indexOf(n) >= 0, el = document.createElement('div');
        el.className = 'k ' + (white ? 'k--w' : 'k--b'); el.dataset.m = m;
        var nm = noteName(m);
        if (white) {
          el.style.gridColumn = (4 * w + 1) + ' / span 4';
          if (w >= 15) el.classList.add('o3'); else if (w >= 8) el.classList.add('o2');
          el.innerHTML = '<span class="k__lbl' + (n === 0 ? ' is-c' : '') + '">' + (n === 0 ? nm.full : nm.pc) + '</span>';
          w++;
        } else {
          var left = w - 1;
          el.style.gridColumn = (4 * left + 4) + ' / span 2';
          if (left >= 14) el.classList.add('o3'); else if (left >= 7) el.classList.add('o2');
        }
        kb.appendChild(el); keyEls[m] = el;
      }
    }
    render();
  }
  function keyAt(x, y) { var el = document.elementFromPoint(x, y); el = el && el.closest ? el.closest('.k') : null; return el && kb.contains(el) ? +el.dataset.m : null; }
  kb.addEventListener('pointerdown', function (e) {
    e.preventDefault(); try { kb.setPointerCapture(e.pointerId); } catch (er) {}
    var m = keyAt(e.clientX, e.clientY); if (m != null) press('p' + e.pointerId, m);
  });
  kb.addEventListener('pointermove', function (e) {
    var src = 'p' + e.pointerId; if (!(src in sources)) return;
    var m = keyAt(e.clientX, e.clientY);
    if (m != null && m !== sources[src]) { lift(src); press(src, m); }
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) { kb.addEventListener(ev, function (e) { lift('p' + e.pointerId); }); });

  function visibleOctaves() { var w = kb.parentNode.clientWidth; return w >= 1040 ? 3 : w >= 520 ? 2 : 1; }
  function render() {
    var held = heldSet(), any = false;
    Object.keys(keyEls).forEach(function (m) { var on = !!held[m]; keyEls[m].classList.toggle('is-down', on); if (on) any = true; });
    var hero = $('hero'); hero.classList.toggle('is-on', any);
    if (any && lastNote != null) {
      var nm = noteName(held[lastNote] ? lastNote : +Object.keys(held).pop());
      $('noteName').textContent = nm.base; $('noteName').classList.remove('is-idle'); $('noteAcc').textContent = nm.acc; $('noteOct').textContent = nm.oct;
    } else { $('noteName').textContent = '– –'; $('noteName').classList.add('is-idle'); $('noteAcc').textContent = ''; $('noteOct').textContent = ''; }
    var vo = visibleOctaves(), lo = noteName(base()), hi = noteName(base() + 12 * vo);
    $('octBig').textContent = lo.full + '–' + hi.full;
    $('octOut').textContent = 'Oct ' + state.oct;
    $('modeOut').textContent = (state.mode === 'mono' ? 'Mono' : 'Poly') + ' · ' + WAVE_NAME[state.wave];
    $('voicesOut').textContent = state.mode === 'mono' ? '1 voice' : MAXV + ' voices';
    $('barMeta').textContent = (PRESETS[state.preset] ? PRESETS[state.preset].label : 'Custom') + ' · ' + (state.mode === 'mono' ? 'Mono' : 'Poly');
    $('presetOut').textContent = PRESETS[state.preset] ? PRESETS[state.preset].label : 'Custom';
    $('fxOut').textContent = state.mix ? fmtT(dTime(state.time)) : 'Off';
    Array.prototype.forEach.call($('presets').children, function (b) { b.classList.toggle('is-on', b.dataset.p === state.preset); });
  }
  if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(kb.parentNode);

  function setOct(o) {
    o = clamp(o, 1, 6); if (o === state.oct) return;
    Object.keys(sources).forEach(function (s) { lift(s); });
    if (Object.keys(latched).length) { var l = latched; latched = {}; Object.keys(l).forEach(function (m) { voiceOff(+m); }); }
    state.oct = o; save(); buildKeys();
  }
  $('octDown').addEventListener('click', function () { setOct(state.oct - 1); });
  $('octUp').addEventListener('click', function () { setOct(state.oct + 1); });
  $('hold').addEventListener('click', function () { graph(); setHold(!state.hold); });

  /* ── Controls ── */
  var knobDraws = [];
  function custom() { state.preset = 'custom'; save(); applyParams(); render(); }
  function knob(id, label, key, fmt, max) {
    knobDraws.push(makeKnob($(id), { label: label, min: 0, max: max || 100, get: function () { return state[key]; }, set: function (v) { state[key] = v; if (key === 'vol') { save(); applyParams(); } else custom(); }, format: fmt, size: 56 }));
  }
  knob('kDetune', 'Detune', 'detune', function (v) { return '±' + Math.round(detC(v)) + '¢'; });
  knob('kGlide', 'Glide', 'glide', function (v) { return v ? fmtT(glideS(v)) : 'Off'; });
  knob('kCut', 'Cutoff', 'cut', function (v) { return fmtHz(cutHz(v)); });
  knob('kRes', 'Reso', 'res', function (v) { return 'Q' + resQ(v).toFixed(1); });
  knob('kVol', 'Volume', 'vol');
  knob('kA', 'Attack', 'a', function (v) { return fmtT(envT(v)); });
  knob('kD', 'Decay', 'd', function (v) { return fmtT(envT(v)); });
  knob('kS', 'Sustain', 's');
  knob('kR', 'Release', 'r', function (v) { return fmtT(envT(v)); });
  knob('kTime', 'Time', 'time', function (v) { return fmtT(dTime(v)); });
  knob('kFb', 'Feedback', 'fb');
  knob('kMix', 'Mix', 'mix');
  radioRow($('waveSel'), WAVES);
  var syncWave = selector($('waveSel'), function () { return state.wave; }, function (v) { state.wave = v; custom(); });
  radioRow($('modeSel'), [['mono', 'Mono'], ['poly', 'Poly']]);
  var syncMode = selector($('modeSel'), function () { return state.mode; }, function (v) { switchMode(v); custom(); });
  function switchMode(v) {
    if (v === state.mode) return;
    Object.keys(sources).forEach(function (s) { lift(s); }); latched = {}; panic();
    if (mono && AUDIO.ctx) { kill(mono, AUDIO.ctx.currentTime + envT(state.r) * 2.5 + .05); mono = null; }
    state.mode = v;
  }

  var presetsEl = $('presets');
  Object.keys(PRESETS).forEach(function (k, i) {
    var b = document.createElement('button'); b.className = 'u-key'; b.dataset.p = k;
    b.innerHTML = '<span>' + PRESETS[k].label + '</span>';
    b.setAttribute('aria-label', 'Preset ' + PRESETS[k].label + ' (' + (i + 1) + ')');
    b.addEventListener('click', function () { loadPreset(k); });
    presetsEl.appendChild(b);
  });
  function loadPreset(k) {
    var p = PRESETS[k]; switchMode(p.mode);
    var octChanged = p.oct !== state.oct;
    P_KEYS.forEach(function (key) { if (key !== 'oct') state[key] = p[key]; });
    state.preset = k; save();
    if (octChanged) setOct(p.oct);
    knobDraws.forEach(function (d) { d(); }); syncWave(); syncMode(); applyParams(); render();
  }

  /* ── Computer keyboard ── */
  var downKeys = {};
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if (k in KEYMAP) { if (e.repeat || downKeys[k]) { e.preventDefault(); return; } e.preventDefault(); downKeys[k] = true; press('k' + k, base() + KEYMAP[k]); return; }
    if (inControl(e) && (k === ' ' || k === 'enter')) return;
    if (k === 'z') setOct(state.oct - 1);
    else if (k === 'x') setOct(state.oct + 1);
    else if (k === ' ') { e.preventDefault(); graph(); setHold(!state.hold); }
    else if (k >= '1' && k <= '4') loadPreset(Object.keys(PRESETS)[+k - 1]);
    else if (k === 'escape') { Object.keys(sources).forEach(function (s) { lift(s); }); latched = {}; setHold(false); panic(); render(); }
  });
  document.addEventListener('keyup', function (e) { var k = e.key.toLowerCase(); if (downKeys[k]) { delete downKeys[k]; lift('k' + k); } });
  window.addEventListener('blur', function () { Object.keys(downKeys).forEach(function (k) { lift('k' + k); }); downKeys = {}; });

  /* ── Oscilloscope ── */
  var scopeLine = $('scopeLine'), lastDraw = 0, flat = true;
  function scope(ts) {
    requestAnimationFrame(scope);
    if (!G || ts - lastDraw < 33) return; lastDraw = ts;
    G.an.getFloatTimeDomainData(G.buf);
    var b = G.buf, n = b.length, start = 0, peak = 0;
    for (var i = 1; i < n / 2; i++) { if (b[i - 1] < 0 && b[i] >= 0) { start = i; break; } }
    var span = 512, pts = [];
    for (var j = 0; j < 100; j++) { var v = b[start + Math.floor(j * span / 100)] || 0; peak = Math.max(peak, Math.abs(v)); pts.push((j * 2.0202).toFixed(1) + ',' + (30 - clamp(v * 40, -28, 28)).toFixed(1)); }
    if (peak < 0.002) { if (!flat) { scopeLine.setAttribute('points', '0,30 200,30'); flat = true; } return; }
    flat = false; scopeLine.setAttribute('points', pts.join(' '));
  }

  $('hold').setAttribute('aria-pressed', String(!!state.hold));
  $('hold').querySelector('.u-led').classList.toggle('is-lit', !!state.hold);
  buildKeys();

})();
</script>
</body>
</html>
