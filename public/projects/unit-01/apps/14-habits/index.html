<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 01 — Habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* ── Unit 01 tokens ─────────────────────────────────────────── */
:root, [data-theme="light"] {
  --chassis:#ffffff; --panel:#ffffff; --panel-sunk:#f0f0ee; --ink:#000000; --ink-muted:#5f5f5c; --line:#c8c8c4; --rule:var(--ink);
  --signal:#ff5a1f; --signal-text:#a83400; --on-signal:#000000; --blue:#3a63d8; --on-blue:#ffffff; --yellow:#f5c400; --on-yellow:#111111;
  --key:#e6e6e3; --lcd:#0b0b0b; --lcd-ink:#f2f2ef; --lcd-muted:#8f8f8a; --lcd-dim:#2a2a2a; --focus:var(--ink);
  --shadow-key:0 2px 0 #00000040; --shadow-key-pressed:0 0 0 #00000040;
}
[data-theme="dark"] {
  --chassis:#000000; --panel:#000000; --panel-sunk:#161616; --ink:#ffffff; --ink-muted:#9b9b97; --line:#3a3a3a; --key:#262626; --rule:var(--ink);
  --signal-text:#ff7a45; --shadow-key:0 2px 0 #ffffff26; --shadow-key-pressed:0 0 0 #ffffff26;
}
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-0:0; --radius-sm:2px; --radius-md:6px; --radius-full:9999px;
  --font-sans:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* ── Unit 01 components (vanilla port of the bundle) ────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); background: var(--chassis); color: var(--ink); -webkit-font-smoothing: antialiased; }
:where(button, input, [role="slider"]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.u-label { display: inline-flex; gap: var(--space-2); align-items: baseline; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.u-label b { font-weight: 700; color: var(--ink); }
.u-value { font-family: var(--font-mono); font-size: 13px; line-height: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
.u-led { display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--line); flex: none; }
.u-key .u-led, .u-selector__opt .u-led { background: var(--line); }
.is-on > .u-led, .u-led.is-lit { background: var(--signal); }

.u-key { appearance: none; position: relative; display: inline-flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  min-width: 0; padding: var(--space-2); border: 0; border-radius: var(--radius-0); background: var(--key); color: var(--ink);
  font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: left;
  box-shadow: var(--shadow-key); cursor: pointer; transition: transform 60ms linear, box-shadow 60ms linear; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.u-key:active, .u-key.is-hit, .u-key[aria-pressed="true"] { transform: translateY(2px); box-shadow: var(--shadow-key-pressed); }
.u-key--ink { background: var(--ink); color: var(--chassis); }
.u-key--signal { background: var(--signal); color: var(--on-signal); }
.u-key--blue { background: var(--blue); color: var(--on-blue); }
.u-key--yellow { background: var(--yellow); color: var(--on-yellow); }
.u-key__top { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: var(--space-1); }
.u-key__index { font-family: var(--font-mono); font-weight: 500; font-size: 9px; line-height: 12px; letter-spacing: .1em; opacity: .75; }
.u-key__glyph { align-self: center; display: flex; }
.u-key__glyph svg { width: 22px; height: 22px; fill: currentColor; }
.u-key--sm { width: 40px; height: 40px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; }

.u-panel { background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: var(--radius-0); min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
.u-panel__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-3); }
.u-panel__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel__body { padding: 0 0 var(--space-2); display: flex; flex-direction: column; gap: var(--space-4); flex: 1; }

.u-display { background: var(--lcd); color: var(--lcd-ink); border: 1px solid var(--line); border-radius: var(--radius-0); font-family: var(--font-mono); }
.u-display__label { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--lcd-muted); white-space: nowrap; }
.u-display__unit { font-size: 13px; line-height: 16px; color: var(--lcd-muted); text-transform: uppercase; letter-spacing: .08em; }

.u-selector { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-selector__row { display: flex; gap: 2px; border-radius: var(--radius-0); }
.u-selector__opt { appearance: none; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-2);
  background: var(--key); color: var(--ink); border: 0; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.u-selector__opt:first-child { border-left: 0; }
.u-selector__opt.is-on { background: var(--ink); color: var(--chassis); }
.u-selector__opt:focus-visible { outline-offset: -4px; }

.u-switch { appearance: none; display: inline-flex; align-items: center; gap: var(--space-3); padding: var(--space-1) 0; background: none; border: 0; color: var(--ink); cursor: pointer; }
.u-switch__track { position: relative; width: 40px; height: 20px; background: var(--panel-sunk); border: 1px solid var(--ink); border-radius: var(--radius-sm); flex: none; }
.u-switch__thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 14px; background: var(--ink); border-radius: var(--radius-sm); transition: left 80ms linear; }
.u-switch[aria-checked="true"] .u-switch__track { background: var(--signal); }
.u-switch[aria-checked="true"] .u-switch__thumb { left: 20px; background: var(--on-signal); }
.u-switch__state { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; min-width: 3ch; }

.u-fader { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-fader__head { display: flex; justify-content: space-between; align-items: baseline; }
.u-fader__input { appearance: none; -webkit-appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: ew-resize; }
.u-fader__input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-moz-range-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 28px; margin-top: -13px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }
.u-fader__input::-moz-range-thumb { width: 14px; height: 28px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }

.u-knob { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.u-knob__dial { border-radius: var(--radius-full); cursor: grab; touch-action: none; line-height: 0; }
.u-knob__tick { stroke: var(--line); stroke-width: 1.5; }
.u-knob__track { fill: none; stroke: var(--panel-sunk); stroke-width: 3; }
.u-knob__arc { fill: none; stroke: var(--signal); stroke-width: 3; }
.u-knob__cap { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.u-knob__ind { stroke: var(--ink); stroke-width: 3; stroke-linecap: square; }
.u-knob__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; }


/* ── Unit 01 app shell (shared) ── */
.shell { height: 100dvh; overflow: auto; container: shell / size; }
.device { min-height: 100%; display: grid; gap: var(--space-2); padding: var(--space-2); grid-template-columns: minmax(0, 1fr); }
.bar { display: none; grid-area: bar; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-1) var(--space-1) 0; container: bar / inline-size; min-width: 0; }
.bar__title { display: inline-flex; align-items: flex-start; gap: var(--space-2); font: 800 clamp(18px, 4.2cqi, 34px)/1 var(--font-sans); letter-spacing: -.025em; white-space: nowrap; }
.bar__idx { font: 500 9px/12px var(--font-mono); letter-spacing: .1em; color: var(--ink-muted); }
.bar__right { display: flex; align-items: center; gap: var(--space-4); }
.bar__meta { display: none; }
@container bar (min-width: 400px) { .bar__meta { display: inline-flex; } }
.sect { border-top: 2px solid var(--rule); padding-top: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; min-height: 0; }
.sect__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.hero { container: hero / inline-size; display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-2); padding: var(--space-3); min-height: 0; min-width: 0; overflow: hidden; }
.hero__top, .hero__bottom { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); min-width: 0; }
@container hero (min-width: 260px) { .hero { padding: var(--space-4); } }
.big { font-family: var(--font-sans); font-weight: 800; letter-spacing: -.045em; line-height: .9; font-variant-numeric: tabular-nums; }
.stepper { display: flex; align-items: center; gap: var(--space-2); }
.stepper__val { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 22px; line-height: 40px; height: 40px; background: var(--panel-sunk); font-variant-numeric: tabular-nums; }
.mini { padding: var(--space-3); display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.mini__num { font-family: var(--font-mono); font-size: 24px; line-height: 24px; font-variant-numeric: tabular-nums; }
.u-field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.u-field__input { width: 100%; padding: var(--space-2) var(--space-3); min-height: 40px; background: var(--panel-sunk); color: var(--ink); border: 0; border-bottom: 2px solid var(--ink); border-radius: var(--radius-0); font: 400 15px/22px var(--font-sans); resize: none; }
.u-field__input::placeholder { color: var(--ink-muted); }
.u-field__input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.note { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); margin: 0; }
.row { display: flex; gap: var(--space-2); align-items: stretch; }
.row > .u-key { height: 40px; align-items: center; justify-content: center; flex: 1; }
.row > .u-key--sm { flex: none; }
@container (max-width: 300px) { .u-selector__opt .u-led { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ── Habits ── */
.hero { grid-area: hero; } .today { grid-area: today; } .grid { grid-area: grid; }
.p-habits { grid-area: habits; } .p-stats { grid-area: stats; }
.grid, .p-habits, .p-stats { display: none; }
.device { grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "hero" "today"; }

.hero__date, .hero__streak { display: none; }
@container hero (min-width: 260px) { .hero__date { display: inline; } }
@container hero (min-width: 400px) { .hero__streak { display: inline; } }
.hero__main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.count { font-size: clamp(40px, min(28cqi, 22cqb), 240px); }
.count small { font-size: .45em; color: var(--lcd-muted); letter-spacing: -.02em; }
.hero.is-all .count, .hero.is-all .count small { color: var(--signal); }
.segs { display: flex; gap: 3px; }
.segs span { flex: 1; height: clamp(6px, 2.4cqi, 16px); background: var(--lcd-dim); }
.segs span.is-on { background: var(--lcd-ink); }
.hero.is-all .segs span { background: var(--signal); }

/* today keys */
.today { container: today / inline-size; display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: var(--space-2); min-width: 0; }
.hk { height: clamp(48px, 14cqi, 76px); }
.hk .u-key__text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.hk[aria-pressed="true"] { background: var(--ink); color: var(--chassis); }
.hk--add { color: var(--ink-muted); }
@container today (max-width: 199px) { .today .u-key__index { display: none; } }

/* grid */
.grid { container: grid / inline-size; }
.gwrap { display: flex; flex-direction: column; gap: 3px; }
.grow { display: grid; grid-template-columns: minmax(52px, 8.5em) repeat(7, minmax(0, 1fr)); gap: 3px; align-items: center; }
.gname { font: 700 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: var(--space-2); }
.cell { appearance: none; border: 0; padding: 0; aspect-ratio: 1; max-height: 34px; width: 100%; background: var(--key); border-radius: var(--radius-0); cursor: pointer; }
.cell.is-done { background: var(--ink); }
.cell.is-future { background: transparent; outline: 1px dashed var(--line); outline-offset: -1px; cursor: default; }
.cell:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.hd { font: 500 9px/12px var(--font-mono); letter-spacing: .04em; color: var(--ink-muted); text-align: center; white-space: nowrap; overflow: visible; min-height: 24px; display: flex; flex-direction: column; justify-content: flex-end; }
.hd.is-today { background: var(--ink); color: var(--chassis); }
.hd__mon, .hd__dm { display: none; }
.cell:not([data-w="0"]), .hd:not([data-w="0"]) { display: none; }
@container grid (min-width: 560px) {
  .grow { grid-template-columns: minmax(64px, 9em) repeat(28, minmax(0, 1fr)); gap: 2px; }
  .cell[data-w="1"], .cell[data-w="2"], .cell[data-w="3"] { display: block; }
  .hd[data-w="1"], .hd[data-w="2"], .hd[data-w="3"] { display: flex; }
  .hd__wd { display: none; } .hd.is-mon .hd__dm { display: block; }
}
@container grid (min-width: 860px) {
  .grow { grid-template-columns: minmax(64px, 9em) repeat(84, minmax(0, 1fr)); gap: 1px; }
  .cell[data-w] { display: block; }
  .hd[data-w] { display: flex; }
  .hd.is-mon .hd__dm { display: none; } .hd.is-mstart .hd__mon { display: block; }
  .hd { min-height: 16px; }
  .hd.is-today { background: linear-gradient(var(--ink), var(--ink)) bottom / 100% 4px no-repeat; color: var(--ink-muted); }
  .hd { text-align: left; }
}

/* habits panel */
.hlist { display: flex; flex-direction: column; gap: var(--space-2); }
.hrow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: var(--space-2); align-items: center; }
.hrow__idx { font: 500 11px/14px var(--font-mono); color: var(--ink-muted); }
.hrow .u-field__input { min-height: 36px; padding: 6px 10px; }
.hrow .u-key, .addrow .u-key, .io .u-key { height: 36px; padding: 0 12px; flex-direction: row; align-items: center; justify-content: center; }
.hrow .u-key.is-arm { background: var(--ink); color: var(--chassis); }
.addrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2); }
.io { display: flex; flex-direction: column; gap: var(--space-2); }
.io__keys { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.io textarea { font: 400 12px/16px var(--font-mono); display: none; }
.io.is-open textarea { display: block; }
.io__keys .u-key { flex-direction: row; align-items: center; }

/* stats */
.p-stats .u-panel__body { min-height: 0; }
#slist { flex: 1; height: 0; min-height: 0; overflow: hidden; }
.stat-top { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-1) var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--line); }
.srow__name { font: 700 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow__nums { font: 500 12px/14px var(--font-mono); color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.meter { grid-column: 1 / -1; display: flex; gap: 2px; }
.meter span { flex: 1; height: 6px; background: var(--key); }
.meter span.is-on { background: var(--ink); }

@container shell (max-height: 279px) {
  .today { grid-template-columns: repeat(auto-fit, minmax(52px, 1fr)); }
  .today:has(.hk:nth-child(4)) { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .today:has(.hk:nth-child(4)) .hk { height: 34px; font-size: 9px; letter-spacing: .02em; }
  .hk { height: 44px; padding: 6px; }
  .hk .u-key__top { display: none; }
  .hk { justify-content: flex-end; }
}
/* ── Tiers ── */
@container shell (min-width: 300px) and (min-height: 360px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar" "hero" "today"; }
  .bar { display: flex; }
}
@container shell (min-width: 300px) and (min-height: 560px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar" "hero" "today" "grid"; }
  .grid { display: flex; }
}
@container shell (min-width: 520px) and (min-height: 860px) {
  .device { gap: var(--space-4); padding: var(--space-4); grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: auto minmax(0, 1fr) auto auto auto; grid-template-areas: "bar bar" "hero hero" "today today" "grid grid" "habits stats"; }
  .p-habits, .p-stats { display: flex; }
}
@container shell (min-width: 560px) and (max-height: 359px) {
  .device { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "hero today"; }
  .today { align-content: stretch; }
}
@container shell (min-width: 560px) and (min-height: 360px) and (max-height: 559px) {
  .device { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "hero today" "grid grid"; }
  .grid { display: flex; }
  .cell { max-height: 22px; }
  .today { align-content: start; }
}
@container shell (min-width: 820px) and (min-height: 540px) {
  .device { gap: var(--space-4); padding: var(--space-6); grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar bar" "hero habits" "today habits" "grid grid"; }
  .grid, .p-habits { display: flex; }
  .p-stats { display: none; }
  .hrow .u-field__input { min-height: 32px; padding: 4px 10px; }
  .hrow .u-key { height: 32px; }
  .hlist { gap: 6px; }
}
@container shell (min-width: 820px) and (max-height: 759px) {
  .device { padding: var(--space-4); }
  .u-panel__head { padding: var(--space-1) 0 var(--space-2); }
  .u-panel__body { padding: 0; gap: var(--space-3); }
  .cell { max-height: 26px; }
  .hk { height: 52px; }
  .io > .note:first-child { display: none; }
  .p-habits .u-panel__body { gap: var(--space-2); }
  .hrow .u-field__input { min-height: 32px; padding: 4px 10px; }
  .hrow .u-key { height: 32px; }
  .hlist { gap: 6px; }
}
@container shell (min-width: 1180px) and (min-height: 760px) {
  .device { padding: var(--space-8); grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(280px, .62fr) minmax(280px, .62fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar bar bar bar" "hero hero habits stats" "today today habits stats" "grid grid grid grid"; }
  .grid, .p-habits, .p-stats { display: flex; }
  .today { align-content: start; }
}
/* iOS zooms into any field under 16px: keep every text field at 16px or more */
input#newName, input.u-field__input, textarea#ioText { font-size: 16px !important; }
</style>
</head>
<body>
<div class="shell">
<main class="device">

  <header class="bar">
    <span class="bar__title"><span class="bar__idx">14</span>Habits</span>
    <div class="bar__right">
      <span class="u-label bar__meta" id="barMeta">Week 44</span>
      <button class="u-switch" role="switch" aria-checked="false" id="themeSw" aria-label="Dark theme">
        <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
        <span class="u-label">Dark</span>
      </button>
    </div>
  </header>

  <section class="hero u-display" id="hero" aria-label="Today">
    <div class="hero__top">
      <span class="u-display__label">Today</span>
      <span class="u-display__label hero__date" id="dateOut">Sat 01 Nov</span>
      <span class="u-display__label hero__streak" id="streakOut">Streak 00</span>
    </div>
    <div class="hero__main"><output class="big count" id="count" aria-live="polite">0<small>/0</small></output></div>
    <div class="segs" id="segs" aria-hidden="true"></div>
  </section>

  <section class="today" id="today" aria-label="Today's habits"></section>

  <section class="sect grid" aria-label="History grid">
    <div class="sect__head"><span class="u-label"><b>01</b> <span id="gridTitle">This week</span></span><span class="u-label">Tap a day to mark it</span></div>
    <div class="gwrap" id="gwrap"></div>
  </section>

  <section class="u-panel p-habits" aria-label="Habits">
    <header class="u-panel__head"><span class="u-label"><b>02</b> Habits</span><span class="u-label" id="habitCount">3 / 8</span></header>
    <div class="u-panel__body">
      <div class="hlist" id="hlist"></div>
      <form class="addrow" id="addForm">
        <input class="u-field__input" id="newName" maxlength="24" placeholder="New habit" aria-label="New habit name">
        <button class="u-key u-key--ink" type="submit" id="addKey">Add</button>
      </form>
      <div class="io" id="io">
        <p class="note">Saved only in this browser. Copy a backup to move it.</p>
        <div class="io__keys"><button class="u-key" id="exportKey">Copy backup</button><button class="u-key" id="importKey">Restore</button></div>
        <textarea class="u-field__input" id="ioText" rows="2" placeholder="Paste a backup here, then Restore" aria-label="Backup data"></textarea>
        <p class="note" id="ioNote" aria-live="polite"></p>
      </div>
    </div>
  </section>

  <section class="u-panel p-stats" aria-label="Stats">
    <header class="u-panel__head"><span class="u-label"><b>03</b> Stats</span><span class="u-label">Last 28 days</span></header>
    <div class="u-panel__body">
      <div class="stat-top">
        <div class="u-display mini"><span class="u-display__label">All · now</span><span class="mini__num" id="allNow">00</span></div>
        <div class="u-display mini"><span class="u-display__label">All · best</span><span class="mini__num" id="allBest">00</span></div>
      </div>
      <div id="slist"></div>
    </div>
  </section>

</main>
</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n, w) { var neg = n < 0; n = String(Math.abs(Math.floor(n))); while (n.length < w) n = '0' + n; return (neg ? '−' : '') + n; };
  var clamp = function (n, a, b) { return Math.min(b, Math.max(a, n)); };
  var rand = function (n) { var a = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n, x; do { crypto.getRandomValues(a); x = a[0]; } while (x >= lim); return x % n; };
  function store(key, defaults) {
    var s = JSON.parse(JSON.stringify(defaults));
    try { var v = JSON.parse(localStorage.getItem(key) || 'null'); if (v && typeof v === 'object') Object.assign(s, v); } catch (e) {}
    Object.defineProperty(s, '__save', { enumerable: false, value: function () { try { localStorage.setItem(key, JSON.stringify(s)); } catch (e) {} } });
    return s;
  }
  function theme(state) {
    var sw = $('themeSw');
    function apply() {
      var dark = state.theme ? state.theme === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'; sw.setAttribute('aria-checked', String(dark));
    }
    sw.addEventListener('click', function () { state.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; apply(); state.__save(); });
    apply();
  }
  function selector(el, get, set) {
    var opts = Array.prototype.slice.call(el.querySelectorAll('[role=radio]'));
    function sync() { opts.forEach(function (o) { var on = o.dataset.v === String(get()); o.classList.toggle('is-on', on); o.setAttribute('aria-checked', String(on)); o.tabIndex = on ? 0 : -1; }); }
    opts.forEach(function (o, i) {
      o.addEventListener('click', function () { set(o.dataset.v); sync(); });
      o.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
        if (!d) return; e.preventDefault(); var j = (i + d + opts.length) % opts.length; opts[j].click(); opts[j].focus();
      });
    });
    sync(); return sync;
  }
  function bindSwitch(el, get, set) {
    var sync = function () { el.setAttribute('aria-checked', String(!!get())); };
    el.addEventListener('click', function () { set(!get()); sync(); });
    sync(); return sync;
  }
  function inControl(e) { return e.target.closest && e.target.closest('button, input, textarea, select, [role="slider"]'); }
  var THEME_SWITCH = '';

  var MAX = 8, DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var S = store('unit01-habits', { theme: null, habits: [{ id: 'h1', name: 'Practice' }, { id: 'h2', name: 'Read' }, { id: 'h3', name: 'Walk' }], done: {} });
  theme(S);

  function key(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1, 2) + '-' + pad(d.getDate(), 2); }
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); return x; }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function isDone(dk, id) { return (S.done[dk] || []).indexOf(id) >= 0; }
  function toggle(dk, id) {
    var a = S.done[dk] || [], i = a.indexOf(id);
    if (i >= 0) a.splice(i, 1); else a.push(id);
    if (a.length) S.done[dk] = a; else delete S.done[dk];
    S.__save(); render();
  }
  function allDone(dk) { return S.habits.length > 0 && S.habits.every(function (h) { return isDone(dk, h.id); }); }
  function streak(test) {
    var t = today(), d = test(key(t)) ? t : addDays(t, -1), n = 0;
    while (test(key(d)) && n < 3650) { n++; d = addDays(d, -1); }
    return n;
  }
  function best(test) {
    var t = today(), b = 0, run = 0;
    for (var i = 365; i >= 0; i--) { if (test(key(addDays(t, -i)))) { run++; if (run > b) b = run; } else run = 0; }
    return b;
  }
  function weekNo(d) { var x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); var day = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - day); var y = new Date(Date.UTC(x.getUTCFullYear(), 0, 1)); return Math.ceil(((x - y) / 86400000 + 1) / 7); }

  function renderHero() {
    var t = today(), tk = key(t), n = S.habits.filter(function (h) { return isDone(tk, h.id); }).length;
    $('count').innerHTML = n + '<small>/' + S.habits.length + '</small>';
    $('dateOut').textContent = DAYS[(t.getDay() + 6) % 7] + ' ' + pad(t.getDate(), 2) + ' ' + MONTHS[t.getMonth()];
    $('streakOut').textContent = 'Streak ' + pad(streak(allDone), 2);
    $('hero').classList.toggle('is-all', allDone(tk));
    $('segs').innerHTML = S.habits.map(function (h) { return '<span class="' + (isDone(tk, h.id) ? 'is-on' : '') + '"></span>'; }).join('');
    $('barMeta').textContent = 'Week ' + weekNo(t);
  }
  function renderToday() {
    var el = $('today'), tk = key(today()); el.innerHTML = '';
    S.habits.forEach(function (h, i) {
      var b = document.createElement('button'), on = isDone(tk, h.id);
      b.className = 'u-key hk'; b.setAttribute('aria-pressed', String(on));
      b.setAttribute('aria-label', h.name + (on ? ', done today' : ', not done today'));
      b.innerHTML = '<span class="u-key__top"><span class="u-key__index">' + pad(i + 1, 2) + '</span><span class="u-key__index">' + (on ? 'Done' : '') + '</span></span><span class="u-key__text"></span>';
      b.querySelector('.u-key__text').textContent = h.name;
      b.addEventListener('click', function () { toggle(tk, h.id); var nb = $('today').children[i]; if (nb) nb.focus(); });
      el.appendChild(b);
    });
    if (!S.habits.length) el.innerHTML = '<p class="note">No habits yet — add one in Habits.</p>';
  }
  function renderGrid() {
    var t = today(), mon = addDays(t, -((t.getDay() + 6) % 7)), start = addDays(mon, -77), w = $('gwrap');
    w.innerHTML = '';
    var head = document.createElement('div'); head.className = 'grow';
    head.innerHTML = '<span></span>';
    var seenMonth = -1;
    for (var i = 0; i < 84; i++) {
      var d = addDays(start, i), wk = 11 - Math.floor(i / 7), hd = document.createElement('span');
      var isMon = i % 7 === 0, mstart = isMon && d.getMonth() !== seenMonth;
      if (mstart) seenMonth = d.getMonth();
      hd.className = 'hd' + (key(d) === key(t) ? ' is-today' : '') + (isMon ? ' is-mon' : '') + (mstart ? ' is-mstart' : '');
      hd.dataset.w = wk;
      hd.innerHTML = '<span class="hd__wd">' + DAYS[i % 7][0] + '<br>' + pad(d.getDate(), 2) + '</span><span class="hd__dm">' + pad(d.getDate(), 2) + '</span><span class="hd__mon">' + MONTHS[d.getMonth()] + '</span>';
      head.appendChild(hd);
    }
    w.appendChild(head);
    S.habits.forEach(function (h) {
      var row = document.createElement('div'); row.className = 'grow';
      var nm = document.createElement('span'); nm.className = 'gname'; nm.textContent = h.name; row.appendChild(nm);
      for (var i = 0; i < 84; i++) {
        var d = addDays(start, i), dk = key(d), fut = d > t, c = document.createElement('button'), on = isDone(dk, h.id);
        c.className = 'cell' + (on ? ' is-done' : '') + (fut ? ' is-future' : '');
        c.dataset.w = 11 - Math.floor(i / 7);
        c.setAttribute('aria-label', h.name + ', ' + DAYS[i % 7] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + (fut ? ', upcoming' : on ? ', done' : ', not done'));
        if (fut) c.disabled = true;
        else (function (dk2) { c.addEventListener('click', function () { toggle(dk2, h.id); }); })(dk);
        row.appendChild(c);
      }
      w.appendChild(row);
    });
  }
  function gridTitle() {
    var gw = $('gwrap').getBoundingClientRect().width;
    $('gridTitle').textContent = gw >= 860 ? 'Last 12 weeks' : gw >= 560 ? 'Last 4 weeks' : 'This week';
  }
  var armed = null, armTimer = 0;
  function renderHabits() {
    var l = $('hlist'); l.innerHTML = '';
    S.habits.forEach(function (h, i) {
      var r = document.createElement('div'); r.className = 'hrow';
      r.innerHTML = '<span class="hrow__idx">' + pad(i + 1, 2) + '</span><input class="u-field__input" maxlength="24"><button class="u-key">Delete</button>';
      var inp = r.querySelector('input'), del = r.querySelector('button');
      inp.value = h.name; inp.setAttribute('aria-label', 'Rename habit ' + (i + 1));
      inp.addEventListener('change', function () { var v = inp.value.trim(); if (v) { h.name = v; S.__save(); renderHero(); renderToday(); renderGrid(); renderStats(); } else inp.value = h.name; });
      if (armed === h.id) { del.classList.add('is-arm'); del.textContent = 'Sure?'; }
      del.addEventListener('click', function () {
        if (armed === h.id) {
          S.habits = S.habits.filter(function (x) { return x.id !== h.id; });
          Object.keys(S.done).forEach(function (k) { S.done[k] = S.done[k].filter(function (x) { return x !== h.id; }); if (!S.done[k].length) delete S.done[k]; });
          armed = null; S.__save(); render();
        } else { armed = h.id; clearTimeout(armTimer); armTimer = setTimeout(function () { armed = null; renderHabits(); }, 3000); renderHabits(); }
      });
      l.appendChild(r);
    });
    $('habitCount').textContent = S.habits.length + ' / ' + MAX;
    $('newName').disabled = $('addKey').disabled = S.habits.length >= MAX;
    $('newName').placeholder = S.habits.length >= MAX ? 'Eight is the limit' : 'New habit';
  }
  function renderStats() {
    $('allNow').textContent = pad(streak(allDone), 2); $('allBest').textContent = pad(best(allDone), 2);
    var t = today(), el = $('slist'); el.innerHTML = '';
    S.habits.forEach(function (h) {
      var test = function (dk) { return isDone(dk, h.id); }, c = 0;
      for (var i = 0; i < 28; i++) if (test(key(addDays(t, -i)))) c++;
      var pct = Math.round(c / 28 * 100), on = Math.round(c / 28 * 10), segs = '';
      for (var j = 0; j < 10; j++) segs += '<span class="' + (j < on ? 'is-on' : '') + '"></span>';
      var r = document.createElement('div'); r.className = 'srow';
      r.innerHTML = '<span class="srow__name"></span><span class="srow__nums">' + pad(streak(test), 2) + ' now · ' + pad(best(test), 2) + ' best · ' + pad(pct, 3) + '%</span><span class="meter">' + segs + '</span>';
      r.querySelector('.srow__name').textContent = h.name;
      el.appendChild(r);
    });
  }
  function render() { renderHero(); renderToday(); renderGrid(); renderHabits(); renderStats(); gridTitle(); }

  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault(); var v = $('newName').value.trim();
    if (!v || S.habits.length >= MAX) return;
    S.habits.push({ id: 'h' + Date.now().toString(36) + rand(1000), name: v.slice(0, 24) }); $('newName').value = ''; S.__save(); render(); $('newName').focus();
  });
  $('exportKey').addEventListener('click', function () {
    var json = JSON.stringify({ app: 'unit01-habits', v: 1, habits: S.habits, done: S.done });
    var fallback = function () { $('io').classList.add('is-open'); $('ioText').value = json; $('ioText').select(); $('ioNote').textContent = 'Copy blocked here — the backup is in the box, selected.'; };
    try { navigator.clipboard.writeText(json).then(function () { $('ioNote').textContent = 'Backup copied (' + Object.keys(S.done).length + ' days).'; }, fallback); } catch (e) { fallback(); }
  });
  $('importKey').addEventListener('click', function () {
    if (!$('io').classList.contains('is-open')) { $('io').classList.add('is-open'); $('ioText').focus(); $('ioNote').textContent = 'Paste a backup, then press Restore again.'; return; }
    try {
      var d = JSON.parse($('ioText').value);
      if (!d || !Array.isArray(d.habits) || typeof d.done !== 'object') throw 0;
      S.habits = d.habits.filter(function (h) { return h && h.id && h.name; }).slice(0, MAX).map(function (h) { return { id: String(h.id), name: String(h.name).slice(0, 24) }; });
      S.done = {}; Object.keys(d.done).forEach(function (k) { if (/^\d{4}-\d{2}-\d{2}$/.test(k) && Array.isArray(d.done[k])) S.done[k] = d.done[k].map(String); });
      S.__save(); render(); $('ioText').value = ''; $('io').classList.remove('is-open'); $('ioNote').textContent = 'Restored ' + S.habits.length + ' habits.';
    } catch (e) { $('ioNote').textContent = 'That doesn’t look like a Habits backup.'; }
  });
  document.addEventListener('keydown', function (e) {
    if (inControl(e) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^[1-8]$/.test(e.key)) { var h = S.habits[+e.key - 1]; if (h) toggle(key(today()), h.id); }
  });
  if (window.ResizeObserver) new ResizeObserver(gridTitle).observe($('gwrap'));
  var lastDay = key(today());
  setInterval(function () { if (key(today()) !== lastDay) { lastDay = key(today()); render(); } }, 60000);
  render();
})();
</script>
</body>
</html>
