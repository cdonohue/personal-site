<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 01 — Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* ── Unit 01 tokens ─────────────────────────────────────────── */
:root, [data-theme="light"] {
  --chassis:#ffffff; --panel:#ffffff; --panel-sunk:#f0f0ee; --ink:#000000; --ink-muted:#5f5f5c; --line:#c8c8c4; --rule:var(--ink);
  --signal:#ff5a1f; --signal-text:#a83400; --on-signal:#000000; --blue:#3a63d8; --on-blue:#ffffff; --yellow:#f5c400; --on-yellow:#111111;
  --key:#e6e6e3; --lcd:#0b0b0b; --lcd-ink:#f2f2ef; --lcd-muted:#8f8f8a; --lcd-dim:#2a2a2a; --focus:var(--ink);
  --shadow-key:0 2px 0 #00000040; --shadow-key-pressed:0 0 0 #00000040;
}
[data-theme="dark"] {
  --chassis:#000000; --panel:#000000; --panel-sunk:#161616; --ink:#ffffff; --ink-muted:#9b9b97; --line:#3a3a3a; --key:#262626; --rule:var(--ink);
  --signal-text:#ff7a45; --shadow-key:0 2px 0 #ffffff26; --shadow-key-pressed:0 0 0 #ffffff26;
}
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-0:0; --radius-sm:2px; --radius-md:6px; --radius-full:9999px;
  --font-sans:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* ── Unit 01 components (vanilla port of the bundle) ────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); background: var(--chassis); color: var(--ink); -webkit-font-smoothing: antialiased; }
:where(button, input, [role="slider"]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.u-label { display: inline-flex; gap: var(--space-2); align-items: baseline; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.u-label b { font-weight: 700; color: var(--ink); }
.u-value { font-family: var(--font-mono); font-size: 13px; line-height: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
.u-led { display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--line); flex: none; }
.u-key .u-led, .u-selector__opt .u-led { background: var(--line); }
.is-on > .u-led, .u-led.is-lit { background: var(--signal); }

.u-key { appearance: none; position: relative; display: inline-flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  min-width: 0; padding: var(--space-2); border: 0; border-radius: var(--radius-0); background: var(--key); color: var(--ink);
  font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: left;
  box-shadow: var(--shadow-key); cursor: pointer; transition: transform 60ms linear, box-shadow 60ms linear; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.u-key:active, .u-key.is-hit, .u-key[aria-pressed="true"] { transform: translateY(2px); box-shadow: var(--shadow-key-pressed); }
.u-key--ink { background: var(--ink); color: var(--chassis); }
.u-key--signal { background: var(--signal); color: var(--on-signal); }
.u-key--blue { background: var(--blue); color: var(--on-blue); }
.u-key--yellow { background: var(--yellow); color: var(--on-yellow); }
.u-key__top { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: var(--space-1); }
.u-key__index { font-family: var(--font-mono); font-weight: 500; font-size: 9px; line-height: 12px; letter-spacing: .1em; opacity: .75; }
.u-key__glyph { align-self: center; display: flex; }
.u-key__glyph svg { width: 22px; height: 22px; fill: currentColor; }
.u-key--sm { width: 40px; height: 40px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; }

.u-panel { background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: var(--radius-0); min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
.u-panel__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-3); }
.u-panel__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel__body { padding: 0 0 var(--space-2); display: flex; flex-direction: column; gap: var(--space-4); flex: 1; }

.u-display { background: var(--lcd); color: var(--lcd-ink); border: 1px solid var(--line); border-radius: var(--radius-0); font-family: var(--font-mono); }
.u-display__label { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--lcd-muted); white-space: nowrap; }
.u-display__unit { font-size: 13px; line-height: 16px; color: var(--lcd-muted); text-transform: uppercase; letter-spacing: .08em; }

.u-selector { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-selector__row { display: flex; gap: 2px; border-radius: var(--radius-0); }
.u-selector__opt { appearance: none; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-2);
  background: var(--key); color: var(--ink); border: 0; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.u-selector__opt:first-child { border-left: 0; }
.u-selector__opt.is-on { background: var(--ink); color: var(--chassis); }
.u-selector__opt:focus-visible { outline-offset: -4px; }

.u-switch { appearance: none; display: inline-flex; align-items: center; gap: var(--space-3); padding: var(--space-1) 0; background: none; border: 0; color: var(--ink); cursor: pointer; }
.u-switch__track { position: relative; width: 40px; height: 20px; background: var(--panel-sunk); border: 1px solid var(--ink); border-radius: var(--radius-sm); flex: none; }
.u-switch__thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 14px; background: var(--ink); border-radius: var(--radius-sm); transition: left 80ms linear; }
.u-switch[aria-checked="true"] .u-switch__track { background: var(--signal); }
.u-switch[aria-checked="true"] .u-switch__thumb { left: 20px; background: var(--on-signal); }
.u-switch__state { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; min-width: 3ch; }

.u-fader { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-fader__head { display: flex; justify-content: space-between; align-items: baseline; }
.u-fader__input { appearance: none; -webkit-appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: ew-resize; }
.u-fader__input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-moz-range-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 28px; margin-top: -13px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }
.u-fader__input::-moz-range-thumb { width: 14px; height: 28px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }

.u-knob { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.u-knob__dial { border-radius: var(--radius-full); cursor: grab; touch-action: none; line-height: 0; }
.u-knob__tick { stroke: var(--line); stroke-width: 1.5; }
.u-knob__track { fill: none; stroke: var(--panel-sunk); stroke-width: 3; }
.u-knob__arc { fill: none; stroke: var(--signal); stroke-width: 3; }
.u-knob__cap { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.u-knob__ind { stroke: var(--ink); stroke-width: 3; stroke-linecap: square; }
.u-knob__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; }


/* ── Shared app shell (Unit 01 apps 16 / 20) ── */
.shell { height: 100dvh; overflow: auto; container: shell / size; }
.device { min-height: 100%; height: 100%; display: grid; gap: var(--space-2); padding: var(--space-2); grid-template-columns: minmax(0, 1fr); }
.bar { display: none; grid-area: bar; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-1) var(--space-1) 0; container: bar / inline-size; min-width: 0; }
.bar__title { display: inline-flex; align-items: flex-start; gap: var(--space-2); font: 800 clamp(18px, 4.2cqi, 34px)/1 var(--font-sans); letter-spacing: -.025em; white-space: nowrap; }
.bar__idx { font: 500 9px/12px var(--font-mono); letter-spacing: .1em; color: var(--ink-muted); }
.bar__right { display: flex; align-items: center; gap: var(--space-4); min-width: 0; }
.bar__meta { display: none; }
@container bar (min-width: 420px) { .bar__meta { display: inline-flex; } }
.section { border-top: 2px solid var(--rule); padding-top: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; min-height: 0; }
.section__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.section__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel { min-height: 0; overflow: hidden; }
.u-panel__body { min-height: 0; }
.fld { box-sizing: border-box; width: 100%; min-width: 0; height: 40px; padding: 0 var(--space-3); background: var(--panel-sunk); color: var(--ink); border: 0; border-bottom: 2px solid var(--ink); border-radius: var(--radius-0); font: 400 15px/22px var(--font-sans); }
.fld--mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.fld::placeholder { color: var(--ink-muted); }
.fld:read-only { color: var(--ink-muted); }
.kc { align-items: center; justify-content: center; padding: 0; text-align: center; }
.is-hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.u-key:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }

.hero { grid-area: hero; } .quick { grid-area: quick; } .tip { grid-area: tip; } .p-opts { grid-area: opts; } .p-items { grid-area: items; } .p-break { grid-area: break; } .p-receipt { grid-area: receipt; }
.tip, .p-opts, .p-items, .p-break, .p-receipt { display: none; }

/* ── Hero ── */
.hero { container: hero / size; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-1); padding: var(--space-2) var(--space-3); overflow: hidden; }
.hero__top, .hero__bottom { display: flex; justify-content: space-between; gap: var(--space-3); min-width: 0; }
.hero__bottom { flex-wrap: wrap; row-gap: 2px; }
.hero__main { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
.amount { --len: 4; white-space: nowrap; overflow: hidden; font-family: var(--font-sans); font-weight: 800; letter-spacing: -.035em; line-height: .95; font-variant-numeric: tabular-nums;
  font-size: max(18px, min(calc(94cqw / (var(--len) * .6)), 56cqh, 170px)); }
.hero__note { font: 400 clamp(10px, 4.2cqh, 13px)/1.3 var(--font-mono); color: var(--lcd-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero__note.is-extra { color: var(--signal); }
@container hero (max-height: 104px) { .hero__top, .hero__note { display: none; } }
@container hero (max-height: 70px) { .hero__bottom { display: none; } .hero__main { justify-content: center; } }
@container hero (max-width: 259px) { .hero__bottom .u-display__label:nth-child(n+2) { display: none; } }

/* ── Quick entry: bill and people ── */
.quick { container: quick / inline-size; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-2); min-width: 0; }
.q-grp { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.q-row { display: flex; gap: var(--space-2); align-items: stretch; min-width: 0; }
.q-row .u-key { width: 40px; height: 40px; flex: none; font-size: 18px; letter-spacing: 0; }
.q-row .fld { flex: 1; text-align: center; font-size: 18px; }
.q-count { flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; gap: var(--space-2); background: var(--panel-sunk); font: 400 18px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.q-count small { font: 700 10px/1 var(--font-sans); letter-spacing: .06em; color: var(--ink-muted); }
.q-lbl { display: none; }
@container shell (min-height: 360px) { .q-lbl { display: inline-flex; } }
@container quick (min-width: 440px) { .quick { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: var(--space-4); } }

/* ── Tip row ── */
.tip { min-width: 0; container: tip / inline-size; }
.tip__row { display: flex; gap: var(--space-2); align-items: stretch; min-width: 0; }
.tip .u-selector__row { flex: 1; min-width: 0; }
.tip .u-selector__opt { padding: 0 2px; }
.tip__custom { display: none; gap: var(--space-1); align-items: center; }
.tip__custom.is-on { display: flex; }
.tip__custom .u-key { width: 32px; height: 40px; font-size: 16px; letter-spacing: 0; }
.tip__custom output { min-width: 4ch; text-align: center; font: 400 15px/40px var(--font-mono); background: var(--panel-sunk); padding: 0 var(--space-1); }
@container tip (max-width: 419px) { .tip__row { flex-wrap: wrap; } .tip .u-selector__row { flex-basis: 100%; } .tip__custom { flex: 1; justify-content: flex-end; } }

/* ── Options ── */
.p-opts { flex-direction: column; }
.opts__row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }

/* ── Items ── */
.p-items { flex-direction: column; }
.p-items .u-panel__body { overflow: hidden; display: flex; flex-direction: column; }
.people { display: flex; flex-wrap: wrap; gap: var(--space-1); }
.chip { appearance: none; height: 28px; min-width: 28px; padding: 0 var(--space-2); border: 0; border-radius: var(--radius-0); background: var(--key); color: var(--ink); box-shadow: var(--shadow-key);
  font: 700 11px/1 var(--font-sans); letter-spacing: .04em; text-transform: uppercase; cursor: pointer; white-space: nowrap; max-width: 12ch; overflow: hidden; text-overflow: ellipsis; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--chassis); box-shadow: var(--shadow-key-pressed); transform: translateY(2px); }
.add { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, .8fr) auto; gap: var(--space-2); }
.add .u-key { height: 40px; padding: 0 var(--space-3); flex-direction: row; align-items: center; }
.ilist { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
.irow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: var(--space-1) var(--space-2); align-items: center; padding: var(--space-2) 0; border-bottom: 1px solid var(--line); }
.irow__name { font: 700 14px/18px var(--font-sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irow__price { font: 400 14px/18px var(--font-mono); font-variant-numeric: tabular-nums; }
.irow__who { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--space-1); align-items: center; }
.irow__who .u-label { margin-right: var(--space-1); }
.k-x { width: 28px; height: 28px; padding: 0; align-items: center; justify-content: center; font-size: 14px; letter-spacing: 0; }
.empty { color: var(--ink-muted); font-size: 13px; line-height: 18px; padding: var(--space-2) 0; }
.mode-off .ilist, .mode-off .people, .mode-off .add { opacity: .45; }

/* ── Breakdown ── */
.p-break { flex-direction: column; }
.p-break .u-panel__body { display: flex; flex-direction: column; overflow: hidden; }
.btable { flex: 1; min-height: 0; overflow: auto; }
.brow { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, minmax(0, auto)); gap: var(--space-3); align-items: center; padding: var(--space-1) 0; border-bottom: 1px solid var(--line); }
.brow--head { border-bottom: 2px solid var(--rule); }
.brow span { font: 400 13px/18px var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; min-width: 7ch; }
.brow .pay { font: 800 16px/18px var(--font-sans); }
.brow--head span { font: 700 10px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.bname { appearance: none; width: 100%; min-width: 0; height: 28px; padding: 0 var(--space-2); border: 0; border-bottom: 1px solid transparent; background: transparent; color: var(--ink); font: 700 13px/18px var(--font-sans); border-radius: 0; }
.bname:hover, .bname:focus { background: var(--panel-sunk); border-bottom-color: var(--ink); }
@container (max-width: 380px) { .brow .c-sub { display: none; } }
.copy-row { display: flex; gap: var(--space-2); }
.copy-row .u-key { height: 40px; flex: 1; flex-direction: row; align-items: center; justify-content: center; }
.fallback { display: none; width: 100%; height: 96px; font: 400 12px/16px var(--font-mono); background: var(--panel-sunk); color: var(--ink); border: 0; border-bottom: 2px solid var(--ink); border-radius: 0; resize: none; }
.fallback.is-on { display: block; }

/* ── Receipt ── */
.p-receipt { flex-direction: column; }
.p-receipt .u-panel__body { display: flex; flex-direction: column; overflow: hidden; }
.receipt { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: var(--space-4); background: var(--panel-sunk); font: 400 12px/18px var(--font-mono); white-space: pre; color: var(--ink); }

/* ── Tiers ── */
.device { grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "hero" "quick"; }
@container shell (min-width: 300px) and (min-height: 360px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar" "hero" "quick"; }
  .bar { display: flex; }
}
@container shell (min-width: 300px) and (min-height: 560px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar" "hero" "tip" "quick"; }
  .tip { display: flex; }
}
@container shell (min-width: 520px) and (min-height: 760px) {
  .device { gap: var(--space-4); padding: var(--space-4); grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
    grid-template-rows: auto minmax(0, .9fr) auto auto minmax(0, 1fr); grid-template-areas: "bar bar" "hero hero" "tip tip" "quick quick" "opts break"; }
  .p-opts, .p-break { display: flex; }
}
@container shell (min-width: 560px) and (max-height: 359px) {
  .device { grid-template-columns: minmax(0, 1fr) minmax(220px, .8fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "hero quick"; }
  .quick { align-content: center; }
}
@container shell (min-width: 560px) and (min-height: 360px) and (max-height: 559px) {
  .device { grid-template-columns: minmax(0, 1fr) minmax(240px, .85fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "hero quick" "tip tip"; }
  .tip { display: flex; }
  .quick { grid-template-columns: minmax(0, 1fr); align-content: center; }
}
@container shell (min-width: 820px) and (min-height: 540px) {
  .device { gap: var(--space-4); padding: var(--space-6); grid-template-columns: minmax(0, 1fr) minmax(360px, 1.1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto auto; grid-template-areas: "bar bar" "hero items" "tip items" "quick break" "opts break"; }
  .tip { display: flex; }
  .p-opts, .p-break, .p-items { display: flex; }
}
@container shell (min-width: 820px) and (max-height: 759px) {
  .device { padding: var(--space-4); }
  .u-panel__head { padding: var(--space-1) 0 var(--space-2); }
  .u-panel__body { padding: 0; gap: var(--space-2); }
}
@container shell (min-width: 1180px) and (min-height: 760px) {
  .device { padding: var(--space-8); grid-template-columns: minmax(0, 1.1fr) minmax(360px, 1.1fr) minmax(300px, .9fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto auto;
    grid-template-areas: "bar bar bar" "hero items receipt" "tip items receipt" "quick break receipt" "opts break receipt"; }
  .p-receipt { display: flex; }
}
.u-knob__dial.is-turning { outline: 1px dashed var(--ink-muted); outline-offset: 3px; }
/* iOS zooms into any field under 16px: keep every text field at 16px or more */
input#itemName, input#itemPrice, input.bname, textarea#fallback { font-size: 16px !important; }
</style>
</head>
<body>
<div class="shell">
<main class="device">

  <header class="bar">
    <span class="bar__title"><span class="bar__idx">20</span>Split</span>
    <div class="bar__right">
      <span class="u-label bar__meta" id="barMeta">Even · 4 people</span>
      <button class="u-switch" role="switch" aria-checked="false" id="themeSw" aria-label="Dark theme">
        <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
        <span class="u-label">Dark</span>
      </button>
    </div>
  </header>

  <section class="hero u-display" aria-label="Result">
    <div class="hero__top">
      <span class="u-display__label" id="eachLbl">Each</span>
      <span class="u-display__label" id="modeOut">Even</span>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'unit01-split';
  var S = { bill: '86.40', tip: 15, tipCustom: false, people: 4, round: false, cur: '$', mode: 'even', names: [], items: [], theme: null, nextId: 1 };
  try { var sv = JSON.parse(localStorage.getItem(KEY) || 'null'); if (sv) Object.assign(S, sv); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  var clamp = function (n, a, b) { return Math.min(b, Math.max(a, n)); };

  /* ── Theme ── */
  function applyTheme() {
    var dark = S.theme ? S.theme === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $('themeSw').setAttribute('aria-checked', String(dark));
  }
  $('themeSw').addEventListener('click', function () { S.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyTheme(); save(); });

  /* ── Money: integer minor units ── */
  function dec() { return S.cur === '¥' ? 0 : 2; }
  function factor() { return S.cur === '¥' ? 1 : 100; }
  function parseMoney(str) {
    var s = String(str || '').replace(/[^0-9.]/g, ''); if (!s || s === '.') return 0;
    var v = parseFloat(s); if (!isFinite(v)) return 0;
    return Math.round(v * factor());
  }
  function money(minor) {
    var d = dec(), neg = minor < 0, v = Math.abs(minor) / factor();
    return (neg ? '−' : '') + S.cur + v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function plain(minor) { return (minor / factor()).toFixed(dec()); }
  function nameOf(i) { return (S.names[i] && S.names[i].trim()) || ('Person ' + (i + 1)); }
  function chipOf(i) { var n = S.names[i] && S.names[i].trim(); return n ? n : 'P' + (i + 1); }
  function splitEven(amount, n) { var base = Math.floor(amount / n), r = amount - base * n, out = []; for (var i = 0; i < n; i++) out.push(base + (i < r ? 1 : 0)); return out; }
  function distribute(total, weights) {
    var sum = weights.reduce(function (a, b) { return a + b; }, 0), n = weights.length;
    if (!sum) return splitEven(total, n);
    var raw = weights.map(function (w) { return total * w / sum; }), fl = raw.map(Math.floor), left = total - fl.reduce(function (a, b) { return a + b; }, 0);
    raw.map(function (r, i) { return { i: i, f: r - fl[i] }; }).sort(function (a, b) { return b.f - a.f || a.i - b.i; }).slice(0, left).forEach(function (o) { fl[o.i]++; });
    return fl;
  }

  function compute() {
    var n = S.people, subs, bill;
    if (S.mode === 'items') {
      subs = []; for (var i = 0; i < n; i++) subs.push(0);
      S.items.forEach(function (it) {
        var c = parseMoney(it.price), who = (it.who || []).filter(function (w) { return w < n; });
        if (!who.length) who = subs.map(function (_, j) { return j; });
        splitEven(c, who.length).forEach(function (part, k) { subs[who[k]] += part; });
      });
      bill = subs.reduce(function (a, b) { return a + b; }, 0);
    } else { bill = parseMoney(S.bill); subs = splitEven(bill, n); }
    var tip = Math.round(bill * S.tip / 100), tips = distribute(tip, subs);
    var total = bill + tip, pays = subs.map(function (s, i) { return s + tips[i]; });
    if (S.mode !== 'items') pays = splitEven(total, n), tips = pays.map(function (p, i) { return p - subs[i]; });
    var unit = factor(), rounded = pays.map(function (p) { return S.round ? Math.ceil(p / unit) * unit : p; });
    var collected = rounded.reduce(function (a, b) { return a + b; }, 0);
    return { n: n, bill: bill, tip: tip, total: total, subs: subs, tips: tips, pays: pays, rounded: rounded, collected: collected, extra: collected - total };
  }

  /* ── Render ── */
  function render() {
    var R = compute(), items = S.mode === 'items';
    var big = items ? (S.round ? R.collected : R.total) : Math.max.apply(null, R.rounded);
    var txt = money(big), amt = $('amount');
    amt.textContent = txt; amt.style.setProperty('--len', Math.max(3, txt.length - (txt.replace(/[^,.]/g, '').length * .55)));
    $('eachLbl').textContent = items ? 'Total' : 'Each';
    $('modeOut').textContent = items ? 'By item' : 'Even';
    $('tipLbl').textContent = 'Tip ' + S.tip + '%';
    $('tipPct').textContent = S.tip + '%';
    $('totalOut').textContent = (items ? 'Bill ' + money(R.bill) : 'Total ' + money(R.total));
    $('tipOut').textContent = 'Tip ' + money(R.tip);
    $('pplOut').textContent = R.n + (R.n === 1 ? ' person' : ' people');
    var note = $('note'); note.classList.remove('is-extra');
    if (S.round && R.extra > 0) { note.textContent = 'Collect ' + money(R.collected) + ' · +' + money(R.extra) + ' extra'; note.classList.add('is-extra'); }
    else if (items) note.textContent = 'Shares vary · ' + S.items.length + (S.items.length === 1 ? ' item' : ' items');
    else {
      var hi = Math.max.apply(null, R.pays), lo = Math.min.apply(null, R.pays), nHi = R.pays.filter(function (p) { return p === hi; }).length;
      note.textContent = hi !== lo ? nHi + ' pay ' + money(hi) + ' · ' + (R.n - nHi) + ' pay ' + money(lo) : (R.n > 1 ? 'Everyone pays the same' : '');
    }
    $('barMeta').textContent = (items ? 'By item' : 'Even') + ' · ' + R.n + (R.n === 1 ? ' person' : ' people');
    $('pplNum').textContent = R.n;
    var bf = $('bill');
    if (items) { bf.readOnly = true; bf.value = plain(R.bill); } else { bf.readOnly = false; if (document.activeElement !== bf) bf.value = S.bill; }
    $('billMinus').disabled = $('billPlus').disabled = items;
    $('billLbl').textContent = items ? 'Bill · from items' : 'Bill';
    // tip selector
    document.querySelectorAll('#tipSel [role=radio]').forEach(function (o) {
      var on = o.dataset.v === 'custom' ? S.tipCustom : (!S.tipCustom && +o.dataset.v === S.tip);
      o.classList.toggle('is-on', on); o.setAttribute('aria-checked', String(on)); o.tabIndex = on ? 0 : -1;
      if (o.dataset.v === 'custom') o.textContent = S.tipCustom ? S.tip + '%' : 'Own';
    });
    $('tipCustom').classList.toggle('is-on', S.tipCustom);
    $('tipCustomOut').textContent = S.tip + '%';
    $('roundSw').setAttribute('aria-checked', String(S.round));
    syncSel('curSel', S.cur); syncSel('modeSel', S.mode);
    if (window.__drawKnob) window.__drawKnob();
    renderPeople(); renderItems(); renderBreak(R); renderReceipt(R);
  }
  function syncSel(id, v) {
    document.querySelectorAll('#' + id + ' [role=radio]').forEach(function (o) { var on = o.dataset.v === v; o.classList.toggle('is-on', on); o.setAttribute('aria-checked', String(on)); o.tabIndex = on ? 0 : -1; });
  }
  function renderPeople() {
    var p = $('people'); p.innerHTML = '';
    var l = document.createElement('span'); l.className = 'u-label'; l.textContent = 'People'; l.style.marginRight = '4px'; l.style.alignSelf = 'center'; p.appendChild(l);
    for (var i = 0; i < S.people; i++) { var c = document.createElement('span'); c.className = 'chip'; c.style.display = 'inline-flex'; c.style.alignItems = 'center'; c.textContent = chipOf(i); c.title = nameOf(i); p.appendChild(c); }
  }
  function renderItems() {
    var body = $('itemsBody'), list = $('ilist');
    body.classList.toggle('mode-off', S.mode !== 'items');
    $('itemsMeta').textContent = S.items.length + (S.items.length === 1 ? ' item' : ' items');
    list.innerHTML = '';
    if (!S.items.length) { list.innerHTML = '<p class="empty">Add what each person ordered. Tap names on an item to assign it; no names means it\'s shared by everyone.</p>'; return; }
    S.items.forEach(function (it) {
      var row = document.createElement('div'); row.className = 'irow';
      var nm = document.createElement('span'); nm.className = 'irow__name'; nm.textContent = it.name || 'Item';
      var pr = document.createElement('span'); pr.className = 'irow__price'; pr.textContent = money(parseMoney(it.price));
      var x = document.createElement('button'); x.className = 'u-key kc k-x'; x.textContent = '×'; x.setAttribute('aria-label', 'Remove ' + (it.name || 'item'));
      x.addEventListener('click', function () { S.items = S.items.filter(function (o) { return o !== it; }); save(); render(); });
      var who = document.createElement('div'); who.className = 'irow__who';
      var wl = document.createElement('span'); wl.className = 'u-label';
      var assigned = (it.who || []).filter(function (w) { return w < S.people; });
      wl.textContent = assigned.length ? 'For' : 'Shared'; who.appendChild(wl);
      for (var i = 0; i < S.people; i++) (function (i) {
        var c = document.createElement('button'); c.className = 'chip'; c.textContent = chipOf(i);
        c.setAttribute('aria-pressed', String(assigned.indexOf(i) >= 0)); c.setAttribute('aria-label', nameOf(i) + ' has ' + (it.name || 'item'));
        c.addEventListener('click', function () {
          it.who = (it.who || []).filter(function (w) { return w < S.people; });
          var k = it.who.indexOf(i); if (k >= 0) it.who.splice(k, 1); else it.who.push(i);
          save(); render();
        });
        who.appendChild(c);
      })(i);
      row.appendChild(nm); row.appendChild(pr); row.appendChild(x); row.appendChild(who);
      list.appendChild(row);
    });
  }
  function renderBreak(R) {
    var t = $('btable'), focused = document.activeElement && document.activeElement.classList.contains('bname') ? +document.activeElement.dataset.i : -1;
    if (focused >= 0 && t.children.length === R.n + 1) { // keep the field being edited; refresh numbers only
      for (var j = 0; j < R.n; j++) { var cells = t.children[j + 1].querySelectorAll('span'); cells[0].textContent = money(R.subs[j]); cells[1].textContent = money(R.tips[j]); cells[2].textContent = money(R.rounded[j]); }
    } else {
      t.innerHTML = '<div class="brow brow--head"><span style="text-align:left">Name</span><span class="c-sub">Share</span><span>Tip</span><span>Pays</span></div>';
      for (var i = 0; i < R.n; i++) {
        var row = document.createElement('div'); row.className = 'brow';
        var inp = document.createElement('input'); inp.className = 'bname'; inp.value = S.names[i] || ''; inp.placeholder = 'Person ' + (i + 1); inp.maxLength = 16; inp.dataset.i = i; inp.setAttribute('aria-label', 'Name for person ' + (i + 1));
        inp.addEventListener('input', function (e) { S.names[+e.target.dataset.i] = e.target.value; save(); render(); });
        var a = document.createElement('span'); a.className = 'c-sub'; a.textContent = money(R.subs[i]);
        var b = document.createElement('span'); b.textContent = money(R.tips[i]);
        var c = document.createElement('span'); c.className = 'pay'; c.textContent = money(R.rounded[i]);
        row.appendChild(inp); row.appendChild(a); row.appendChild(b); row.appendChild(c); t.appendChild(row);
      }
    }
    $('breakMeta').textContent = S.round && R.extra > 0 ? '+' + money(R.extra) + ' extra' : 'Total ' + money(R.total);
  }
  function summary(R) {
    R = R || compute();
    var W = 30, line = new Array(W + 1).join('-');
    function lr(l, r) { l = String(l); r = String(r); var sp = W - l.length - r.length; if (sp < 1) { l = l.slice(0, W - r.length - 2) + '…'; sp = 1; } return l + new Array(sp + 1).join(' ') + r; }
    var out = ['UNIT 01 · SPLIT', new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }), line];
    if (S.mode === 'items' && S.items.length) S.items.forEach(function (it) { out.push(lr(it.name || 'Item', money(parseMoney(it.price)))); });
    else out.push(lr('Bill', money(R.bill)));
    out.push(line, lr('Subtotal', money(R.bill)), lr('Tip ' + S.tip + '%', money(R.tip)), lr('TOTAL', money(R.total)), line);
    for (var i = 0; i < R.n; i++) out.push(lr(nameOf(i), money(R.rounded[i])));
    if (S.round && R.extra > 0) out.push(line, lr('Collected', money(R.collected)), lr('Extra', money(R.extra)));
    out.push(line, 'Split ' + (S.mode === 'items' ? 'by item' : 'evenly') + ' between ' + R.n + '.');
    return out.join('\n');
  }
  function renderReceipt(R) { $('receipt').textContent = summary(R); $('rcptDate').textContent = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }); }

  /* ── Copy (click only; fall back to selected text) ── */
  function copy(btn) {
    var text = summary(), fb = $('fallback'), label = btn.textContent;
    function done(ok) {
      btn.textContent = ok ? 'Copied' : 'Select & copy below';
      if (!ok) { fb.value = text; fb.classList.add('is-on'); fb.focus(); fb.select(); }
      setTimeout(function () { btn.textContent = label; }, 1600);
    }
    try { navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); }); } catch (e) { done(false); }
  }
  $('copyBtn').addEventListener('click', function () { copy($('copyBtn')); });
  $('fallback').addEventListener('blur', function () { $('fallback').classList.remove('is-on'); });
  $('copyBtn2').addEventListener('click', function () { copy($('copyBtn2')); });

  /* ── Inputs ── */
  $('bill').addEventListener('input', function (e) {
    var v = e.target.value.replace(/[^0-9.]/g, ''), p = v.split('.');
    if (p.length > 2) v = p[0] + '.' + p.slice(1).join('');
    p = v.split('.'); if (p[1] != null) v = p[0] + (dec() ? '.' + p[1].slice(0, dec()) : '');
    if (v !== e.target.value) e.target.value = v;
    S.bill = v; save(); render();
  });
  function nudgeBill(d) { if (S.mode === 'items') return; var c = Math.max(0, parseMoney(S.bill) + d * factor()); S.bill = plain(c); $('bill').value = S.bill; save(); render(); }
  $('billMinus').addEventListener('click', function () { nudgeBill(-1); });
  $('billPlus').addEventListener('click', function () { nudgeBill(1); });
  function setPeople(n) { S.people = clamp(n, 1, 20); save(); render(); }
  $('pplMinus').addEventListener('click', function () { setPeople(S.people - 1); });
  $('pplPlus').addEventListener('click', function () { setPeople(S.people + 1); });
  function setTip(v, custom) { S.tip = clamp(Math.round(v), 0, 40); S.tipCustom = custom; save(); render(); }
  document.querySelectorAll('#tipSel [role=radio]').forEach(function (o, i, all) {
    o.addEventListener('click', function () { if (o.dataset.v === 'custom') setTip(S.tipCustom ? S.tip : (S.tip || 22), true); else setTip(+o.dataset.v, false); });
    o.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (!d) return;
      e.preventDefault(); var j = (i + d + all.length) % all.length; all[j].click(); all[j].focus();
    });
  });
  $('tipMinus').addEventListener('click', function () { setTip(S.tip - 1, true); });
  $('tipPlus').addEventListener('click', function () { setTip(S.tip + 1, true); });
  $('roundSw').addEventListener('click', function () { S.round = !S.round; save(); render(); });
  function bindSel(id, key) {
    var all = document.querySelectorAll('#' + id + ' [role=radio]');
    all.forEach(function (o, i) {
      o.addEventListener('click', function () { S[key] = o.dataset.v; save(); render(); });
      o.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (!d) return;
        e.preventDefault(); var j = (i + d + all.length) % all.length; all[j].click(); all[j].focus();
      });
    });
  }
  bindSel('curSel', 'cur'); bindSel('modeSel', 'mode');
  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('itemName').value.trim(), price = $('itemPrice').value.replace(/[^0-9.]/g, '');
    if (!parseMoney(price)) { $('itemPrice').focus(); return; }
    S.items.push({ id: S.nextId++, name: name || 'Item ' + (S.items.length + 1), price: price, who: [] });
    if (S.mode !== 'items') S.mode = 'items';
    $('itemName').value = ''; $('itemPrice').value = ''; $('itemName').focus(); save(); render();
  });

  /* ── Tip knob (vanilla Unit.Knob) ── */
  (function knob(root) {
    function pt(a, r) { var t = a * Math.PI / 180; return [32 + r * Math.sin(t), 32 - r * Math.cos(t)]; }
    function arc(a0, a1, r) { var s = pt(a0, r), e = pt(a1, r); return 'M' + s[0].toFixed(2) + ' ' + s[1].toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + e[0].toFixed(2) + ' ' + e[1].toFixed(2); }
    var ticks = ''; for (var i = 0; i <= 10; i++) { var a = -135 + 27 * i, o = pt(a, 31), n = pt(a, 28.5); ticks += '<line class="u-knob__tick" x1="' + o[0] + '" y1="' + o[1] + '" x2="' + n[0] + '" y2="' + n[1] + '"/>'; }
    root.innerHTML = '<div class="u-knob__dial" tabindex="0" role="slider" aria-label="Tip percent" aria-valuemin="0" aria-valuemax="40">' +
      '<svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">' + ticks + '<path class="u-knob__track" d="' + arc(-135, 135, 25) + '"/><path class="u-knob__arc"/><circle class="u-knob__cap" cx="32" cy="32" r="20"/><line class="u-knob__ind"/></svg></div>' +
      '<div class="u-knob__foot"><span class="u-label">Tip</span><span class="u-value"></span></div>';
    var dial = root.firstChild, arcEl = root.querySelector('.u-knob__arc'), ind = root.querySelector('.u-knob__ind'), val = root.querySelector('.u-value');
    window.__drawKnob = function () {
      var v = S.tip, a = -135 + 270 * v / 40, i0 = pt(a, 6), i1 = pt(a, 17);
      arcEl.setAttribute('d', v > 0 ? arc(-135, a, 25) : '');
      ind.setAttribute('x1', i0[0]); ind.setAttribute('y1', i0[1]); ind.setAttribute('x2', i1[0]); ind.setAttribute('y2', i1[1]);
      val.textContent = (v < 10 ? '0' : '') + v + '%'; dial.setAttribute('aria-valuenow', v);
    };
    var drag = null;
    function knobDrag(dial, get, set, range, sens, ok, min, max) {
      /* Turn it like a dial (start on the ring), or slide up/right to raise, down/left to lower (start near the centre). Shift = fine. Wheel works too. */
      var st = null, lo = min == null ? -Infinity : min, hi = max == null ? Infinity : max;
      var cl = function (v) { return Math.min(hi, Math.max(lo, v)); };
      dial.style.touchAction = 'none';
      dial.addEventListener('pointerdown', function (e) {
        if (ok && !ok()) return; e.preventDefault(); dial.focus(); dial.setPointerCapture(e.pointerId);
        var r = dial.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, rad = Math.min(r.width, r.height) / 2;
        var dx = e.clientX - cx, dy = e.clientY - cy;
        st = { x: e.clientX, y: e.clientY, cx: cx, cy: cy, v: get(), tv: get(), mode: null, ang: Math.atan2(dx, -dy), ring: Math.sqrt(dx * dx + dy * dy) >= rad * 0.4 };
      });
      dial.addEventListener('pointermove', function (e) {
        if (!st) return;
        var mx = e.clientX - st.x, my = e.clientY - st.y;
        if (!st.mode) { if (Math.sqrt(mx * mx + my * my) < 4) return; st.mode = st.ring ? 'turn' : 'slide'; dial.classList.add('is-turning'); }
        if (st.mode === 'turn') {
          var dx = e.clientX - st.cx, dy = e.clientY - st.cy;
          if (Math.sqrt(dx * dx + dy * dy) < 6) return;
          var a = Math.atan2(dx, -dy), d = a - st.ang;
          if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
          st.ang = a; st.tv = cl(st.tv + d / (1.5 * Math.PI) * range * (e.shiftKey ? 0.25 : 1));
          set(st.tv, e.shiftKey);
        } else {
          set(cl(st.v + (mx - my) * range / (sens || 150) / (e.shiftKey ? 4 : 1)), e.shiftKey);
        }
      });
      var end = function () { st = null; dial.classList.remove('is-turning'); };
      dial.addEventListener('pointerup', end); dial.addEventListener('pointercancel', end);
      dial.addEventListener('wheel', function (e) {
        if (ok && !ok()) return; e.preventDefault();
        if (Math.abs(e.deltaY) < 1) return; dial.dispatchEvent(new KeyboardEvent('keydown', { key: e.deltaY < 0 ? 'ArrowUp' : 'ArrowDown', shiftKey: e.shiftKey, bubbles: true, cancelable: true }));
      }, { passive: false });
    }
    knobDrag(dial, function () { return S.tip; }, function (v) { setTip(v, true); }, 40, 150, null, 0, 40);
    dial.addEventListener('pointerup', function () { drag = null; });
    dial.addEventListener('keydown', function (e) {
      var d = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 5, PageDown: -5 }[e.key];
      if (e.key === 'Home') d = -S.tip; if (e.key === 'End') d = 40 - S.tip;
      if (d != null) { e.preventDefault(); setTip(S.tip + d, true); }
    });
  })($('tipKnob'));

  /* ── Keyboard: +/− people · ↑/↓ bill · R round ── */
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target; if (t.closest && t.closest('input, textarea, button, [role="slider"]')) return;
    if (e.key === '+' || e.key === '=') setPeople(S.people + 1);
    else if (e.key === '-' || e.key === '_') setPeople(S.people - 1);
    else if (e.key === 'ArrowUp') { e.preventDefault(); nudgeBill(e.shiftKey ? 10 : 1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); nudgeBill(e.shiftKey ? -10 : -1); }
    else if (e.key === 'r' || e.key === 'R') { S.round = !S.round; save(); render(); }
    else return;
  });

  window.__split = { S: S, compute: compute, summary: summary };
  applyTheme(); $('bill').value = S.bill; render();
})();
</script>
