<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 01 — Colour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* ── Unit 01 tokens ─────────────────────────────────────────── */
:root, [data-theme="light"] {
  --chassis:#ffffff; --panel:#ffffff; --panel-sunk:#f0f0ee; --ink:#000000; --ink-muted:#5f5f5c; --line:#c8c8c4; --rule:var(--ink);
  --signal:#ff5a1f; --signal-text:#a83400; --on-signal:#000000; --blue:#3a63d8; --on-blue:#ffffff; --yellow:#f5c400; --on-yellow:#111111;
  --key:#e6e6e3; --lcd:#0b0b0b; --lcd-ink:#f2f2ef; --lcd-muted:#8f8f8a; --lcd-dim:#2a2a2a; --focus:var(--ink);
  --shadow-key:0 2px 0 #00000040; --shadow-key-pressed:0 0 0 #00000040;
}
[data-theme="dark"] {
  --chassis:#000000; --panel:#000000; --panel-sunk:#161616; --ink:#ffffff; --ink-muted:#9b9b97; --line:#3a3a3a; --key:#262626; --rule:var(--ink);
  --signal-text:#ff7a45; --shadow-key:0 2px 0 #ffffff26; --shadow-key-pressed:0 0 0 #ffffff26;
}
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-0:0; --radius-sm:2px; --radius-md:6px; --radius-full:9999px;
  --font-sans:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* ── Unit 01 components (vanilla port of the bundle) ────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); background: var(--chassis); color: var(--ink); -webkit-font-smoothing: antialiased; }
:where(button, input, [role="slider"]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.u-label { display: inline-flex; gap: var(--space-2); align-items: baseline; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.u-label b { font-weight: 700; color: var(--ink); }
.u-value { font-family: var(--font-mono); font-size: 13px; line-height: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
.u-led { display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--line); flex: none; }
.u-key .u-led, .u-selector__opt .u-led { background: var(--line); }
.is-on > .u-led, .u-led.is-lit { background: var(--signal); }

.u-key { appearance: none; position: relative; display: inline-flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  min-width: 0; padding: var(--space-2); border: 0; border-radius: var(--radius-0); background: var(--key); color: var(--ink);
  font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: left;
  box-shadow: var(--shadow-key); cursor: pointer; transition: transform 60ms linear, box-shadow 60ms linear; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.u-key:active, .u-key.is-hit, .u-key[aria-pressed="true"] { transform: translateY(2px); box-shadow: var(--shadow-key-pressed); }
.u-key--ink { background: var(--ink); color: var(--chassis); }
.u-key--signal { background: var(--signal); color: var(--on-signal); }
.u-key--blue { background: var(--blue); color: var(--on-blue); }
.u-key--yellow { background: var(--yellow); color: var(--on-yellow); }
.u-key__top { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: var(--space-1); }
.u-key__index { font-family: var(--font-mono); font-weight: 500; font-size: 9px; line-height: 12px; letter-spacing: .1em; opacity: .75; }
.u-key__glyph { align-self: center; display: flex; }
.u-key__glyph svg { width: 22px; height: 22px; fill: currentColor; }
.u-key--sm { width: 40px; height: 40px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; }

.u-panel { background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: var(--radius-0); min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
.u-panel__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-3); }
.u-panel__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel__body { padding: 0 0 var(--space-2); display: flex; flex-direction: column; gap: var(--space-4); flex: 1; }

.u-display { background: var(--lcd); color: var(--lcd-ink); border: 1px solid var(--line); border-radius: var(--radius-0); font-family: var(--font-mono); }
.u-display__label { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--lcd-muted); white-space: nowrap; }
.u-display__unit { font-size: 13px; line-height: 16px; color: var(--lcd-muted); text-transform: uppercase; letter-spacing: .08em; }

.u-selector { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-selector__row { display: flex; gap: 2px; border-radius: var(--radius-0); }
.u-selector__opt { appearance: none; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-2);
  background: var(--key); color: var(--ink); border: 0; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.u-selector__opt:first-child { border-left: 0; }
.u-selector__opt.is-on { background: var(--ink); color: var(--chassis); }
.u-selector__opt:focus-visible { outline-offset: -4px; }

.u-switch { appearance: none; display: inline-flex; align-items: center; gap: var(--space-3); padding: var(--space-1) 0; background: none; border: 0; color: var(--ink); cursor: pointer; }
.u-switch__track { position: relative; width: 40px; height: 20px; background: var(--panel-sunk); border: 1px solid var(--ink); border-radius: var(--radius-sm); flex: none; }
.u-switch__thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 14px; background: var(--ink); border-radius: var(--radius-sm); transition: left 80ms linear; }
.u-switch[aria-checked="true"] .u-switch__track { background: var(--signal); }
.u-switch[aria-checked="true"] .u-switch__thumb { left: 20px; background: var(--on-signal); }
.u-switch__state { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; min-width: 3ch; }

.u-fader { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-fader__head { display: flex; justify-content: space-between; align-items: baseline; }
.u-fader__input { appearance: none; -webkit-appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: ew-resize; }
.u-fader__input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-moz-range-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 28px; margin-top: -13px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }
.u-fader__input::-moz-range-thumb { width: 14px; height: 28px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }

.u-knob { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.u-knob__dial { border-radius: var(--radius-full); cursor: grab; touch-action: none; line-height: 0; }
.u-knob__tick { stroke: var(--line); stroke-width: 1.5; }
.u-knob__track { fill: none; stroke: var(--panel-sunk); stroke-width: 3; }
.u-knob__arc { fill: none; stroke: var(--signal); stroke-width: 3; }
.u-knob__cap { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.u-knob__ind { stroke: var(--ink); stroke-width: 3; stroke-linecap: square; }
.u-knob__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; }


/* ── Unit 01 app shell (shared) ── */
.shell { height: 100dvh; overflow: auto; container: shell / size; }
.device { min-height: 100%; display: grid; gap: var(--space-2); padding: var(--space-2); grid-template-columns: minmax(0, 1fr); }
.bar { display: none; grid-area: bar; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-1) var(--space-1) 0; container: bar / inline-size; min-width: 0; }
.bar__title { display: inline-flex; align-items: flex-start; gap: var(--space-2); font: 800 clamp(18px, 4.2cqi, 34px)/1 var(--font-sans); letter-spacing: -.025em; white-space: nowrap; }
.bar__idx { font: 500 9px/12px var(--font-mono); letter-spacing: .1em; color: var(--ink-muted); }
.bar__right { display: flex; align-items: center; gap: var(--space-4); }
.bar__meta { display: none; }
@container bar (min-width: 400px) { .bar__meta { display: inline-flex; } }
.sect { border-top: 2px solid var(--rule); padding-top: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; min-height: 0; }
.sect__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.hero { container: hero / inline-size; display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-2); padding: var(--space-3); min-height: 0; min-width: 0; overflow: hidden; }
.hero__top, .hero__bottom { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); min-width: 0; }
@container hero (min-width: 260px) { .hero { padding: var(--space-4); } }
.big { font-family: var(--font-sans); font-weight: 800; letter-spacing: -.045em; line-height: .9; font-variant-numeric: tabular-nums; }
.stepper { display: flex; align-items: center; gap: var(--space-2); }
.stepper__val { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 22px; line-height: 40px; height: 40px; background: var(--panel-sunk); font-variant-numeric: tabular-nums; }
.mini { padding: var(--space-3); display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.mini__num { font-family: var(--font-mono); font-size: 24px; line-height: 24px; font-variant-numeric: tabular-nums; }
.u-field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.u-field__input { width: 100%; padding: var(--space-2) var(--space-3); min-height: 40px; background: var(--panel-sunk); color: var(--ink); border: 0; border-bottom: 2px solid var(--ink); border-radius: var(--radius-0); font: 400 15px/22px var(--font-sans); resize: none; }
.u-field__input::placeholder { color: var(--ink-muted); }
.u-field__input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.note { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); margin: 0; }
.row { display: flex; gap: var(--space-2); align-items: stretch; }
.row > .u-key { height: 40px; align-items: center; justify-content: center; flex: 1; }
.row > .u-key--sm { flex: none; }
@container (max-width: 300px) { .u-selector__opt .u-led { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ── Colour ── */
.hero { grid-area: hero; } .mixer { grid-area: mixer; } .codes { grid-area: codes; } .transport { grid-area: transport; }
.p-contrast { grid-area: contrast; } .p-palette { grid-area: palette; } .p-harm { grid-area: harm; }
.mixer, .codes, .p-contrast, .p-palette, .p-harm { display: none; }
.device { grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "hero" "transport"; }

/* Swatch hero: the user's colour fills the display */
.swatch { --sw-ink: #000000; background: var(--sw, #ff5a1f); color: var(--sw-ink); transition: background 60ms linear; }
.sw-label { font: 700 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; opacity: .72; white-space: nowrap; }
.sw-model { display: none; }
.sw-code { font: 500 11px/14px var(--font-mono); opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw-ok { display: none; }
.hero__main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.hexbig { font-size: clamp(26px, min(17cqi, 15cqb), 168px); letter-spacing: -.04em; white-space: nowrap; }
@container hero (min-width: 300px) { .sw-model { display: inline; } }
@container hero (min-width: 380px) { .sw-ok { display: inline; } }

/* Mixer */
.mixer { container: mixer / inline-size; }
.model { flex: 0 1 auto; min-width: 0; }
.model .u-selector__opt { height: 32px; padding: 0 var(--space-2); }
.mixer__body { display: flex; flex-direction: column; gap: var(--space-3); }
.knobs { display: flex; justify-content: space-around; gap: var(--space-2); }
.faders { display: none; flex-direction: column; gap: var(--space-2); justify-content: center; }
.faders .u-fader__input { height: 24px; }
@container mixer (min-width: 600px) {
  .mixer__body { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: var(--space-6); }
  .knobs { justify-content: flex-start; gap: var(--space-4); }
  .faders { display: flex; }
}
@container mixer (max-width: 330px) { .mixer .sect__head > .u-label { display: none; } .sect__head { justify-content: flex-end; } }

/* Hex codes row */
.codes { container: codes / inline-size; }
.codes__row { align-items: stretch; }
.hexin, .vsin { font-family: var(--font-mono); text-transform: uppercase; flex: 1; min-width: 0; }
.codes .u-key { flex: none; width: auto; height: 40px; padding: 0 var(--space-3); align-items: center; justify-content: center; }
.c-rgb, .c-ok, .codes__hint { display: none !important; }
@container codes (min-width: 380px) { .c-rgb { display: inline-flex !important; } }
@container codes (min-width: 480px) { .c-ok { display: inline-flex !important; } .codes__hint { display: inline-flex !important; } }

/* Transport */
.transport { container: transport / inline-size; display: flex; gap: var(--space-2); min-width: 0; }
.transport .u-key { flex: 1 1 0; height: clamp(52px, 18cqi, 96px); }
.transport .k-copy { flex-grow: 2; }
.transport .k-save { display: none; }
@container transport (max-width: 199px) { .transport .u-key__top { display: none; } .transport .u-key { justify-content: flex-end; } }

/* Contrast */
.p-contrast { container: ctr / inline-size; }
.ctr-top { display: flex; flex-direction: column; gap: var(--space-2); }
.ctr-top .u-selector__opt { height: 36px; }
.vsin { display: none; height: 36px; min-height: 36px; padding: 0 var(--space-3); }
.p-contrast.is-custom .vsin { display: block; }
.ctr-mid { display: grid; grid-template-columns: auto 1fr; gap: var(--space-2); }
.ratio { padding: var(--space-2) var(--space-3); display: flex; flex-direction: column; justify-content: space-between; min-width: 112px; }
.ratio__num { font: 800 36px/1 var(--font-sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.sample { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: var(--space-2) var(--space-3); min-width: 0; overflow: hidden; }
.sample__big { font: 800 32px/1 var(--font-sans); letter-spacing: -.03em; }
.sample__small { font: 400 13px/18px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.passes { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); }
.pass { display: inline-flex; align-items: center; gap: var(--space-2); }
.pass .u-led { width: 8px; height: 8px; }
.pass .u-led.is-ok { background: var(--ink); }
.swap { margin-left: auto; }
@container ctr (min-width: 460px) { .ctr-top { flex-direction: row; align-items: center; } .ctr-top .u-selector__row { flex: 0 0 auto; } }

/* Palette */
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--space-2); }
.tile { appearance: none; border: 0; padding: 0; aspect-ratio: 1; cursor: pointer; position: relative; box-shadow: inset 0 0 0 1px var(--line); }
.tile.is-sel::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 3px; background: var(--ink); }
.tile--empty { background: transparent; cursor: default; box-shadow: inset 0 0 0 1px var(--line); opacity: .5; }
.p-palette .row > .u-key { height: 36px; }

/* Harmonies */
.harm-row { display: flex; flex-direction: column; gap: var(--space-1); }
.harm-strip { display: flex; gap: 2px; }
.harm-strip .tile { flex: 1; aspect-ratio: auto; height: 32px; box-shadow: none; }
.p-harm .u-panel__body { gap: var(--space-3); }

/* ── Tiers ── */
@container shell (min-width: 300px) and (min-height: 360px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar" "hero" "transport"; }
  .bar { display: flex; }
}
@container shell (min-width: 300px) { .transport .k-save { display: inline-flex; } }
@container shell (min-width: 300px) and (min-height: 540px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto auto auto; grid-template-areas: "bar" "hero" "mixer" "codes" "transport"; }
  .mixer, .codes { display: flex; }
}
@container shell (min-width: 520px) and (min-height: 900px) {
  .device { gap: var(--space-4); padding: var(--space-4); grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: auto minmax(0, 1fr) auto auto auto auto;
    grid-template-areas: "bar bar" "hero hero" "mixer mixer" "codes codes" "transport transport" "contrast palette"; }
  .p-contrast, .p-palette { display: flex; }
}
@container shell (min-width: 560px) and (max-height: 359px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(200px, 34cqi, 340px); grid-template-rows: minmax(0, 1fr); grid-template-areas: "hero transport"; }
}
@container shell (min-width: 560px) and (min-height: 360px) and (max-height: 539px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(260px, 42cqi, 440px); grid-template-rows: auto auto minmax(0, 1fr); grid-template-areas: "bar bar" "hero mixer" "hero transport"; }
  .mixer { display: flex; }
}
@container shell (min-width: 560px) and (max-height: 539px) {
  .transport { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; grid-template-areas: "copy copy" "rand save"; }
  .transport .u-key { height: auto; min-height: 44px; }
  .k-copy { grid-area: copy; } .k-rand { grid-area: rand; } .k-save { grid-area: save; }
}
@container shell (min-width: 820px) and (min-height: 540px) {
  .device { gap: var(--space-4); padding: var(--space-6); grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto auto;
    grid-template-areas: "bar bar" "hero contrast" "hero palette" "mixer palette" "transport codes"; }
  .mixer, .codes, .p-contrast, .p-palette { display: flex; }
  .tiles { grid-template-columns: repeat(6, minmax(0, 1fr)); }
}
@container shell (min-width: 820px) and (max-height: 759px) {
  .device { padding: var(--space-4); }
  .u-panel__head { padding: var(--space-1) 0 var(--space-2); }
  .u-panel__body { padding: 0; gap: var(--space-2); }
  .tiles { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .ratio__num { font-size: 28px; } .sample__big { font-size: 24px; }
}
@container shell (min-width: 1180px) and (min-height: 760px) {
  .device { padding: var(--space-8); grid-template-columns: minmax(260px, .85fr) minmax(0, 1.5fr) minmax(320px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto auto;
    grid-template-areas: "bar bar bar" "palette hero contrast" "palette hero harm" "codes mixer harm" "codes transport harm"; }
  .mixer, .codes, .p-contrast, .p-palette, .p-harm { display: flex; }
  .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

.u-knob__dial.is-turning { outline: 1px dashed var(--ink-muted); outline-offset: 3px; }
/* iOS zooms into any field under 16px: keep every text field at 16px or more */
input#hexIn, input#vsIn { font-size: 16px !important; }
</style>
</head>
<body>
<div class="shell">
<main class="device">

  <header class="bar">
    <span class="bar__title"><span class="bar__idx">22</span>Colour</span>
    <div class="bar__right">
      <span class="u-label bar__meta" id="barMeta">OKLCH · 0/12 saved</span>
      <button class="u-switch" role="switch" aria-checked="false" id="themeSw" aria-label="Dark theme">
        <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
        <span class="u-label">Dark</span>
      </button>
    </div>
  </header>

  <section class="hero u-display swatch" id="hero" aria-label="Current colour">
    <div class="hero__top">
      <span class="sw-label">Colour</span>
      <span class="sw-label sw-model" id="modelOut">OKLCH</span>
    </div>
    <div class="hero__main">
      <output class="big hexbig" id="hexOut" aria-live="polite">#FF5A1F</output>
    </div>
    <div class="hero__bottom">
      <span class="sw-code" id="rgbOut">rgb(255 90 31)</span>
      <span class="sw-code sw-ok" id="oklchOut">oklch(68% 0.21 37)</span>
    </div>
  </section>

  <section class="sect mixer" aria-label="Mixer">
    <div class="sect__head">

  }
  function syncControls() { knobs.forEach(function (k) { k.draw(); }); faders.forEach(function (f) { f(); }); }
  function fromModel() { rgb = MODELS[st.model].toRgb(mv); render(true); }
  function setRgb(next, keepMv) { rgb = next.slice(); if (!keepMv) mv = MODELS[st.model].from(rgb); render(false); }

  U1.selector($('modelSel'), function () { return st.model; }, function (v) { st.model = v; mv = MODELS[v].from(rgb); buildControls(); render(false); });

  /* ── Render ── */
  function render(fromKnob) {
    var h = hex(rgb), o = rgbToOklch(rgb), hero = $('hero');
    var onBlack = ratio(rgb, [0, 0, 0]), onWhite = ratio(rgb, [255, 255, 255]);
    hero.style.setProperty('--sw', h); hero.style.setProperty('--sw-ink', onBlack >= onWhite ? '#000000' : '#ffffff');
    $('hexOut').textContent = h;
    $('rgbOut').textContent = 'rgb(' + rgb.join(' ') + ')';
    $('oklchOut').textContent = oklchStr(o);
    $('modelOut').textContent = MODELS[st.model].name;
    if (document.activeElement !== $('hexIn')) $('hexIn').value = h;
    syncControls();
    renderContrast(); renderPalette(); renderHarm(o);
    $('barMeta').textContent = MODELS[st.model].name + ' · ' + st.palette.length + '/12 saved';
    st.hex = h; st.save();
  }
  function oklchStr(o) { return 'oklch(' + (o[0] * 100).toFixed(1) + '% ' + o[1].toFixed(3) + ' ' + o[2].toFixed(1) + ')'; }

  function other() { return parseHex(st.vs === 'custom' ? st.vsHex : st.vs) || [255, 255, 255]; }
  function renderContrast() {
    var b = other(), r = ratio(rgb, b), s = $('sample');
    $('ratioOut').textContent = r.toFixed(2);
    s.style.background = hex(st.swap ? b : rgb); s.style.color = hex(st.swap ? rgb : b);
    [['ledAA', 4.5], ['ledAAL', 3], ['ledAAA', 7], ['ledAAAL', 4.5]].forEach(function (p) { $(p[0]).classList.toggle('is-ok', r >= p[1]); $(p[0]).parentNode.setAttribute('aria-label', (r >= p[1] ? 'Passes ' : 'Fails ') + p[0].slice(3)); });
    $('ctrMeta').textContent = 'vs ' + (st.vs === 'custom' ? hex(b) : st.vs === '#FFFFFF' ? 'white' : 'black');
    document.querySelector('.p-contrast').classList.toggle('is-custom', st.vs === 'custom');
    if (document.activeElement !== $('vsIn')) $('vsIn').value = st.vsHex;
  }
  U1.selector($('vsSel'), function () { return st.vs; }, function (v) { st.vs = v; render(false); });
  $('vsIn').addEventListener('input', function () { var p = parseHex($('vsIn').value); if (p) { st.vsHex = hex(p); renderContrast(); st.save(); } });
  $('swapVs').addEventListener('click', function () { st.swap = !st.swap; renderContrast(); st.save(); });

  /* Palette */
  function renderPalette() {
    var t = $('tiles'); t.innerHTML = '';
    for (var i = 0; i < 12; i++) {
      var c = st.palette[i], b = document.createElement('button');
      if (c) {
        b.className = 'tile' + (i === sel ? ' is-sel' : ''); b.style.background = c; b.title = c; b.setAttribute('aria-label', 'Load ' + c);
        (function (i, c) { b.addEventListener('click', function () { sel = i; setRgb(parseHex(c)); }); })(i, c);
      } else { b.className = 'tile tile--empty'; b.disabled = true; b.setAttribute('aria-label', 'Empty slot'); }
      t.appendChild(b);
    }
    $('palMeta').textContent = st.palette.length + ' / 12';
  }
  function save(key) {
    var h = hex(rgb), i = st.palette.indexOf(h);
    if (i >= 0) { sel = i; flash(key, 'Saved'); render(false); return; }
    if (st.palette.length >= 12) { flash(key, 'Full'); return; }
    st.palette.push(h); sel = st.palette.length - 1; flash(key, 'Saved'); render(false);
  }
  function flash(key, msg) { var t = key.querySelector('.u-key__text'), o = t.textContent; t.textContent = msg; setTimeout(function () { t.textContent = o; }, 900); }
  $('save').addEventListener('click', function () { save($('save')); });
  $('save2').addEventListener('click', function () { save($('save2')); });
  U1.confirmKey($('remove'), 'Tap again', function () {
    if (sel < 0 || sel >= st.palette.length) { flash($('remove'), 'Pick one'); return; }
    st.palette.splice(sel, 1); sel = -1; render(false);
  });

  /* Harmonies (OKLCH hue rotations; tints/shades along L) */
  function renderHarm(o) {
    var el = $('harm'); if (!el.offsetParent) return;
    var L = Math.max(o[0], .05), C = o[1], H = o[2];
    var rows = [
      ['Complementary', [H, H + 180]], ['Analogous', [H - 30, H, H + 30]], ['Triadic', [H, H + 120, H + 240]], ['Split', [H, H + 150, H + 210]]
    ].map(function (r) { return [r[0], r[1].map(function (h) { return oklchToRgb(L, C, (h % 360 + 360) % 360); })]; });
    var scale = []; for (var i = 0; i < 9; i++) scale.push(oklchToRgb(.96 - i * .09, C, H));
    rows.push(['Tints & shades', scale]);
    el.innerHTML = '';
    rows.forEach(function (r) {
      var row = document.createElement('div'); row.className = 'harm-row';
      row.innerHTML = '<span class="u-label">' + r[0] + '</span>';
      var strip = document.createElement('div'); strip.className = 'harm-strip';
      r[1].forEach(function (c) {
        var b = document.createElement('button'), hx = hex(c); b.className = 'tile'; b.style.background = hx; b.title = hx; b.setAttribute('aria-label', 'Load ' + hx);
        b.addEventListener('click', function () { sel = -1; setRgb(c); });
        strip.appendChild(b);
      });
      row.appendChild(strip); el.appendChild(row);
    });
  }

  /* Hex input */
  $('hexIn').addEventListener('input', function () { var p = parseHex($('hexIn').value); if (p) { sel = -1; setRgb(p); } });
  $('hexIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') { $('hexIn').value = hex(rgb); $('hexIn').blur(); } });
  $('hexIn').addEventListener('blur', function () { $('hexIn').value = hex(rgb); });

  /* Random: pleasant OKLCH range */
  function random() {
    var a = new Uint32Array(3); crypto.getRandomValues(a);
    var L = 0.45 + (a[0] / 4294967296) * 0.45, C = 0.06 + (a[1] / 4294967296) * 0.2, H = (a[2] / 4294967296) * 360;
    sel = -1;
    if (st.model === 'oklch') { mv = [+(L * 100).toFixed(1), +C.toFixed(3), Math.round(H)]; fromModel(); }
    else setRgb(oklchToRgb(L, C, H));
    $('rand').classList.add('is-hit'); setTimeout(function () { $('rand').classList.remove('is-hit'); }, 80);
  }
  $('rand').addEventListener('click', random);

  /* Copy */
  $('copyHex').addEventListener('click', function () { U1.copy(hex(rgb), $('copyHex'), $('hexOut')); });
  $('copyRgb').addEventListener('click', function () { U1.copy('rgb(' + rgb.join(' ') + ')', $('copyRgb'), $('rgbOut')); });
  $('copyOk').addEventListener('click', function () { U1.copy(oklchStr(rgbToOklch(rgb)), $('copyOk'), $('oklchOut')); });

  U1.shortcuts({ ' ': random, r: random, c: function () { $('copyHex').click(); }, s: function () { save($('save')); } });

  /* Harmonies only render when visible: re-render on resize */
  if (window.ResizeObserver) new ResizeObserver(function () { renderHarm(rgbToOklch(rgb)); }).observe($('harm').parentNode);

  buildControls(); render(false);
})();

</script>
</body>
</html>
