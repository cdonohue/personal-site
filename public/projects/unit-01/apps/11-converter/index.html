<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 01 — Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* ── Unit 01 tokens ─────────────────────────────────────────── */
:root, [data-theme="light"] {
  --chassis:#ffffff; --panel:#ffffff; --panel-sunk:#f0f0ee; --ink:#000000; --ink-muted:#5f5f5c; --line:#c8c8c4; --rule:var(--ink);
  --signal:#ff5a1f; --signal-text:#a83400; --on-signal:#000000; --blue:#3a63d8; --on-blue:#ffffff; --yellow:#f5c400; --on-yellow:#111111;
  --key:#e6e6e3; --lcd:#0b0b0b; --lcd-ink:#f2f2ef; --lcd-muted:#8f8f8a; --lcd-dim:#2a2a2a; --focus:var(--ink);
  --shadow-key:0 2px 0 #00000040; --shadow-key-pressed:0 0 0 #00000040;
}
[data-theme="dark"] {
  --chassis:#000000; --panel:#000000; --panel-sunk:#161616; --ink:#ffffff; --ink-muted:#9b9b97; --line:#3a3a3a; --key:#262626; --rule:var(--ink);
  --signal-text:#ff7a45; --shadow-key:0 2px 0 #ffffff26; --shadow-key-pressed:0 0 0 #ffffff26;
}
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-0:0; --radius-sm:2px; --radius-md:6px; --radius-full:9999px;
  --font-sans:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* ── Unit 01 components (vanilla port of the bundle) ────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); background: var(--chassis); color: var(--ink); -webkit-font-smoothing: antialiased; }
:where(button, input, [role="slider"]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.u-label { display: inline-flex; gap: var(--space-2); align-items: baseline; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.u-label b { font-weight: 700; color: var(--ink); }
.u-value { font-family: var(--font-mono); font-size: 13px; line-height: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
.u-led { display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--line); flex: none; }
.u-key .u-led, .u-selector__opt .u-led { background: var(--line); }
.is-on > .u-led, .u-led.is-lit { background: var(--signal); }

.u-key { appearance: none; position: relative; display: inline-flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  min-width: 0; padding: var(--space-2); border: 0; border-radius: var(--radius-0); background: var(--key); color: var(--ink);
  font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: left;
  box-shadow: var(--shadow-key); cursor: pointer; transition: transform 60ms linear, box-shadow 60ms linear; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.u-key:active, .u-key.is-hit, .u-key[aria-pressed="true"] { transform: translateY(2px); box-shadow: var(--shadow-key-pressed); }
.u-key--ink { background: var(--ink); color: var(--chassis); }
.u-key--signal { background: var(--signal); color: var(--on-signal); }
.u-key--blue { background: var(--blue); color: var(--on-blue); }
.u-key--yellow { background: var(--yellow); color: var(--on-yellow); }
.u-key__top { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: var(--space-1); }
.u-key__index { font-family: var(--font-mono); font-weight: 500; font-size: 9px; line-height: 12px; letter-spacing: .1em; opacity: .75; }
.u-key__glyph { align-self: center; display: flex; }
.u-key__glyph svg { width: 22px; height: 22px; fill: currentColor; }
.u-key--sm { width: 40px; height: 40px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; }

.u-panel { background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: var(--radius-0); min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
.u-panel__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-3); }
.u-panel__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel__body { padding: 0 0 var(--space-2); display: flex; flex-direction: column; gap: var(--space-4); flex: 1; }

.u-display { background: var(--lcd); color: var(--lcd-ink); border: 1px solid var(--line); border-radius: var(--radius-0); font-family: var(--font-mono); }
.u-display__label { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--lcd-muted); white-space: nowrap; }
.u-display__unit { font-size: 13px; line-height: 16px; color: var(--lcd-muted); text-transform: uppercase; letter-spacing: .08em; }

.u-selector { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-selector__row { display: flex; gap: 2px; border-radius: var(--radius-0); }
.u-selector__opt { appearance: none; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-2);
  background: var(--key); color: var(--ink); border: 0; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.u-selector__opt:first-child { border-left: 0; }
.u-selector__opt.is-on { background: var(--ink); color: var(--chassis); }
.u-selector__opt:focus-visible { outline-offset: -4px; }

.u-switch { appearance: none; display: inline-flex; align-items: center; gap: var(--space-3); padding: var(--space-1) 0; background: none; border: 0; color: var(--ink); cursor: pointer; }
.u-switch__track { position: relative; width: 40px; height: 20px; background: var(--panel-sunk); border: 1px solid var(--ink); border-radius: var(--radius-sm); flex: none; }
.u-switch__thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 14px; background: var(--ink); border-radius: var(--radius-sm); transition: left 80ms linear; }
.u-switch[aria-checked="true"] .u-switch__track { background: var(--signal); }
.u-switch[aria-checked="true"] .u-switch__thumb { left: 20px; background: var(--on-signal); }
.u-switch__state { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; min-width: 3ch; }

.u-fader { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-fader__head { display: flex; justify-content: space-between; align-items: baseline; }
.u-fader__input { appearance: none; -webkit-appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: ew-resize; }
.u-fader__input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-moz-range-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 28px; margin-top: -13px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }
.u-fader__input::-moz-range-thumb { width: 14px; height: 28px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }

.u-knob { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.u-knob__dial { border-radius: var(--radius-full); cursor: grab; touch-action: none; line-height: 0; }
.u-knob__tick { stroke: var(--line); stroke-width: 1.5; }
.u-knob__track { fill: none; stroke: var(--panel-sunk); stroke-width: 3; }
.u-knob__arc { fill: none; stroke: var(--signal); stroke-width: 3; }
.u-knob__cap { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.u-knob__ind { stroke: var(--ink); stroke-width: 3; stroke-linecap: square; }
.u-knob__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; }


/* ── Shared app shell (Unit 01 apps, fork C) ── */
.shell { height: 100dvh; overflow: auto; container: shell / size; }
.device { min-height: 100%; display: grid; gap: var(--space-2); padding: var(--space-2); grid-template-columns: minmax(0, 1fr); }
.bar { display: none; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-1) var(--space-1) 0; container: bar / inline-size; min-width: 0; grid-area: bar; }
.bar__title { display: inline-flex; align-items: flex-start; gap: var(--space-2); font: 800 clamp(18px, 4.2cqi, 34px)/1 var(--font-sans); letter-spacing: -.025em; white-space: nowrap; }
.bar__idx { font: 500 9px/12px var(--font-mono); letter-spacing: .1em; color: var(--ink-muted); }
.bar__right { display: flex; align-items: center; gap: var(--space-4); min-width: 0; }
.bar__meta { display: none; }
@container bar (min-width: 420px) { .bar__meta { display: inline-flex; } }
.section { border-top: 2px solid var(--rule); padding-top: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; min-height: 0; }
.section__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.section__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.u-field__input { box-sizing: border-box; width: 100%; min-width: 0; height: 40px; padding: 0 var(--space-3); background: var(--panel-sunk); color: var(--ink); border: 0; border-bottom: 2px solid var(--ink); border-radius: var(--radius-0); font: 400 15px/22px var(--font-sans); }
.u-field__input--mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.u-field__input::placeholder { color: var(--ink-muted); }
.u-pick { appearance: none; -webkit-appearance: none; width: 100%; height: 40px; min-width: 0; padding: 0 28px 0 var(--space-3); background: var(--key) linear-gradient(45deg, transparent 50%, var(--ink) 50%) no-repeat right 14px center / 6px 6px; color: var(--ink); border: 0; border-radius: var(--radius-0); box-shadow: var(--shadow-key);
  font: 700 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.row { display: flex; gap: var(--space-2); align-items: center; min-width: 0; }
.grow { flex: 1 1 0; min-width: 0; }
.k-row { height: 40px; flex-direction: row; align-items: center; justify-content: center; }
.k-x { width: 32px; height: 32px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; flex: none; }
.is-armed { background: var(--ink) !important; color: var(--chassis) !important; }
.u-panel { min-height: 0; }
.u-panel__body { min-height: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.hero { grid-area: hero; } .transport { grid-area: transport; } .io { grid-area: io; } .p-cats { grid-area: cats; } .p-table { grid-area: table; } .p-recent { grid-area: recent; }
.device { grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "hero" "transport"; }
.io, .p-cats, .p-table, .p-recent { display: none; }

/* Hero */
.hero { container: hero / inline-size; display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-2); padding: var(--space-3); min-height: 0; overflow: hidden; }
.hero__top { display: flex; justify-content: space-between; gap: var(--space-3); }
.hero__pair, .hero__sig { display: none; }
.hero__main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: var(--space-2); min-height: 0; }
.hero__from { font: 700 clamp(13px, 5cqi, 28px)/1.1 var(--font-sans); color: var(--lcd-muted); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero__res { display: flex; align-items: baseline; gap: var(--space-2); min-width: 0; }
.res { font: 800 clamp(28px, min(calc(150cqi / var(--chars, 4)), 22cqb, 26cqi), 220px)/.92 var(--font-sans); letter-spacing: -.045em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.res__unit { font: 700 clamp(12px, 4cqi, 26px)/1 var(--font-sans); color: var(--lcd-muted); text-transform: none; white-space: nowrap; }
@container hero (min-width: 260px) { .hero { padding: var(--space-4); } .hero__pair { display: inline; } }
@container hero (min-width: 420px) { .hero__sig { display: inline; } }

/* Transport */
.transport { container: transport / inline-size; display: flex; gap: var(--space-2); min-width: 0; }
.transport .u-key { flex: 1 1 0; height: clamp(56px, 18cqi, 104px); }
.transport .k-swap { flex-grow: 1.6; }
.k-big .u-key__glyph { align-self: center; font: 800 clamp(20px, 7cqi, 40px)/1 var(--font-sans); }
@container transport (max-width: 199px) { .transport .u-key__text { display: none; } .transport .u-key { align-items: center; justify-content: center; } }

/* IO */
.io { container: io / inline-size; }
.io__grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-2); }
.io__vals { display: flex; gap: var(--space-3); align-items: flex-end; }
.io__units { display: grid; grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr); gap: var(--space-2); align-items: end; }
.io__units .u-key { width: 40px; height: 40px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; }
.io .u-knob { display: none; }
.io__cat { display: flex; gap: var(--space-2); align-items: flex-end; }
.custom { display: none; gap: var(--space-2); align-items: flex-end; flex-wrap: wrap; }
.is-custom .custom { display: flex; }
.custom .u-field { flex: 1 1 80px; }
.custom__note { font-size: 13px; line-height: 18px; color: var(--signal-text); flex-basis: 100%; }
.sig-sel .u-selector__opt { height: 32px; }
@container io (min-width: 460px) {
  .io__grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); align-items: end; column-gap: var(--space-4); }
  .io__cat, .custom { grid-column: 1 / -1; }
}
@container io (min-width: 560px) { .io .u-knob { display: inline-flex; } }

/* Cats */
.cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2); }
.cats .u-key { height: 52px; }
.cats .u-key[aria-pressed="true"] { background: var(--ink); color: var(--chassis); transform: none; box-shadow: var(--shadow-key); }

/* Table */
.p-table .u-panel__body { overflow: auto; }
.trow { appearance: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3); align-items: baseline; width: 100%; padding: 8px var(--space-2); background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); cursor: pointer; text-align: left; }
.trow__u { font: 700 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow__v { font: 400 15px/18px var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.trow.is-to { background: var(--ink); color: var(--chassis); }
.trow.is-to .trow__u { color: var(--chassis); }
.trow.is-from .trow__u::after { content: ' · input'; }

/* Recent */
.p-recent .u-panel__body { overflow: auto; }
.rrow { appearance: none; display: block; width: 100%; text-align: left; padding: 8px 0; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); cursor: pointer; font: 400 13px/18px var(--font-sans); }
.rrow b { font-weight: 700; }
.rrow .u-label { display: block; }
.r-empty { color: var(--ink-muted); font-size: 13px; }

/* Tiers */
@container shell (min-width: 300px) and (min-height: 360px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar" "hero" "transport"; }
  .bar { display: flex; }
}
@container shell (min-width: 300px) and (min-height: 540px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar" "hero" "io" "transport"; }
  .io { display: flex; }
}
@container shell (min-width: 520px) and (min-height: 760px) {
  .device { gap: var(--space-4); padding: var(--space-4); grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: auto minmax(0, 1fr) auto auto minmax(0, 260px); grid-template-areas: "bar bar" "hero hero" "io io" "transport transport" "cats table"; }
  .p-cats, .p-table { display: flex; }
  .io__cat .cat-pick { display: none; }
}
@container shell (min-width: 560px) and (max-height: 359px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(200px, 34cqi, 340px); grid-template-rows: minmax(0, 1fr); grid-template-areas: "hero transport"; }
}
@container shell (min-width: 560px) and (min-height: 360px) and (max-height: 539px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(220px, 34cqi, 340px); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "hero transport" "io transport"; }
  .io { display: flex; }
  .io__cat { display: none; }
}
@container shell (min-width: 560px) and (max-height: 539px) {
  .transport { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; grid-template-areas: "swap swap" "minus plus"; }
  .transport .u-key { height: auto; }
  .k-swap { grid-area: swap; } .k-minus { grid-area: minus; } .k-plus { grid-area: plus; }
}
@container shell (min-width: 820px) and (min-height: 540px) {
  .device { gap: var(--space-4); padding: var(--space-6); grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar bar" "hero table" "io table" "transport cats"; }
  .io, .p-cats, .p-table { display: flex; }
  .io__cat { display: flex; }
  .io__cat .cat-pick { display: none; }
}
@container shell (min-width: 980px) and (min-height: 540px) and (max-height: 759px) {
  .device { grid-template-columns: minmax(0, 1.5fr) minmax(260px, 1fr) minmax(240px, .8fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar bar bar" "hero table cats" "io table cats" "transport table cats"; }
}
@container shell (min-width: 820px) and (max-height: 759px) {
  .device { padding: var(--space-4); }
  .u-panel__head { padding: var(--space-1) 0 var(--space-2); }
  .u-panel__body { padding: 0; gap: var(--space-3); }
}
@container shell (min-width: 1180px) and (min-height: 760px) {
  .device { padding: var(--space-8); grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr) minmax(260px, .8fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar bar bar" "hero table cats" "io table recent" "transport table recent"; }
  .p-recent { display: flex; }
}
.u-knob__dial.is-turning { outline: 1px dashed var(--ink-muted); outline-offset: 3px; }
/* iOS zooms into any field under 16px: keep every text field at 16px or more */
input#cA, input#cB, input#cRate, input#val, select#catPick, select#from, select#to { font-size: 16px !important; }
</style>
</head>
<body>
<div class="shell">
<main class="device" id="device">

  <header class="bar">
    <span class="bar__title"><span class="bar__idx">11</span>Converter</span>
    <div class="bar__right">
      <span class="u-label bar__meta" id="barMeta">Length</span>
      <button class="u-switch" role="switch" aria-checked="false" id="themeSw" aria-label="Dark theme">
        <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
        <span class="u-label">Dark</span>
      </button>
    </div>
  </header>

  <section class="hero u-display" id="hero" aria-label="Result">
    <div class="hero__top">
      <span class="u-display__label" id="heroCat">Length</span>
      <span class="u-display__label hero__pair" id="heroPair">ft → m</span>
      <span class="u-display__label hero__sig" id="heroSig">5 sig</span>
    </div>
    <div class="hero__main">
      <span class="hero__from" id="heroFrom">1 ft =</span>
      <span class="hero__res"><output class="res" id="res" aria-live="polite">0.3048</output><span class="res__unit" id="resUnit">m</span></span>
    </div>
  </section>

  <section class="io section" aria-label="Input">
    <div class="section__head"><span class="u-label"><b>01</b> Input</span><span class="u-label" id="ioHint">Type a value</span></div>
    <div class="io__grid">
      <div class="io__vals">
        <label class="u-field grow"><span class="u-label">Value</span><input class="u-field__input u-field__input--mono" id="val" type="text" inputmode="decimal" autocomplete="off" value="1"></label>
        <div class="u-knob" id="nudge"></div>
      </div>
      <div class="io__units">
        <label class="u-field"><span class="u-label">From</span><select class="u-pick" id="from"></select></label>
        <button class="u-key" id="swap2" aria-label="Swap units" style="align-items:center;justify-content:center"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px;fill:currentColor;display:block"><path d="M3 6h13.2l-3.6-3.6L14 1l6 6-6 6-1.4-1.4L16.2 8H3zM21 18H7.8l3.6 3.6L10 23l-6-6 6-6 1.4 1.4L7.8 16H21z"/></svg></button>
        <label class="u-field"><span class="u-label">To</span><select class="u-pick" id="to"></select></label>
      </div>
      <div class="io__cat">
        <label class="u-field grow cat-pick"><span class="u-label">Category</span><select class="u-pick" id="catPick"></select></label>
        <div class="u-selector sig-sel">
          <span class="u-label" id="sigLbl">Precision</span>
          <div class="u-selector__row" role="radiogroup" aria-labelledby="sigLbl" id="sigSel">
            <button class="u-selector__opt" role="radio" data-v="3">3</button>
            <button class="u-selector__opt" role="radio" data-v="5">5</button>
            <button class="u-selector__opt" role="radio" data-v="8">8</button>
          </div>
        </div>
      </div>
      <div class="custom" id="custom">
        <label class="u-field"><span class="u-label">Unit A</span><input class="u-field__input" id="cA" maxlength="8"></label>
        <label class="u-field"><span class="u-label">1 A = ? B</span><input class="u-field__input u-field__input--mono" id="cRate" inputmode="decimal"></label>
        <label class="u-field"><span class="u-label">Unit B</span><input class="u-field__input" id="cB" maxlength="8"></label>
        <span class="custom__note">Your own rate, typed by you. Not live data: update it yourself (e.g. for currency).</span>
      </div>
    </div>
  </section>

  <section class="transport" aria-label="Adjust">
    <button class="u-key k-minus k-big" id="minus"><span class="u-key__glyph" aria-hidden="true">−</span><span class="u-key__text" id="minusText">−1</span></button>
    <button class="u-key u-key--signal k-swap" id="swap"><span class="u-key__top"><span class="u-key__index">S</span></span><span class="u-key__glyph" aria-hidden="true" style="align-self:center"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:26px;height:26px;fill:currentColor;display:block"><path d="M3 6h13.2l-3.6-3.6L14 1l6 6-6 6-1.4-1.4L16.2 8H3zM21 18H7.8l3.6 3.6L10 23l-6-6 6-6 1.4 1.4L7.8 16H21z"/></svg></span><span class="u-key__text">Swap</span></button>
    <button class="u-key k-plus k-big" id="plus"><span class="u-key__glyph" aria-hidden="true">+</span><span class="u-key__text" id="plusText">+1</span></button>
  </section>

  <section class="u-panel p-cats" aria-label="Category">
    <header class="u-panel__head"><span class="u-label"><b>02</b> Category</span><span class="u-label">1–9</span></header>
    <div class="u-panel__body"><div class="cats" id="cats"></div></div>
  </section>

  <section class="u-panel p-table" aria-label="All units">
    <header class="u-panel__head"><span class="u-label"><b>03</b> All units</span><span class="u-label">Tap to show</span></header>
    <div class="u-panel__body" id="table"></div>
  </section>

  <section class="u-panel p-recent" aria-label="Recent conversions">
    <header class="u-panel__head"><span class="u-label"><b>04</b> Recent</span></header>
    <div class="u-panel__body" id="recent"></div>
  </section>

</main>
</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n, w) { n = String(Math.max(0, Math.floor(Math.abs(n)))); while (n.length < w) n = '0' + n; return n; };
  var clamp = function (n, a, b) { return Math.min(b, Math.max(a, n)); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function load(key, state) { try { var s = JSON.parse(localStorage.getItem(key) || 'null'); if (s) Object.assign(state, s); } catch (e) {} }
  function saver(key, state) { return function () { try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {} }; }
  function themeInit(state, save) {
    function apply() {
      var dark = state.theme ? state.theme === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      $('themeSw').setAttribute('aria-checked', String(dark));
    }
    $('themeSw').addEventListener('click', function () { state.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; apply(); save(); });
    apply();
  }
  function bindSwitch(el, get, set) {
    var sync = function () { el.setAttribute('aria-checked', String(!!get())); };
    el.addEventListener('click', function () { set(!get()); sync(); });
    sync(); return sync;
  }
  function selector(el, get, set) {
    var opts = Array.prototype.slice.call(el.querySelectorAll('[role=radio]'));
    function sync() { opts.forEach(function (o) { var on = o.dataset.v === String(get()); o.classList.toggle('is-on', on); o.setAttribute('aria-checked', String(on)); o.tabIndex = on ? 0 : -1; }); }
    opts.forEach(function (o, i) {
      o.addEventListener('click', function () { set(o.dataset.v); sync(); });
      o.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
        if (!d) return; e.preventDefault(); var j = (i + d + opts.length) % opts.length; opts[j].click(); opts[j].focus();
      });
    });
    sync(); return sync;
  }
  function inControl(t) { return t.closest && t.closest('button, input, select, textarea, [role="slider"]'); }
  function armed(btn, label, ms, onConfirm) {
    var timer = null, orig = null;
    btn.addEventListener('click', function () {
      var tx = btn.querySelector('.u-key__text');
      if (btn.classList.contains('is-armed')) { clearTimeout(timer); btn.classList.remove('is-armed'); tx.textContent = orig; onConfirm(); return; }
      orig = tx.textContent;
      btn.classList.add('is-armed'); tx.textContent = label;
      timer = setTimeout(function () { btn.classList.remove('is-armed'); tx.textContent = orig; }, ms || 2000);
    });
  }

  /* Units: [id, label, factor to the category's base unit] */
  var CATS = [
    { id: 'length', name: 'Length', units: [['mm','Millimetre',.001],['cm','Centimetre',.01],['m','Metre',1],['km','Kilometre',1000],['in','Inch',.0254],['ft','Foot',.3048],['yd','Yard',.9144],['mi','Mile',1609.344],['nmi','Nautical mile',1852]], def: ['ft','m'] },
    { id: 'weight', name: 'Weight', units: [['mg','Milligram',.001],['g','Gram',1],['kg','Kilogram',1000],['t','Tonne',1e6],['oz','Ounce',28.349523125],['lb','Pound',453.59237],['st','Stone',6350.29318]], def: ['lb','kg'] },
    { id: 'volume', name: 'Volume', units: [['ml','Millilitre',.001],['l','Litre',1],['m3','Cubic metre',1000],['tsp','Teaspoon (US)',.00492892159375],['tbsp','Tablespoon (US)',.01478676478125],['floz','Fluid ounce (US)',.0295735295625],['cup','Cup (US)',.2365882365],['pt','Pint (US)',.473176473],['qt','Quart (US)',.946352946],['gal','Gallon (US)',3.785411784],['galuk','Gallon (UK)',4.54609]], def: ['gal','l'] },
    { id: 'temp', name: 'Temp', units: [['C','Celsius'],['F','Fahrenheit'],['K','Kelvin']], def: ['F','C'] },
    { id: 'speed', name: 'Speed', units: [['ms','Metres / second',1],['kmh','Kilometres / hour',1 / 3.6],['mph','Miles / hour',.44704],['kn','Knot',1852 / 3600],['fts','Feet / second',.3048]], def: ['mph','kmh'] },
    { id: 'time', name: 'Time', units: [['ms','Millisecond',.001],['s','Second',1],['min','Minute',60],['h','Hour',3600],['d','Day',86400],['wk','Week',604800],['yr','Year (365.25 d)',31557600]], def: ['h','min'] },
    { id: 'data', name: 'Data', units: [['bit','Bit',.125],['B','Byte',1],['KB','Kilobyte',1e3],['MB','Megabyte',1e6],['GB','Gigabyte',1e9],['TB','Terabyte',1e12],['KiB','Kibibyte',1024],['MiB','Mebibyte',1048576],['GiB','Gibibyte',1073741824]], def: ['GB','MiB'] },
    { id: 'cook', name: 'Cooking', units: [['tsp','Teaspoon',4.92892159375],['tbsp','Tablespoon',14.78676478125],['cup','Cup (US)',236.5882365],['floz','Fluid ounce',29.5735295625],['ml','Millilitre',1],['l','Litre',1000],['g','Gram (water)',1],['oz','Ounce (water)',28.349523125]], def: ['cup','ml'] },
    { id: 'custom', name: 'Custom', units: [], def: ['A','B'] }
  ];
  var KEY = 'unit01-converter';
  var state = { cat: 'length', value: '1', sig: 5, pairs: {}, custom: { a: 'USD', b: 'EUR', rate: '0.92' }, recent: [], theme: null };
  load(KEY, state); var save = saver(KEY, state);
  themeInit(state, save);

  function cat() { return CATS.filter(function (c) { return c.id === state.cat; })[0] || CATS[0]; }
  function units(c) {
    if (c.id !== 'custom') return c.units;
    var r = parseFloat(String(state.custom.rate).replace(/,/g, '')) || 1;
    return [['A', state.custom.a || 'A', 1], ['B', state.custom.b || 'B', 1 / r]];
  }
  function pair(c) { var p = state.pairs[c.id] || c.def.slice(); var ids = units(c).map(function (u) { return u[0]; }); if (ids.indexOf(p[0]) < 0) p[0] = ids[0]; if (ids.indexOf(p[1]) < 0) p[1] = ids[1] || ids[0]; state.pairs[c.id] = p; return p; }
  function unit(c, id) { return units(c).filter(function (u) { return u[0] === id; })[0]; }
  function short(c, id) { return c.id === 'custom' ? unit(c, id)[1] : (id === 'C' || id === 'F' || id === 'K' ? (id === 'K' ? 'K' : '°' + id) : id === 'm3' ? 'm³' : id === 'galuk' ? 'gal UK' : id === 'ms' && c.id === 'speed' ? 'm/s' : id === 'kmh' ? 'km/h' : id === 'fts' ? 'ft/s' : id === 'floz' ? 'fl oz' : id); }
  function convert(c, v, from, to) {
    if (c.id === 'temp') {
      var k = from === 'C' ? v + 273.15 : from === 'F' ? (v - 32) * 5 / 9 + 273.15 : v;
      return to === 'C' ? k - 273.15 : to === 'F' ? (k - 273.15) * 9 / 5 + 32 : k;
    }
    return v * unit(c, from)[2] / unit(c, to)[2];
  }
  function fmt(n) {
    if (!isFinite(n)) return '—';
    if (n === 0) return '0';
    var a = Math.abs(n);
    if (a >= 1e12 || a < 1e-6) return n.toExponential(state.sig - 1).replace('e+', 'E').replace('e-', 'E−').replace('-', '−');
    var r = Number(n.toPrecision(state.sig));
    return r.toLocaleString('en-US', { maximumFractionDigits: 10 }).replace('-', '−');
  }
  function num() { var s = String(state.value).replace(/,/g, '').replace('−', '-').trim(); if (s === '' || isNaN(+s)) return NaN; return +s; }
  function stepOf(v) { var a = Math.abs(v); return a >= 1 ? Math.pow(10, Math.floor(Math.log10(a)) - 1) || 1 : a > 0 ? Math.pow(10, Math.floor(Math.log10(a)) - 1) : 1; }
  function stepFor(v) { var s = stepOf(v); return Math.abs(v) < 10 && Math.abs(v) >= 1 ? .1 : s < 1 && Math.abs(v) >= 1 ? 1 : s; }
  function stepLabel(s) { return s >= 1 ? String(s) : String(+s.toPrecision(1)); }

  /* Build pickers & panels */
  var catPick = $('catPick'), cats = $('cats');
  CATS.forEach(function (c, i) {
    var o = document.createElement('option'); o.value = c.id; o.textContent = c.name; catPick.appendChild(o);
    var b = document.createElement('button'); b.className = 'u-key'; b.dataset.id = c.id;
    b.innerHTML = '<span class="u-key__index">' + pad(i + 1, 2) + '</span><span class="u-key__text">' + c.name + '</span>';
    b.addEventListener('click', function () { setCat(c.id); });
    cats.appendChild(b);
  });
  catPick.addEventListener('change', function () { setCat(catPick.value); });
  function setCat(id) { state.cat = id; save(); buildUnits(); render(); }
  function buildUnits() {
    var c = cat(), p = pair(c), us = units(c);
    ['from', 'to'].forEach(function (k, i) {
      var sel = $(k); sel.innerHTML = '';
      us.forEach(function (u) { var o = document.createElement('option'); o.value = u[0]; o.textContent = short(c, u[0]) + ' · ' + u[1]; sel.appendChild(o); });
      sel.value = p[i];
    });
    catPick.value = c.id;
    Array.prototype.forEach.call(cats.children, function (b) { b.setAttribute('aria-pressed', String(b.dataset.id === c.id)); });
    $('device').classList.toggle('is-custom', c.id === 'custom');
  }
  $('from').addEventListener('change', function (e) { pair(cat())[0] = e.target.value; save(); render(); });
  $('to').addEventListener('change', function (e) { pair(cat())[1] = e.target.value; save(); render(); });
  function swap() { var p = pair(cat()); p.reverse(); save(); buildUnits(); render(); }
  $('swap').addEventListener('click', swap); $('swap2').addEventListener('click', swap);
  $('val').addEventListener('input', function (e) { state.value = e.target.value; save(); render(); });
  selector($('sigSel'), function () { return state.sig; }, function (v) { state.sig = +v; save(); render(); });
  $('cA').value = state.custom.a; $('cB').value = state.custom.b; $('cRate').value = state.custom.rate;
  ['cA', 'cB', 'cRate'].forEach(function (id) {
    $(id).addEventListener('input', function (e) { state.custom[{ cA: 'a', cB: 'b', cRate: 'rate' }[id]] = e.target.value; save(); buildUnits(); render(); });
  });

  function nudge(dir, fine) {
    var v = num(); if (isNaN(v)) v = 0;
    var s = stepFor(v) * (fine ? .1 : 1), nv = Math.round((v + dir * s) / s) * s;
    var dec = Math.max(0, -Math.floor(Math.log10(s) + 1e-9));
    if (cat().id !== 'temp' && nv < 0) nv = 0;
    state.value = nv.toFixed(Math.min(10, dec)); $('val').value = state.value; save(); render();
  }
  $('plus').addEventListener('click', function () { nudge(1); });
  $('minus').addEventListener('click', function () { nudge(-1); });

  /* Nudge knob: endless encoder */
  (function knob(root) {
    function pt(a, r) { var t = a * Math.PI / 180; return [32 + r * Math.sin(t), 32 - r * Math.cos(t)]; }
    var ticks = ''; for (var i = 0; i < 12; i++) { var a = i * 30, o = pt(a, 31), n = pt(a, 28.5); ticks += '<line class="u-knob__tick" x1="' + o[0] + '" y1="' + o[1] + '" x2="' + n[0] + '" y2="' + n[1] + '"/>'; }
    root.innerHTML = '<div class="u-knob__dial" tabindex="0" role="slider" aria-label="Nudge value" aria-valuetext="Turn to nudge">' +
      '<svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">' + ticks + '<circle class="u-knob__cap" cx="32" cy="32" r="22"/><line class="u-knob__ind"/></svg></div>' +
      '<div class="u-knob__foot"><span class="u-label">Nudge</span></div>';
    var dial = root.firstChild, ind = root.querySelector('.u-knob__ind'), ang = 0, drag = null;
    function draw() { var a = pt(ang, 7), b = pt(ang, 19); ind.setAttribute('x1', a[0]); ind.setAttribute('y1', a[1]); ind.setAttribute('x2', b[0]); ind.setAttribute('y2', b[1]); }
    function turn(n, fine) { ang += n * 15; draw(); nudge(n, fine); }
    function knobDrag(dial, get, set, range, sens, ok, min, max) {
      /* Turn it like a dial (start on the ring), or slide up/right to raise, down/left to lower (start near the centre). Shift = fine. Wheel works too. */
      var st = null, lo = min == null ? -Infinity : min, hi = max == null ? Infinity : max;
      var cl = function (v) { return Math.min(hi, Math.max(lo, v)); };
      dial.style.touchAction = 'none';
      dial.addEventListener('pointerdown', function (e) {
        if (ok && !ok()) return; e.preventDefault(); dial.focus(); dial.setPointerCapture(e.pointerId);
        var r = dial.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, rad = Math.min(r.width, r.height) / 2;
        var dx = e.clientX - cx, dy = e.clientY - cy;
        st = { x: e.clientX, y: e.clientY, cx: cx, cy: cy, v: get(), tv: get(), mode: null, ang: Math.atan2(dx, -dy), ring: Math.sqrt(dx * dx + dy * dy) >= rad * 0.4 };
      });
      dial.addEventListener('pointermove', function (e) {
        if (!st) return;
        var mx = e.clientX - st.x, my = e.clientY - st.y;
        if (!st.mode) { if (Math.sqrt(mx * mx + my * my) < 4) return; st.mode = st.ring ? 'turn' : 'slide'; dial.classList.add('is-turning'); }
        if (st.mode === 'turn') {
          var dx = e.clientX - st.cx, dy = e.clientY - st.cy;
          if (Math.sqrt(dx * dx + dy * dy) < 6) return;
          var a = Math.atan2(dx, -dy), d = a - st.ang;
          if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
          st.ang = a; st.tv = cl(st.tv + d / (1.5 * Math.PI) * range * (e.shiftKey ? 0.25 : 1));
          set(st.tv, e.shiftKey);
        } else {
          set(cl(st.v + (mx - my) * range / (sens || 150) / (e.shiftKey ? 4 : 1)), e.shiftKey);
        }
      });
      var end = function () { st = null; dial.classList.remove('is-turning'); };
      dial.addEventListener('pointerup', end); dial.addEventListener('pointercancel', end);
      dial.addEventListener('wheel', function (e) {
        if (ok && !ok()) return; e.preventDefault();
        if (Math.abs(e.deltaY) < 1) return; dial.dispatchEvent(new KeyboardEvent('keydown', { key: e.deltaY < 0 ? 'ArrowUp' : 'ArrowDown', shiftKey: e.shiftKey, bubbles: true, cancelable: true }));
      }, { passive: false });
    }
    var cnt = 0; knobDrag(dial, function () { return cnt; }, function (v, f) { var n = Math.round(v) - cnt; while (n) { var s = n > 0 ? 1 : -1; cnt += s; turn(s, f); n -= s; } }, 18, 144, null, null, null);
    dial.addEventListener('pointerup', function () { drag = null; });
    dial.addEventListener('keydown', function (e) { var d = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key]; if (d) { e.preventDefault(); turn(d, e.shiftKey); } });
    draw();
  })($('nudge'));

  /* Render */
  var recentTimer = null;
  function render() {
    var c = cat(), p = pair(c), v = num(), r = isNaN(v) ? NaN : convert(c, v, p[0], p[1]);
    var rs = isNaN(v) ? '—' : fmt(r);
    $('res').textContent = rs; $('res').style.setProperty('--chars', Math.max(3, rs.length));
    $('resUnit').textContent = short(c, p[1]);
    $('heroFrom').textContent = (isNaN(v) ? '—' : fmt(v)) + ' ' + short(c, p[0]) + ' =';
    $('heroCat').textContent = c.name; $('heroPair').textContent = short(c, p[0]) + ' → ' + short(c, p[1]);
    $('heroSig').textContent = state.sig + ' sig. fig.';
    $('barMeta').textContent = c.name + ' · ' + short(c, p[0]) + ' → ' + short(c, p[1]);
    var st = stepFor(isNaN(v) ? 0 : v);
    $('plusText').textContent = '+' + stepLabel(st); $('minusText').textContent = '−' + stepLabel(st);
    $('ioHint').textContent = isNaN(v) ? 'Not a number' : 'Step ' + stepLabel(st);
    $('plus').setAttribute('aria-label', 'Increase by ' + stepLabel(st)); $('minus').setAttribute('aria-label', 'Decrease by ' + stepLabel(st));
    if (document.activeElement !== $('val')) $('val').value = state.value;
    /* table */
    var t = $('table'); t.innerHTML = '';
    units(c).forEach(function (u) {
      var b = document.createElement('button'); b.className = 'trow' + (u[0] === p[1] ? ' is-to' : '') + (u[0] === p[0] ? ' is-from' : '');
      b.innerHTML = '<span class="trow__u">' + esc(u[1]) + '</span><span class="trow__v">' + (isNaN(v) ? '—' : fmt(convert(c, v, p[0], u[0]))) + ' ' + esc(short(c, u[0])) + '</span>';
      b.addEventListener('click', function () { if (u[0] === p[0]) { swap(); return; } p[1] = u[0]; save(); buildUnits(); render(); });
      t.appendChild(b);
    });
    /* recent (debounced) */
    clearTimeout(recentTimer);
    if (!isNaN(v)) recentTimer = setTimeout(function () {
      var line = { c: c.id, v: state.value, f: p[0], t: p[1], txt: fmt(v) + ' ' + short(c, p[0]) + ' = ' + rs + ' ' + short(c, p[1]) };
      if (!state.recent[0] || state.recent[0].txt !== line.txt) { state.recent.unshift(line); state.recent = state.recent.slice(0, 8); save(); renderRecent(); }
    }, 1200);
  }
  function renderRecent() {
    var box = $('recent');
    if (!state.recent.length) { box.innerHTML = '<span class="r-empty">Conversions you settle on show up here.</span>'; return; }
    box.innerHTML = '';
    state.recent.forEach(function (r) {
      var c = CATS.filter(function (x) { return x.id === r.c; })[0]; if (!c) return;
      var b = document.createElement('button'); b.className = 'rrow';
      b.innerHTML = '<span class="u-label">' + c.name + '</span><b>' + esc(r.txt) + '</b>';
      b.addEventListener('click', function () { state.cat = r.c; state.value = r.v; state.pairs[r.c] = [r.f, r.t]; save(); buildUnits(); render(); });
      box.appendChild(b);
    });
  }

  document.addEventListener('keydown', function (e) {
    if (inControl(e.target)) return;
    if (e.key === 's' || e.key === 'S') swap();
    else if (e.key === 'ArrowUp' || e.key === '+' || e.key === '=') { e.preventDefault(); nudge(1, e.shiftKey); }
    else if (e.key === 'ArrowDown' || e.key === '-') { e.preventDefault(); nudge(-1, e.shiftKey); }
    else if (/^[1-9]$/.test(e.key)) setCat(CATS[+e.key - 1].id);
  });

  buildUnits(); render(); renderRecent();
})();
</script>
