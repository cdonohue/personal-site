<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 01 — Stopwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* ── Unit 01 tokens ─────────────────────────────────────────── */
:root, [data-theme="light"] {
  --chassis:#ffffff; --panel:#ffffff; --panel-sunk:#f0f0ee; --ink:#000000; --ink-muted:#5f5f5c; --line:#c8c8c4; --rule:var(--ink);
  --signal:#ff5a1f; --signal-text:#a83400; --on-signal:#000000; --blue:#3a63d8; --on-blue:#ffffff; --yellow:#f5c400; --on-yellow:#111111;
  --key:#e6e6e3; --lcd:#0b0b0b; --lcd-ink:#f2f2ef; --lcd-muted:#8f8f8a; --lcd-dim:#2a2a2a; --focus:var(--ink);
  --shadow-key:0 2px 0 #00000040; --shadow-key-pressed:0 0 0 #00000040;
}
[data-theme="dark"] {
  --chassis:#000000; --panel:#000000; --panel-sunk:#161616; --ink:#ffffff; --ink-muted:#9b9b97; --line:#3a3a3a; --key:#262626; --rule:var(--ink);
  --signal-text:#ff7a45; --shadow-key:0 2px 0 #ffffff26; --shadow-key-pressed:0 0 0 #ffffff26;
}
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-0:0; --radius-sm:2px; --radius-md:6px; --radius-full:9999px;
  --font-sans:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* ── Unit 01 components (vanilla port of the bundle) ────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); background: var(--chassis); color: var(--ink); -webkit-font-smoothing: antialiased; }
:where(button, input, [role="slider"]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.u-label { display: inline-flex; gap: var(--space-2); align-items: baseline; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.u-label b { font-weight: 700; color: var(--ink); }
.u-value { font-family: var(--font-mono); font-size: 13px; line-height: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
.u-led { display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--line); flex: none; }
.u-key .u-led, .u-selector__opt .u-led { background: var(--line); }
.is-on > .u-led, .u-led.is-lit { background: var(--signal); }

.u-key { appearance: none; position: relative; display: inline-flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  min-width: 0; padding: var(--space-2); border: 0; border-radius: var(--radius-0); background: var(--key); color: var(--ink);
  font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: left;
  box-shadow: var(--shadow-key); cursor: pointer; transition: transform 60ms linear, box-shadow 60ms linear; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.u-key:active, .u-key.is-hit, .u-key[aria-pressed="true"] { transform: translateY(2px); box-shadow: var(--shadow-key-pressed); }
.u-key--ink { background: var(--ink); color: var(--chassis); }
.u-key--signal { background: var(--signal); color: var(--on-signal); }
.u-key--blue { background: var(--blue); color: var(--on-blue); }
.u-key--yellow { background: var(--yellow); color: var(--on-yellow); }
.u-key__top { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: var(--space-1); }
.u-key__index { font-family: var(--font-mono); font-weight: 500; font-size: 9px; line-height: 12px; letter-spacing: .1em; opacity: .75; }
.u-key__glyph { align-self: center; display: flex; }
.u-key__glyph svg { width: 22px; height: 22px; fill: currentColor; }
.u-key--sm { width: 40px; height: 40px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; }

.u-panel { background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: var(--radius-0); min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
.u-panel__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-3); }
.u-panel__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel__body { padding: 0 0 var(--space-2); display: flex; flex-direction: column; gap: var(--space-4); flex: 1; }

.u-display { background: var(--lcd); color: var(--lcd-ink); border: 1px solid var(--line); border-radius: var(--radius-0); font-family: var(--font-mono); }
.u-display__label { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--lcd-muted); white-space: nowrap; }
.u-display__unit { font-size: 13px; line-height: 16px; color: var(--lcd-muted); text-transform: uppercase; letter-spacing: .08em; }

.u-selector { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-selector__row { display: flex; gap: 2px; border-radius: var(--radius-0); }
.u-selector__opt { appearance: none; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-2);
  background: var(--key); color: var(--ink); border: 0; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.u-selector__opt:first-child { border-left: 0; }
.u-selector__opt.is-on { background: var(--ink); color: var(--chassis); }
.u-selector__opt:focus-visible { outline-offset: -4px; }

.u-switch { appearance: none; display: inline-flex; align-items: center; gap: var(--space-3); padding: var(--space-1) 0; background: none; border: 0; color: var(--ink); cursor: pointer; }
.u-switch__track { position: relative; width: 40px; height: 20px; background: var(--panel-sunk); border: 1px solid var(--ink); border-radius: var(--radius-sm); flex: none; }
.u-switch__thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 14px; background: var(--ink); border-radius: var(--radius-sm); transition: left 80ms linear; }
.u-switch[aria-checked="true"] .u-switch__track { background: var(--signal); }
.u-switch[aria-checked="true"] .u-switch__thumb { left: 20px; background: var(--on-signal); }
.u-switch__state { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; min-width: 3ch; }

.u-fader { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-fader__head { display: flex; justify-content: space-between; align-items: baseline; }
.u-fader__input { appearance: none; -webkit-appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: ew-resize; }
.u-fader__input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-moz-range-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 28px; margin-top: -13px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }
.u-fader__input::-moz-range-thumb { width: 14px; height: 28px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }

.u-knob { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.u-knob__dial { border-radius: var(--radius-full); cursor: grab; touch-action: none; line-height: 0; }
.u-knob__tick { stroke: var(--line); stroke-width: 1.5; }
.u-knob__track { fill: none; stroke: var(--panel-sunk); stroke-width: 3; }
.u-knob__arc { fill: none; stroke: var(--signal); stroke-width: 3; }
.u-knob__cap { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.u-knob__ind { stroke: var(--ink); stroke-width: 3; stroke-linecap: square; }
.u-knob__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; }

/* ── App shell (shared by 06–08) ── */
.shell { height: 100dvh; overflow: auto; container: shell / size; }
.device { min-height: 100%; display: grid; gap: var(--space-2); padding: var(--space-2); grid-template-columns: minmax(0, 1fr); }
.bar { display: none; grid-area: bar; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-1) var(--space-1) 0; container: bar / inline-size; min-width: 0; }
.bar__title { display: inline-flex; align-items: flex-start; gap: var(--space-2); font: 800 clamp(18px, 4.2cqi, 34px)/1 var(--font-sans); letter-spacing: -.025em; white-space: nowrap; }
.bar__idx { font: 500 9px/12px var(--font-mono); letter-spacing: .1em; color: var(--ink-muted); }
.bar__right { display: flex; align-items: center; gap: var(--space-4); }
.bar__meta { display: none; }
@container bar (min-width: 420px) { .bar__meta { display: inline-flex; } }
.rowsec { border-top: 2px solid var(--rule); padding-top: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; min-height: 0; }
.rowsec__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); min-height: 16px; }
.hero { container: hero / inline-size; display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-2); padding: var(--space-3); min-height: 0; min-width: 0; overflow: hidden; transition: background 60ms linear; }
.hero__top, .hero__bottom { display: flex; justify-content: space-between; gap: var(--space-3); }
.hero__main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.hero .opt { display: none; }
@container hero (min-width: 260px) { .hero { padding: var(--space-4); } }
@container hero (min-width: 380px) { .hero .opt { display: inline; } }
.hero.is-flash { background: var(--signal); }
.hero.is-flash, .hero.is-flash .u-display__label, .hero.is-flash .u-display__unit { color: var(--on-signal); }
.transport { grid-area: transport; container: transport / inline-size; display: flex; gap: var(--space-2); min-width: 0; }
.transport .u-key { flex: 1 1 0; height: clamp(52px, 20cqi, 104px); }
.transport .k-main { flex-grow: 2; }
.transport .k-more { display: none; }
.u-key__glyph { font-size: clamp(16px, 5cqi, 26px); line-height: 1; }
@container transport (max-width: 199px) { .transport .u-key__text { font-size: 10px; } }
.stepper { display: flex; align-items: center; gap: var(--space-2); }
.stepper__val { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 20px; line-height: 40px; height: 40px; background: var(--panel-sunk); font-variant-numeric: tabular-nums; }
.mini { padding: var(--space-3); display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.mini__num { font-size: 24px; line-height: 24px; font-variant-numeric: tabular-nums; }
.u-key:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.u-key.is-sel { background: var(--ink); color: var(--chassis); }
@container (max-width: 300px) { .u-selector__opt .u-led { display: none; } }
@container shell (min-width: 300px) and (min-height: 360px) { .bar { display: flex; } }
@container shell (min-width: 300px) { .transport .k-more { display: inline-flex; } }
@container shell (min-width: 820px) and (max-height: 759px) {
  .device { padding: var(--space-4); }
  .u-panel__head { padding: var(--space-1) 0 var(--space-2); }
  .u-panel__body { padding: 0; gap: var(--space-3); }
}
@container shell (min-width: 820px) and (min-height: 540px) { .device { gap: var(--space-4); padding: var(--space-6); } }
@container shell (min-width: 1180px) and (min-height: 760px) { .device { padding: var(--space-8); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.device { grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "hero" "transport"; }
.hero { grid-area: hero; } .laps { grid-area: laps; } .p-stats { grid-area: stats; }
.laps, .p-stats { display: none; }

.clock { font-family: var(--font-mono); font-size: clamp(28px, min(21cqi, 20cqb), 230px); line-height: .9; letter-spacing: -.04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock__cs { font-size: .55em; color: var(--lcd-muted); }
.hero.is-run .clock__cs { color: var(--lcd-ink); }
.hero__lap { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.laps__list { list-style: none; margin: 0; padding: 0; overflow: auto; min-height: 0; flex: 1; container: laps / inline-size; }
.lap { display: grid; grid-template-columns: 4ch 1fr 1fr; gap: var(--space-3); align-items: baseline; padding: var(--space-2) 0; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 15px; line-height: 20px; }
.lap__idx { font-size: 11px; color: var(--ink-muted); }
.lap__split, .lap__delta { display: none; color: var(--ink-muted); text-align: right; }
.lap__time { text-align: right; }
.lap.is-best .lap__idx, .lap.is-best .lap__time { color: var(--signal-text); font-weight: 500; }
.lap.is-worst .lap__time { color: var(--ink-muted); }
.lap.is-live .lap__time { color: var(--ink); }
.lap.is-live .lap__idx::after { content: ' •'; color: var(--signal-text); }
.laps__empty { color: var(--ink-muted); font-size: 13px; padding: var(--space-2) 0; font-family: var(--font-sans); }
@container laps (min-width: 300px) { .lap { grid-template-columns: 4ch 1fr 1fr; } .lap__split { display: block; } }
@container laps (min-width: 420px) { .lap { grid-template-columns: 4ch 1fr 1fr 1fr; } .lap__delta { display: block; } }
.laps__cols { display: none; font-size: 11px; }
@container laps (min-width: 300px) { .laps__cols { display: grid; } }

.stats { display: grid; grid-template-columns: 1fr; gap: var(--space-2); }
@container (min-width: 420px) { .stats { grid-template-columns: 1fr 1fr; } }
.mini .mini__num.is-best { color: var(--signal); }

@container shell (min-width: 300px) and (min-height: 360px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar" "hero" "transport"; }
}
@container shell (min-width: 300px) and (min-height: 540px) {
  .device { grid-template-rows: auto minmax(0, 1.1fr) minmax(0, 1fr) auto; grid-template-areas: "bar" "hero" "laps" "transport"; }
  .laps { display: flex; }
}
@container shell (min-width: 520px) and (min-height: 760px) {
  .device { gap: var(--space-4); padding: var(--space-4); grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr) auto; grid-template-areas: "bar bar" "hero hero" "laps stats" "transport transport"; }
  .laps, .p-stats { display: flex; }
}
@container shell (min-width: 560px) and (max-height: 359px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(200px, 34cqi, 340px); grid-template-rows: minmax(0, 1fr); grid-template-areas: "hero transport"; }
}
@container shell (min-width: 560px) and (min-height: 360px) and (max-height: 539px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(220px, 34cqi, 360px); grid-template-rows: auto minmax(0, 1.3fr) minmax(0, 1fr); grid-template-areas: "bar bar" "hero transport" "laps transport"; }
  .laps { display: flex; }
}
@container shell (min-width: 560px) and (max-height: 539px) {
  .transport { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 2fr 1fr; grid-template-areas: "main main" "lap reset"; }
  .transport .u-key { height: auto; }
  .k-main { grid-area: main; } .k-lap { grid-area: lap; } .k-reset { grid-area: reset; display: inline-flex; }
}
@container shell (min-width: 820px) and (min-height: 540px) {
  .device { grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "hero laps" "transport laps"; }
  .laps { display: flex; } .p-stats { display: none; }
}
@container shell (min-width: 1180px) and (min-height: 760px) {
  .device { grid-template-columns: minmax(240px, .8fr) minmax(0, 1.6fr) minmax(320px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar bar" "stats hero laps" "stats transport laps"; }
  .laps, .p-stats { display: flex; }
  .stats { grid-template-columns: 1fr; }
}
.u-knob__dial.is-turning { outline: 1px dashed var(--ink-muted); outline-offset: 3px; }
</style>
</head>
<body>
<div class="shell">
<main class="device">
  <header class="bar">
    <span class="bar__title"><span class="bar__idx">08</span>Stopwatch</span>
    <div class="bar__right">
      <span class="u-label bar__meta" id="barMeta">Laps</span>
      <button class="u-switch" role="switch" aria-checked="false" id="themeSw" aria-label="Dark theme">
        <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
        <span class="u-label">Dark</span>
      </button>
    </div>
  </header>

  <section class="hero u-display" id="hero" aria-label="Stopwatch display">
    <div class="hero__top">
      <span class="u-display__label">Elapsed</span>
      <span class="u-display__label opt" id="stateOut">Ready</span>
      <span class="u-display__label" id="lapCount">Lap 01</span>
    </div>
    <div class="hero__main"><span class="clock" id="clock" role="timer"><span id="clockMain">00:00</span><span class="clock__cs" id="clockCs">.00</span></span></div>
    <div class="hero__bottom">
      <span class="u-display__label">Lap</span>
      <span class="u-display__label hero__lap" id="lapOut">00:00.00</span>
    </div>
  </section>

  <section class="laps rowsec" aria-label="Laps">
    <div class="rowsec__head"><span class="u-label"><b>01</b> Laps</span><span class="u-label" id="lapsMeta">0</span></div>
    <ol class="laps__list" id="laps"></ol>
  </section>

  <section class="transport" aria-label="Controls">
    <button class="u-key u-key--ink k-reset k-more" id="reset"><span class="u-key__top"><span class="u-key__index">R</span></span><span class="u-key__text">Reset</span></button>
    <button class="u-key k-lap" id="lap"><span class="u-key__top"><span class="u-key__index">L</span></span><span class="u-key__text" id="lapText">Lap</span></button>
    <button class="u-key u-key--signal k-main" id="start"><span class="u-key__top"><span class="u-key__index">Space</span></span><span class="u-key__text" id="startText">Start</span></button>
  </section>

  <section class="u-panel p-stats" aria-label="Lap statistics">
    <header class="u-panel__head"><span class="u-label"><b>02</b> Stats</span><span class="u-label" id="statsMeta">No laps</span></header>
    <div class="u-panel__body">
      <div class="stats">
        <div class="u-display mini"><span class="u-display__label">Best</span><span class="mini__num is-best" id="stBest">--:--.--</span></div>
        <div class="u-display mini"><span class="u-display__label">Average</span><span class="mini__num" id="stAvg">--:--.--</span></div>
        <div class="u-display mini"><span class="u-display__label">Worst</span><span class="mini__num" id="stWorst">--:--.--</span></div>
        <div class="u-display mini"><span class="u-display__label">Spread</span><span class="mini__num" id="stSpread">--.--</span></div>
      </div>
    </div>
  </section>
</main>
</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n, w) { n = String(Math.max(0, Math.floor(n))); while (n.length < (w || 2)) n = '0' + n; return n; };
  var clamp = function (n, a, b) { return Math.min(b, Math.max(a, n)); };
  function makeStore(key, defaults) {
    var s = Object.assign({}, defaults);
    try { var v = JSON.parse(localStorage.getItem(key) || 'null'); if (v) Object.assign(s, v); } catch (e) {}
    s.save = function () { try { localStorage.setItem(key, JSON.stringify(s)); } catch (e) {} };
    return s;
  }
  function initTheme(state) {
    var sw = $('themeSw');
    function apply() {
      var dark = state.theme ? state.theme === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'; sw.setAttribute('aria-checked', String(dark));
    }
    sw.addEventListener('click', function () { state.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; apply(); state.save(); });
    apply();
  }
  var AC = null;
  function audio() {
    if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function inControl(e) { return e.target.closest && e.target.closest('button, input, select, textarea, [role="slider"]'); }
  function selector(el, get, set) {
    var opts = Array.prototype.slice.call(el.querySelectorAll('[role=radio]'));
    function sync() { opts.forEach(function (o) { var on = o.dataset.v === String(get()); o.classList.toggle('is-on', on); o.setAttribute('aria-checked', String(on)); o.tabIndex = on ? 0 : -1; }); }
    opts.forEach(function (o, i) {
      o.addEventListener('click', function () { set(o.dataset.v); sync(); });
      o.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
        if (!d) return; e.preventDefault(); var j = (i + d + opts.length) % opts.length; opts[j].click(); opts[j].focus();
      });
    });
    sync(); return sync;
  }
  function bindSwitch(el, get, set) {
    var sync = function () { el.setAttribute('aria-checked', String(!!get())); };
    el.addEventListener('click', function () { set(!get()); sync(); }); sync(); return sync;
  }
  /* Knob: opts {label, min, max, step, fine, size, get, set, format, sens} */
  function knob(root, o) {
    function pt(a, r) { var t = a * Math.PI / 180; return [32 + r * Math.sin(t), 32 - r * Math.cos(t)]; }
    function arc(a0, a1, r) { var s = pt(a0, r), e = pt(a1, r); return 'M' + s[0].toFixed(2) + ' ' + s[1].toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + e[0].toFixed(2) + ' ' + e[1].toFixed(2); }
    var ticks = ''; for (var i = 0; i <= 10; i++) { var a = -135 + 27 * i, p1 = pt(a, 31), p2 = pt(a, 28.5); ticks += '<line class="u-knob__tick" x1="' + p1[0] + '" y1="' + p1[1] + '" x2="' + p2[0] + '" y2="' + p2[1] + '"/>'; }
    var sz = o.size || 64;
    root.innerHTML = '<div class="u-knob__dial" tabindex="0" role="slider" aria-label="' + o.label + '" aria-valuemin="' + o.min + '" aria-valuemax="' + o.max + '">' +
      '<svg viewBox="0 0 64 64" width="' + sz + '" height="' + sz + '" aria-hidden="true">' + ticks + '<path class="u-knob__track" d="' + arc(-135, 135, 25) + '"/><path class="u-knob__arc"/><circle class="u-knob__cap" cx="32" cy="32" r="20"/><line class="u-knob__ind"/></svg></div>' +
      '<div class="u-knob__foot"><span class="u-label">' + o.label + '</span><span class="u-value"></span></div>';
    var dial = root.firstChild, arcEl = root.querySelector('.u-knob__arc'), ind = root.querySelector('.u-knob__ind'), val = root.querySelector('.u-value');
    var disabled = false;
    function draw() {
      var v = o.get(), t = (v - o.min) / (o.max - o.min), a = -135 + 270 * clamp(t, 0, 1), i0 = pt(a, 6), i1 = pt(a, 17);
      arcEl.setAttribute('d', t > 0.001 ? arc(-135, a, 25) : '');
      ind.setAttribute('x1', i0[0]); ind.setAttribute('y1', i0[1]); ind.setAttribute('x2', i1[0]); ind.setAttribute('y2', i1[1]);
      val.textContent = o.format ? o.format(v) : pad(v, 3); dial.setAttribute('aria-valuenow', v);
      dial.setAttribute('aria-valuetext', o.format ? o.format(v) : String(v));
    }
    function set(v, fine) { if (disabled) return; var st = fine ? (o.fine || o.step) : o.step; o.set(clamp(Math.round(v / st) * st, o.min, o.max)); draw(); }
    var drag = null;
    function knobDrag(dial, get, set, range, sens, ok, min, max) {
      /* Turn it like a dial (start on the ring), or slide up/right to raise, down/left to lower (start near the centre). Shift = fine. Wheel works too. */
      var st = null, lo = min == null ? -Infinity : min, hi = max == null ? Infinity : max;
      var cl = function (v) { return Math.min(hi, Math.max(lo, v)); };
      dial.style.touchAction = 'none';
      dial.addEventListener('pointerdown', function (e) {
        if (ok && !ok()) return; e.preventDefault(); dial.focus(); dial.setPointerCapture(e.pointerId);
        var r = dial.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, rad = Math.min(r.width, r.height) / 2;
        var dx = e.clientX - cx, dy = e.clientY - cy;
        st = { x: e.clientX, y: e.clientY, cx: cx, cy: cy, v: get(), tv: get(), mode: null, ang: Math.atan2(dx, -dy), ring: Math.sqrt(dx * dx + dy * dy) >= rad * 0.4 };
      });
      dial.addEventListener('pointermove', function (e) {
        if (!st) return;
        var mx = e.clientX - st.x, my = e.clientY - st.y;
        if (!st.mode) { if (Math.sqrt(mx * mx + my * my) < 4) return; st.mode = st.ring ? 'turn' : 'slide'; dial.classList.add('is-turning'); }
        if (st.mode === 'turn') {
          var dx = e.clientX - st.cx, dy = e.clientY - st.cy;
          if (Math.sqrt(dx * dx + dy * dy) < 6) return;
          var a = Math.atan2(dx, -dy), d = a - st.ang;
          if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
          st.ang = a; st.tv = cl(st.tv + d / (1.5 * Math.PI) * range * (e.shiftKey ? 0.25 : 1));
          set(st.tv, e.shiftKey);
        } else {
          set(cl(st.v + (mx - my) * range / (sens || 150) / (e.shiftKey ? 4 : 1)), e.shiftKey);
        }
      });
      var end = function () { st = null; dial.classList.remove('is-turning'); };
      dial.addEventListener('pointerup', end); dial.addEventListener('pointercancel', end);
      dial.addEventListener('wheel', function (e) {
        if (ok && !ok()) return; e.preventDefault();
        if (Math.abs(e.deltaY) < 1) return; dial.dispatchEvent(new KeyboardEvent('keydown', { key: e.deltaY < 0 ? 'ArrowUp' : 'ArrowDown', shiftKey: e.shiftKey, bubbles: true, cancelable: true }));
      }, { passive: false });
    }
    knobDrag(dial, function () { return o.get(); }, function (v, f) { set(v, f); }, o.max - o.min, (o.sens || 200), function () { return !disabled; }, o.min, o.max);
    dial.addEventListener('pointerup', function () { drag = null; });
    dial.addEventListener('keydown', function (e) {
      var s = e.shiftKey ? (o.fine || o.step) : o.step, d = { ArrowUp: s, ArrowRight: s, ArrowDown: -s, ArrowLeft: -s, PageUp: s * 10, PageDown: -s * 10 }[e.key];
      if (e.key === 'Home') d = o.min - o.get(); if (e.key === 'End') d = o.max - o.get();
      if (d != null) { e.preventDefault(); set(o.get() + d, e.shiftKey); }
    });
    draw();
    return { draw: draw, disable: function (b) { disabled = b; root.classList.toggle('is-disabled', b); dial.setAttribute('aria-disabled', String(b)); } };
  }

  var S = makeStore('unit01-stopwatch', { theme: null, running: false, base: 0, startWall: 0, laps: [] });
  initTheme(S);
  var startPerf = 0;
  if (S.running) startPerf = performance.now() - (Date.now() - S.startWall);

  function elapsed() { return S.running ? S.base + (performance.now() - startPerf) : S.base; }
  function parts(ms) {
    ms = Math.max(0, ms); var cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    return { main: (h ? h + ':' + pad(m, 2) : pad(m, 2)) + ':' + pad(ss, 2), cs: '.' + pad(cs, 2) };
  }
  function fmt(ms) { var p = parts(ms); return p.main + p.cs; }
  function fmtDelta(ms) { var s = (ms / 1000).toFixed(2); return '+' + s; }

  function start() {
    if (S.running) { S.base = elapsed(); S.running = false; }
    else { S.running = true; S.startWall = Date.now(); startPerf = performance.now(); }
    S.save(); renderState();
  }
  function lap() {
    if (!S.running) { if (S.base > 0) reset(); return; }
    S.laps.push(Math.round(elapsed())); S.save(); renderLaps();
  }
  function reset() { if (S.running) return; S.base = 0; S.laps = []; S.save(); renderState(); renderLaps(); renderClock(); }

  function lapTimes() { var out = [], prev = 0; S.laps.forEach(function (t) { out.push(t - prev); prev = t; }); return out; }
  function renderLaps() {
    var list = $('laps'), lt = lapTimes(), n = lt.length;
    list.innerHTML = '';
    var best = n > 1 ? Math.min.apply(null, lt) : null, worst = n > 1 ? Math.max.apply(null, lt) : null;
    if (S.running || S.base > 0) {
      var live = document.createElement('li'); live.className = 'lap is-live'; live.id = 'liveLap';
      live.innerHTML = '<span class="lap__idx">' + pad(n + 1, 2) + '</span><span class="lap__time" id="liveTime"></span><span class="lap__split" id="liveSplit"></span><span class="lap__delta"></span>';
      list.appendChild(live);
    }
    for (var i = n - 1; i >= 0; i--) {
      var li = document.createElement('li');
      li.className = 'lap' + (lt[i] === best ? ' is-best' : '') + (lt[i] === worst ? ' is-worst' : '');
      li.innerHTML = '<span class="lap__idx">' + pad(i + 1, 2) + '</span><span class="lap__time">' + fmt(lt[i]) + '</span><span class="lap__split">' + fmt(S.laps[i]) + '</span><span class="lap__delta">' + (best != null ? (lt[i] === best ? 'Best' : fmtDelta(lt[i] - best)) : '') + '</span>';
      list.appendChild(li);
    }
    if (!list.children.length) { var e = document.createElement('li'); e.className = 'laps__empty'; e.textContent = 'Press Lap while running to record splits.'; list.appendChild(e); }
    $('lapsMeta').textContent = n + (n === 1 ? ' lap' : ' laps');
    $('lapCount').textContent = 'Lap ' + pad(n + 1, 2);
    if (n) {
      var sum = lt.reduce(function (a, b) { return a + b; }, 0), b = Math.min.apply(null, lt), w = Math.max.apply(null, lt);
      $('stBest').textContent = fmt(b); $('stAvg').textContent = fmt(sum / n); $('stWorst').textContent = fmt(w);
      $('stSpread').textContent = ((w - b) / 1000).toFixed(2); $('statsMeta').textContent = n + (n === 1 ? ' lap' : ' laps');
    } else { ['stBest', 'stAvg', 'stWorst'].forEach(function (id) { $(id).textContent = '--:--.--'; }); $('stSpread').textContent = '--.--'; $('statsMeta').textContent = 'No laps'; }
    renderClock();
  }
  function renderState() {
    $('hero').classList.toggle('is-run', S.running);
    $('startText').textContent = S.running ? 'Stop' : (S.base > 0 ? 'Resume' : 'Start');
    $('start').setAttribute('aria-pressed', String(S.running));
    $('lapText').textContent = S.running || S.base === 0 ? 'Lap' : 'Reset';
    $('lap').disabled = !S.running && S.base === 0;
    $('reset').disabled = S.running || S.base === 0;
    var st = S.running ? 'Running' : S.base > 0 ? 'Stopped' : 'Ready';
    $('stateOut').textContent = st; $('barMeta').textContent = st;
    renderLaps();
  }
  function renderClock() {
    var e = elapsed(), p = parts(e), last = S.laps.length ? S.laps[S.laps.length - 1] : 0;
    $('clockMain').textContent = p.main; $('clockCs').textContent = p.cs;
    $('lapOut').textContent = fmt(e - last);
    var lt = $('liveTime'); if (lt) { lt.textContent = fmt(e - last); $('liveSplit').textContent = fmt(e); }
  }
  (function loop() { if (S.running) renderClock(); requestAnimationFrame(loop); })();

  $('start').addEventListener('click', start);
  $('lap').addEventListener('click', lap);
  $('reset').addEventListener('click', reset);
  document.addEventListener('keydown', function (e) {
    if (inControl(e)) return;
    if (e.key === ' ') { e.preventDefault(); start(); }
    else if (e.key === 'l' || e.key === 'L') lap();
    else if (e.key === 'r' || e.key === 'R') reset();
  });
  renderState();
})();
</script>
</body>
