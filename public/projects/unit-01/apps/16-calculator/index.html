<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 01 — Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* ── Unit 01 tokens ─────────────────────────────────────────── */
:root, [data-theme="light"] {
  --chassis:#ffffff; --panel:#ffffff; --panel-sunk:#f0f0ee; --ink:#000000; --ink-muted:#5f5f5c; --line:#c8c8c4; --rule:var(--ink);
  --signal:#ff5a1f; --signal-text:#a83400; --on-signal:#000000; --blue:#3a63d8; --on-blue:#ffffff; --yellow:#f5c400; --on-yellow:#111111;
  --key:#e6e6e3; --lcd:#0b0b0b; --lcd-ink:#f2f2ef; --lcd-muted:#8f8f8a; --lcd-dim:#2a2a2a; --focus:var(--ink);
  --shadow-key:0 2px 0 #00000040; --shadow-key-pressed:0 0 0 #00000040;
}
[data-theme="dark"] {
  --chassis:#000000; --panel:#000000; --panel-sunk:#161616; --ink:#ffffff; --ink-muted:#9b9b97; --line:#3a3a3a; --key:#262626; --rule:var(--ink);
  --signal-text:#ff7a45; --shadow-key:0 2px 0 #ffffff26; --shadow-key-pressed:0 0 0 #ffffff26;
}
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-0:0; --radius-sm:2px; --radius-md:6px; --radius-full:9999px;
  --font-sans:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* ── Unit 01 components (vanilla port of the bundle) ────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); background: var(--chassis); color: var(--ink); -webkit-font-smoothing: antialiased; }
:where(button, input, [role="slider"]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.u-label { display: inline-flex; gap: var(--space-2); align-items: baseline; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.u-label b { font-weight: 700; color: var(--ink); }
.u-value { font-family: var(--font-mono); font-size: 13px; line-height: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
.u-led { display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--line); flex: none; }
.u-key .u-led, .u-selector__opt .u-led { background: var(--line); }
.is-on > .u-led, .u-led.is-lit { background: var(--signal); }

.u-key { appearance: none; position: relative; display: inline-flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  min-width: 0; padding: var(--space-2); border: 0; border-radius: var(--radius-0); background: var(--key); color: var(--ink);
  font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: left;
  box-shadow: var(--shadow-key); cursor: pointer; transition: transform 60ms linear, box-shadow 60ms linear; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.u-key:active, .u-key.is-hit, .u-key[aria-pressed="true"] { transform: translateY(2px); box-shadow: var(--shadow-key-pressed); }
.u-key--ink { background: var(--ink); color: var(--chassis); }
.u-key--signal { background: var(--signal); color: var(--on-signal); }
.u-key--blue { background: var(--blue); color: var(--on-blue); }
.u-key--yellow { background: var(--yellow); color: var(--on-yellow); }
.u-key__top { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: var(--space-1); }
.u-key__index { font-family: var(--font-mono); font-weight: 500; font-size: 9px; line-height: 12px; letter-spacing: .1em; opacity: .75; }
.u-key__glyph { align-self: center; display: flex; }
.u-key__glyph svg { width: 22px; height: 22px; fill: currentColor; }
.u-key--sm { width: 40px; height: 40px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; }

.u-panel { background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: var(--radius-0); min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
.u-panel__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-3); }
.u-panel__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel__body { padding: 0 0 var(--space-2); display: flex; flex-direction: column; gap: var(--space-4); flex: 1; }

.u-display { background: var(--lcd); color: var(--lcd-ink); border: 1px solid var(--line); border-radius: var(--radius-0); font-family: var(--font-mono); }
.u-display__label { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--lcd-muted); white-space: nowrap; }
.u-display__unit { font-size: 13px; line-height: 16px; color: var(--lcd-muted); text-transform: uppercase; letter-spacing: .08em; }

.u-selector { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-selector__row { display: flex; gap: 2px; border-radius: var(--radius-0); }
.u-selector__opt { appearance: none; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-2);
  background: var(--key); color: var(--ink); border: 0; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.u-selector__opt:first-child { border-left: 0; }
.u-selector__opt.is-on { background: var(--ink); color: var(--chassis); }
.u-selector__opt:focus-visible { outline-offset: -4px; }

.u-switch { appearance: none; display: inline-flex; align-items: center; gap: var(--space-3); padding: var(--space-1) 0; background: none; border: 0; color: var(--ink); cursor: pointer; }
.u-switch__track { position: relative; width: 40px; height: 20px; background: var(--panel-sunk); border: 1px solid var(--ink); border-radius: var(--radius-sm); flex: none; }
.u-switch__thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 14px; background: var(--ink); border-radius: var(--radius-sm); transition: left 80ms linear; }
.u-switch[aria-checked="true"] .u-switch__track { background: var(--signal); }
.u-switch[aria-checked="true"] .u-switch__thumb { left: 20px; background: var(--on-signal); }
.u-switch__state { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; min-width: 3ch; }

.u-fader { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-fader__head { display: flex; justify-content: space-between; align-items: baseline; }
.u-fader__input { appearance: none; -webkit-appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: ew-resize; }
.u-fader__input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-moz-range-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 28px; margin-top: -13px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }
.u-fader__input::-moz-range-thumb { width: 14px; height: 28px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }

.u-knob { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.u-knob__dial { border-radius: var(--radius-full); cursor: grab; touch-action: none; line-height: 0; }
.u-knob__tick { stroke: var(--line); stroke-width: 1.5; }
.u-knob__track { fill: none; stroke: var(--panel-sunk); stroke-width: 3; }
.u-knob__arc { fill: none; stroke: var(--signal); stroke-width: 3; }
.u-knob__cap { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.u-knob__ind { stroke: var(--ink); stroke-width: 3; stroke-linecap: square; }
.u-knob__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; }


/* ── Shared app shell (Unit 01 apps 16 / 20) ── */
.shell { height: 100dvh; overflow: auto; container: shell / size; }
.device { min-height: 100%; height: 100%; display: grid; gap: var(--space-2); padding: var(--space-2); grid-template-columns: minmax(0, 1fr); }
.bar { display: none; grid-area: bar; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-1) var(--space-1) 0; container: bar / inline-size; min-width: 0; }
.bar__title { display: inline-flex; align-items: flex-start; gap: var(--space-2); font: 800 clamp(18px, 4.2cqi, 34px)/1 var(--font-sans); letter-spacing: -.025em; white-space: nowrap; }
.bar__idx { font: 500 9px/12px var(--font-mono); letter-spacing: .1em; color: var(--ink-muted); }
.bar__right { display: flex; align-items: center; gap: var(--space-4); min-width: 0; }
.bar__meta { display: none; }
@container bar (min-width: 420px) { .bar__meta { display: inline-flex; } }
.section { border-top: 2px solid var(--rule); padding-top: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; min-height: 0; }
.section__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.section__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel { min-height: 0; overflow: hidden; }
.u-panel__body { min-height: 0; }
.fld { box-sizing: border-box; width: 100%; min-width: 0; height: 40px; padding: 0 var(--space-3); background: var(--panel-sunk); color: var(--ink); border: 0; border-bottom: 2px solid var(--ink); border-radius: var(--radius-0); font: 400 15px/22px var(--font-sans); }
.fld--mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.fld::placeholder { color: var(--ink-muted); }
.fld:read-only { color: var(--ink-muted); }
.kc { align-items: center; justify-content: center; padding: 0; text-align: center; }
.is-hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.u-key:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }

.hero { grid-area: hero; } .pad { grid-area: pad; } .mem { grid-area: mem; } .p-sci { grid-area: sci; } .p-hist { grid-area: hist; }
.mem, .p-sci, .p-hist { display: none; }

/* ── Hero display: a size container so the result can fill it ── */
.hero { container: hero / size; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-1); padding: var(--space-2) var(--space-3); overflow: hidden; }
.hero__top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }
.hero__m { display: inline-flex; align-items: center; gap: var(--space-1); }
.hero__m .u-led { background: var(--lcd-dim); }
.hero__m.is-on .u-led { background: var(--signal); }
.hero__m:not(.is-on) .u-display__label { color: var(--lcd-dim); }
.expr { direction: rtl; text-align: right; overflow: hidden; white-space: nowrap; font: 400 clamp(11px, 7cqh, 18px)/1.3 var(--font-mono); color: var(--lcd-muted); min-height: 1.3em; }
.expr span { direction: ltr; unicode-bidi: isolate; }
.result { --len: 1; text-align: right; white-space: nowrap; overflow: hidden; font-family: var(--font-sans); font-weight: 800; letter-spacing: -.035em; line-height: .95;
  font-size: max(16px, min(calc(96cqw / (var(--len) * .62)), 58cqh, 160px)); font-variant-numeric: tabular-nums; }
.result.is-preview { color: var(--lcd-muted); }
.result.is-err { color: var(--signal); }
@container hero (max-height: 99px) { .hero__top { display: none; } }
@container hero (max-height: 64px) { .expr { display: none; } .hero { justify-content: center; } }

/* ── Keypad: a size container; keys fill their cells ── */
.pad { container: pad / size; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); gap: var(--space-1); }
.pad .u-key { height: auto; min-height: 0; font-size: clamp(12px, min(6.5cqw, 9cqh), 30px); letter-spacing: 0; text-transform: none; font-weight: 700; }
.pad .k-txt { font-size: clamp(10px, min(4cqw, 6cqh), 15px); letter-spacing: .06em; text-transform: uppercase; }
@container shell (min-width: 300px) and (min-height: 360px) { .pad { gap: var(--space-2); } }

/* ── Memory row ── */
.mem { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-2); }
.mem .u-key { height: 40px; flex-direction: row; gap: var(--space-2); }
.mem .u-led { background: var(--line); }
.mem .is-mem .u-led { background: var(--signal); }

/* ── Scientific panel ── */
.p-sci { flex-direction: column; }
.sci { container: sci / inline-size; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-2); }
.sci .u-key { height: clamp(40px, 10cqi, 56px); text-transform: none; letter-spacing: 0; font-size: 14px; }
.u-selector__row .u-selector__opt { flex: 1 1 0; }

/* ── History panel ── */
.p-hist { flex-direction: column; }
.p-hist .u-panel__body { overflow: auto; gap: 0; }
.hist__clear { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; font: 700 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.hrow { appearance: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; width: 100%; padding: var(--space-2) 0; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); cursor: pointer; text-align: right; min-width: 0; }
.hrow__e { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 12px/16px var(--font-mono); color: var(--ink-muted); }
.hrow__r { font: 800 22px/1 var(--font-sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.hrow:hover .hrow__r { color: var(--signal-text); }
.hist__empty { color: var(--ink-muted); font-size: 13px; line-height: 18px; padding-top: var(--space-2); }

/* ── Tiers ── */
.device { grid-template-rows: minmax(0, .62fr) minmax(0, 1.38fr); grid-template-areas: "hero" "pad"; }
/* T1 — header */
@container shell (min-width: 300px) and (min-height: 360px) {
  .device { grid-template-rows: auto minmax(0, .7fr) minmax(0, 1.5fr); grid-template-areas: "bar" "hero" "pad"; }
  .bar { display: flex; }
}
/* T2 — tall phone: memory row */
@container shell (min-width: 300px) and (min-height: 620px) {
  .device { grid-template-rows: auto minmax(0, .75fr) auto minmax(0, 1.6fr); grid-template-areas: "bar" "hero" "mem" "pad"; }
  .mem { display: grid; }
}
/* T3 — tall tablet: scientific panel beside the pad */
@container shell (min-width: 520px) and (min-height: 760px) {
  .device { gap: var(--space-4); padding: var(--space-4); grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
    grid-template-rows: auto minmax(0, .8fr) auto minmax(0, 1.5fr); grid-template-areas: "bar bar" "hero hero" "mem mem" "sci pad"; }
  .p-sci { display: flex; }
}
/* T4 — short landscape strip */
@container shell (min-width: 560px) and (max-height: 359px) {
  .device { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "hero pad"; }
}
/* T5 — landscape phone */
@container shell (min-width: 560px) and (min-height: 360px) and (max-height: 619px) {
  .device { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "hero pad" "mem pad"; }
  .mem { display: grid; }
}
/* T6 — desktop: two columns */
@container shell (min-width: 820px) and (min-height: 540px) {
  .device { gap: var(--space-4); padding: var(--space-6); grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr);
    grid-template-rows: auto minmax(0, .8fr) auto minmax(0, 1.4fr); grid-template-areas: "bar bar" "hero sci" "mem sci" "pad hist"; }
  .mem, .p-sci, .p-hist { display: grid; }
  .p-sci, .p-hist { display: flex; }
}
@container shell (min-width: 820px) and (max-height: 759px) {
  .device { padding: var(--space-4); }
  .u-panel__head { padding: var(--space-1) 0 var(--space-2); }
  .u-panel__body { padding: 0; gap: var(--space-2); }
  .sci .u-key { height: 38px; }
}
/* T7 — big screens: history | display + pad | scientific */
@container shell (min-width: 1180px) and (min-height: 760px) {
  .device { padding: var(--space-8); grid-template-columns: minmax(260px, .8fr) minmax(0, 1.3fr) minmax(320px, 1fr);
    grid-template-rows: auto minmax(0, .8fr) auto minmax(0, 1.5fr); grid-template-areas: "bar bar bar" "hist hero sci" "hist mem sci" "hist pad sci"; }
  .sci { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sci .u-key { height: clamp(48px, 16cqi, 64px); font-size: 16px; }
}
</style>
</head>
<body>
<div class="shell">
<main class="device">

  <header class="bar">
    <span class="bar__title"><span class="bar__idx">16</span>Calculator</span>
    <div class="bar__right">
      <span class="u-label bar__meta" id="barMeta">DEG</span>
      <button class="u-switch" role="switch" aria-checked="false" id="themeSw" aria-label="Dark theme">
        <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
        <span class="u-label">Dark</span>
      </button>
    </div>
  </header>

  <section class="hero u-display" aria-label="Display">
    <div class="hero__top">
      <span class="u-display__label">Calc</span>
      <span class="hero__m" id="memInd"><span class="u-led"></span><span class="u-display__label">M</span></span>
      <span class="u-display__label" id="angleOut">Deg</span>
    </div>
    <div class="expr" id="expr"><span id="exprText"></span></div>
    <output class="result" id="result" aria-live="polite">0</output>
  </section>

  <section class="mem" aria-label="Memory">
    <button class="u-key kc" data-k="mc">MC</button>
    <button class="u-key kc" data-k="mr" id="mrKey"><span class="u-led"></span>MR</button>
    <button class="u-key kc" data-k="m+">M+</button>
    <button class="u-key kc" data-k="m-">M−</button>
  </section>

  <section class="pad" aria-label="Keypad">
    <button class="u-key kc k-txt" data-k="ac" id="acKey">AC</button>
    <button class="u-key kc" data-k="back" aria-label="Backspace" style="align-items:center;justify-content:center"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px;fill:currentColor;display:block"><path fill-rule="evenodd" d="M8 4h14v16H8L1 12zm4.4 4L11 9.4l2.6 2.6-2.6 2.6 1.4 1.4 2.6-2.6 2.6 2.6 1.4-1.4-2.6-2.6 2.6-2.6L17.6 8 15 10.6z"/></svg></button>
    <button class="u-key kc" data-k="pct" aria-label="Percent">%</button>
    <button class="u-key u-key--ink kc" data-k="/" aria-label="Divide">÷</button>
    <button class="u-key kc" data-k="7">7</button>
    <button class="u-key kc" data-k="8">8</button>
    <button class="u-key kc" data-k="9">9</button>
    <button class="u-key u-key--ink kc" data-k="*" aria-label="Multiply">×</button>
    <button class="u-key kc" data-k="4">4</button>
    <button class="u-key kc" data-k="5">5</button>
    <button class="u-key kc" data-k="6">6</button>
    <button class="u-key u-key--ink kc" data-k="-" aria-label="Subtract">−</button>
    <button class="u-key kc" data-k="1">1</button>
    <button class="u-key kc" data-k="2">2</button>
    <button class="u-key kc" data-k="3">3</button>
    <button class="u-key u-key--ink kc" data-k="+" aria-label="Add">+</button>
    <button class="u-key kc" data-k="neg" aria-label="Plus or minus">±</button>
    <button class="u-key kc" data-k="0">0</button>
    <button class="u-key kc" data-k="." aria-label="Decimal point">.</button>
    <button class="u-key u-key--signal kc" data-k="=" aria-label="Equals">=</button>
  </section>

  <section class="u-panel p-sci" aria-label="Scientific">
    <header class="u-panel__head"><span class="u-label"><b>02</b> Scientific</span><span class="u-label">15 functions</span></header>
    <div class="u-panel__body">
      <div class="u-selector">
        <div class="u-selector__row" role="radiogroup" aria-label="Angle unit" id="angleSel">
          <button class="u-selector__opt" role="radio" data-v="deg"><span class="u-led"></span>Deg</button>
          <button class="u-selector__opt" role="radio" data-v="rad"><span class="u-led"></span>Rad</button>
        </div>
      </div>
      <div class="sci">
        <button class="u-key kc" data-k="(">(</button>
        <button class="u-key kc" data-k=")">)</button>
        <button class="u-key kc" data-k="sq" aria-label="Square">x²</button>
        <button class="u-key kc" data-k="^" aria-label="Power">xʸ</button>
        <button class="u-key kc" data-k="sqrt" aria-label="Square root">√</button>
        <button class="u-key kc" data-k="sin">sin</button>
        <button class="u-key kc" data-k="cos">cos</button>
        <button class="u-key kc" data-k="tan">tan</button>
        <button class="u-key kc" data-k="inv" aria-label="Reciprocal">1/x</button>
        <button class="u-key kc" data-k="pi" aria-label="Pi">π</button>
        <button class="u-key kc" data-k="ln">ln</button>
        <button class="u-key kc" data-k="log">log</button>
        <button class="u-key kc" data-k="e" aria-label="Euler's number">e</button>
        <button class="u-key kc" data-k="fact" aria-label="Factorial">n!</button>
        <button class="u-key kc" data-k="ans" aria-label="Last answer">Ans</button>
      </div>
    </div>
  </section>

  <section class="u-panel p-hist" aria-label="History">
    <header class="u-panel__head"><span class="u-label"><b>03</b> History</span><button class="hist__clear" id="histClear">Clear</button></header>
    <div class="u-panel__body" id="hist"></div>
  </section>

</main>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'unit01-calculator';
  var S = { tokens: [], ans: 0, justEval: false, err: false, mem: 0, angle: 'deg', hist: [], theme: null };
  try { var sv = JSON.parse(localStorage.getItem(KEY) || 'null'); if (sv) { ['mem', 'angle', 'hist', 'theme', 'ans'].forEach(function (k) { if (sv[k] != null) S[k] = sv[k]; }); } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ mem: S.mem, angle: S.angle, hist: S.hist, theme: S.theme, ans: S.ans })); } catch (e) {} }

  /* ── Theme ── */
  function applyTheme() {
    var dark = S.theme ? S.theme === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $('themeSw').setAttribute('aria-checked', String(dark));
  }
  $('themeSw').addEventListener('click', function () { S.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyTheme(); save(); });

  /* ── Number formatting: 12 significant digits, exponent beyond ── */
  function round12(v) { return Number(v.toPrecision(12)); }
  function fmtNum(v) {
    if (!isFinite(v)) return 'Error';
    if (v === 0 || Object.is(v, -0)) return '0';
    var a = Math.abs(v);
    if (a >= 1e12 || a < 1e-9) {
      var s = v.toExponential(7).split('e'), m = s[0].replace(/\.?0+$/, '');
      return (m + 'e' + (+s[1])).replace(/-/g, '−');
    }
    return round12(v).toLocaleString('en-US', { maximumFractionDigits: 11 }).replace('-', '−');
  }
  function fmtEntry(s) {
    if (s === '-') return '−';
    var neg = s[0] === '-', b = neg ? s.slice(1) : s, parts = b.split('.');
    var ip = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '−' : '') + ip + (parts.length > 1 ? '.' + parts[1] : '');
  }
  function rawOf(v) { return String(round12(v)); }

  /* ── Tokens ── */
  var last = function () { return S.tokens[S.tokens.length - 1]; };
  var operandEnd = function (t) { return !!t && (t.t === 'n' && t.v !== '-' || t.t === 'rp' || t.t === 'post' || t.t === 'c'); };
  function implicitMul() { if (operandEnd(last())) S.tokens.push({ t: 'op', v: '*' }); }
  function fresh() { if (S.err) { S.tokens = []; S.err = false; } if (S.justEval) { S.tokens = []; S.justEval = false; } }
  function continueFromAns() { if (S.err) { S.tokens = []; S.err = false; } if (S.justEval) { S.tokens = [{ t: 'n', v: rawOf(S.ans) }]; S.justEval = false; } }
  function openCount() { var n = 0; S.tokens.forEach(function (t) { if (t.t === 'lp') n++; if (t.t === 'rp') n--; }); return n; }
  function digitCount(s) { return s.replace(/[^0-9]/g, '').length; }

  function digit(d) {
    fresh(); var l = last();
    if (l && l.t === 'n' && !/e/.test(l.v)) {
      if (l.v === '0') l.v = d; else if (l.v === '-0') l.v = '-' + d; else if (digitCount(l.v) < 15) l.v += d;
    } else { implicitMul(); S.tokens.push({ t: 'n', v: d }); }
  }
  function dot() {
    fresh(); var l = last();
    if (l && l.t === 'n' && !/e/.test(l.v)) { if (l.v.indexOf('.') < 0) l.v += (l.v === '-' ? '0.' : '.'); }
    else { implicitMul(); S.tokens.push({ t: 'n', v: '0.' }); }
  }
  function op(o) {
    continueFromAns(); var l = last();
    if (!l) { if (o === '-') { S.tokens.push({ t: 'n', v: '-' }); return; } S.tokens.push({ t: 'n', v: rawOf(S.ans || 0) }); l = last(); }
    if (l.t === 'op') { l.v = o; return; }
    if (l.t === 'lp' || l.t === 'fn') { if (o === '-') S.tokens.push({ t: 'n', v: '-' }); return; }
    if (l.t === 'n' && l.v === '-') return;
    S.tokens.push({ t: 'op', v: o });
  }
  function lparen() { fresh(); implicitMul(); S.tokens.push({ t: 'lp' }); }
  function rparen() { if (S.justEval || S.err) return; if (openCount() > 0 && operandEnd(last())) S.tokens.push({ t: 'rp' }); }
  function fn(name) { fresh(); implicitMul(); S.tokens.push({ t: 'fn', v: name }); S.tokens.push({ t: 'lp' }); }
  function post(p) { continueFromAns(); if (operandEnd(last())) S.tokens.push({ t: 'post', v: p }); }
  function constant(c) { fresh(); implicitMul(); S.tokens.push({ t: 'c', v: c }); }
  function insertValue(v) { fresh(); var l = last(); if (l && l.t === 'n') S.tokens.pop(); implicitMul(); S.tokens.push({ t: 'n', v: rawOf(v) }); }
  function neg() {
    continueFromAns(); var l = last();
    if (l && l.t === 'n') l.v = l.v[0] === '-' ? l.v.slice(1) : '-' + l.v;
    else if (!l || l.t === 'op' || l.t === 'lp') S.tokens.push({ t: 'n', v: '-' });
  }
  function back() {
    if (S.err) { S.tokens = []; S.err = false; return; }
    if (S.justEval) { S.justEval = false; S.tokens = [{ t: 'n', v: rawOf(S.ans) }]; }
    var l = last(); if (!l) return;
    if (l.t === 'n' && l.v.length > 1 && !/e/.test(l.v)) { l.v = l.v.slice(0, -1); return; }
    S.tokens.pop();
    if (l.t === 'lp' && last() && last().t === 'fn') S.tokens.pop();
  }
  function clearKey() {
    var l = last();
    if (!S.justEval && !S.err && l && l.t === 'n' && S.tokens.length > 1) { S.tokens.pop(); return; }
    S.tokens = []; S.justEval = false; S.err = false;
  }

  /* ── Evaluation: shunting-yard → RPN ── */
  var PREC = { '+': 1, '-': 1, '*': 2, '/': 2, '^': 3 };
  function cleanTokens(src) {
    var t = src.slice();
    while (t.length) {
      var l = t[t.length - 1];
      if (l.t === 'op' || l.t === 'fn' || (l.t === 'n' && (l.v === '-' || l.v === ''))) { t.pop(); continue; }
      if (l.t === 'lp') { t.pop(); if (t.length && t[t.length - 1].t === 'fn') t.pop(); continue; }
      break;
    }
    var open = 0; t.forEach(function (x) { if (x.t === 'lp') open++; if (x.t === 'rp') open--; });
    while (open-- > 0) t.push({ t: 'rp' });
    return t;
  }
  function trig(f, x) {
    var r = S.angle === 'deg' ? x * Math.PI / 180 : x;
    if (f === 'tan' && S.angle === 'deg' && Math.abs(((x % 180) + 180) % 180 - 90) < 1e-12) return NaN;
    var v = Math[f](r);
    return Math.abs(v) < 1e-12 ? 0 : v;
  }
  function fact(x) { if (x < 0 || Math.floor(x) !== x || x > 170) return NaN; var r = 1; for (var i = 2; i <= x; i++) r *= i; return r; }
  function evaluate(src) {
    var toks = cleanTokens(src);
    if (!toks.length) return null;
    var out = [], ops = [];
    toks.forEach(function (tk) {
      if (tk.t === 'n') out.push({ num: parseFloat(tk.v) });
      else if (tk.t === 'c') out.push({ num: tk.v === 'pi' ? Math.PI : Math.E });
      else if (tk.t === 'post') out.push(tk);
      else if (tk.t === 'fn' || tk.t === 'lp') ops.push(tk);
      else if (tk.t === 'op') {
        while (ops.length) {
          var top = ops[ops.length - 1];
          if (top.t === 'op' && (PREC[top.v] > PREC[tk.v] || (PREC[top.v] === PREC[tk.v] && tk.v !== '^'))) out.push(ops.pop()); else break;
        }
        ops.push(tk);
      } else if (tk.t === 'rp') {
        while (ops.length && ops[ops.length - 1].t !== 'lp') out.push(ops.pop());
        ops.pop();
        if (ops.length && ops[ops.length - 1].t === 'fn') out.push(ops.pop());
      }
    });
    while (ops.length) { var o = ops.pop(); if (o.t !== 'lp') out.push(o); }
    var st = [];
    out.forEach(function (tk) {
      if ('num' in tk) { st.push(tk.num); return; }
      if (tk.t === 'op') {
        var b = st.pop(), a = st.pop(); if (a === undefined || b === undefined) throw 0;
        st.push(tk.v === '+' ? a + b : tk.v === '-' ? a - b : tk.v === '*' ? a * b : tk.v === '/' ? a / b : Math.pow(a, b));
      } else if (tk.t === 'fn') {
        var x = st.pop(); if (x === undefined) throw 0;
        var f = tk.v;
        st.push(f === 'sin' || f === 'cos' || f === 'tan' ? trig(f, x) : f === 'ln' ? Math.log(x) : f === 'log' ? Math.log10(x) : Math.sqrt(x));
      } else if (tk.t === 'post') {
        var y = st.pop(); if (y === undefined) throw 0;
        st.push(tk.v === 'sq' ? y * y : tk.v === 'inv' ? 1 / y : tk.v === 'pct' ? y / 100 : fact(y));
      }
    });
    if (st.length !== 1 || !isFinite(st[0]) || isNaN(st[0])) throw 0;
    return round12(st[0]);
  }
  function safeEval(src) { try { return evaluate(src); } catch (e) { return undefined; } }

  function equals() {
    if (S.err) { S.tokens = []; S.err = false; return; }
    if (S.justEval || !S.tokens.length) return;
    var v = safeEval(S.tokens);
    if (v === undefined) { S.err = true; S.lastExpr = render(cleanTokens(S.tokens)); return; }
    if (v === null) return;
    var e = render(cleanTokens(S.tokens));
    S.hist.unshift({ e: e, r: v }); if (S.hist.length > 40) S.hist.length = 40;
    S.ans = v; S.justEval = true; S.lastExpr = e; save();
  }

  /* ── Render ── */
  var SYM = { '+': '+', '-': '−', '*': '×', '/': '÷', '^': '^' };
  var POST = { sq: '²', inv: '⁻¹', pct: '%', fact: '!' };
  function render(toks) {
    return toks.map(function (t) {
      if (t.t === 'n') return fmtEntry(t.v);
      if (t.t === 'op') return t.v === '^' ? '^' : ' ' + SYM[t.v] + ' ';
      if (t.t === 'lp') return '(';
      if (t.t === 'rp') return ')';
      if (t.t === 'fn') return t.v === 'sqrt' ? '√' : t.v;
      if (t.t === 'post') return POST[t.v];
      if (t.t === 'c') return t.v === 'pi' ? 'π' : 'e';
      return '';
    }).join('');
  }
  function update() {
    var res = $('result'), text, preview = false;
    if (S.err) { text = 'Error'; $('exprText').textContent = (S.lastExpr || '') + ' ='; }
    else if (S.justEval) { text = fmtNum(S.ans); $('exprText').textContent = S.lastExpr + ' ='; }
    else {
      $('exprText').textContent = render(S.tokens);
      var l = last();
      if (!l) text = '0';
      else if (l.t === 'n' && l.v !== '-' && S.tokens.length === 1) text = fmtEntry(l.v);
      else if (l.t === 'n' && l.v !== '-') text = fmtEntry(l.v);
      else { var v = safeEval(S.tokens); text = v == null ? '0' : fmtNum(v); preview = true; }
    }
    res.textContent = text;
    res.style.setProperty('--len', Math.max(1, text.replace(/[,.]/g, '').length + text.replace(/[^,.]/g, '').length * .45));
    res.classList.toggle('is-preview', preview);
    res.classList.toggle('is-err', !!S.err);
    var l2 = last();
    $('acKey').textContent = (!S.justEval && !S.err && l2 && l2.t === 'n' && S.tokens.length > 1) ? 'C' : 'AC';
    $('memInd').classList.toggle('is-on', S.mem !== 0);
    $('mrKey').classList.toggle('is-mem', S.mem !== 0);
    $('angleOut').textContent = S.angle === 'deg' ? 'Deg' : 'Rad';
    $('barMeta').textContent = (S.angle === 'deg' ? 'DEG' : 'RAD') + (S.mem !== 0 ? ' · M ' + fmtNum(S.mem) : '');
    renderHist();
  }
  function renderHist() {
    var h = $('hist');
    if (!S.hist.length) { h.innerHTML = '<p class="hist__empty">Results appear here. Tap one to use it again.</p>'; return; }
    h.innerHTML = '';
    S.hist.forEach(function (it) {
      var b = document.createElement('button'); b.className = 'hrow';
      b.setAttribute('aria-label', it.e + ' equals ' + fmtNum(it.r) + '. Use this result');
      var e = document.createElement('span'); e.className = 'hrow__e'; e.textContent = it.e + ' =';
      var r = document.createElement('span'); r.className = 'hrow__r'; r.textContent = fmtNum(it.r);
      b.appendChild(e); b.appendChild(r);
      b.addEventListener('click', function () { insertValue(it.r); update(); });
      h.appendChild(b);
    });
  }
  $('histClear').addEventListener('click', function () { S.hist = []; save(); update(); });

  /* ── Memory ── */
  function currentValue() {
    if (S.err) return 0;
    if (S.justEval) return S.ans;
    var v = safeEval(S.tokens); return v == null ? 0 : v;
  }

  /* ── Key dispatch ── */
  function press(k) {
    if (/^[0-9]$/.test(k)) digit(k);
    else if (k === '.') dot();
    else if ('+-*/^'.indexOf(k) >= 0 && k.length === 1) op(k);
    else if (k === '=') equals();
    else if (k === 'ac') clearKey();
    else if (k === 'back') back();
    else if (k === 'neg') neg();
    else if (k === 'pct' || k === 'sq' || k === 'inv' || k === 'fact') post(k);
    else if (k === '(') lparen();
    else if (k === ')') rparen();
    else if (k === 'sin' || k === 'cos' || k === 'tan' || k === 'ln' || k === 'log' || k === 'sqrt') fn(k);
    else if (k === 'pi' || k === 'e') constant(k);
    else if (k === 'ans') insertValue(S.ans);
    else if (k === 'mc') { S.mem = 0; save(); }
    else if (k === 'mr') { if (S.mem !== 0) insertValue(S.mem); }
    else if (k === 'm+') { S.mem = round12(S.mem + currentValue()); save(); }
    else if (k === 'm-') { S.mem = round12(S.mem - currentValue()); save(); }
    update();
  }
  document.querySelectorAll('[data-k]').forEach(function (b) {
    b.addEventListener('mousedown', function (e) { e.preventDefault(); });
    b.addEventListener('click', function () { press(b.dataset.k); });
  });
  function flash(k) {
    var b = document.querySelector('.pad [data-k="' + k + '"], .sci [data-k="' + k + '"]');
    if (!b) return; b.classList.add('is-hit'); setTimeout(function () { b.classList.remove('is-hit'); }, 90);
  }
  var KEYMAP = { 'Enter': '=', '=': '=', 'Backspace': 'back', 'Escape': 'ac', 'Delete': 'ac', 'x': '*', 'X': '*', ',': '.', '%': 'pct', '(': '(', ')': ')', '^': '^' };
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && t.closest && t.closest('button')) return;
    var k = KEYMAP[e.key] || ('0123456789.+-*/'.indexOf(e.key) >= 0 ? e.key : null);
    if (!k) return;
    e.preventDefault(); press(k); flash(k);
  });

  /* ── Angle selector ── */
  (function () {
    var opts = Array.prototype.slice.call($('angleSel').querySelectorAll('[role=radio]'));
    function sync() { opts.forEach(function (o) { var on = o.dataset.v === S.angle; o.classList.toggle('is-on', on); o.setAttribute('aria-checked', String(on)); o.tabIndex = on ? 0 : -1; }); }
    opts.forEach(function (o, i) {
      o.addEventListener('click', function () { S.angle = o.dataset.v; sync(); save(); update(); });
      o.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
        if (!d) return; e.preventDefault(); var j = (i + d + opts.length) % opts.length; opts[j].click(); opts[j].focus();
      });
    });
    sync();
  })();

  window.__calc = { press: press, state: S };
  applyTheme(); update();
})();
</script>
</body>
</html>
