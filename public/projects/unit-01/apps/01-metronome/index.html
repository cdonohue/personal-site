<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 01 — Metronome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ── Unit 01 tokens ─────────────────────────────────────────── */
:root, [data-theme="light"] {
  --chassis:#ffffff; --panel:#ffffff; --panel-sunk:#f0f0ee; --ink:#000000; --ink-muted:#5f5f5c; --line:#c8c8c4; --rule:var(--ink);
  --signal:#ff5a1f; --signal-text:#a83400; --on-signal:#000000; --blue:#3a63d8; --on-blue:#ffffff; --yellow:#f5c400; --on-yellow:#111111;
  --key:#e6e6e3; --lcd:#0b0b0b; --lcd-ink:#f2f2ef; --lcd-muted:#8f8f8a; --lcd-dim:#2a2a2a; --focus:var(--ink);
  --shadow-key:0 2px 0 #00000040; --shadow-key-pressed:0 0 0 #00000040;
}
[data-theme="dark"] {
  --chassis:#000000; --panel:#000000; --panel-sunk:#161616; --ink:#ffffff; --ink-muted:#9b9b97; --line:#3a3a3a; --key:#262626; --rule:var(--ink);
  --signal-text:#ff7a45; --shadow-key:0 2px 0 #ffffff26; --shadow-key-pressed:0 0 0 #ffffff26;
}
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-0:0; --radius-sm:2px; --radius-md:6px; --radius-full:9999px;
  --font-sans:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* ── Unit 01 components (vanilla port of the bundle) ────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); background: var(--chassis); color: var(--ink); -webkit-font-smoothing: antialiased; }
:where(button, input, [role="slider"]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.u-label { display: inline-flex; gap: var(--space-2); align-items: baseline; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.u-label b { font-weight: 700; color: var(--ink); }
.u-value { font-family: var(--font-mono); font-size: 13px; line-height: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
.u-led { display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--line); flex: none; }
.u-key .u-led, .u-selector__opt .u-led { background: var(--line); }
.is-on > .u-led, .u-led.is-lit { background: var(--signal); }

.u-key { appearance: none; position: relative; display: inline-flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  min-width: 0; padding: var(--space-2); border: 0; border-radius: var(--radius-0); background: var(--key); color: var(--ink);
  font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: left;
  box-shadow: var(--shadow-key); cursor: pointer; transition: transform 60ms linear, box-shadow 60ms linear; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.u-key:active, .u-key.is-hit, .u-key[aria-pressed="true"] { transform: translateY(2px); box-shadow: var(--shadow-key-pressed); }
.u-key--ink { background: var(--ink); color: var(--chassis); }
.u-key--signal { background: var(--signal); color: var(--on-signal); }
.u-key--blue { background: var(--blue); color: var(--on-blue); }
.u-key--yellow { background: var(--yellow); color: var(--on-yellow); }
.u-key__top { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: var(--space-1); }
.u-key__index { font-family: var(--font-mono); font-weight: 500; font-size: 9px; line-height: 12px; letter-spacing: .1em; opacity: .75; }
.u-key__glyph { align-self: center; display: flex; }
.u-key__glyph svg { width: 22px; height: 22px; fill: currentColor; }
.u-key--sm { width: 40px; height: 40px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; }

.u-panel { background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: var(--radius-0); min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
.u-panel__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-3); }
.u-panel__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel__body { padding: 0 0 var(--space-2); display: flex; flex-direction: column; gap: var(--space-4); flex: 1; }

.u-display { background: var(--lcd); color: var(--lcd-ink); border: 1px solid var(--line); border-radius: var(--radius-0); font-family: var(--font-mono); }
.u-display__label { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--lcd-muted); white-space: nowrap; }
.u-display__unit { font-size: 13px; line-height: 16px; color: var(--lcd-muted); text-transform: uppercase; letter-spacing: .08em; }

.u-selector { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-selector__row { display: flex; gap: 2px; border-radius: var(--radius-0); }
.u-selector__opt { appearance: none; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-2);
  background: var(--key); color: var(--ink); border: 0; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.u-selector__opt:first-child { border-left: 0; }
.u-selector__opt.is-on { background: var(--ink); color: var(--chassis); }
.u-selector__opt:focus-visible { outline-offset: -4px; }

.u-switch { appearance: none; display: inline-flex; align-items: center; gap: var(--space-3); padding: var(--space-1) 0; background: none; border: 0; color: var(--ink); cursor: pointer; }
.u-switch__track { position: relative; width: 40px; height: 20px; background: var(--panel-sunk); border: 1px solid var(--ink); border-radius: var(--radius-sm); flex: none; }
.u-switch__thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 14px; background: var(--ink); border-radius: var(--radius-sm); transition: left 80ms linear; }
.u-switch[aria-checked="true"] .u-switch__track { background: var(--signal); }
.u-switch[aria-checked="true"] .u-switch__thumb { left: 20px; background: var(--on-signal); }
.u-switch__state { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; min-width: 3ch; }

.u-fader { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-fader__head { display: flex; justify-content: space-between; align-items: baseline; }
.u-fader__input { appearance: none; -webkit-appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: ew-resize; }
.u-fader__input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-moz-range-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 28px; margin-top: -13px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }
.u-fader__input::-moz-range-thumb { width: 14px; height: 28px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }

.u-knob { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.u-knob__dial { border-radius: var(--radius-full); cursor: grab; touch-action: none; line-height: 0; }
.u-knob__tick { stroke: var(--line); stroke-width: 1.5; }
.u-knob__track { fill: none; stroke: var(--panel-sunk); stroke-width: 3; }
.u-knob__arc { fill: none; stroke: var(--signal); stroke-width: 3; }
.u-knob__cap { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.u-knob__ind { stroke: var(--ink); stroke-width: 3; stroke-linecap: square; }
.u-knob__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; }

/* ── App shell: the viewport is a size container ────────────── */
.shell { height: 100dvh; overflow: auto; container: shell / size; }
.device { min-height: 100%; display: grid; gap: var(--space-2); padding: var(--space-2);
  grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "hero" "transport"; }
.bar { grid-area: bar; } .hero { grid-area: hero; } .transport { grid-area: transport; } .beats { grid-area: beats; }
.p-tempo { grid-area: tempo; } .p-meter { grid-area: meter; } .p-sound { grid-area: sound; } .p-presets { grid-area: presets; } .p-stats { grid-area: stats; }
.bar, .beats, .p-tempo, .p-meter, .p-sound, .p-presets, .p-stats { display: none; }

/* ── Header bar ── */
.bar { align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-1) var(--space-1) 0; container: bar / inline-size; min-width: 0; }
.bar__title { display: inline-flex; align-items: flex-start; gap: var(--space-2); font: 800 clamp(18px, 4.2cqi, 34px)/1 var(--font-sans); letter-spacing: -.025em; }
.bar__idx { font: 500 9px/12px var(--font-mono); letter-spacing: .1em; color: var(--ink-muted); }
.bar__right { display: flex; align-items: center; gap: var(--space-4); }
.bar__meta { display: none; }
@container bar (min-width: 400px) { .bar__meta { display: inline-flex; } }

/* ── Hero display: inline-size container; type also reads the shell's height ── */
.hero { container: hero / inline-size; display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-2); padding: var(--space-3); min-height: 0; overflow: hidden; transition: background 60ms linear; }
.hero__top { display: flex; justify-content: space-between; gap: var(--space-3); }
.hero__marking, .hero__sig, .hero__beat { display: none; }
.hero__main { flex: 1; display: flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: 0; }
.hero__bpm { font-family: var(--font-sans); font-size: clamp(36px, min(30cqi, 24cqb), 280px); line-height: .9; letter-spacing: -.045em; font-variant-numeric: tabular-nums; font-weight: 800; }
.hero__num { display: flex; align-items: baseline; gap: var(--space-2); }
.hero__dots { display: flex; justify-content: center; flex-wrap: wrap; gap: clamp(4px, 2cqi, 12px); }
.dot { width: clamp(6px, 3.2cqi, 22px); aspect-ratio: 1; border-radius: var(--radius-full); background: var(--lcd-dim); }
.dot.is-acc { box-shadow: inset 0 0 0 2px var(--signal); }
.dot.is-mute { background: transparent; box-shadow: inset 0 0 0 1px var(--lcd-dim); }
.dot.is-lit { background: var(--lcd-ink); }
.dot.is-acc.is-lit { background: var(--signal); }
.hero.is-flash { background: var(--signal); }
.hero.is-flash .hero__bpm, .hero.is-flash .u-display__label, .hero.is-flash .u-display__unit { color: var(--on-signal); }
@container hero (min-width: 260px) { .hero { padding: var(--space-4); } .hero__sig { display: inline; } }
@container hero (min-width: 380px) { .hero__marking { display: inline; } }
@container hero (min-width: 520px) {
  .hero__beat { display: inline; }
  .hero__dots { gap: clamp(6px, 2.4cqi, 16px); }
}

/* ── Transport ── */
.transport { container: transport / inline-size; display: flex; gap: var(--space-2); min-width: 0; }
.transport .u-key { flex: 1 1 0; height: clamp(56px, 20cqi, 112px); }
.transport .k-play { flex-grow: 2; }
.transport .k-tap { display: none; }
.k-play .u-key__glyph svg { width: clamp(20px, 6cqi, 36px); height: clamp(20px, 6cqi, 36px); }
.k-play .is-stop { display: none; }
.k-play[aria-pressed="true"] .is-stop { display: block; }
.k-play[aria-pressed="true"] .is-play { display: none; }
.k-step .u-key__glyph { font-size: clamp(18px, 5cqi, 28px); line-height: 1; }
@container transport (max-width: 199px) { .transport .u-key__text { display: none; } .transport .u-key { align-items: center; justify-content: center; } }

/* ── Pattern (beat keys) ── */
.beats { border-top: 2px solid var(--rule); padding-top: var(--space-2); flex-direction: column; gap: var(--space-2); container: beats / inline-size; min-width: 0; }
.beats__head { display: flex; justify-content: space-between; gap: var(--space-3); }
.beats__hint { display: none; }
.beats__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(44px, 1fr)); gap: var(--space-2); }
.bk { height: clamp(44px, 11cqi, 76px); }
.bk.is-mute { background: transparent; color: var(--ink-muted); box-shadow: none; outline: 1px dashed var(--ink-muted); outline-offset: -1px; }
.bk__state { display: none; }
@container beats (min-width: 380px) { .bk__state { display: block; } }
@container beats (min-width: 560px) { .beats__hint { display: inline-flex; } }

/* ── Panels' own content ── */
.stepper { display: flex; align-items: center; gap: var(--space-2); }
.stepper__val { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 22px; line-height: 40px; height: 40px; background: var(--panel-sunk); font-variant-numeric: tabular-nums; }
.nudge { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); }
.nudge .u-key { height: 40px; align-items: center; justify-content: center; }
.row-split { display: flex; flex-direction: column; gap: var(--space-4); }
.sound-ctrls { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }
.switches { display: flex; flex-direction: column; gap: var(--space-2); }
@container (max-width: 300px) { .u-selector__opt .u-led { display: none; } }
@container (min-width: 440px) { .row-split { flex-direction: row; } .row-split > * { flex: 1; } }

.presets { display: flex; flex-direction: column; gap: var(--space-2); }
.preset { flex-direction: row; align-items: center; width: 100%; height: 44px; padding: 0 var(--space-3); }
.preset .u-value { color: inherit; }
.preset.is-current { background: var(--ink); color: var(--chassis); }
.mini { padding: var(--space-3); display: flex; justify-content: space-between; align-items: baseline; }
.mini__num { font-size: 28px; line-height: 28px; font-variant-numeric: tabular-nums; }

/* ── Tiers: each one sets which modules exist and where they go ─ */
/* T1 — room for a header */
@container shell (min-width: 300px) and (min-height: 360px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar" "hero" "transport"; }
  .bar { display: flex; }
}
@container shell (min-width: 300px) { .transport .k-tap { display: inline-flex; } }
/* T2 — tall enough for the pattern */
@container shell (min-width: 300px) and (min-height: 540px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar" "hero" "beats" "transport"; }
  .beats { display: flex; }
}
/* T3 — tall tablet / phone: add tempo + meter under everything */
@container shell (min-width: 520px) and (min-height: 760px) {
  .device { gap: var(--space-4); padding: var(--space-4); grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: auto minmax(0, 1fr) auto auto auto; grid-template-areas: "bar bar" "hero hero" "beats beats" "transport transport" "tempo meter"; }
  .p-tempo, .p-meter { display: flex; }
}
/* T4 — short landscape strip: display beside a 2×2 key block */
@container shell (min-width: 560px) and (max-height: 359px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(200px, 34cqi, 340px); grid-template-rows: minmax(0, 1fr); grid-template-areas: "hero transport"; }
}
/* T5 — landscape phone */
@container shell (min-width: 560px) and (min-height: 360px) and (max-height: 539px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(220px, 34cqi, 360px); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "hero transport" "beats transport"; }
  .beats { display: flex; }
}
@container shell (min-width: 560px) and (max-height: 539px) {
  .transport { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 2fr 1fr 1fr; grid-template-areas: "play play" "minus plus" "tap tap"; }
  .transport .u-key { height: auto; }
  .k-minus { grid-area: minus; } .k-play { grid-area: play; } .k-plus { grid-area: plus; } .k-tap { grid-area: tap; }
}
/* T6 — desktop / tablet landscape: two columns, every core module */
@container shell (min-width: 820px) and (min-height: 540px) {
  .device { gap: var(--space-4); padding: var(--space-6); grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto auto;
    grid-template-areas: "bar bar" "hero tempo" "hero meter" "beats sound" "transport sound"; }
  .beats, .p-tempo, .p-meter, .p-sound { display: flex; }
}
/* T6c — narrower and short: sound settings wait for more room */
@container shell (min-width: 820px) and (max-width: 979px) and (min-height: 540px) and (max-height: 759px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto auto auto;
    grid-template-areas: "bar bar" "hero tempo" "hero meter" "beats meter" "transport meter"; }
  .p-sound { display: none; }
}
/* T6s — wide but short (laptops): sound gets its own column so nothing scrolls */
@container shell (min-width: 980px) and (min-height: 540px) and (max-height: 759px) {
  .device { grid-template-columns: minmax(0, 1.4fr) minmax(260px, 1fr) minmax(260px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "bar bar bar" "hero tempo sound" "beats meter sound" "transport meter sound"; }
}
/* Short-ish multi-column layouts tighten panel spacing */
@container shell (min-width: 820px) and (max-height: 759px) {
  .device { padding: var(--space-4); }
  .u-panel__head { padding: var(--space-1) 0 var(--space-2); }
  .u-panel__body { padding: 0; gap: var(--space-3); }
}
/* T7 — big screens: a third column of presets and session stats */
@container shell (min-width: 1180px) and (min-height: 760px) {
  .device { padding: var(--space-8); grid-template-columns: minmax(220px, .7fr) minmax(0, 1.6fr) minmax(320px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto auto;
    grid-template-areas: "bar bar bar" "presets hero tempo" "presets hero meter" "stats beats sound" "stats transport sound"; }
  .beats, .p-tempo, .p-meter, .p-sound, .p-presets, .p-stats { display: flex; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.u-knob__dial.is-turning { outline: 1px dashed var(--ink-muted); outline-offset: 3px; }
</style>
</head>
<body>
<div class="shell">
<main class="device">

  <header class="bar">
    <span class="bar__title"><span class="bar__idx">01</span>Metronome</span>
    <div class="bar__right">
      <span class="u-label bar__meta" id="barMeta">4/4 · 1/4</span>
      <button class="u-switch" role="switch" aria-checked="false" id="themeSw" aria-label="Dark theme">
        <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
        <span class="u-label">Dark</span>
      </button>
    </div>
  </header>

  <section class="hero u-display" id="hero" aria-label="Tempo display">
    <div class="hero__top">
      <span class="u-display__label">Tempo</span>
      <span class="u-display__label hero__marking" id="marking">Allegro</span>
      <span class="u-display__label hero__beat" id="beatOut">Beat –/4</span>
      <span class="u-display__label hero__sig" id="sigOut">4/4</span>
    </div>
    <div class="hero__main">
      <span class="hero__num"><output class="hero__bpm" id="bpmOut" aria-live="off">120</output><span class="u-display__unit">BPM</span></span>
    </div>
    <div class="hero__dots" id="dots" aria-hidden="true"></div>
  </section>

  <section class="beats" aria-label="Beat pattern">
    <div class="beats__head">
      <span class="u-label"><b>01</b> Pattern</span>
      <span class="u-label beats__hint">Tap a beat: accent → beat → mute</span>
    </div>
    <div class="beats__grid" id="beatKeys"></div>
  </section>

  <section class="transport" aria-label="Transport">
    <button class="u-key k-minus k-step" id="minus" aria-label="Slower by 1 BPM"><span class="u-key__glyph" aria-hidden="true">−</span><span class="u-key__text">−1</span></button>
    <button class="u-key u-key--signal k-play" id="play" aria-pressed="false" aria-label="Play">
      <span class="u-key__top"><span class="u-key__index">Space</span></span>
      <span class="u-key__glyph" aria-hidden="true">
        <svg class="is-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
        <svg class="is-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/></svg>
      </span>
      <span class="u-key__text" id="playText">Play</span>
    </button>
    <button class="u-key k-plus k-step" id="plus" aria-label="Faster by 1 BPM"><span class="u-key__glyph" aria-hidden="true">+</span><span class="u-key__text">+1</span></button>
    <button class="u-key u-key--blue k-tap" id="tap" aria-label="Tap tempo"><span class="u-key__top"><span class="u-key__index">T</span></span><span class="u-key__text">Tap</span></button>
  </section>

  <section class="u-panel p-tempo" aria-label="Tempo">
    <header class="u-panel__head"><span class="u-label"><b>02</b> Tempo</span><span class="u-label" id="tempoMeta">20–300</span></header>
    <div class="u-panel__body">
      <label class="u-fader">
        <span class="u-fader__head"><span class="u-label">BPM</span><span class="u-value" id="faderVal">120</span></span>
        <input class="u-fader__input" id="fader" type="range" min="20" max="300" step="1" value="120">
      </label>
      <div class="nudge">
        <button class="u-key" data-op="half">÷2</button>
        <button class="u-key" data-op="-5">−5</button>
        <button class="u-key" data-op="+5">+5</button>
        <button class="u-key" data-op="double">×2</button>
      </div>
    </div>
  </section>

  <section class="u-panel p-meter" aria-label="Meter">
    <header class="u-panel__head"><span class="u-label"><b>03</b> Meter</span></header>
    <div class="u-panel__body row-split">
      <div class="u-selector">
        <span class="u-label">Beats / bar</span>
        <div class="stepper">
          <button class="u-key u-key--sm" id="beatsMinus" aria-label="Fewer beats">−</button>
          <output class="stepper__val" id="beatsOut">04</output>
          <button class="u-key u-key--sm" id="beatsPlus" aria-label="More beats">+</button>
        </div>
      </div>
      <div class="u-selector">
        <span class="u-label" id="subLbl">Subdivision</span>
        <div class="u-selector__row" role="radiogroup" aria-labelledby="subLbl" id="subSel">
          <button class="u-selector__opt" role="radio" data-v="1"><span class="u-led"></span>1/4</button>
          <button class="u-selector__opt" role="radio" data-v="2"><span class="u-led"></span>1/8</button>
          <button class="u-selector__opt" role="radio" data-v="3"><span class="u-led"></span>Trip</button>
          <button class="u-selector__opt" role="radio" data-v="4"><span class="u-led"></span>1/16</button>
        </div>
      </div>
    </div>
  </section>

  <section class="u-panel p-sound" aria-label="Sound">
    <header class="u-panel__head"><span class="u-label"><b>04</b> Sound</span></header>
    <div class="u-panel__body">
      <div class="u-selector">
        <span class="u-label" id="sndLbl">Voice</span>
        <div class="u-selector__row" role="radiogroup" aria-labelledby="sndLbl" id="sndSel">
          <button class="u-selector__opt" role="radio" data-v="click"><span class="u-led"></span>Click</button>
          <button class="u-selector__opt" role="radio" data-v="wood"><span class="u-led"></span>Wood</button>
          <button class="u-selector__opt" role="radio" data-v="beep"><span class="u-led"></span>Beep</button>
        </div>
      </div>
      <div class="sound-ctrls">
        <div class="u-knob" id="volKnob"></div>
        <div class="switches">
          <button class="u-switch" role="switch" aria-checked="true" id="flashSw">
            <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
            <span class="u-label">Flash on 1</span>
          </button>
          <button class="u-switch" role="switch" aria-checked="true" id="subsSw">
            <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
            <span class="u-label">Sound subdivs</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <section class="u-panel p-presets" aria-label="Tempo presets">
    <header class="u-panel__head"><span class="u-label"><b>05</b> Presets</span></header>
    <div class="u-panel__body"><div class="presets" id="presets"></div></div>
  </section>

  <section class="u-panel p-stats" aria-label="Session">
    <header class="u-panel__head"><span class="u-label"><b>06</b> Session</span></header>
    <div class="u-panel__body">
      <div class="u-display mini"><span class="u-display__label">Bar</span><span class="mini__num" id="barOut">0000</span></div>
      <div class="u-display mini"><span class="u-display__label">Time</span><span class="mini__num" id="timeOut">00:00</span></div>
      <button class="u-key" id="resetStats" style="height:44px;width:100%;flex-direction:row;align-items:center">Reset</button>
    </div>
  </section>

</main>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n, w) { n = String(Math.max(0, Math.floor(n))); while (n.length < w) n = '0' + n; return n; };
  var clamp = function (n, a, b) { return Math.min(b, Math.max(a, n)); };

  /* ── State (remembered per browser when storage works) ── */
  var KEY = 'unit01-metronome';
  var state = { bpm: 120, beats: 4, sub: 1, sound: 'click', vol: 80, flash: true, subs: true, theme: null,
    pattern: ['a','n','n','n','n','n','n','n','n','n','n','n','n','n','n','n'] };
  try { var saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved) Object.assign(state, saved); } catch (e) {}
  var save = function () { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  /* ── Theme ── */
  function applyTheme() {
    var dark = state.theme ? state.theme === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $('themeSw').setAttribute('aria-checked', String(dark));
  }
  $('themeSw').addEventListener('click', function () {
    state.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyTheme(); save();
  });

  /* ── Tempo ── */
  var MARKS = [[0,'Grave'],[40,'Largo'],[60,'Larghetto'],[66,'Adagio'],[76,'Andante'],[108,'Moderato'],[120,'Allegro'],[168,'Presto'],[200,'Prestissimo']];
  var PRESETS = [['Largo',50],['Adagio',70],['Andante',92],['Moderato',112],['Allegro',132],['Presto',180]];
  function marking(b) { var m = MARKS[0][1]; MARKS.forEach(function (x) { if (b >= x[0]) m = x[1]; }); return m; }

  function setBpm(v) {
    state.bpm = clamp(Math.round(v), 20, 300);
    $('bpmOut').textContent = pad(state.bpm, 3);
    $('faderVal').textContent = pad(state.bpm, 3);
    $('fader').value = state.bpm;
    $('fader').style.setProperty('--t', ((state.bpm - 20) / 280 * 100) + '%');
    var mk = marking(state.bpm);
    $('marking').textContent = mk;
    document.querySelectorAll('.preset').forEach(function (p) { p.classList.toggle('is-current', p.dataset.name === mk); });
    $('play').setAttribute('aria-label', (running ? 'Stop' : 'Play') + ', ' + state.bpm + ' BPM');
    save();
  }
  $('minus').addEventListener('click', function () { setBpm(state.bpm - 1); });
  $('plus').addEventListener('click', function () { setBpm(state.bpm + 1); });
  $('fader').addEventListener('input', function (e) { setBpm(+e.target.value); });
  document.querySelectorAll('.nudge .u-key').forEach(function (k) {
    k.addEventListener('click', function () {
      var op = k.dataset.op;
      setBpm(op === 'half' ? state.bpm / 2 : op === 'double' ? state.bpm * 2 : state.bpm + (+op));
    });
  });
  var presetsEl = $('presets');
  PRESETS.forEach(function (p) {
    var b = document.createElement('button');
    b.className = 'u-key preset'; b.dataset.name = p[0];
    b.innerHTML = '<span>' + p[0] + '</span><span class="u-value">' + pad(p[1], 3) + '</span>';
    b.addEventListener('click', function () { setBpm(p[1]); });
    presetsEl.appendChild(b);
  });

  /* Tap tempo: average of the last few intervals, reset after a 2 s pause */
  var taps = [];
  function tap() {
    var now = performance.now();
    if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
    taps.push(now); if (taps.length > 6) taps.shift();
    if (taps.length >= 2) { var d = (taps[taps.length - 1] - taps[0]) / (taps.length - 1); setBpm(60000 / d); }
    var k = $('tap'); k.classList.add('is-hit'); setTimeout(function () { k.classList.remove('is-hit'); }, 80);
  }
  $('tap').addEventListener('click', tap);

  /* ── Meter & pattern ── */
  function renderMeter() {
    $('beatsOut').textContent = pad(state.beats, 2);
    var subName = { 1: '1/4', 2: '1/8', 3: 'Trip', 4: '1/16' }[state.sub];
    $('sigOut').textContent = state.beats + '/4';
    $('barMeta').textContent = state.beats + '/4 · ' + subName;
    $('beatOut').textContent = 'Beat –/' + state.beats;
    var dots = $('dots'), keys = $('beatKeys');
    dots.innerHTML = ''; keys.innerHTML = '';
    for (var i = 0; i < state.beats; i++) {
      var p = state.pattern[i] || 'n';
      var d = document.createElement('span');
      d.className = 'dot' + (p === 'a' ? ' is-acc' : p === 'm' ? ' is-mute' : '');
      dots.appendChild(d);
      var k = document.createElement('button');
      k.className = 'u-key bk' + (p === 'a' ? ' u-key--signal' : p === 'm' ? ' is-mute' : '');
      k.setAttribute('aria-label', 'Beat ' + (i + 1) + ': ' + { a: 'accent', n: 'normal', m: 'muted' }[p]);
      k.innerHTML = '<span class="u-key__index">' + pad(i + 1, 2) + '</span><span class="bk__state">' + { a: 'Acc', n: 'Beat', m: 'Mute' }[p] + '</span>';
      (function (idx) { k.addEventListener('click', function () {
        var cur = state.pattern[idx] || 'n';
        state.pattern[idx] = { a: 'n', n: 'm', m: 'a' }[cur]; renderMeter(); save();
        var nk = $('beatKeys').children[idx]; if (nk) nk.focus();
      }); })(i);
      keys.appendChild(k);
    }
  }
  $('beatsMinus').addEventListener('click', function () { state.beats = clamp(state.beats - 1, 1, 16); renderMeter(); save(); });
  $('beatsPlus').addEventListener('click', function () { state.beats = clamp(state.beats + 1, 1, 16); renderMeter(); save(); });

  function selector(el, key, cast) {
    var opts = Array.prototype.slice.call(el.querySelectorAll('[role=radio]'));
    function sync() { opts.forEach(function (o) { var on = cast(o.dataset.v) === state[key]; o.classList.toggle('is-on', on); o.setAttribute('aria-checked', String(on)); o.tabIndex = on ? 0 : -1; }); }
    opts.forEach(function (o, i) {
      o.addEventListener('click', function () { state[key] = cast(o.dataset.v); sync(); renderMeter(); save(); });
      o.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
        if (!d) return; e.preventDefault(); var j = (i + d + opts.length) % opts.length; opts[j].click(); opts[j].focus();
      });
    });
    sync();
  }
  selector($('subSel'), 'sub', Number);
  selector($('sndSel'), 'sound', String);

  function bindSwitch(el, key) {
    var sync = function () { el.setAttribute('aria-checked', String(!!state[key])); };
    el.addEventListener('click', function () { state[key] = !state[key]; sync(); save(); });
    sync();
  }
  bindSwitch($('flashSw'), 'flash');
  bindSwitch($('subsSw'), 'subs');

  /* ── Volume knob (vanilla port of Unit.Knob) ── */
  (function knob(root) {
    function pt(a, r) { var t = a * Math.PI / 180; return [32 + r * Math.sin(t), 32 - r * Math.cos(t)]; }
    function arc(a0, a1, r) { var s = pt(a0, r), e = pt(a1, r); return 'M' + s[0].toFixed(2) + ' ' + s[1].toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + e[0].toFixed(2) + ' ' + e[1].toFixed(2); }
    var ticks = ''; for (var i = 0; i <= 10; i++) { var a = -135 + 27 * i, o = pt(a, 31), n = pt(a, 28.5); ticks += '<line class="u-knob__tick" x1="' + o[0] + '" y1="' + o[1] + '" x2="' + n[0] + '" y2="' + n[1] + '"/>'; }
    root.innerHTML = '<div class="u-knob__dial" tabindex="0" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100">' +
      '<svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">' + ticks + '<path class="u-knob__track" d="' + arc(-135, 135, 25) + '"/><path class="u-knob__arc"/><circle class="u-knob__cap" cx="32" cy="32" r="20"/><line class="u-knob__ind"/></svg></div>' +
      '<div class="u-knob__foot"><span class="u-label">Volume</span><span class="u-value"></span></div>';
    var dial = root.firstChild, arcEl = root.querySelector('.u-knob__arc'), ind = root.querySelector('.u-knob__ind'), val = root.querySelector('.u-value');
    function draw() {
      var v = state.vol, a = -135 + 270 * v / 100, i0 = pt(a, 6), i1 = pt(a, 17);
      arcEl.setAttribute('d', v > 0 ? arc(-135, a, 25) : '');
      ind.setAttribute('x1', i0[0]); ind.setAttribute('y1', i0[1]); ind.setAttribute('x2', i1[0]); ind.setAttribute('y2', i1[1]);
      val.textContent = pad(v, 3); dial.setAttribute('aria-valuenow', v);
      if (master) master.gain.value = Math.pow(v / 100, 2);
    }
    function set(v) { state.vol = clamp(Math.round(v), 0, 100); draw(); save(); }
    var drag = null;
    function knobDrag(dial, get, set, range, sens, ok, min, max) {
      /* Turn it like a dial (start on the ring), or slide up/right to raise, down/left to lower (start near the centre). Shift = fine. Wheel works too. */
      var st = null, lo = min == null ? -Infinity : min, hi = max == null ? Infinity : max;
      var cl = function (v) { return Math.min(hi, Math.max(lo, v)); };
      dial.style.touchAction = 'none';
      dial.addEventListener('pointerdown', function (e) {
        if (ok && !ok()) return; e.preventDefault(); dial.focus(); dial.setPointerCapture(e.pointerId);
        var r = dial.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, rad = Math.min(r.width, r.height) / 2;
        var dx = e.clientX - cx, dy = e.clientY - cy;
        st = { x: e.clientX, y: e.clientY, cx: cx, cy: cy, v: get(), tv: get(), mode: null, ang: Math.atan2(dx, -dy), ring: Math.sqrt(dx * dx + dy * dy) >= rad * 0.4 };
      });
      dial.addEventListener('pointermove', function (e) {
        if (!st) return;
        var mx = e.clientX - st.x, my = e.clientY - st.y;
        if (!st.mode) { if (Math.sqrt(mx * mx + my * my) < 4) return; st.mode = st.ring ? 'turn' : 'slide'; dial.classList.add('is-turning'); }
        if (st.mode === 'turn') {
          var dx = e.clientX - st.cx, dy = e.clientY - st.cy;
          if (Math.sqrt(dx * dx + dy * dy) < 6) return;
          var a = Math.atan2(dx, -dy), d = a - st.ang;
          if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
          st.ang = a; st.tv = cl(st.tv + d / (1.5 * Math.PI) * range * (e.shiftKey ? 0.25 : 1));
          set(st.tv, e.shiftKey);
        } else {
          set(cl(st.v + (mx - my) * range / (sens || 150) / (e.shiftKey ? 4 : 1)), e.shiftKey);
        }
      });
      var end = function () { st = null; dial.classList.remove('is-turning'); };
      dial.addEventListener('pointerup', end); dial.addEventListener('pointercancel', end);
      dial.addEventListener('wheel', function (e) {
        if (ok && !ok()) return; e.preventDefault();
        if (Math.abs(e.deltaY) < 1) return; dial.dispatchEvent(new KeyboardEvent('keydown', { key: e.deltaY < 0 ? 'ArrowUp' : 'ArrowDown', shiftKey: e.shiftKey, bubbles: true, cancelable: true }));
      }, { passive: false });
    }
    knobDrag(dial, function () { return state.vol; }, function (v) { set(v); }, 100, 150, null, 0, 100);
    dial.addEventListener('pointerup', function () { drag = null; });
    dial.addEventListener('keydown', function (e) {
      var s = e.shiftKey ? 1 : 5, d = { ArrowUp: s, ArrowRight: s, ArrowDown: -s, ArrowLeft: -s, PageUp: 20, PageDown: -20 }[e.key];
      if (e.key === 'Home') d = -state.vol; if (e.key === 'End') d = 100 - state.vol;
      if (d != null) { e.preventDefault(); set(state.vol + d); }
    });
    window.__drawVol = draw; draw();
  })($('volKnob'));

  /* ── Audio engine: Web Audio look-ahead scheduler, ticked by a worker so background tabs keep time ── */
  var ctx = null, master = null, running = false, nextTime = 0, step = 0, bar = 0, queue = [], startAt = 0, ticker = null;
  function startTicker() {
    try {
      var src = 'var t=null;onmessage=function(e){if(e.data==="start"){clearInterval(t);t=setInterval(function(){postMessage(0)},25)}else{clearInterval(t)}}';
      ticker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      ticker.onmessage = schedule; ticker.postMessage('start');
    } catch (e) { ticker = { iv: setInterval(schedule, 25), postMessage: function () { clearInterval(this.iv); } }; }
  }
  function voice(t, level) {
    var o = ctx.createOscillator(), g = ctx.createGain(), s = state.sound, f, dur, peak;
    if (s === 'click') { o.type = 'square'; f = [0, 1000, 1500, 2000][level]; dur = .025; peak = .3; o.frequency.setValueAtTime(f, t); }
    else if (s === 'wood') { o.type = 'sine'; f = [0, 600, 800, 1150][level]; dur = .07; peak = .9; o.frequency.setValueAtTime(f * 1.7, t); o.frequency.exponentialRampToValueAtTime(f, t + .015); }
    else { o.type = 'sine'; f = [0, 660, 880, 1320][level]; dur = .09; peak = .7; o.frequency.setValueAtTime(f, t); }
    peak *= [0, .35, .7, 1][level];
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .002); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
  }
  function schedule() {
    if (!running) return;
    while (nextTime < ctx.currentTime + .12) {
      if (step >= state.beats * state.sub) { step = 0; bar++; }
      var beat = Math.floor(step / state.sub), main = step % state.sub === 0, p = state.pattern[beat] || 'n';
      var level = p === 'm' ? 0 : main ? (p === 'a' ? 3 : 2) : (state.subs ? 1 : 0);
      if (level) voice(nextTime, level);
      queue.push({ t: nextTime, beat: beat, main: main, acc: p === 'a', bar: bar });
      nextTime += 60 / state.bpm / state.sub;
      step++;
    }
  }

  /* Visuals follow the audio clock */
  var lastBeat = -1, flashOff = 0;
  function frame() {
    if (!running) return;
    var now = ctx.currentTime;
    while (queue.length && queue[0].t <= now) {
      var ev = queue.shift();
      if (!ev.main) continue;
      var dots = $('dots').children, keys = $('beatKeys').children;
      for (var i = 0; i < dots.length; i++) { dots[i].classList.toggle('is-lit', i === ev.beat); if (keys[i]) keys[i].classList.toggle('is-hit', i === ev.beat); }
      $('beatOut').textContent = 'Beat ' + (ev.beat + 1) + '/' + state.beats;
      $('barOut').textContent = pad(ev.bar + 1, 4);
      if (ev.beat === 0 && state.flash) { $('hero').classList.add('is-flash'); flashOff = performance.now() + 90; }
      lastBeat = ev.beat;
    }
    if (flashOff && performance.now() > flashOff) { $('hero').classList.remove('is-flash'); flashOff = 0; }
    var secs = Math.max(0, now - startAt);
    $('timeOut').textContent = pad(secs / 60, 2) + ':' + pad(secs % 60, 2);
    requestAnimationFrame(frame);
  }

  function start() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { $('playText').textContent = 'No audio'; return; }
      ctx = new AC(); master = ctx.createGain(); master.connect(ctx.destination); window.__drawVol();
    }
    var go = function () {
      running = true; step = 0; queue = []; nextTime = ctx.currentTime + .06;
      if (!startAt || !sessionLive) { startAt = ctx.currentTime; bar = 0; sessionLive = true; }
      startTicker(); schedule(); requestAnimationFrame(frame); syncPlay();
    };
    ctx.resume().then(go, go);
  }
  var sessionLive = false;
  function stop() {
    running = false; if (ticker) ticker.postMessage('stop');
    queue = []; $('hero').classList.remove('is-flash');
    Array.prototype.forEach.call($('dots').children, function (d) { d.classList.remove('is-lit'); });
    Array.prototype.forEach.call($('beatKeys').children, function (k) { k.classList.remove('is-hit'); });
    $('beatOut').textContent = 'Beat –/' + state.beats; syncPlay();
  }
  function syncPlay() {
    $('play').setAttribute('aria-pressed', String(running));
    $('playText').textContent = running ? 'Stop' : 'Play';
    $('play').setAttribute('aria-label', (running ? 'Stop' : 'Play') + ', ' + state.bpm + ' BPM');
  }
  function toggle() { running ? stop() : start(); }
  $('play').addEventListener('click', toggle);
  $('resetStats').addEventListener('click', function () {
    sessionLive = false; bar = 0; $('barOut').textContent = '0000'; $('timeOut').textContent = '00:00';
    if (running && ctx) { startAt = ctx.currentTime; sessionLive = true; }
  });

  /* ── Keyboard: Space play/stop · ↑↓ tempo (Shift ×10) · T tap ── */
  document.addEventListener('keydown', function (e) {
    var t = e.target, inCtl = t.closest && t.closest('button, input, [role="slider"]');
    if (e.key === ' ' && !inCtl) { e.preventDefault(); toggle(); }
    else if ((e.key === 't' || e.key === 'T') && !(t.tagName === 'INPUT' && t.type !== 'range')) { tap(); }
    else if (!inCtl && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); setBpm(state.bpm + (e.key === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 10 : 1)); }
  });

  applyTheme(); renderMeter(); setBpm(state.bpm);
})();
</script>
</body>
</html>
