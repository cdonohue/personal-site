<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 01 — Ear Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* ── Unit 01 tokens ─────────────────────────────────────────── */
:root, [data-theme="light"] {
  --chassis:#ffffff; --panel:#ffffff; --panel-sunk:#f0f0ee; --ink:#000000; --ink-muted:#5f5f5c; --line:#c8c8c4; --rule:var(--ink);
  --signal:#ff5a1f; --signal-text:#a83400; --on-signal:#000000; --blue:#3a63d8; --on-blue:#ffffff; --yellow:#f5c400; --on-yellow:#111111;
  --key:#e6e6e3; --lcd:#0b0b0b; --lcd-ink:#f2f2ef; --lcd-muted:#8f8f8a; --lcd-dim:#2a2a2a; --focus:var(--ink);
  --shadow-key:0 2px 0 #00000040; --shadow-key-pressed:0 0 0 #00000040;
}
[data-theme="dark"] {
  --chassis:#000000; --panel:#000000; --panel-sunk:#161616; --ink:#ffffff; --ink-muted:#9b9b97; --line:#3a3a3a; --key:#262626; --rule:var(--ink);
  --signal-text:#ff7a45; --shadow-key:0 2px 0 #ffffff26; --shadow-key-pressed:0 0 0 #ffffff26;
}
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-0:0; --radius-sm:2px; --radius-md:6px; --radius-full:9999px;
  --font-sans:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* ── Unit 01 components (vanilla port of the bundle) ────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); background: var(--chassis); color: var(--ink); -webkit-font-smoothing: antialiased; }
:where(button, input, [role="slider"]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.u-label { display: inline-flex; gap: var(--space-2); align-items: baseline; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.u-label b { font-weight: 700; color: var(--ink); }
.u-value { font-family: var(--font-mono); font-size: 13px; line-height: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
.u-led { display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--line); flex: none; }
.u-key .u-led, .u-selector__opt .u-led { background: var(--line); }
.is-on > .u-led, .u-led.is-lit { background: var(--signal); }

.u-key { appearance: none; position: relative; display: inline-flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  min-width: 0; padding: var(--space-2); border: 0; border-radius: var(--radius-0); background: var(--key); color: var(--ink);
  font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: left;
  box-shadow: var(--shadow-key); cursor: pointer; transition: transform 60ms linear, box-shadow 60ms linear; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.u-key:active, .u-key.is-hit, .u-key[aria-pressed="true"] { transform: translateY(2px); box-shadow: var(--shadow-key-pressed); }
.u-key--ink { background: var(--ink); color: var(--chassis); }
.u-key--signal { background: var(--signal); color: var(--on-signal); }
.u-key--blue { background: var(--blue); color: var(--on-blue); }
.u-key--yellow { background: var(--yellow); color: var(--on-yellow); }
.u-key__top { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: var(--space-1); }
.u-key__index { font-family: var(--font-mono); font-weight: 500; font-size: 9px; line-height: 12px; letter-spacing: .1em; opacity: .75; }
.u-key__glyph { align-self: center; display: flex; }
.u-key__glyph svg { width: 22px; height: 22px; fill: currentColor; }
.u-key--sm { width: 40px; height: 40px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; }

.u-panel { background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: var(--radius-0); min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
.u-panel__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-3); }
.u-panel__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel__body { padding: 0 0 var(--space-2); display: flex; flex-direction: column; gap: var(--space-4); flex: 1; }

.u-display { background: var(--lcd); color: var(--lcd-ink); border: 1px solid var(--line); border-radius: var(--radius-0); font-family: var(--font-mono); }
.u-display__label { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--lcd-muted); white-space: nowrap; }
.u-display__unit { font-size: 13px; line-height: 16px; color: var(--lcd-muted); text-transform: uppercase; letter-spacing: .08em; }

.u-selector { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-selector__row { display: flex; gap: 2px; border-radius: var(--radius-0); }
.u-selector__opt { appearance: none; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-2);
  background: var(--key); color: var(--ink); border: 0; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.u-selector__opt:first-child { border-left: 0; }
.u-selector__opt.is-on { background: var(--ink); color: var(--chassis); }
.u-selector__opt:focus-visible { outline-offset: -4px; }

.u-switch { appearance: none; display: inline-flex; align-items: center; gap: var(--space-3); padding: var(--space-1) 0; background: none; border: 0; color: var(--ink); cursor: pointer; }
.u-switch__track { position: relative; width: 40px; height: 20px; background: var(--panel-sunk); border: 1px solid var(--ink); border-radius: var(--radius-sm); flex: none; }
.u-switch__thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 14px; background: var(--ink); border-radius: var(--radius-sm); transition: left 80ms linear; }
.u-switch[aria-checked="true"] .u-switch__track { background: var(--signal); }
.u-switch[aria-checked="true"] .u-switch__thumb { left: 20px; background: var(--on-signal); }
.u-switch__state { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; min-width: 3ch; }

.u-fader { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-fader__head { display: flex; justify-content: space-between; align-items: baseline; }
.u-fader__input { appearance: none; -webkit-appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: ew-resize; }
.u-fader__input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-moz-range-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 28px; margin-top: -13px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }
.u-fader__input::-moz-range-thumb { width: 14px; height: 28px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }

.u-knob { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.u-knob__dial { border-radius: var(--radius-full); cursor: grab; touch-action: none; line-height: 0; }
.u-knob__tick { stroke: var(--line); stroke-width: 1.5; }
.u-knob__track { fill: none; stroke: var(--panel-sunk); stroke-width: 3; }
.u-knob__arc { fill: none; stroke: var(--signal); stroke-width: 3; }
.u-knob__cap { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.u-knob__ind { stroke: var(--ink); stroke-width: 3; stroke-linecap: square; }
.u-knob__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; }


/* ── Shared app shell (Unit 01 apps) ── */
.shell { height: 100dvh; overflow: auto; container: shell / size; }
.device { min-height: 100%; display: grid; gap: var(--space-2); padding: var(--space-2); grid-template-columns: minmax(0, 1fr); }
.bar { align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-1) var(--space-1) 0; container: bar / inline-size; min-width: 0; }
.bar__title { display: inline-flex; align-items: flex-start; gap: var(--space-2); font: 800 clamp(18px, 4.2cqi, 34px)/1 var(--font-sans); letter-spacing: -.025em; }
.bar__idx { font: 500 9px/12px var(--font-mono); letter-spacing: .1em; color: var(--ink-muted); }
.bar__right { display: flex; align-items: center; gap: var(--space-4); }
.bar__meta { display: none; }
@container bar (min-width: 400px) { .bar__meta { display: inline-flex; } }

.hero { container: hero / inline-size; display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-2); padding: var(--space-3); min-height: 0; overflow: hidden; transition: background 60ms linear; }
.hero__top, .hero__bottom { display: flex; justify-content: space-between; gap: var(--space-3); min-width: 0; }
.hero__main { flex: 1; display: flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: 0; }
.hero__big { font-family: var(--font-sans); font-weight: 800; line-height: .9; letter-spacing: -.045em; font-variant-numeric: tabular-nums; font-size: clamp(36px, min(30cqi, 24cqb), 280px); }
.hide-xs { display: none; }
.show-m { display: none; }
@container hero (min-width: 260px) { .hero { padding: var(--space-4); } .hide-xs { display: inline; } }
@container hero (min-width: 380px) { .show-m { display: inline; } }

.transport { container: transport / inline-size; display: flex; gap: var(--space-2); min-width: 0; }
.transport .u-key { flex: 1 1 0; height: clamp(56px, 20cqi, 112px); }
.transport .k-main { flex-grow: 2; }
.transport .k-extra { display: none; }
.k-main .u-key__glyph svg { width: clamp(20px, 6cqi, 36px); height: clamp(20px, 6cqi, 36px); }
.k-main .is-stop { display: none; }
.k-main[aria-pressed="true"] .is-stop { display: block; }
.k-main[aria-pressed="true"] .is-play { display: none; }
.k-step .u-key__glyph { font-size: clamp(18px, 5cqi, 28px); line-height: 1; }
@container transport (max-width: 199px) { .transport .u-key__text { display: none; } .transport .u-key { align-items: center; justify-content: center; } }
@container shell (min-width: 300px) { .transport .k-extra { display: inline-flex; } }

.section { border-top: 2px solid var(--rule); padding-top: var(--space-2); flex-direction: column; gap: var(--space-2); min-width: 0; }
.section__head { display: flex; justify-content: space-between; gap: var(--space-3); }
.stepper { display: flex; align-items: center; gap: var(--space-2); }
.stepper__val { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 22px; line-height: 40px; height: 40px; background: var(--panel-sunk); font-variant-numeric: tabular-nums; }
.row-split { display: flex; flex-direction: column; gap: var(--space-4); }
.knobs { display: flex; flex-wrap: wrap; gap: var(--space-4); justify-content: space-between; }
.mini { padding: var(--space-3); display: flex; justify-content: space-between; align-items: baseline; }
.mini__num { font-size: 28px; line-height: 28px; font-variant-numeric: tabular-nums; }
.k-flat { height: 44px; width: 100%; flex-direction: row; align-items: center; padding: 0 var(--space-3); }
.keyrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: var(--space-2); }
.keyrow .u-key { height: 44px; align-items: center; justify-content: center; }
.keyrow .u-key.is-on { background: var(--ink); color: var(--chassis); }
@container (min-width: 440px) { .row-split { flex-direction: row; } .row-split > * { flex: 1; } }
@container (max-width: 300px) { .u-selector__opt .u-led { display: none; } }
@container shell (min-width: 820px) and (max-height: 759px) {
  .device { padding: var(--space-4); }
  .u-panel__head { padding: var(--space-1) 0 var(--space-2); }
  .u-panel__body { padding: 0; gap: var(--space-3); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }


.device { grid-template-rows: minmax(0, 1fr) auto auto; grid-template-areas: "hero" "answers" "transport"; }
.bar { grid-area: bar; } .hero { grid-area: hero; } .transport { grid-area: transport; } .answers { grid-area: answers; }
.p-mode { grid-area: mode; } .p-level { grid-area: level; } .p-stats { grid-area: stats; }
.bar, .p-mode, .p-level, .p-stats { display: none; }

/* ── Hero ── */
.verdict { text-align: center; }
.hero.is-right .hero__big { color: var(--signal); }
.hero.is-wrong .hero__big { color: var(--lcd-muted); }
.score { font-variant-numeric: tabular-nums; }
.answer-name { text-align: center; color: var(--lcd-muted); min-height: 14px; }

/* ── Answers ── */
.answers { display: flex; flex-direction: column; justify-content: center; container: answers / inline-size; min-width: 0; }
.answers__head { display: none; }
.answers__grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(38px, 1fr)); gap: var(--space-2); }
.ak { height: clamp(36px, 10cqi, 64px); align-items: center; justify-content: center; }
.ak .u-key__index { display: none; }
.ak.is-right { background: var(--signal); color: var(--on-signal); }
.ak.is-wrong { background: transparent; color: var(--ink-muted); box-shadow: none; outline: 1px dashed var(--ink-muted); outline-offset: -1px; }
.ak:disabled { cursor: default; }
@container answers (min-width: 420px) { .ak { align-items: flex-start; justify-content: space-between; } .ak .u-key__index { display: block; } .answers__grid { grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); } }

/* ── Stats ── */
.stats { display: flex; flex-direction: column; gap: var(--space-2); }
.srow { display: grid; grid-template-columns: 52px 1fr 44px; align-items: center; gap: var(--space-2); padding: 6px var(--space-3); }
.srow__bar { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
.sseg { height: 8px; background: var(--lcd-dim); }
.sseg.is-lit { background: var(--lcd-ink); }
.srow__n { font-family: var(--font-sans); font-weight: 800; font-size: 15px; color: var(--lcd-ink); }
.srow__pct { text-align: right; }

/* ── Tiers ── */
@container shell (max-height: 259px) { .hero__top, .answer-name { display: none; } .hero { padding: var(--space-2) var(--space-3); } .transport .u-key { height: 44px; } }
@container shell (min-width: 300px) and (min-height: 360px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar" "hero" "answers" "transport"; }
  .bar { display: flex; }
}
@container shell (min-width: 300px) and (min-height: 540px) {
  .answers { flex-direction: column; gap: var(--space-2); border-top: 2px solid var(--rule); padding-top: var(--space-2); }
  .answers__head { display: flex; justify-content: space-between; gap: var(--space-3); }
}
@container shell (min-width: 520px) and (min-height: 760px) {
  .device { gap: var(--space-4); padding: var(--space-4); grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: auto minmax(0, 1fr) auto auto auto; grid-template-areas: "bar bar" "hero hero" "answers answers" "transport transport" "mode level"; }
  .p-mode, .p-level { display: flex; }
}
@container shell (min-width: 560px) and (max-height: 359px) {
  .device { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "hero answers" "hero transport"; }
}
@container shell (min-width: 560px) and (min-height: 360px) and (max-height: 539px) {
  .device { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "hero answers" "hero transport"; }
}
@container shell (min-width: 820px) and (min-height: 540px) {
  .device { gap: var(--space-4); padding: var(--space-6); grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto auto;
    grid-template-areas: "bar bar" "hero mode" "hero level" "answers level" "transport level"; }
  .p-mode, .p-level { display: flex; }
}
@container shell (min-width: 820px) and (max-height: 759px) { .transport .u-key { height: clamp(56px, 13cqi, 88px); } }
@container shell (min-width: 1180px) and (min-height: 760px) {
  .device { padding: var(--space-8); grid-template-columns: minmax(280px, .8fr) minmax(0, 1.6fr) minmax(320px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto auto;
    grid-template-areas: "bar bar bar" "stats hero mode" "stats hero level" "stats answers level" "stats transport level"; }
  .p-mode, .p-level, .p-stats { display: flex; }
}
.u-knob__dial.is-turning { outline: 1px dashed var(--ink-muted); outline-offset: 3px; }
</style>
</head>
<body>
<div class="shell">
<main class="device">

  <header class="bar">
    <span class="bar__title"><span class="bar__idx">05</span>Ear Trainer</span>
    <div class="bar__right">
      <span class="u-label bar__meta" id="barMeta">Intervals · Easy</span>
      <button class="u-switch" role="switch" aria-checked="false" id="themeSw" aria-label="Dark theme">
        <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
        <span class="u-label">Dark</span>
      </button>
    </div>
  </header>

  <section class="hero u-display" id="hero" aria-label="Question display">
    <div class="hero__top">
      <span class="u-display__label" id="qOut">Q 000</span>
      <span class="u-display__label show-m" id="modeOut">Intervals</span>
      <span class="u-display__label hide-xs" id="streakOut">Streak 00</span>
    </div>
    <div class="hero__main"><output class="hero__big" id="big" aria-live="polite">?</output></div>
    <div class="u-display__label answer-name" id="nameOut">Press Play to hear a question</div>
    <div class="hero__bottom">
      <span class="u-display__label score" id="scoreOut">00/00</span>
      <span class="u-display__label hide-xs score" id="pctOut">–%</span>
    </div>
  </section>

  <section class="answers" aria-label="Answers">
    <div class="answers__head"><span class="u-label"><b>01</b> Answer</span><span class="u-label" id="hintOut">Keys 1–9</span></div>
    <div class="answers__grid" id="answers"></div>
  </section>

  <section class="transport" aria-label="Controls">
    <button class="u-key u-key--blue" id="replay" aria-label="Replay question"><span class="u-key__top"><span class="u-key__index">R</span></span><span class="u-key__text">Replay</span></button>
    <button class="u-key u-key--signal k-main" id="next" aria-label="Play question">
      <span class="u-key__top"><span class="u-key__index">Space</span></span>
      <span class="u-key__glyph" aria-hidden="true"><svg class="is-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></span>
      <span class="u-key__text" id="nextText">Play</span>
    </button>
  </section>

  <section class="u-panel p-mode" aria-label="Mode">
    <header class="u-panel__head"><span class="u-label"><b>02</b> Mode</span></header>
    <div class="u-panel__body">
      <div class="u-selector"><span class="u-label" id="mLbl">Train</span><div class="u-selector__row" role="radiogroup" aria-labelledby="mLbl" id="modeSel"></div></div>
      <div class="u-selector"><span class="u-label" id="pLbl">Play as</span><div class="u-selector__row" role="radiogroup" aria-labelledby="pLbl" id="playSel"></div></div>
    </div>
  </section>

  <section class="u-panel p-level" aria-label="Difficulty">
    <header class="u-panel__head"><span class="u-label"><b>03</b> Level</span></header>
    <div class="u-panel__body">
      <div class="u-selector"><span class="u-label" id="lLbl">Answer set</span><div class="u-selector__row" role="radiogroup" aria-labelledby="lLbl" id="levelSel"></div></div>
      <div class="u-display mini"><span class="u-display__label">Best streak</span><span class="mini__num" id="bestOut">00</span></div>
      <button class="u-key k-flat" id="reset">Reset score</button>
    </div>
  </section>

  <section class="u-panel p-stats" aria-label="Session stats">
    <header class="u-panel__head"><span class="u-label"><b>04</b> Accuracy</span><span class="u-label">Per answer</span></header>
    <div class="u-panel__body"><div class="stats" id="stats"></div></div>
  </section>

</main>
</div>

<script>
(function () {
  'use strict';
  /* ── Shared helpers (Unit 01 apps) ── */
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n, w) { n = String(Math.max(0, Math.floor(n))); while (n.length < w) n = '0' + n; return n; };
  var clamp = function (n, a, b) { return Math.min(b, Math.max(a, n)); };
  var NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
  function noteName(m) { var n = NAMES[((m % 12) + 12) % 12]; return { base: n[0], acc: n.length > 1 ? '♯' : '', oct: Math.floor(m / 12) - 1, pc: n, full: n + (Math.floor(m / 12) - 1) }; }
  function makeStore(key, defaults) {
    var s = JSON.parse(JSON.stringify(defaults));
    try { var saved = JSON.parse(localStorage.getItem(key) || 'null'); if (saved) Object.assign(s, saved); } catch (e) {}
    return { state: s, save: function () { try { localStorage.setItem(key, JSON.stringify(s)); } catch (e) {} } };
  }
  function initTheme(state, save) {
    function apply() {
      var dark = state.theme ? state.theme === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      $('themeSw').setAttribute('aria-checked', String(dark));
    }
    $('themeSw').addEventListener('click', function () { state.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; apply(); save(); });
    apply();
  }
  /* Selector: el holds [role=radio][data-v]; get() returns current; pick(v) sets */
  function selector(el, get, pick) {
    var opts = Array.prototype.slice.call(el.querySelectorAll('[role=radio]'));
    function sync() { var cur = String(get()); opts.forEach(function (o) { var on = o.dataset.v === cur; o.classList.toggle('is-on', on); o.setAttribute('aria-checked', String(on)); o.tabIndex = on ? 0 : -1; }); }
    opts.forEach(function (o, i) {
      o.addEventListener('click', function () { pick(o.dataset.v); sync(); });
      o.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
        if (!d) return; e.preventDefault(); var j = (i + d + opts.length) % opts.length; opts[j].click(); opts[j].focus();
      });
    });
    sync(); return sync;
  }
  function radioRow(el, opts) { el.innerHTML = opts.map(function (o) { return '<button class="u-selector__opt" role="radio" data-v="' + o[0] + '"><span class="u-led"></span>' + o[1] + '</button>'; }).join(''); }
  function bindSwitch(el, get, set) {
    var sync = function () { el.setAttribute('aria-checked', String(!!get())); };
    el.addEventListener('click', function () { set(!get()); sync(); }); sync(); return sync;
  }
  function makeKnob(root, o) {
    var min = o.min == null ? 0 : o.min, max = o.max == null ? 100 : o.max, step = o.step || 1;
    function pt(a, r) { var t = a * Math.PI / 180; return [32 + r * Math.sin(t), 32 - r * Math.cos(t)]; }
    function arc(a0, a1, r) { var s = pt(a0, r), e = pt(a1, r); return 'M' + s[0].toFixed(2) + ' ' + s[1].toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + e[0].toFixed(2) + ' ' + e[1].toFixed(2); }
    var ticks = ''; for (var i = 0; i <= 10; i++) { var a = -135 + 27 * i, p1 = pt(a, 31), p2 = pt(a, 28.5); ticks += '<line class="u-knob__tick" x1="' + p1[0] + '" y1="' + p1[1] + '" x2="' + p2[0] + '" y2="' + p2[1] + '"/>'; }
    var size = o.size || 64;
    root.className = 'u-knob';
    root.innerHTML = '<div class="u-knob__dial" tabindex="0" role="slider" aria-label="' + o.label + '" aria-valuemin="' + min + '" aria-valuemax="' + max + '">' +
      '<svg viewBox="0 0 64 64" width="' + size + '" height="' + size + '" aria-hidden="true">' + ticks + '<path class="u-knob__track" d="' + arc(-135, 135, 25) + '"/><path class="u-knob__arc"/><circle class="u-knob__cap" cx="32" cy="32" r="20"/><line class="u-knob__ind"/></svg></div>' +
      '<div class="u-knob__foot"><span class="u-label">' + o.label + '</span><span class="u-value"></span></div>';
    var dial = root.firstChild, arcEl = root.querySelector('.u-knob__arc'), ind = root.querySelector('.u-knob__ind'), val = root.querySelector('.u-value');
    function draw() {
      var v = o.get(), t = (v - min) / (max - min), a = -135 + 270 * t, i0 = pt(a, 6), i1 = pt(a, 17);
      arcEl.setAttribute('d', t > .001 ? arc(-135, a, 25) : '');
      ind.setAttribute('x1', i0[0]); ind.setAttribute('y1', i0[1]); ind.setAttribute('x2', i1[0]); ind.setAttribute('y2', i1[1]);
      val.textContent = o.format ? o.format(v) : pad(v, 3); dial.setAttribute('aria-valuenow', v);
    }
    function set(v) { o.set(clamp(Math.round(v / step) * step, min, max)); draw(); }
    var drag = null;
    function knobDrag(dial, get, set, range, sens, ok, min, max) {
      /* Turn it like a dial (start on the ring), or slide up/right to raise, down/left to lower (start near the centre). Shift = fine. Wheel works too. */
      var st = null, lo = min == null ? -Infinity : min, hi = max == null ? Infinity : max;
      var cl = function (v) { return Math.min(hi, Math.max(lo, v)); };
      dial.style.touchAction = 'none';
      dial.addEventListener('pointerdown', function (e) {
        if (ok && !ok()) return; e.preventDefault(); dial.focus(); dial.setPointerCapture(e.pointerId);
        var r = dial.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, rad = Math.min(r.width, r.height) / 2;
        var dx = e.clientX - cx, dy = e.clientY - cy;
        st = { x: e.clientX, y: e.clientY, cx: cx, cy: cy, v: get(), tv: get(), mode: null, ang: Math.atan2(dx, -dy), ring: Math.sqrt(dx * dx + dy * dy) >= rad * 0.4 };
      });
      dial.addEventListener('pointermove', function (e) {
        if (!st) return;
        var mx = e.clientX - st.x, my = e.clientY - st.y;
        if (!st.mode) { if (Math.sqrt(mx * mx + my * my) < 4) return; st.mode = st.ring ? 'turn' : 'slide'; dial.classList.add('is-turning'); }
        if (st.mode === 'turn') {
          var dx = e.clientX - st.cx, dy = e.clientY - st.cy;
          if (Math.sqrt(dx * dx + dy * dy) < 6) return;
          var a = Math.atan2(dx, -dy), d = a - st.ang;
          if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
          st.ang = a; st.tv = cl(st.tv + d / (1.5 * Math.PI) * range * (e.shiftKey ? 0.25 : 1));
          set(st.tv, e.shiftKey);
        } else {
          set(cl(st.v + (mx - my) * range / (sens || 150) / (e.shiftKey ? 4 : 1)), e.shiftKey);
        }
      });
      var end = function () { st = null; dial.classList.remove('is-turning'); };
      dial.addEventListener('pointerup', end); dial.addEventListener('pointercancel', end);
      dial.addEventListener('wheel', function (e) {
        if (ok && !ok()) return; e.preventDefault();
        if (Math.abs(e.deltaY) < 1) return; dial.dispatchEvent(new KeyboardEvent('keydown', { key: e.deltaY < 0 ? 'ArrowUp' : 'ArrowDown', shiftKey: e.shiftKey, bubbles: true, cancelable: true }));
      }, { passive: false });
    }
    knobDrag(dial, function () { return o.get(); }, function (v) { set(v); }, max - min, 150, null, min, max);
    dial.addEventListener('pointerup', function () { drag = null; });
    dial.addEventListener('keydown', function (e) {
      var s = e.shiftKey ? step : Math.max(step, (max - min) / 20), d = { ArrowUp: s, ArrowRight: s, ArrowDown: -s, ArrowLeft: -s, PageUp: s * 4, PageDown: -s * 4 }[e.key];
      if (e.key === 'Home') d = min - o.get(); if (e.key === 'End') d = max - o.get();
      if (d != null) { e.preventDefault(); set(o.get() + d); }
    });

  }
  var AUDIO = { ctx: null, master: null };
  function audio() {
    if (!AUDIO.ctx) {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      AUDIO.ctx = new AC(); AUDIO.master = AUDIO.ctx.createGain(); AUDIO.master.connect(AUDIO.ctx.destination);
    }
    if (AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume();
    return AUDIO.ctx;
  }
  function startTicker(fn) {
    try {
      var src = 'var t=null;onmessage=function(e){if(e.data==="start"){clearInterval(t);t=setInterval(function(){postMessage(0)},25)}else{clearInterval(t)}}';
      var w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      w.onmessage = fn; w.postMessage('start');
      return { stop: function () { w.postMessage('stop'); w.terminate(); } };
    } catch (e) { var iv = setInterval(fn, 25); return { stop: function () { clearInterval(iv); } }; }
  }
  function flash(el, cls, ms) { el.classList.add(cls || 'is-hit'); setTimeout(function () { el.classList.remove(cls || 'is-hit'); }, ms || 90); }
  function inControl(e) { return e.target.closest && e.target.closest('button, input, select, textarea, [role="slider"]'); }


  var IV = { m2: 1, M2: 2, m3: 3, M3: 4, P4: 5, TT: 6, P5: 7, m6: 8, M6: 9, m7: 10, M7: 11, P8: 12 };
  var IV_NAMES = { m2: 'Minor 2nd', M2: 'Major 2nd', m3: 'Minor 3rd', M3: 'Major 3rd', P4: 'Perfect 4th', TT: 'Tritone', P5: 'Perfect 5th', m6: 'Minor 6th', M6: 'Major 6th', m7: 'Minor 7th', M7: 'Major 7th', P8: 'Octave' };
  var CH = { Maj: [0, 4, 7], Min: [0, 3, 7], Dim: [0, 3, 6], Aug: [0, 4, 8], Dom7: [0, 4, 7, 10], Maj7: [0, 4, 7, 11], Min7: [0, 3, 7, 10] };
  var CH_NAMES = { Maj: 'Major triad', Min: 'Minor triad', Dim: 'Diminished', Aug: 'Augmented', Dom7: 'Dominant 7th', Maj7: 'Major 7th', Min7: 'Minor 7th' };
  var SETS = {
    intervals: { easy: ['M3', 'P4', 'P5', 'P8'], medium: ['m3', 'M3', 'P4', 'P5', 'M6', 'P8'], hard: Object.keys(IV) },
    chords: { easy: ['Maj', 'Min'], medium: ['Maj', 'Min', 'Dim', 'Aug'], hard: Object.keys(CH) }
  };
  var store = makeStore('unit01-ear-trainer', { mode: 'intervals', play: 'up', level: 'easy', correct: 0, total: 0, streak: 0, best: 0, stats: {}, theme: null });
  var state = store.state, save = store.save;
  initTheme(state, save);

  var q = null; /* { key, root, answered } */
  var currentSet = function () { return SETS[state.mode][state.level]; };

  radioRow($('modeSel'), [['intervals', 'Intervals'], ['chords', 'Chords']]);
  radioRow($('playSel'), [['up', 'Up'], ['down', 'Down'], ['together', 'Together']]);
  radioRow($('levelSel'), [['easy', 'Easy'], ['medium', 'Medium'], ['hard', 'Hard']]);
  selector($('modeSel'), function () { return state.mode; }, function (v) { state.mode = v; q = null; renderAll(); save(); });
  selector($('playSel'), function () { return state.play; }, function (v) { state.play = v; save(); });
  selector($('levelSel'), function () { return state.level; }, function (v) { state.level = v; q = null; renderAll(); save(); });

  function renderAnswers() {
    var g = $('answers'); g.innerHTML = '';
    currentSet().forEach(function (k, i) {
      var b = document.createElement('button'); b.className = 'u-key ak'; b.dataset.k = k;
      b.setAttribute('aria-label', (state.mode === 'intervals' ? IV_NAMES[k] : CH_NAMES[k]) + (i < 9 ? ', key ' + (i + 1) : ''));
      b.innerHTML = '<span class="u-key__index">' + pad(i + 1, 2) + '</span><span class="u-key__text">' + k + '</span>';
      b.addEventListener('click', function () { answer(k); });
      g.appendChild(b);
    });
  }
  function renderScore() {
    $('qOut').textContent = 'Q ' + pad(state.total + (q && !q.answered ? 1 : 0), 3);
    $('scoreOut').textContent = pad(state.correct, 2) + '/' + pad(state.total, 2);
    $('pctOut').textContent = state.total ? Math.round(100 * state.correct / state.total) + '%' : '–%';
    $('streakOut').textContent = 'Streak ' + pad(state.streak, 2);
    $('bestOut').textContent = pad(state.best, 2);
    $('modeOut').textContent = state.mode === 'intervals' ? 'Intervals' : 'Chords';
    $('barMeta').textContent = (state.mode === 'intervals' ? 'Intervals' : 'Chords') + ' · ' + state.level[0].toUpperCase() + state.level.slice(1);
    var html = '';
    currentSet().forEach(function (k) {
      var s = state.stats[state.mode + ':' + k] || [0, 0], pct = s[1] ? s[0] / s[1] : 0, lit = Math.round(pct * 10), segs = '';
      for (var i = 0; i < 10; i++) segs += '<span class="sseg' + (i < lit && s[1] ? ' is-lit' : '') + '"></span>';
      html += '<div class="u-display srow"><span class="srow__n">' + k + '</span><span class="srow__bar">' + segs + '</span><span class="u-display__label srow__pct">' + (s[1] ? Math.round(pct * 100) + '%' : '–') + '</span></div>';
    });
    $('stats').innerHTML = html;
  }
  function renderAll() { renderAnswers(); renderScore(); resetHero(); }
  function resetHero() {
    $('hero').classList.remove('is-right', 'is-wrong'); $('big').textContent = '?';
    $('nameOut').textContent = 'Press Play to hear a question'; $('nextText').textContent = 'Play';
    $('next').setAttribute('aria-label', 'Play question');
  }

  /* ── Sound: a soft electric-piano-ish tone ── */
  function tone(m, t, dur) {
    var ctx = AUDIO.ctx, f = 440 * Math.pow(2, (m - 69) / 12);
    var o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), flt = ctx.createBiquadFilter();
    o1.type = 'triangle'; o2.type = 'sine'; o1.frequency.value = f; o2.frequency.value = f * 2; o2.detune.value = 3;
    var g2 = ctx.createGain(); g2.gain.value = .25;
    flt.type = 'lowpass'; flt.frequency.setValueAtTime(4000, t); flt.frequency.exponentialRampToValueAtTime(900, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.32, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o1.connect(flt); o2.connect(g2); g2.connect(flt); flt.connect(g); g.connect(AUDIO.master);
    o1.start(t); o2.start(t); o1.stop(t + dur + .05); o2.stop(t + dur + .05);
  }
  function playQ() {
    if (!q || !audio()) return;
    AUDIO.master.gain.value = .9;
    var t = AUDIO.ctx.currentTime + .05, notes;
    if (state.mode === 'intervals') notes = [q.root, q.root + IV[q.key]];
    else notes = CH[q.key].map(function (iv) { return q.root + iv; });
    if (state.play === 'down') notes = notes.slice().reverse();
    if (state.play === 'together') notes.forEach(function (m) { tone(m, t, 1.8); });
    else notes.forEach(function (m, i) { tone(m, t + i * .55, 1.2); });
  }
  function newQ() {
    var set = currentSet(), key = set[Math.floor(Math.random() * set.length)];
    if (q && set.length > 1 && key === q.key && Math.random() < .6) key = set[(set.indexOf(key) + 1) % set.length];
    q = { key: key, root: 52 + Math.floor(Math.random() * 14), answered: false };
    renderAnswers(); resetHero();
    $('big').textContent = '?'; $('nameOut').textContent = 'Listen · then pick an answer';
    $('nextText').textContent = 'Skip'; $('next').setAttribute('aria-label', 'Skip to a new question');
    renderScore(); playQ();
  }
  function answer(k) {
    if (!q || q.answered) return;
    q.answered = true;
    var ok = k === q.key, sk = state.mode + ':' + q.key;
    state.total++; if (ok) { state.correct++; state.streak++; state.best = Math.max(state.best, state.streak); } else state.streak = 0;
    var s = state.stats[sk] || [0, 0]; s[1]++; if (ok) s[0]++; state.stats[sk] = s;
    document.querySelectorAll('.ak').forEach(function (b) {
      if (b.dataset.k === q.key) b.classList.add('is-right');
      else if (b.dataset.k === k) b.classList.add('is-wrong');
      b.disabled = true;
    });
    $('hero').classList.add(ok ? 'is-right' : 'is-wrong');
    $('big').textContent = q.key;
    $('nameOut').textContent = (ok ? 'Right · ' : 'It was · ') + (state.mode === 'intervals' ? IV_NAMES[q.key] : CH_NAMES[q.key]);
    $('nextText').textContent = 'Next'; $('next').setAttribute('aria-label', 'Next question');
    renderScore(); save();
  }
  $('next').addEventListener('click', newQ);
  $('replay').addEventListener('click', function () { if (q) playQ(); else newQ(); });
  $('reset').addEventListener('click', function () { state.correct = state.total = state.streak = 0; state.stats = {}; q = null; renderAll(); save(); });

  document.addEventListener('keydown', function (e) {
    if (inControl(e) && e.key !== ' ' ) { if (!(e.key >= '1' && e.key <= '9')) return; }
    if (e.key === ' ' || e.key === 'Enter') { if (inControl(e)) return; e.preventDefault(); $('next').click(); }
    else if (e.key === 'r' || e.key === 'R') $('replay').click();
    else if (e.key >= '1' && e.key <= '9') { var k = currentSet()[+e.key - 1]; if (k) answer(k); }
  });
  renderAll();
})();
</script>
