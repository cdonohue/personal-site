<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 01 — World Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* ── Unit 01 tokens ─────────────────────────────────────────── */
:root, [data-theme="light"] {
  --chassis:#ffffff; --panel:#ffffff; --panel-sunk:#f0f0ee; --ink:#000000; --ink-muted:#5f5f5c; --line:#c8c8c4; --rule:var(--ink);
  --signal:#ff5a1f; --signal-text:#a83400; --on-signal:#000000; --blue:#3a63d8; --on-blue:#ffffff; --yellow:#f5c400; --on-yellow:#111111;
  --key:#e6e6e3; --lcd:#0b0b0b; --lcd-ink:#f2f2ef; --lcd-muted:#8f8f8a; --lcd-dim:#2a2a2a; --focus:var(--ink);
  --shadow-key:0 2px 0 #00000040; --shadow-key-pressed:0 0 0 #00000040;
}
[data-theme="dark"] {
  --chassis:#000000; --panel:#000000; --panel-sunk:#161616; --ink:#ffffff; --ink-muted:#9b9b97; --line:#3a3a3a; --key:#262626; --rule:var(--ink);
  --signal-text:#ff7a45; --shadow-key:0 2px 0 #ffffff26; --shadow-key-pressed:0 0 0 #ffffff26;
}
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-0:0; --radius-sm:2px; --radius-md:6px; --radius-full:9999px;
  --font-sans:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* ── Unit 01 components (vanilla port of the bundle) ────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); background: var(--chassis); color: var(--ink); -webkit-font-smoothing: antialiased; }
:where(button, input, [role="slider"]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.u-label { display: inline-flex; gap: var(--space-2); align-items: baseline; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.u-label b { font-weight: 700; color: var(--ink); }
.u-value { font-family: var(--font-mono); font-size: 13px; line-height: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
.u-led { display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--line); flex: none; }
.u-key .u-led, .u-selector__opt .u-led { background: var(--line); }
.is-on > .u-led, .u-led.is-lit { background: var(--signal); }

.u-key { appearance: none; position: relative; display: inline-flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  min-width: 0; padding: var(--space-2); border: 0; border-radius: var(--radius-0); background: var(--key); color: var(--ink);
  font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: left;
  box-shadow: var(--shadow-key); cursor: pointer; transition: transform 60ms linear, box-shadow 60ms linear; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.u-key:active, .u-key.is-hit, .u-key[aria-pressed="true"] { transform: translateY(2px); box-shadow: var(--shadow-key-pressed); }
.u-key--ink { background: var(--ink); color: var(--chassis); }
.u-key--signal { background: var(--signal); color: var(--on-signal); }
.u-key--blue { background: var(--blue); color: var(--on-blue); }
.u-key--yellow { background: var(--yellow); color: var(--on-yellow); }
.u-key__top { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: var(--space-1); }
.u-key__index { font-family: var(--font-mono); font-weight: 500; font-size: 9px; line-height: 12px; letter-spacing: .1em; opacity: .75; }
.u-key__glyph { align-self: center; display: flex; }
.u-key__glyph svg { width: 22px; height: 22px; fill: currentColor; }
.u-key--sm { width: 40px; height: 40px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; }

.u-panel { background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: var(--radius-0); min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
.u-panel__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-3); }
.u-panel__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel__body { padding: 0 0 var(--space-2); display: flex; flex-direction: column; gap: var(--space-4); flex: 1; }

.u-display { background: var(--lcd); color: var(--lcd-ink); border: 1px solid var(--line); border-radius: var(--radius-0); font-family: var(--font-mono); }
.u-display__label { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--lcd-muted); white-space: nowrap; }
.u-display__unit { font-size: 13px; line-height: 16px; color: var(--lcd-muted); text-transform: uppercase; letter-spacing: .08em; }

.u-selector { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-selector__row { display: flex; gap: 2px; border-radius: var(--radius-0); }
.u-selector__opt { appearance: none; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-2);
  background: var(--key); color: var(--ink); border: 0; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.u-selector__opt:first-child { border-left: 0; }
.u-selector__opt.is-on { background: var(--ink); color: var(--chassis); }
.u-selector__opt:focus-visible { outline-offset: -4px; }

.u-switch { appearance: none; display: inline-flex; align-items: center; gap: var(--space-3); padding: var(--space-1) 0; background: none; border: 0; color: var(--ink); cursor: pointer; }
.u-switch__track { position: relative; width: 40px; height: 20px; background: var(--panel-sunk); border: 1px solid var(--ink); border-radius: var(--radius-sm); flex: none; }
.u-switch__thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 14px; background: var(--ink); border-radius: var(--radius-sm); transition: left 80ms linear; }
.u-switch[aria-checked="true"] .u-switch__track { background: var(--signal); }
.u-switch[aria-checked="true"] .u-switch__thumb { left: 20px; background: var(--on-signal); }
.u-switch__state { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; min-width: 3ch; }

.u-fader { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-fader__head { display: flex; justify-content: space-between; align-items: baseline; }
.u-fader__input { appearance: none; -webkit-appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: ew-resize; }
.u-fader__input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-moz-range-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 28px; margin-top: -13px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }
.u-fader__input::-moz-range-thumb { width: 14px; height: 28px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }

.u-knob { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.u-knob__dial { border-radius: var(--radius-full); cursor: grab; touch-action: none; line-height: 0; }
.u-knob__tick { stroke: var(--line); stroke-width: 1.5; }
.u-knob__track { fill: none; stroke: var(--panel-sunk); stroke-width: 3; }
.u-knob__arc { fill: none; stroke: var(--signal); stroke-width: 3; }
.u-knob__cap { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.u-knob__ind { stroke: var(--ink); stroke-width: 3; stroke-linecap: square; }
.u-knob__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; }


/* ── Shared app shell (Unit 01 apps, fork C) ── */
.shell { height: 100dvh; overflow: auto; container: shell / size; }
.device { min-height: 100%; display: grid; gap: var(--space-2); padding: var(--space-2); grid-template-columns: minmax(0, 1fr); }
.bar { display: none; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-1) var(--space-1) 0; container: bar / inline-size; min-width: 0; grid-area: bar; }
.bar__title { display: inline-flex; align-items: flex-start; gap: var(--space-2); font: 800 clamp(18px, 4.2cqi, 34px)/1 var(--font-sans); letter-spacing: -.025em; white-space: nowrap; }
.bar__idx { font: 500 9px/12px var(--font-mono); letter-spacing: .1em; color: var(--ink-muted); }
.bar__right { display: flex; align-items: center; gap: var(--space-4); min-width: 0; }
.bar__meta { display: none; }
@container bar (min-width: 420px) { .bar__meta { display: inline-flex; } }
.section { border-top: 2px solid var(--rule); padding-top: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; min-height: 0; }
.section__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.section__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.u-field__input { box-sizing: border-box; width: 100%; min-width: 0; height: 40px; padding: 0 var(--space-3); background: var(--panel-sunk); color: var(--ink); border: 0; border-bottom: 2px solid var(--ink); border-radius: var(--radius-0); font: 400 15px/22px var(--font-sans); }
.u-field__input--mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.u-field__input::placeholder { color: var(--ink-muted); }
.u-pick { appearance: none; -webkit-appearance: none; width: 100%; height: 40px; min-width: 0; padding: 0 28px 0 var(--space-3); background: var(--key) linear-gradient(45deg, transparent 50%, var(--ink) 50%) no-repeat right 14px center / 6px 6px; color: var(--ink); border: 0; border-radius: var(--radius-0); box-shadow: var(--shadow-key);
  font: 700 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.row { display: flex; gap: var(--space-2); align-items: center; min-width: 0; }
.grow { flex: 1 1 0; min-width: 0; }
.k-row { height: 40px; flex-direction: row; align-items: center; justify-content: center; }
.k-x { width: 32px; height: 32px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; flex: none; }
.is-armed { background: var(--ink) !important; color: var(--chassis) !important; }
.u-panel { min-height: 0; }
.u-panel__body { min-height: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.hero { grid-area: hero; } .cities { grid-area: cities; } .p-add { grid-area: add; } .p-set { grid-area: set; } .p-over { grid-area: over; }
.device { grid-template-rows: minmax(0, 1fr); grid-template-areas: "hero"; }
.cities, .p-add, .p-set, .p-over { display: none; }

/* Hero clock */
.hero { container: hero / inline-size; display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-2); padding: var(--space-3); min-height: 0; overflow: hidden; }
.hero__top, .hero__bottom { display: flex; justify-content: space-between; gap: var(--space-3); }
.hero__zone, .hero__utc, .hero__date { display: none; }
.hero__main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.clock { display: flex; align-items: flex-start; gap: .06em; font-family: var(--font-mono); font-size: clamp(34px, min(23cqi, 22cqb), 240px); line-height: .9; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.clock__side { display: flex; flex-direction: column; justify-content: space-between; align-self: stretch; font-size: .32em; letter-spacing: 0; padding-top: .1em; }
.clock__s { color: var(--lcd-ink); }
.clock__ap { color: var(--lcd-muted); font-family: var(--font-sans); font-weight: 700; letter-spacing: .06em; }
.hero.is-preview .clock__hm { color: var(--signal); }
.dn { display: inline-flex; align-items: center; gap: var(--space-2); }
.u-led.is-day { background: var(--yellow); }
.u-led.is-night { background: transparent; box-shadow: inset 0 0 0 1px var(--lcd-muted); }
@container hero (min-width: 260px) { .hero { padding: var(--space-4); } .hero__date { display: inline; } }
@container hero (min-width: 400px) { .hero__zone, .hero__utc { display: inline; } }

/* Cities */
.cities { container: cities / inline-size; }
.cities__list { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-2); min-height: 0; overflow: auto; align-content: start; }
.city { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "name time x" "meta time x"; align-items: center; column-gap: var(--space-3); padding: var(--space-2) var(--space-3); }
.city__name { grid-area: name; font: 700 13px/16px var(--font-sans); letter-spacing: .02em; color: var(--lcd-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.city__meta { grid-area: meta; display: flex; align-items: center; gap: var(--space-2); }
.city__time { grid-area: time; font: 400 28px/1 var(--font-mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--lcd-ink); }
.city__time small { font-size: 11px; letter-spacing: .06em; margin-left: 4px; color: var(--lcd-muted); font-family: var(--font-sans); font-weight: 700; }
.city .k-x { grid-area: x; background: var(--lcd-dim); color: var(--lcd-ink); box-shadow: none; }
.hero.is-preview ~ .cities .city__time { color: var(--signal); }
.cities__empty { color: var(--ink-muted); font-size: 13px; padding: var(--space-2) 0; }
@container cities (min-width: 560px) { .cities__list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Add city */
.results { display: flex; flex-direction: column; gap: var(--space-2); }
.result { flex-direction: row; align-items: center; justify-content: space-between; width: 100%; height: 36px; padding: 0 var(--space-3); }
.result .u-value { color: inherit; font-size: 11px; }
.add__note { font-size: 13px; line-height: 18px; color: var(--ink-muted); }

/* Overlap */
.strip { display: grid; grid-template-columns: minmax(64px, auto) repeat(24, minmax(0, 1fr)); gap: 2px; position: relative; align-items: center; }
.strip__name { font: 700 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); padding-right: var(--space-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip__hr { font: 500 9px/12px var(--font-mono); color: var(--ink-muted); text-align: left; }
.cell { height: 18px; background: var(--panel-sunk); }
.cell.is-day { background: var(--line); }
.cell.is-work { background: var(--ink); }
.strip__wrap { position: relative; }
.marker { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--signal); pointer-events: none; }
.legend { display: flex; gap: var(--space-4); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
.over__ctrl { display: flex; gap: var(--space-3); align-items: flex-end; }
.over__ctrl .u-fader { flex: 1; }

/* Tiers */
@container shell (min-width: 300px) and (min-height: 360px) {
  .device { grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "bar" "hero"; }
  .bar { display: flex; }
}
@container shell (min-width: 300px) and (min-height: 540px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar" "hero" "cities"; }
  .cities { display: flex; }
  .city:nth-child(n+3) { display: none; }
}
@container shell (min-width: 520px) and (min-height: 760px) {
  .device { gap: var(--space-4); padding: var(--space-4); grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar bar" "hero hero" "cities cities" "add set"; }
  .p-add, .p-set { display: flex; }
  .city:nth-child(n+3) { display: grid; }
  .result:nth-child(n+4) { display: none; }
}
@container shell (min-width: 560px) and (max-height: 359px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(220px, 40cqi, 380px); grid-template-rows: minmax(0, 1fr); grid-template-areas: "hero cities"; }
  .cities { display: flex; }
}
@container shell (min-width: 560px) and (min-height: 360px) and (max-height: 539px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(240px, 40cqi, 400px); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "bar bar" "hero cities"; }
  .cities { display: flex; }
}
@container shell (min-width: 820px) and (min-height: 540px) {
  .device { gap: var(--space-4); padding: var(--space-6); grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "hero cities" "set add"; }
  .cities, .p-add, .p-set { display: flex; }
  .city:nth-child(n+3) { display: grid; }
}
@container shell (min-width: 980px) and (min-height: 540px) and (max-height: 759px) {
  .device { grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr) minmax(260px, .8fr);
    grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar bar" "hero cities add" "hero cities set"; }
}
@container shell (min-width: 820px) and (max-height: 759px) {
  .device { padding: var(--space-4); }
  .u-panel__head { padding: var(--space-1) 0 var(--space-2); }
  .u-panel__body { padding: 0; gap: var(--space-3); }
  .result:nth-child(n+4) { display: none; }
}
@container shell (min-width: 1180px) and (min-height: 760px) {
  .device { padding: var(--space-8); grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr) minmax(280px, .8fr);
    grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar bar" "hero cities add" "over over set"; }
  .cities, .p-add, .p-set, .p-over { display: flex; }
}
/* iOS zooms into any field under 16px: keep every text field at 16px or more */
input#search { font-size: 16px !important; }
</style>
</head>
<body>
<div class="shell">
<main class="device">

  <header class="bar">
    <span class="bar__title"><span class="bar__idx">09</span>World Clock</span>
    <div class="bar__right">
      <span class="u-label bar__meta" id="barMeta">0 / 6 cities</span>
      <button class="u-switch" role="switch" aria-checked="false" id="themeSw" aria-label="Dark theme">
        <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
        <span class="u-label">Dark</span>
      </button>
    </div>
  </header>

  <section class="hero u-display" id="hero" aria-label="Local time">
    <div class="hero__top">
      <span class="u-display__label" id="heroMode">Local</span>
      <span class="u-display__label hero__zone" id="heroZone">–</span>
      <span class="u-display__label hero__date" id="heroDate">–</span>
    </div>
    <div class="hero__main">
      <div class="clock" role="timer" aria-live="off"><span class="clock__hm" id="hm">00:00</span><span class="clock__side"><span class="clock__s" id="ss">00</span><span class="clock__ap" id="ap"></span></span></div>
    </div>
    <div class="hero__bottom">
      <span class="u-display__label dn"><span class="u-led" id="dnLed"></span><span id="dnText">Day</span></span>
      <span class="u-display__label hero__utc" id="heroUtc">UTC+0</span>
    </div>
  </section>

  <section class="cities section" aria-label="Cities">
    <div class="section__head"><span class="u-label"><b>01</b> Cities</span><span class="u-label" id="cityCount">0 / 6</span></div>
    <div class="cities__list" id="cityList"></div>
  </section>

  <section class="u-panel p-add" aria-label="Add city">
    <header class="u-panel__head"><span class="u-label"><b>02</b> Add city</span><span class="u-label">/ to search</span></header>
    <div class="u-panel__body">
      <label class="u-field"><span class="u-label">Search</span><input class="u-field__input" id="search" type="search" placeholder="Tokyo, Lisbon, Denver…" autocomplete="off"></label>
      <div class="results" id="results"></div>
      <span class="add__note" id="addNote"></span>
    </div>
  </section>

  <section class="u-panel p-set" aria-label="Display settings">
    <header class="u-panel__head"><span class="u-label"><b>03</b> Display</span></header>
    <div class="u-panel__body">
      <button class="u-switch" role="switch" aria-checked="true" id="h24Sw"><span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span><span class="u-label">24-hour</span></button>
      <button class="u-switch" role="switch" aria-checked="true" id="secSw"><span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span><span class="u-label">Seconds</span></button>
    </div>
  </section>

  <section class="u-panel p-over" aria-label="Overlap">
    <header class="u-panel__head"><span class="u-label"><b>04</b> Overlap</span><span class="u-label">Your day, hour by hour</span></header>
    <div class="u-panel__body">
      <div class="strip__wrap"><div class="strip" id="strip"></div><span class="marker" id="marker"></span></div>
      <div class="legend">
        <span class="u-label"><i style="background:var(--ink)"></i>9–17</span>
        <span class="u-label"><i style="background:var(--line)"></i>Day</span>
        <span class="u-label"><i style="background:var(--panel-sunk)"></i>Night</span>
      </div>
      <div class="over__ctrl">
        <label class="u-fader">
          <span class="u-fader__head"><span class="u-label">Preview</span><span class="u-value" id="scrubVal">Now</span></span>
          <input class="u-fader__input" id="scrub" type="range" min="-24" max="24" step="1" value="0">
        </label>
        <button class="u-key k-row" id="scrubReset" style="width:96px"><span class="u-key__text">Now</span></button>
      </div>
    </div>
  </section>

</main>
</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n, w) { n = String(Math.max(0, Math.floor(Math.abs(n)))); while (n.length < w) n = '0' + n; return n; };
  var clamp = function (n, a, b) { return Math.min(b, Math.max(a, n)); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function load(key, state) { try { var s = JSON.parse(localStorage.getItem(key) || 'null'); if (s) Object.assign(state, s); } catch (e) {} }
  function saver(key, state) { return function () { try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {} }; }
  function themeInit(state, save) {
    function apply() {
      var dark = state.theme ? state.theme === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      $('themeSw').setAttribute('aria-checked', String(dark));
    }
    $('themeSw').addEventListener('click', function () { state.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; apply(); save(); });
    apply();
  }
  function bindSwitch(el, get, set) {
    var sync = function () { el.setAttribute('aria-checked', String(!!get())); };
    el.addEventListener('click', function () { set(!get()); sync(); });
    sync(); return sync;
  }
  function selector(el, get, set) {
    var opts = Array.prototype.slice.call(el.querySelectorAll('[role=radio]'));
    function sync() { opts.forEach(function (o) { var on = o.dataset.v === String(get()); o.classList.toggle('is-on', on); o.setAttribute('aria-checked', String(on)); o.tabIndex = on ? 0 : -1; }); }
    opts.forEach(function (o, i) {
      o.addEventListener('click', function () { set(o.dataset.v); sync(); });
      o.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
        if (!d) return; e.preventDefault(); var j = (i + d + opts.length) % opts.length; opts[j].click(); opts[j].focus();
      });
    });
    sync(); return sync;
  }
  function inControl(t) { return t.closest && t.closest('button, input, select, textarea, [role="slider"]'); }
  function armed(btn, label, ms, onConfirm) {
    var timer = null, orig = null;
    btn.addEventListener('click', function () {
      var tx = btn.querySelector('.u-key__text');
      if (btn.classList.contains('is-armed')) { clearTimeout(timer); btn.classList.remove('is-armed'); tx.textContent = orig; onConfirm(); return; }
      orig = tx.textContent;
      btn.classList.add('is-armed'); tx.textContent = label;
      timer = setTimeout(function () { btn.classList.remove('is-armed'); tx.textContent = orig; }, ms || 2000);
    });
  }

  var CITIES = [
    ['Honolulu','Pacific/Honolulu'],['Anchorage','America/Anchorage'],['Los Angeles','America/Los_Angeles'],['San Francisco','America/Los_Angeles'],['Seattle','America/Los_Angeles'],['Vancouver','America/Vancouver'],
    ['Phoenix','America/Phoenix'],['Denver','America/Denver'],['Mexico City','America/Mexico_City'],['Chicago','America/Chicago'],['Dallas','America/Chicago'],['Toronto','America/Toronto'],
    ['New York','America/New_York'],['Miami','America/New_York'],['Bogotá','America/Bogota'],['Lima','America/Lima'],['Halifax','America/Halifax'],["St. John's",'America/St_Johns'],
    ['Santiago','America/Santiago'],['Buenos Aires','America/Argentina/Buenos_Aires'],['São Paulo','America/Sao_Paulo'],['Rio de Janeiro','America/Sao_Paulo'],['Reykjavík','Atlantic/Reykjavik'],['Lisbon','Europe/Lisbon'],
    ['London','Europe/London'],['Dublin','Europe/Dublin'],['Madrid','Europe/Madrid'],['Paris','Europe/Paris'],['Amsterdam','Europe/Amsterdam'],['Berlin','Europe/Berlin'],
    ['Zurich','Europe/Zurich'],['Rome','Europe/Rome'],['Stockholm','Europe/Stockholm'],['Prague','Europe/Prague'],['Warsaw','Europe/Warsaw'],['Athens','Europe/Athens'],
    ['Helsinki','Europe/Helsinki'],['Kyiv','Europe/Kyiv'],['Istanbul','Europe/Istanbul'],['Moscow','Europe/Moscow'],['Cairo','Africa/Cairo'],['Casablanca','Africa/Casablanca'],
    ['Lagos','Africa/Lagos'],['Nairobi','Africa/Nairobi'],['Johannesburg','Africa/Johannesburg'],['Dubai','Asia/Dubai'],['Tehran','Asia/Tehran'],['Karachi','Asia/Karachi'],
    ['Mumbai','Asia/Kolkata'],['Delhi','Asia/Kolkata'],['Kathmandu','Asia/Kathmandu'],['Dhaka','Asia/Dhaka'],['Bangkok','Asia/Bangkok'],['Jakarta','Asia/Jakarta'],
    ['Singapore','Asia/Singapore'],['Hong Kong','Asia/Hong_Kong'],['Shanghai','Asia/Shanghai'],['Beijing','Asia/Shanghai'],['Taipei','Asia/Taipei'],['Manila','Asia/Manila'],
    ['Seoul','Asia/Seoul'],['Tokyo','Asia/Tokyo'],['Perth','Australia/Perth'],['Adelaide','Australia/Adelaide'],['Brisbane','Australia/Brisbane'],['Sydney','Australia/Sydney'],
    ['Melbourne','Australia/Melbourne'],['Auckland','Pacific/Auckland'],['UTC','Etc/UTC']
  ].filter(function (c) {
    try { new Intl.DateTimeFormat('en-US', { timeZone: c[1] }); return true; }
    catch (e) { if (c[1] === 'Europe/Kyiv') { c[1] = 'Europe/Kiev'; return true; } return false; }
  });
  var MAX = 6, MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var LOCAL = (Intl.DateTimeFormat().resolvedOptions().timeZone) || 'Etc/UTC';

  var KEY = 'unit01-world-clock';
  var state = { cities: ['London', 'New York', 'Tokyo'], h24: true, secs: true, theme: null };
  load(KEY, state); var save = saver(KEY, state);
  themeInit(state, save);
  var preview = 0; // hours

  /* Time maths: everything via Intl, so DST is always right */
  var fc = {};
  function parts(zone, d) {
    var f = fc[zone] || (fc[zone] = new Intl.DateTimeFormat('en-US', { timeZone: zone, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric', weekday: 'short' }));
    var o = {}; f.formatToParts(d).forEach(function (p) { o[p.type] = p.value; });
    var h = +o.hour; if (h === 24) h = 0;
    return { y: +o.year, mo: +o.month, d: +o.day, h: h, mi: +o.minute, s: +o.second, wd: o.weekday };
  }
  function offsetMin(zone, d) { var p = parts(zone, d); return Math.round((Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s) - Math.floor(d.getTime() / 1000) * 1000) / 60000); }
  function fmtOffset(min, utc) {
    if (!utc && min === 0) return 'Same time';
    var s = min < 0 ? '−' : '+', a = Math.abs(min), h = Math.floor(a / 60), m = a % 60;
    return (utc ? 'UTC' : '') + s + h + (m ? ':' + pad(m, 2) : '') + (utc ? '' : 'h');
  }
  function hm(p) {
    if (state.h24) return { t: pad(p.h, 2) + ':' + pad(p.mi, 2), ap: '' };
    var h = p.h % 12 || 12; return { t: (h < 10 ? ' ' : '') + h + ':' + pad(p.mi, 2), ap: p.h < 12 ? 'AM' : 'PM' };
  }
  var isDay = function (h) { return h >= 6 && h < 18; };
  function zoneLabel(z) { var c = CITIES.filter(function (x) { return x[1] === z; })[0]; return c ? c[0] : z.split('/').pop().replace(/_/g, ' '); }
  function zoneOf(name) { var c = CITIES.filter(function (x) { return x[0] === name; })[0]; return c && c[1]; }
  state.cities = state.cities.filter(zoneOf).slice(0, MAX);

  /* Cities */
  function renderCities() {
    var list = $('cityList'); list.innerHTML = '';
    if (!state.cities.length) list.innerHTML = '<span class="cities__empty">No cities yet. Add one from Add city.</span>';
    state.cities.forEach(function (name, i) {
      var el = document.createElement('div'); el.className = 'city u-display'; el.dataset.name = name;
      el.innerHTML = '<span class="city__name">' + esc(name) + '</span>' +
        '<span class="city__meta"><span class="u-led"></span><span class="u-display__label city__off"></span></span>' +
        '<span class="city__time"></span>' +
        '<button class="u-key k-x" aria-label="Remove ' + esc(name) + '">×</button>';
      el.querySelector('button').addEventListener('click', function () { state.cities.splice(i, 1); save(); renderCities(); renderResults(); renderStrip(); });
      list.appendChild(el);
    });
    $('cityCount').textContent = state.cities.length + ' / ' + MAX;
    $('barMeta').textContent = state.cities.length + ' / ' + MAX + ' cities';
    tick(true);
  }

  /* Search */
  function renderResults() {
    var q = $('search').value.trim().toLowerCase(), box = $('results');
    var pool = CITIES.filter(function (c) { return state.cities.indexOf(c[0]) < 0 && (!q || c[0].toLowerCase().indexOf(q) === 0 || c[0].toLowerCase().indexOf(' ' + q) > -1 || c[1].toLowerCase().indexOf(q) > -1); }).slice(0, 5);
    var now = new Date();
    box.innerHTML = '';
    pool.forEach(function (c) {
      var b = document.createElement('button'); b.className = 'u-key result';
      var t = hm(parts(c[1], now));
      b.innerHTML = '<span>' + esc(c[0]) + '</span><span class="u-value">' + t.t.trim() + (t.ap ? ' ' + t.ap : '') + '</span>';
      b.addEventListener('click', function () {
        if (state.cities.length >= MAX) { $('addNote').textContent = MAX + ' / ' + MAX + ' cities. Remove one first.'; return; }
        state.cities.push(c[0]); save(); $('search').value = ''; $('addNote').textContent = '';
        renderCities(); renderResults(); renderStrip();
      });
      box.appendChild(b);
    });
    $('addNote').textContent = state.cities.length >= MAX ? MAX + ' / ' + MAX + ' cities. Remove one to add another.' : (pool.length ? '' : 'No match in the built-in list.');
  }
  $('search').addEventListener('input', renderResults);
  $('search').addEventListener('keydown', function (e) { if (e.key === 'Enter') { var f = $('results').querySelector('button'); if (f) f.click(); } });

  /* Overlap strip */
  function renderStrip() {
    var strip = $('strip'), now = new Date(), html = '<span></span>';
    for (var h = 0; h < 24; h++) html += '<span class="strip__hr">' + (h % 3 === 0 ? pad(h, 2) : '') + '</span>';
    var midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var rows = [['Local', LOCAL]].concat(state.cities.map(function (n) { return [n, zoneOf(n)]; }));
    rows.forEach(function (r) {
      html += '<span class="strip__name">' + esc(r[0]) + '</span>';
      for (var h = 0; h < 24; h++) {
        var zh = parts(r[1], new Date(midnight.getTime() + (h + .5) * 3600000)).h;
        html += '<span class="cell' + (zh >= 9 && zh < 17 ? ' is-work' : isDay(zh) ? ' is-day' : '') + '" title="' + esc(r[0]) + ' ' + pad(zh, 2) + ':00"></span>';
      }
    });
    strip.innerHTML = html;
    placeMarker();
  }
  function placeMarker() {
    var strip = $('strip'), first = strip.children[1], last = strip.children[24];
    if (!first || !last || !strip.offsetWidth) return;
    var now = new Date(Date.now() + preview * 3600000), frac = (now.getHours() + now.getMinutes() / 60) / 24;
    if (preview && new Date().getDate() !== now.getDate()) frac = ((now.getHours() + now.getMinutes() / 60) / 24);
    var x0 = first.offsetLeft, x1 = last.offsetLeft + last.offsetWidth;
    $('marker').style.left = (x0 + (x1 - x0) * frac - 1) + 'px';
  }
  function setPreview(h) {
    preview = clamp(+h, -24, 24); $('scrub').value = preview;
    $('scrub').style.setProperty('--t', ((preview + 24) / 48 * 100) + '%');
    $('scrubVal').textContent = preview ? (preview > 0 ? '+' : '−') + Math.abs(preview) + 'h' : 'Now';
    $('hero').classList.toggle('is-preview', !!preview);
    tick(true);
  }
  $('scrub').addEventListener('input', function (e) { setPreview(e.target.value); });
  $('scrubReset').addEventListener('click', function () { setPreview(0); });

  /* Tick */
  var lastMin = -1;
  function tick(force) {
    var real = new Date(), now = new Date(real.getTime() + preview * 3600000);
    var lp = parts(LOCAL, now), t = hm(lp);
    $('hm').textContent = t.t; $('ss').textContent = state.secs ? pad(lp.s, 2) : ''; $('ap').textContent = t.ap;
    $('heroMode').textContent = preview ? 'Preview ' + (preview > 0 ? '+' : '−') + Math.abs(preview) + 'h' : 'Local';
    $('heroZone').textContent = zoneLabel(LOCAL);
    $('heroDate').textContent = lp.wd + ' ' + pad(lp.d, 2) + ' ' + MON[lp.mo - 1];
    $('heroUtc').textContent = fmtOffset(offsetMin(LOCAL, now), true);
    var day = isDay(lp.h);
    $('dnLed').className = 'u-led ' + (day ? 'is-day' : 'is-night'); $('dnText').textContent = day ? 'Day' : 'Night';
    var lOff = offsetMin(LOCAL, now), lKey = lp.y * 400 + lp.mo * 32 + lp.d;
    Array.prototype.forEach.call(document.querySelectorAll('.city'), function (el) {
      var z = zoneOf(el.dataset.name); if (!z) return;
      var p = parts(z, now), ct = hm(p), k = p.y * 400 + p.mo * 32 + p.d;
      el.querySelector('.city__time').innerHTML = ct.t.trim() + (ct.ap ? '<small>' + ct.ap + '</small>' : '');
      var rel = k > lKey ? ' · Tmrw' : k < lKey ? ' · Yest' : '';
      el.querySelector('.city__off').textContent = fmtOffset(offsetMin(z, now) - lOff, false) + rel;
      el.querySelector('.u-led').className = 'u-led ' + (isDay(p.h) ? 'is-day' : 'is-night');
    });
    if (force || lp.mi !== lastMin) { lastMin = lp.mi; placeMarker(); if (!force) renderResults(); }
  }
  bindSwitch($('h24Sw'), function () { return state.h24; }, function (v) { state.h24 = v; save(); tick(true); renderResults(); });
  bindSwitch($('secSw'), function () { return state.secs; }, function (v) { state.secs = v; save(); tick(true); });

  document.addEventListener('keydown', function (e) {
    if (inControl(e.target)) return;
    if (e.key === '/') { e.preventDefault(); $('search').focus(); }
  });
  window.addEventListener('resize', placeMarker);
  if (window.ResizeObserver) new ResizeObserver(placeMarker).observe(document.querySelector('.shell'));

  renderCities(); renderResults(); renderStrip(); setPreview(0);
  setInterval(tick, 250);
})();
</script>
</body>
