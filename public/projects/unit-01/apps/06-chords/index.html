<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 01 — Chord Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* ── Unit 01 tokens ─────────────────────────────────────────── */
:root, [data-theme="light"] {
  --chassis:#ffffff; --panel:#ffffff; --panel-sunk:#f0f0ee; --ink:#000000; --ink-muted:#5f5f5c; --line:#c8c8c4; --rule:var(--ink);
  --signal:#ff5a1f; --signal-text:#a83400; --on-signal:#000000; --blue:#3a63d8; --on-blue:#ffffff; --yellow:#f5c400; --on-yellow:#111111;
  --key:#e6e6e3; --lcd:#0b0b0b; --lcd-ink:#f2f2ef; --lcd-muted:#8f8f8a; --lcd-dim:#2a2a2a; --focus:var(--ink);
  --shadow-key:0 2px 0 #00000040; --shadow-key-pressed:0 0 0 #00000040;
}
[data-theme="dark"] {
  --chassis:#000000; --panel:#000000; --panel-sunk:#161616; --ink:#ffffff; --ink-muted:#9b9b97; --line:#3a3a3a; --key:#262626; --rule:var(--ink);
  --signal-text:#ff7a45; --shadow-key:0 2px 0 #ffffff26; --shadow-key-pressed:0 0 0 #ffffff26;
}
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-0:0; --radius-sm:2px; --radius-md:6px; --radius-full:9999px;
  --font-sans:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* ── Unit 01 components (vanilla port of the bundle) ────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); background: var(--chassis); color: var(--ink); -webkit-font-smoothing: antialiased; }
:where(button, input, [role="slider"]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.u-label { display: inline-flex; gap: var(--space-2); align-items: baseline; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.u-label b { font-weight: 700; color: var(--ink); }
.u-value { font-family: var(--font-mono); font-size: 13px; line-height: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
.u-led { display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--line); flex: none; }
.u-key .u-led, .u-selector__opt .u-led { background: var(--line); }
.is-on > .u-led, .u-led.is-lit { background: var(--signal); }

.u-key { appearance: none; position: relative; display: inline-flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  min-width: 0; padding: var(--space-2); border: 0; border-radius: var(--radius-0); background: var(--key); color: var(--ink);
  font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: left;
  box-shadow: var(--shadow-key); cursor: pointer; transition: transform 60ms linear, box-shadow 60ms linear; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.u-key:active, .u-key.is-hit, .u-key[aria-pressed="true"] { transform: translateY(2px); box-shadow: var(--shadow-key-pressed); }
.u-key--ink { background: var(--ink); color: var(--chassis); }
.u-key--signal { background: var(--signal); color: var(--on-signal); }
.u-key--blue { background: var(--blue); color: var(--on-blue); }
.u-key--yellow { background: var(--yellow); color: var(--on-yellow); }
.u-key__top { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: var(--space-1); }
.u-key__index { font-family: var(--font-mono); font-weight: 500; font-size: 9px; line-height: 12px; letter-spacing: .1em; opacity: .75; }
.u-key__glyph { align-self: center; display: flex; }
.u-key__glyph svg { width: 22px; height: 22px; fill: currentColor; }
.u-key--sm { width: 40px; height: 40px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; }

.u-panel { background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: var(--radius-0); min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
.u-panel__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-3); }
.u-panel__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel__body { padding: 0 0 var(--space-2); display: flex; flex-direction: column; gap: var(--space-4); flex: 1; }

.u-display { background: var(--lcd); color: var(--lcd-ink); border: 1px solid var(--line); border-radius: var(--radius-0); font-family: var(--font-mono); }
.u-display__label { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--lcd-muted); white-space: nowrap; }
.u-display__unit { font-size: 13px; line-height: 16px; color: var(--lcd-muted); text-transform: uppercase; letter-spacing: .08em; }

.u-selector { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-selector__row { display: flex; gap: 2px; border-radius: var(--radius-0); }
.u-selector__opt { appearance: none; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-2);
  background: var(--key); color: var(--ink); border: 0; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.u-selector__opt:first-child { border-left: 0; }
.u-selector__opt.is-on { background: var(--ink); color: var(--chassis); }
.u-selector__opt:focus-visible { outline-offset: -4px; }

.u-switch { appearance: none; display: inline-flex; align-items: center; gap: var(--space-3); padding: var(--space-1) 0; background: none; border: 0; color: var(--ink); cursor: pointer; }
.u-switch__track { position: relative; width: 40px; height: 20px; background: var(--panel-sunk); border: 1px solid var(--ink); border-radius: var(--radius-sm); flex: none; }
.u-switch__thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 14px; background: var(--ink); border-radius: var(--radius-sm); transition: left 80ms linear; }
.u-switch[aria-checked="true"] .u-switch__track { background: var(--signal); }
.u-switch[aria-checked="true"] .u-switch__thumb { left: 20px; background: var(--on-signal); }
.u-switch__state { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; min-width: 3ch; }

.u-fader { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-fader__head { display: flex; justify-content: space-between; align-items: baseline; }
.u-fader__input { appearance: none; -webkit-appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: ew-resize; }
.u-fader__input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-moz-range-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 28px; margin-top: -13px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }
.u-fader__input::-moz-range-thumb { width: 14px; height: 28px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }

.u-knob { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.u-knob__dial { border-radius: var(--radius-full); cursor: grab; touch-action: none; line-height: 0; }
.u-knob__tick { stroke: var(--line); stroke-width: 1.5; }
.u-knob__track { fill: none; stroke: var(--panel-sunk); stroke-width: 3; }
.u-knob__arc { fill: none; stroke: var(--signal); stroke-width: 3; }
.u-knob__cap { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.u-knob__ind { stroke: var(--ink); stroke-width: 3; stroke-linecap: square; }
.u-knob__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; }

/* ── App shell (shared by 06–08) ── */
.shell { height: 100dvh; overflow: auto; container: shell / size; }
.device { min-height: 100%; display: grid; gap: var(--space-2); padding: var(--space-2); grid-template-columns: minmax(0, 1fr); }
.bar { display: none; grid-area: bar; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-1) var(--space-1) 0; container: bar / inline-size; min-width: 0; }
.bar__title { display: inline-flex; align-items: flex-start; gap: var(--space-2); font: 800 clamp(18px, 4.2cqi, 34px)/1 var(--font-sans); letter-spacing: -.025em; white-space: nowrap; }
.bar__idx { font: 500 9px/12px var(--font-mono); letter-spacing: .1em; color: var(--ink-muted); }
.bar__right { display: flex; align-items: center; gap: var(--space-4); }
.bar__meta { display: none; }
@container bar (min-width: 420px) { .bar__meta { display: inline-flex; } }
.rowsec { border-top: 2px solid var(--rule); padding-top: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; min-height: 0; }
.rowsec__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); min-height: 16px; }
.hero { container: hero / inline-size; display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-2); padding: var(--space-3); min-height: 0; min-width: 0; overflow: hidden; transition: background 60ms linear; }
.hero__top, .hero__bottom { display: flex; justify-content: space-between; gap: var(--space-3); }
.hero__main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.hero .opt { display: none; }
@container hero (min-width: 260px) { .hero { padding: var(--space-4); } }
@container hero (min-width: 380px) { .hero .opt { display: inline; } }
.hero.is-flash { background: var(--signal); }
.hero.is-flash, .hero.is-flash .u-display__label, .hero.is-flash .u-display__unit { color: var(--on-signal); }
.transport { grid-area: transport; container: transport / inline-size; display: flex; gap: var(--space-2); min-width: 0; }
.transport .u-key { flex: 1 1 0; height: clamp(52px, 20cqi, 104px); }
.transport .k-main { flex-grow: 2; }
.transport .k-more { display: none; }
.u-key__glyph { font-size: clamp(16px, 5cqi, 26px); line-height: 1; }
@container transport (max-width: 199px) { .transport .u-key__text { font-size: 10px; } }
.stepper { display: flex; align-items: center; gap: var(--space-2); }
.stepper__val { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 20px; line-height: 40px; height: 40px; background: var(--panel-sunk); font-variant-numeric: tabular-nums; }
.mini { padding: var(--space-3); display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.mini__num { font-size: 24px; line-height: 24px; font-variant-numeric: tabular-nums; }
.u-key:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.u-key.is-sel { background: var(--ink); color: var(--chassis); }
@container (max-width: 300px) { .u-selector__opt .u-led { display: none; } }
@container shell (min-width: 300px) and (min-height: 360px) { .bar { display: flex; } }
@container shell (min-width: 300px) { .transport .k-more { display: inline-flex; } }
@container shell (min-width: 820px) and (max-height: 759px) {
  .device { padding: var(--space-4); }
  .u-panel__head { padding: var(--space-1) 0 var(--space-2); }
  .u-panel__body { padding: 0; gap: var(--space-3); }
}
@container shell (min-width: 820px) and (min-height: 540px) { .device { gap: var(--space-4); padding: var(--space-6); } }
@container shell (min-width: 1180px) and (min-height: 760px) { .device { padding: var(--space-8); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.device { grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "hero" "input"; }
.hero { grid-area: hero; } .input { grid-area: input; } .p-notes { grid-area: notes; } .p-build { grid-area: build; }
.transport, .p-notes, .p-build { display: none; }

.chord { font-family: var(--font-sans); font-weight: 800; font-size: clamp(28px, min(18cqi, 18cqb), 200px); line-height: .95; letter-spacing: -.035em; text-align: center; overflow-wrap: anywhere; }
.chord.is-empty { font-size: clamp(16px, 7cqi, 40px); color: var(--lcd-muted); letter-spacing: 0; font-weight: 700; }
.chord__slash { color: var(--lcd-muted); }
.hero__notes { font-family: var(--font-mono); font-size: 13px; line-height: 16px; color: var(--lcd-ink); text-align: center; min-height: 16px; }
.hero__alts { display: none; text-align: center; }
@container hero (min-width: 480px) { .hero__alts { display: block; } }
.hero__notes .r { color: var(--signal); }

/* input area: piano or fretboard */
.input__head .mode { display: none; }
.pianosec { container: piano / inline-size; }
.piano { --pk-w: #ececea; --pk-wt: #5f5f5c; --pk-b: #111111; --pk-bt: #f0f0ee; display: flex; gap: 2px; height: clamp(52px, min(20cqi, 26cqb), 170px); }
.oct { position: relative; flex: 1; display: flex; gap: 2px; min-width: 0; }
.oct--2 { display: none; }
@container piano (min-width: 480px) { .oct--2 { display: flex; } }
.wk { appearance: none; flex: 1; border: 0; padding: 0 0 6px; display: flex; align-items: flex-end; justify-content: center; background: var(--pk-w); color: var(--pk-wt); box-shadow: var(--shadow-key); cursor: pointer; font: 700 10px/1 var(--font-sans); letter-spacing: .04em; min-width: 0; }
.bk { appearance: none; position: absolute; top: 0; height: 60%; width: calc(100% / 7 * .62); border: 0; padding: 0 0 4px; display: flex; align-items: flex-end; justify-content: center; background: var(--pk-b); color: var(--pk-bt); cursor: pointer; z-index: 1; font: 700 9px/1 var(--font-sans); }
.wk[aria-pressed="true"], .bk[aria-pressed="true"] { background: var(--signal); color: var(--on-signal); box-shadow: none; }
.wk:active, .bk:active { transform: translateY(1px); }
.wk span, .bk span { opacity: 0; }
@container piano (min-width: 360px) { .wk span { opacity: 1; } }
.wk[aria-pressed="true"] span, .bk[aria-pressed="true"] span { opacity: 1; }

.fretsec { display: none; container: fret / inline-size; }
.fret { display: grid; grid-template-columns: 28px 1.1fr repeat(12, 1fr); grid-template-rows: repeat(6, 1fr) 14px; gap: 2px; height: clamp(120px, min(26cqi, 30cqb), 230px); }
.fret__name { font: 700 11px/1 var(--font-sans); color: var(--ink-muted); display: flex; align-items: center; }
.fc { appearance: none; border: 0; padding: 0; background: linear-gradient(var(--line), var(--line)) center / 100% 1px no-repeat, var(--chassis); cursor: pointer; display: flex; align-items: center; justify-content: center; font: 500 10px/1 var(--font-mono); color: transparent; min-width: 0; }
.fc[data-f="0"] { background: linear-gradient(var(--line), var(--line)) center / 100% 1px no-repeat, var(--panel-sunk); border-right: 3px solid var(--ink); }
.fc:not([data-f="0"]) { border-right: 1px solid var(--line); }
.fc[aria-pressed="true"] { background: var(--signal); color: var(--on-signal); }
.fret__mark { font: 500 9px/14px var(--font-mono); color: var(--ink-muted); text-align: center; }
.f-hi { display: block; }
@container fret (max-width: 559px) { .fret { grid-template-columns: 28px 1.1fr repeat(7, 1fr); } .f-hi { display: none !important; } }

/* panels */
.notelist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.notelist li { display: flex; justify-content: space-between; padding: var(--space-2) 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 20px; }
.notelist li .u-value { color: var(--ink-muted); }
.notelist .empty { color: var(--ink-muted); font-size: 13px; }
.alts { font-size: 15px; line-height: 22px; }
.roots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
.roots .u-key, .quals .u-key { height: 40px; align-items: center; justify-content: center; padding: 0; }
.quals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }

@container shell (max-height: 259px) { .input__head { display: none; } .input { padding-top: var(--space-1); } }
@container shell (min-height: 300px) {
  .device { grid-template-rows: minmax(0, 1fr) auto auto; grid-template-areas: "hero" "input" "transport"; }
  .transport { display: flex; }
}
@container shell (min-width: 300px) and (min-height: 360px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar" "hero" "input" "transport"; }
}
@container shell (min-width: 520px) and (min-height: 760px) {
  .device { gap: var(--space-4); padding: var(--space-4); grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: auto minmax(0, 1fr) auto auto auto; grid-template-areas: "bar bar" "hero hero" "input input" "transport transport" "notes build"; }
  .p-notes, .p-build { display: flex; }
}
@container shell (min-width: 560px) and (max-height: 299px) {
  .device { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "hero input"; }
}
@container shell (min-width: 560px) and (min-height: 300px) and (max-height: 539px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(180px, 26cqi, 280px); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "hero transport" "input input"; }
  .transport { flex-direction: column; } .transport .u-key { height: auto; }
}
/* the Piano/Guitar choice and the fretboard arrive with width */
@container shell (min-width: 520px) and (min-height: 560px) {
  .input__head .mode { display: flex; }
  .device[data-mode="guitar"] .pianosec { display: none; }
  .device[data-mode="guitar"] .fretsec { display: flex; }
}
@container shell (min-width: 820px) and (min-height: 540px) {
  .device { grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar bar" "hero notes" "input input" "transport transport"; }
  .p-notes { display: flex; } .p-build { display: none; }
  .input__head .mode { display: flex; }
  .device[data-mode="guitar"] .pianosec { display: none; }
  .device[data-mode="guitar"] .fretsec { display: flex; }
}
@container shell (min-width: 1180px) and (min-height: 760px) {
  .device { grid-template-columns: minmax(260px, .8fr) minmax(0, 1.6fr) minmax(300px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar bar bar" "build hero notes" "input input input" "transport transport transport"; }
  .p-notes, .p-build { display: flex; }
}
.transport .u-key { height: clamp(48px, 14cqi, 80px); }
.u-knob__dial.is-turning { outline: 1px dashed var(--ink-muted); outline-offset: 3px; }
</style>
</head>
<body>
<div class="shell">
<main class="device" id="device" data-mode="piano">
  <header class="bar">
    <span class="bar__title"><span class="bar__idx">06</span>Chord Finder</span>
    <div class="bar__right">
      <span class="u-label bar__meta" id="barMeta">Piano</span>
      <button class="u-switch" role="switch" aria-checked="false" id="themeSw" aria-label="Dark theme">
        <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
        <span class="u-label">Dark</span>
      </button>
    </div>
  </header>

  <section class="hero u-display" id="hero" aria-label="Chord name">
    <div class="hero__top">
      <span class="u-display__label">Chord</span>
      <span class="u-display__label opt" id="qualOut">–</span>
      <span class="u-display__label" id="countOut">0 notes</span>
    </div>
    <div class="hero__main"><div class="chord is-empty" id="chordOut" aria-live="polite">Tap notes</div></div>
    <div class="hero__notes" id="notesOut"></div>
    <div class="hero__alts u-display__label" id="altsOut"></div>
  </section>

  <section class="input rowsec" aria-label="Note input">
    <div class="rowsec__head input__head">
      <span class="u-label"><b>01</b> <span id="inputTitle">Piano</span></span>
      <div class="u-selector__row mode" role="radiogroup" aria-label="Input" id="modeSel">
        <button class="u-selector__opt" role="radio" data-v="piano" style="height:28px"><span class="u-led"></span>Piano</button>
        <button class="u-selector__opt" role="radio" data-v="guitar" style="height:28px"><span class="u-led"></span>Guitar</button>
      </div>
    </div>
    <div class="pianosec"><div class="piano" id="piano"></div></div>
    <div class="fretsec"><div class="fret" id="fret" style="width:100%"></div></div>
  </section>

  <section class="transport" aria-label="Controls">
    <button class="u-key u-key--ink" id="clear"><span class="u-key__top"><span class="u-key__index">C</span></span><span class="u-key__text">Clear</span></button>
    <button class="u-key u-key--blue k-more" id="strum"><span class="u-key__top"><span class="u-key__index">S</span></span><span class="u-key__text">Strum</span></button>
    <button class="u-key u-key--blue k-main" id="play"><span class="u-key__top"><span class="u-key__index">Space</span></span><span class="u-key__text">Play</span></button>
  </section>

  <section class="u-panel p-notes" aria-label="Notes">

<script>

  var NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
  var TUNING = [64, 59, 55, 50, 45, 40]; /* high E at top */
  var STR = ['E', 'B', 'G', 'D', 'A', 'E'];
  var S = makeStore('unit01-chords', { theme: null, mode: 'piano', piano: [], frets: [null, null, null, null, null, null], bRoot: 0, bQual: 'maj' });
  initTheme(S);
  var device = $('device');

  /* chord templates: name suffix, intervals, display quality */
  var T = [
    ['', [0, 4, 7], 'Major'], ['m', [0, 3, 7], 'Minor'], ['dim', [0, 3, 6], 'Diminished'], ['aug', [0, 4, 8], 'Augmented'],
    ['sus2', [0, 2, 7], 'Suspended 2nd'], ['sus4', [0, 5, 7], 'Suspended 4th'], ['5', [0, 7], 'Power chord'],
    ['6', [0, 4, 7, 9], 'Major 6th'], ['m6', [0, 3, 7, 9], 'Minor 6th'], ['7', [0, 4, 7, 10], 'Dominant 7th'], ['maj7', [0, 4, 7, 11], 'Major 7th'],
    ['m7', [0, 3, 7, 10], 'Minor 7th'], ['m(maj7)', [0, 3, 7, 11], 'Minor-major 7th'], ['m7♭5', [0, 3, 6, 10], 'Half-diminished'], ['dim7', [0, 3, 6, 9], 'Diminished 7th'],
    ['aug7', [0, 4, 8, 10], 'Augmented 7th'], ['7sus4', [0, 5, 7, 10], 'Dominant 7th sus4'], ['add9', [0, 2, 4, 7], 'Added 9th'], ['madd9', [0, 2, 3, 7], 'Minor added 9th'],
    ['6/9', [0, 2, 4, 7, 9], 'Six-nine'], ['9', [0, 2, 4, 7, 10], 'Dominant 9th'], ['maj9', [0, 2, 4, 7, 11], 'Major 9th'], ['m9', [0, 2, 3, 7, 10], 'Minor 9th'],
    ['7♭9', [0, 1, 4, 7, 10], 'Dominant 7th flat 9'], ['11', [0, 2, 5, 7, 10], 'Dominant 11th'], ['13', [0, 2, 4, 7, 9, 10], 'Dominant 13th']
  ];
  var INTERVALS = ['Unison', 'Minor 2nd', 'Major 2nd', 'Minor 3rd', 'Major 3rd', 'Perfect 4th', 'Tritone', 'Perfect 5th', 'Minor 6th', 'Major 6th', 'Minor 7th', 'Major 7th'];
  var DEG = ['R', '♭9', '9', '♭3', '3', '4', '♭5', '5', '♯5', '6', '♭7', '7'];
  var QUALS = [['maj', ''], ['m', 'm'], ['7', '7'], ['maj7', 'maj7'], ['m7', 'm7'], ['dim', 'dim'], ['aug', 'aug'], ['sus4', 'sus4'], ['sus2', 'sus2'], ['6', '6'], ['9', '9'], ['m7♭5', 'm7♭5']];

  function selectedMidi() {
    var m = activeMode() === 'guitar' ? S.frets.map(function (f, i) { return f == null ? null : TUNING[i] + f; }).filter(function (x) { return x != null; }) : S.piano.slice();
    return m.sort(function (a, b) { return a - b; });
  }
  function activeMode() { return S.mode === 'guitar' && $('fret').offsetParent ? 'guitar' : 'piano'; }

  function detect(midis) {
    if (!midis.length) return [];
    var pcs = [], bass = midis[0] % 12;
    midis.forEach(function (m) { if (pcs.indexOf(m % 12) < 0) pcs.push(m % 12); });

      var rel = pcs.map(function (p) { return (p - root + 12) % 12; }).sort(function (a, b) { return a - b; });

        var iv = t[1], score = 0, no5 = false;

  }

  /* build piano */
  function buildPiano() {
    var p = $('piano'); p.innerHTML = '';
    [48, 60].forEach(function (base, o) {
      var oct = document.createElement('div'); oct.className = 'oct' + (o ? ' oct--2' : ' oct--1');
      var whites = [0, 2, 4, 5, 7, 9, 11], blacks = { 1: 1, 3: 2, 6: 4, 8: 5, 10: 6 };

  }
  function keyBtn(cls, m) {

  }
  function buildFret() {
    var f = $('fret'); f.innerHTML = '';

      var nm = document.createElement('span'); nm.className = 'fret__name'; nm.textContent = STR[s]; f.appendChild(nm);

  }

  /* audio: plucked triangle through a lowpass */

  }
  function applyBuild() {
    var t = T.filter(function (x) { return x[0] === (S.bQual === 'maj' ? '' : S.bQual); })[0];

  function syncMode() { device.dataset.mode = S.mode; $('inputTitle').textContent = S.mode === 'guitar' ? 'Guitar' : 'Piano'; syncModeSel(); }

      if (best.slash) out.innerHTML = best.base.replace(' (no 5)', '') + '<span class="chord__slash">/' + best.slash + '</span>';

    var pcsSeen = [], root = best ? best.root : null;
    var notes = midis.map(function (m) { return m % 12; }).filter(function (p) { if (pcsSeen.indexOf(p) >= 0) return false; pcsSeen.push(p); return true; });
    $('notesOut').innerHTML = notes.map(function (p) { return '<span' + (p === root && !(best && best.isInterval) ? ' class="r"' : '') + '>' + NAMES[p] + '</span>'; }).join(' · ');
    $('qualOut').textContent = best ? best.q : '–';
    $('countOut').textContent = notes.length + (notes.length === 1 ? ' note' : ' notes');
    var alts = res.slice(1, 5).map(function (r) { return r.name; });
    $('altsOut').textContent = alts.length ? 'Also: ' + alts.join(' · ') : '';
    $('altList').textContent = alts.length ? alts.join(' · ') : '–';
    $('barMeta').textContent = (activeMode() === 'guitar' ? 'Guitar' : 'Piano') + ' · ' + notes.length + ' notes';
    var nl = $('noteList'); nl.innerHTML = '';
    if (!notes.length) { var e = document.createElement('li'); e.className = 'empty'; e.textContent = 'Selected notes and their intervals appear here.'; nl.appendChild(e); }
    notes.forEach(function (p) {
      var li = document.createElement('li'); var deg = root != null && !(best && best.isInterval) ? DEG[(p - root + 12) % 12] : '';
      li.innerHTML = '<span>' + NAMES[p] + '</span><span class="u-value">' + deg + '</span>'; nl.appendChild(li);
    });
    $('bassOut').textContent = 'Bass ' + (midis.length ? NAMES[midis[0] % 12] : '–');
    document.querySelectorAll('#roots .u-key').forEach(function (b) { b.classList.toggle('is-sel', +b.dataset.r === S.bRoot); });
    document.querySelectorAll('#quals .u-key').forEach(function (b) { b.classList.toggle('is-sel', b.dataset.q === S.bQual); });
  }

  function clearAll() { if (activeMode() === 'guitar') S.frets = [null, null, null, null, null, null]; else S.piano = []; S.save(); render(); }
  $('clear').addEventListener('click', clearAll);
  $('play').addEventListener('click', function () { pluck(selectedMidi(), 0); });
  $('strum').addEventListener('click', function () { pluck(selectedMidi(), .045); });
  document.addEventListener('keydown', function (e) {
    if (inControl(e)) return;
    if (e.key === ' ') { e.preventDefault(); pluck(selectedMidi(), 0); }
    else if (e.key === 's' || e.key === 'S') pluck(selectedMidi(), .045);
    else if (e.key === 'c' || e.key === 'C' || e.key === 'Escape') clearAll();
  });

  if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(document.querySelector('.shell'));

})();
