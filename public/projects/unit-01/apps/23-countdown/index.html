<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 01 — Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* ── Unit 01 tokens ─────────────────────────────────────────── */
:root, [data-theme="light"] {
  --chassis:#ffffff; --panel:#ffffff; --panel-sunk:#f0f0ee; --ink:#000000; --ink-muted:#5f5f5c; --line:#c8c8c4; --rule:var(--ink);
  --signal:#ff5a1f; --signal-text:#a83400; --on-signal:#000000; --blue:#3a63d8; --on-blue:#ffffff; --yellow:#f5c400; --on-yellow:#111111;
  --key:#e6e6e3; --lcd:#0b0b0b; --lcd-ink:#f2f2ef; --lcd-muted:#8f8f8a; --lcd-dim:#2a2a2a; --focus:var(--ink);
  --shadow-key:0 2px 0 #00000040; --shadow-key-pressed:0 0 0 #00000040;
}
[data-theme="dark"] {
  --chassis:#000000; --panel:#000000; --panel-sunk:#161616; --ink:#ffffff; --ink-muted:#9b9b97; --line:#3a3a3a; --key:#262626; --rule:var(--ink);
  --signal-text:#ff7a45; --shadow-key:0 2px 0 #ffffff26; --shadow-key-pressed:0 0 0 #ffffff26;
}
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-0:0; --radius-sm:2px; --radius-md:6px; --radius-full:9999px;
  --font-sans:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* ── Unit 01 components (vanilla port of the bundle) ────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); background: var(--chassis); color: var(--ink); -webkit-font-smoothing: antialiased; }
:where(button, input, [role="slider"]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.u-label { display: inline-flex; gap: var(--space-2); align-items: baseline; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.u-label b { font-weight: 700; color: var(--ink); }
.u-value { font-family: var(--font-mono); font-size: 13px; line-height: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
.u-led { display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--line); flex: none; }
.u-key .u-led, .u-selector__opt .u-led { background: var(--line); }
.is-on > .u-led, .u-led.is-lit { background: var(--signal); }

.u-key { appearance: none; position: relative; display: inline-flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  min-width: 0; padding: var(--space-2); border: 0; border-radius: var(--radius-0); background: var(--key); color: var(--ink);
  font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: left;
  box-shadow: var(--shadow-key); cursor: pointer; transition: transform 60ms linear, box-shadow 60ms linear; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.u-key:active, .u-key.is-hit, .u-key[aria-pressed="true"] { transform: translateY(2px); box-shadow: var(--shadow-key-pressed); }
.u-key--ink { background: var(--ink); color: var(--chassis); }
.u-key--signal { background: var(--signal); color: var(--on-signal); }
.u-key--blue { background: var(--blue); color: var(--on-blue); }
.u-key--yellow { background: var(--yellow); color: var(--on-yellow); }
.u-key__top { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: var(--space-1); }
.u-key__index { font-family: var(--font-mono); font-weight: 500; font-size: 9px; line-height: 12px; letter-spacing: .1em; opacity: .75; }
.u-key__glyph { align-self: center; display: flex; }
.u-key__glyph svg { width: 22px; height: 22px; fill: currentColor; }
.u-key--sm { width: 40px; height: 40px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; }

.u-panel { background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: var(--radius-0); min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
.u-panel__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-3); }
.u-panel__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel__body { padding: 0 0 var(--space-2); display: flex; flex-direction: column; gap: var(--space-4); flex: 1; }

.u-display { background: var(--lcd); color: var(--lcd-ink); border: 1px solid var(--line); border-radius: var(--radius-0); font-family: var(--font-mono); }
.u-display__label { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--lcd-muted); white-space: nowrap; }
.u-display__unit { font-size: 13px; line-height: 16px; color: var(--lcd-muted); text-transform: uppercase; letter-spacing: .08em; }

.u-selector { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-selector__row { display: flex; gap: 2px; border-radius: var(--radius-0); }
.u-selector__opt { appearance: none; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-2);
  background: var(--key); color: var(--ink); border: 0; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.u-selector__opt:first-child { border-left: 0; }
.u-selector__opt.is-on { background: var(--ink); color: var(--chassis); }
.u-selector__opt:focus-visible { outline-offset: -4px; }

.u-switch { appearance: none; display: inline-flex; align-items: center; gap: var(--space-3); padding: var(--space-1) 0; background: none; border: 0; color: var(--ink); cursor: pointer; }
.u-switch__track { position: relative; width: 40px; height: 20px; background: var(--panel-sunk); border: 1px solid var(--ink); border-radius: var(--radius-sm); flex: none; }
.u-switch__thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 14px; background: var(--ink); border-radius: var(--radius-sm); transition: left 80ms linear; }
.u-switch[aria-checked="true"] .u-switch__track { background: var(--signal); }
.u-switch[aria-checked="true"] .u-switch__thumb { left: 20px; background: var(--on-signal); }
.u-switch__state { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; min-width: 3ch; }

.u-fader { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-fader__head { display: flex; justify-content: space-between; align-items: baseline; }
.u-fader__input { appearance: none; -webkit-appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: ew-resize; }
.u-fader__input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-moz-range-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 28px; margin-top: -13px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }
.u-fader__input::-moz-range-thumb { width: 14px; height: 28px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }

.u-knob { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.u-knob__dial { border-radius: var(--radius-full); cursor: grab; touch-action: none; line-height: 0; }
.u-knob__tick { stroke: var(--line); stroke-width: 1.5; }
.u-knob__track { fill: none; stroke: var(--panel-sunk); stroke-width: 3; }
.u-knob__arc { fill: none; stroke: var(--signal); stroke-width: 3; }
.u-knob__cap { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.u-knob__ind { stroke: var(--ink); stroke-width: 3; stroke-linecap: square; }
.u-knob__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; }


/* ── Shared app shell (Unit 01 apps, fork C) ── */
.shell { height: 100dvh; overflow: auto; container: shell / size; }
.device { min-height: 100%; display: grid; gap: var(--space-2); padding: var(--space-2); grid-template-columns: minmax(0, 1fr); }
.bar { display: none; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-1) var(--space-1) 0; container: bar / inline-size; min-width: 0; grid-area: bar; }
.bar__title { display: inline-flex; align-items: flex-start; gap: var(--space-2); font: 800 clamp(18px, 4.2cqi, 34px)/1 var(--font-sans); letter-spacing: -.025em; white-space: nowrap; }
.bar__idx { font: 500 9px/12px var(--font-mono); letter-spacing: .1em; color: var(--ink-muted); }
.bar__right { display: flex; align-items: center; gap: var(--space-4); min-width: 0; }
.bar__meta { display: none; }
@container bar (min-width: 420px) { .bar__meta { display: inline-flex; } }
.section { border-top: 2px solid var(--rule); padding-top: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; min-height: 0; }
.section__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.section__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.u-field__input { box-sizing: border-box; width: 100%; min-width: 0; height: 40px; padding: 0 var(--space-3); background: var(--panel-sunk); color: var(--ink); border: 0; border-bottom: 2px solid var(--ink); border-radius: var(--radius-0); font: 400 15px/22px var(--font-sans); }
.u-field__input--mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.u-field__input::placeholder { color: var(--ink-muted); }
.u-pick { appearance: none; -webkit-appearance: none; width: 100%; height: 40px; min-width: 0; padding: 0 28px 0 var(--space-3); background: var(--key) linear-gradient(45deg, transparent 50%, var(--ink) 50%) no-repeat right 14px center / 6px 6px; color: var(--ink); border: 0; border-radius: var(--radius-0); box-shadow: var(--shadow-key);
  font: 700 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.row { display: flex; gap: var(--space-2); align-items: center; min-width: 0; }
.grow { flex: 1 1 0; min-width: 0; }
.k-row { height: 40px; flex-direction: row; align-items: center; justify-content: center; }
.k-x { width: 32px; height: 32px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; flex: none; }
.is-armed { background: var(--ink) !important; color: var(--chassis) !important; }
.u-panel { min-height: 0; }
.u-panel__body { min-height: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }


.hero { grid-area: hero; } .transport { grid-area: transport; } .events { grid-area: events; }
.p-add { grid-area: add; } .p-cal { grid-area: cal; }
.device { grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "hero" "transport"; }
.events, .p-add, .p-cal { display: none; }

/* ── Hero ── */
.hero { container: hero / inline-size; display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-2); padding: var(--space-3); min-height: 0; overflow: hidden; }
.hero__top, .hero__bottom { display: flex; justify-content: space-between; gap: var(--space-3); align-items: center; }
.hero__pos, .hero__date { display: none; }
.hero__name { font: 700 clamp(13px, 6.5cqi, 30px)/1.1 var(--font-sans); letter-spacing: -.01em; color: var(--lcd-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hero__main { flex: 1; display: flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: 0; }
.big { font: 800 clamp(40px, min(34cqi, 26cqb), 300px)/.88 var(--font-sans); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.big--word { font-size: clamp(32px, min(22cqi, 20cqb), 220px); letter-spacing: -.04em; }
.big--clock { font: 400 clamp(28px, min(17cqi, 18cqb), 180px)/.95 var(--font-mono); letter-spacing: -.03em; }
.hero__num { display: flex; align-items: baseline; gap: var(--space-2); min-width: 0; }
.hero.is-today .big, .hero.is-today .hero__state { color: var(--signal); }
.hero.is-past .big { color: var(--lcd-muted); }
.hero__state { display: inline-flex; gap: var(--space-2); align-items: center; }
.hero.is-today .u-led { background: var(--signal); }
@container hero (min-width: 260px) { .hero { padding: var(--space-4); } .hero__pos { display: inline; } }
@container hero (min-width: 400px) { .hero__date { display: inline; } }

/* ── Transport ── */
.transport { container: transport / inline-size; display: flex; gap: var(--space-2); min-width: 0; }
.transport .u-key { flex: 1 1 0; height: clamp(52px, 19cqi, 100px); }
.transport .k-today { display: none; }
.transport .u-key__glyph { align-self: center; font: 800 clamp(18px, 6cqi, 34px)/1 var(--font-sans); }
@container transport (max-width: 199px) { .transport .u-key__text { display: none; } .transport .u-key { justify-content: center; align-items: center; } }

/* ── Event list / cards ── */
.events { container: events / inline-size; }
.elist { display: flex; flex-direction: column; min-height: 0; overflow: auto; }
.ev { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px var(--space-3); align-items: center; padding: var(--space-2) 0; border-top: 1px solid var(--line); cursor: pointer; background: none; }
.ev:first-child { border-top: 0; }
.ev.is-sel .ev__name { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.ev__days { font: 800 22px/1 var(--font-sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; min-width: 3.2ch; text-align: right; }
.ev__unit { display: block; font: 700 9px/12px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); text-align: right; }
.ev__name { font: 700 15px/20px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev__date { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev__acts { display: flex; gap: var(--space-1); }
.ev__acts .u-key { width: auto; padding: 0 10px; height: 32px; justify-content: center; align-items: center; font-size: 11px; }
.ev.is-today .ev__days { color: var(--signal-text); }
.ev.is-past .ev__days, .ev.is-past .ev__name { color: var(--ink-muted); }
.ev__acts .k-edit { display: none; }
.elist__past { font: 700 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); padding: var(--space-3) 0 var(--space-1); border-top: 2px solid var(--rule); margin-top: var(--space-2); }
.empty { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); margin: 0; padding: var(--space-2) 0; }
@container events (min-width: 380px) { .ev__acts .k-edit { display: inline-flex; } }
@container events (min-width: 560px) {
  .elist { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-2); align-content: start; }
  .ev { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "days acts" "name name" "date date"; align-items: start; padding: var(--space-3); border-top: 0; background: var(--key); box-shadow: var(--shadow-key); }
  .ev > :nth-child(1) { grid-area: days; } .ev > :nth-child(2) { grid-area: name; display: contents; } .ev > :nth-child(3) { grid-area: acts; }
  .ev__days { font-size: 40px; text-align: left; } .ev__unit { text-align: left; }
  .ev.is-sel { background: var(--ink); color: var(--chassis); }
  .ev.is-sel .ev__date, .ev.is-sel .ev__unit { color: var(--chassis); opacity: .7; }
  .ev.is-sel .ev__name { text-decoration: none; }
  .ev.is-sel .ev__acts .u-key { background: var(--chassis); color: var(--ink); }
  .ev__name { grid-area: name; white-space: normal; } .ev__date { grid-area: date; }
  .elist__past { grid-column: 1 / -1; }
  .empty { grid-column: 1 / -1; }
}

/* ── Add form ── */
.form { display: flex; flex-direction: column; gap: var(--space-3); }
.form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
input[type="date"].u-field__input, input[type="time"].u-field__input { font-family: var(--font-mono); font-size: 14px; color-scheme: light; }
[data-theme="dark"] input[type="date"].u-field__input, [data-theme="dark"] input[type="time"].u-field__input { color-scheme: dark; }
.form__err { font: 400 13px/18px var(--font-sans); color: var(--signal-text); min-height: 18px; margin: 0; }

/* ── Calendar strip ── */
.cal { display: grid; grid-template-columns: 34px repeat(31, minmax(0, 1fr)); gap: 2px; align-items: center; }
.cal__m { font: 700 9px/12px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.cal__d { height: clamp(8px, 1.6cqh, 16px); background: var(--panel-sunk); min-width: 0; }
.cal__d.is-none { background: transparent; }
.cal__d.is-ev { background: var(--ink); cursor: pointer; }
.cal__d.is-today { box-shadow: inset 0 0 0 2px var(--signal); }
.cal__d.is-ev.is-today { background: var(--signal); box-shadow: none; }
.cal__head { display: contents; }
.cal__n { font: 500 8px/10px var(--font-mono); color: var(--ink-muted); text-align: center; }

/* ── Tiers ── */
@container shell (min-width: 300px) and (min-height: 360px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar" "hero" "transport"; }
  .bar { display: flex; }
}
@container shell (min-width: 300px) { .transport .k-today { display: inline-flex; } }
@container shell (min-width: 300px) and (min-height: 540px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar" "hero" "transport" "events"; }
  .events { display: flex; max-height: 34cqh; }
}
@container shell (min-width: 520px) and (min-height: 760px) {
  .device { gap: var(--space-4); padding: var(--space-4); grid-template-columns: minmax(0, 1fr) minmax(240px, .8fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar bar" "hero hero" "transport transport" "events add"; }
  .events { max-height: 38cqh; }
  .p-add { display: flex; }
}
@container shell (min-width: 560px) and (max-height: 359px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(180px, 30cqi, 300px); grid-template-rows: minmax(0, 1fr); grid-template-areas: "hero transport"; }
}
@container shell (min-width: 560px) and (min-height: 360px) and (max-height: 539px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(220px, 38cqi, 380px); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "hero events" "transport events"; }
  .events { display: flex; max-height: none; }
}
@container shell (min-width: 560px) and (max-height: 359px) {
  .transport { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; grid-template-areas: "prev next" "today today"; }
  .transport .u-key { height: auto; }
  .k-prev { grid-area: prev; } .k-next { grid-area: next; } .k-today { grid-area: today; }
}
@container shell (min-width: 820px) and (min-height: 540px) {
  .device { gap: var(--space-4); padding: var(--space-6); grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "bar bar" "hero events" "transport events" "add events"; }
  .events, .p-add { display: flex; max-height: none; }
  .p-add .form { flex-direction: row; flex-wrap: wrap; align-items: flex-end; }
  .p-add .form > * { flex: 1 1 200px; }
  .p-add .form > .row2 { flex: 2 1 300px; }
  .p-add .form > .u-switch { flex: 0 0 auto; }
  .p-add .form > .form__err { flex: 1 0 100%; min-height: 0; }
}
@container shell (min-width: 820px) and (max-height: 759px) {
  .device { padding: var(--space-4); }
  .u-panel__head { padding: var(--space-1) 0 var(--space-2); }
  .u-panel__body { padding: 0; gap: var(--space-3); }
}
@container shell (min-width: 820px) and (min-height: 540px) and (max-height: 759px) { .transport .u-key { height: 56px; } }
@container shell (min-width: 1180px) and (min-height: 760px) {
  .device { padding: var(--space-8); grid-template-columns: minmax(260px, .8fr) minmax(0, 1.5fr) minmax(340px, 1.1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "bar bar bar" "add hero events" "add transport events" "cal cal events"; }
  .events, .p-add, .p-cal { display: flex; }
  .p-add .form { flex-direction: column; align-items: stretch; flex-wrap: nowrap; }
  .p-add .form > *, .p-add .form > .row2, .p-add .form > .u-switch, .p-add .form > .form__err { flex: none; }
}
/* iOS zooms into any field under 16px: keep every text field at 16px or more */
input#fDate, input#fName, input#fTime { font-size: 16px !important; }
</style>
</head>
<body>
<div class="shell">
<main class="device">

  <header class="bar">
    <span class="bar__title"><span class="bar__idx">23</span>Countdown</span>
    <div class="bar__right">
      <span class="u-label bar__meta" id="barMeta">3 events</span>
      <button class="u-switch" role="switch" aria-checked="false" id="themeSw" aria-label="Dark theme">
        <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
        <span class="u-label">Dark</span>
      </button>
    </div>
  </header>

  <section class="hero u-display" id="hero" aria-label="Selected event">
    <div class="hero__top">
      <span class="hero__name" id="heroName">–</span>
      <span class="u-display__label hero__pos" id="heroPos">01 / 03</span>
    </div>
    <div class="hero__main" aria-live="polite"><span class="hero__num"><output class="big" id="big">–</output><span class="u-display__unit hero__unit" id="heroUnit">Days</span></span></div>
    <div class="hero__bottom">
      <span class="u-display__label hero__state" id="heroState"><span class="u-led" id="heroLed"></span><span id="heroStateText">Next up</span></span>
      <span class="u-display__label hero__date" id="heroDate"></span>
    </div>
  </section>

  <section class="transport" aria-label="Browse events">
    <button class="u-key k-prev" id="prev" aria-label="Previous event"><span class="u-key__glyph" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 4L4 12l13 8z"/></svg></span><span class="u-key__text">Prev</span></button>
    <button class="u-key k-next" id="next" aria-label="Next event"><span class="u-key__glyph" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg></span><span class="u-key__text">Next</span></button>
    <button class="u-key u-key--ink k-today" id="soonest" aria-label="Jump to soonest event"><span class="u-key__top"><span class="u-key__index">S</span></span><span class="u-key__text">Soonest</span></button>
  </section>

  <section class="section events" aria-label="Events">
    <div class="section__head"><span class="u-label"><b>01</b> Events</span><span class="u-label" id="eventsMeta">Soonest first</span></div>
    <div class="elist" id="elist"></div>
  </section>

  <section class="u-panel p-add" aria-label="Add event">
    <header class="u-panel__head"><span class="u-label"><b>02</b> <span id="formTitle">Add event</span></span><span class="u-label" id="formMeta">Local time</span></header>
    <div class="u-panel__body">
      <form class="form" id="form" autocomplete="off">
        <label class="u-field"><span class="u-label">Name</span><input class="u-field__input" id="fName" maxlength="40" placeholder="Trip, birthday, launch…"></label>
        <div class="row2">
          <label class="u-field"><span class="u-label">Date</span><input class="u-field__input" id="fDate" type="date"></label>
          <label class="u-field"><span class="u-label">Time · optional</span><input class="u-field__input" id="fTime" type="time"></label>
        </div>
        <button class="u-switch" type="button" role="switch" aria-checked="false" id="fYearly">
          <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
          <span class="u-label">Repeats yearly</span>
        </button>
        <div class="row">
          <button class="u-key k-row grow" type="submit" id="fSave">Add event</button>
          <button class="u-key k-row" type="button" id="fCancel" style="display:none;min-width:80px">Cancel</button>
        </div>
        <p class="form__err" id="fErr" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <section class="u-panel p-cal" aria-label="Next 12 months">
    <header class="u-panel__head"><span class="u-label"><b>03</b> Next 12 months</span><span class="u-label" id="calMeta"></span></header>
    <div class="u-panel__body"><div class="cal" id="cal" aria-hidden="true"></div></div>
  </section>

</main>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n, w) { n = String(Math.max(0, Math.floor(Math.abs(n)))); while (n.length < w) n = '0' + n; return n; };
  var clamp = function (n, a, b) { return Math.min(b, Math.max(a, n)); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function load(key, state) { try { var s = JSON.parse(localStorage.getItem(key) || 'null'); if (s) Object.assign(state, s); } catch (e) {} }
  function saver(key, state) { return function () { try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {} }; }
  function themeInit(state, save) {
    function apply() {
      var dark = state.theme ? state.theme === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      $('themeSw').setAttribute('aria-checked', String(dark));
    }
    $('themeSw').addEventListener('click', function () { state.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; apply(); save(); });
    apply();
  }
  function bindSwitch(el, get, set) {
    var sync = function () { el.setAttribute('aria-checked', String(!!get())); };
    el.addEventListener('click', function () { set(!get()); sync(); });
    sync(); return sync;
  }


  var KEY = 'unit01-countdown';
  var state = { theme: null, sel: null, events: null };
  load(KEY, state);
  var save = saver(KEY, state);
  themeInit(state, save);

  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function today() { var n = new Date(); return { y: n.getFullYear(), m: n.getMonth(), d: n.getDate() }; }
  function ymd(y, m, d) { return y + '-' + pad(m + 1, 2) + '-' + pad(d, 2); }
  var uid = function () { return Math.random().toString(36).slice(2, 9); };

  if (!Array.isArray(state.events)) {
    var t = today();
    state.events = [
      { id: uid(), name: 'New Year', date: (t.y + 1) + '-01-01', time: '', yearly: true },
      { id: uid(), name: 'Weekend trip', date: (function () { var x = new Date(t.y, t.m, t.d + 12); return ymd(x.getFullYear(), x.getMonth(), x.getDate()); })(), time: '09:00', yearly: false },
      { id: uid(), name: 'Mid-summer', date: t.y + '-06-21', time: '', yearly: true }
    ];
  }

  /* Calendar-day difference, DST-safe (compare as UTC midnights) */
  function dayIndex(y, m, d) { return Math.round(Date.UTC(y, m, d) / 86400000); }
  function parseDate(s) { var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return p ? { y: +p[1], m: +p[2] - 1, d: +p[3] } : null; }
  function clampDay(y, m, d) { var last = new Date(y, m + 1, 0).getDate(); return Math.min(d, last); }
  /* Resolve an event to its next (or only) occurrence */
  function occ(ev) {
    var p = parseDate(ev.date); if (!p) return null;
    var t = today(), tIdx = dayIndex(t.y, t.m, t.d), y = p.y, m = p.m, d = p.d;
    if (ev.yearly) {
      y = t.y; d = clampDay(y, m, p.d);
      if (dayIndex(y, m, d) < tIdx) { y = t.y + 1; d = clampDay(y, m, p.d); }
    }
    var hm = /^(\d{2}):(\d{2})$/.exec(ev.time || ''), H = hm ? +hm[1] : 0, M = hm ? +hm[2] : 0;
    var at = new Date(y, m, d, H, M, 0, 0);
    return { y: y, m: m, d: d, days: dayIndex(y, m, d) - tIdx, at: at, hasTime: !!hm };
  }
  function sorted() {
    var list = state.events.map(function (e) { return { e: e, o: occ(e) }; }).filter(function (x) { return x.o; });
    var up = list.filter(function (x) { return x.o.days >= 0; }).sort(function (a, b) { return a.o.at - b.o.at; });
    var past = list.filter(function (x) { return x.o.days < 0; }).sort(function (a, b) { return b.o.at - a.o.at; });
    return { up: up, past: past, all: up.concat(past) };
  }
  function fmtDate(o, ev) {
    var dt = new Date(o.y, o.m, o.d);
    return DOW[dt.getDay()] + ' ' + o.d + ' ' + MONTHS[o.m] + ' ' + o.y + (o.hasTime ? ' · ' + ev.time : '') + (ev.yearly ? ' · yearly' : '');
  }
  function hms(ms) { ms = Math.max(0, ms); var s = Math.floor(ms / 1000), h = Math.floor(s / 3600); return pad(h, 2) + ':' + pad(Math.floor(s % 3600 / 60), 2) + ':' + pad(s % 60, 2); }

  var S = sorted(), heroItem = null;
  function selected() {
    var all = S.all; if (!all.length) return null;
    var i = all.findIndex(function (x) { return x.e.id === state.sel; });
    if (i < 0) { state.sel = (S.up[0] || all[0]).e.id; i = all.findIndex(function (x) { return x.e.id === state.sel; }); }
    return { item: all[i], i: i, n: all.length };
  }

  function renderHero() {
    var hero = $('hero'), s = selected(), big = $('big'), unit = $('heroUnit');
    hero.classList.remove('is-today', 'is-past');
    if (!s) {
      $('heroName').textContent = 'No events'; big.className = 'big big--word'; big.textContent = 'Add one';
      unit.textContent = ''; $('heroPos').textContent = '00 / 00'; $('heroStateText').textContent = 'Empty'; $('heroDate').textContent = ''; heroItem = null; return;
    }
    heroItem = s.item; var e = s.item.e, o = s.item.o, now = Date.now(), ms = o.at - now;
    $('heroName').textContent = e.name;
    $('heroPos').textContent = pad(s.i + 1, 2) + ' / ' + pad(s.n, 2);
    $('heroDate').textContent = fmtDate(o, e);
    var state_ = '';
    if (o.days < 0) {
      hero.classList.add('is-past'); big.className = 'big'; big.textContent = -o.days; unit.textContent = -o.days === 1 ? 'Day since' : 'Days since'; state_ = 'Past';
    } else if (o.days === 0 && (!o.hasTime || ms <= 0)) {
      hero.classList.add('is-today'); big.className = 'big big--word'; big.textContent = 'Today'; unit.textContent = ''; state_ = o.hasTime ? 'Started ' + e.time : 'It’s today';
    } else if (ms < 48 * 3600 * 1000) {
      if (o.days === 0) hero.classList.add('is-today');
      big.className = 'big big--clock'; big.textContent = hms(ms); unit.textContent = ''; state_ = o.days === 0 ? 'Today at ' + e.time : (o.days === 1 ? 'Tomorrow' : 'In 2 days');
    } else {
      big.className = 'big'; big.textContent = o.days; unit.textContent = o.days === 1 ? 'Day' : 'Days';
      var wk = Math.floor(o.days / 7); state_ = s.item === S.up[0] ? 'Next up' : (wk >= 1 ? wk + (wk === 1 ? ' week' : ' weeks') + ' ' + (o.days % 7) + 'd' : 'Coming up');
    }
    $('heroLed').classList.toggle('is-lit', hero.classList.contains('is-today'));
    $('heroStateText').textContent = state_;
  }

  var armed = null, armT = null;
  function renderList() {
    var box = $('elist'), h = '';
    function row(x) {
      var e = x.e, o = x.o, past = o.days < 0, n = Math.abs(o.days);
      var cls = 'ev' + (e.id === state.sel ? ' is-sel' : '') + (o.days === 0 ? ' is-today' : '') + (past ? ' is-past' : '');
      var num = n;
      var unit = o.days === 0 ? 'Today' : past ? (n === 1 ? 'Day ago' : 'Days ago') : (n === 1 ? 'Day' : 'Days');
      var delLbl = armed === e.id ? 'Sure?' : '×';
      return '<div class="' + cls + '" data-id="' + e.id + '" role="button" tabindex="0" aria-label="' + esc(e.name) + ', ' + unit.toLowerCase() + ' ' + (o.days === 0 ? '' : n) + '">' +
        '<div><span class="ev__days">' + num + '</span><span class="ev__unit">' + unit + '</span></div>' +
        '<div style="min-width:0"><div class="ev__name">' + esc(e.name) + '</div><div class="ev__date">' + esc(fmtDate(o, e)) + '</div></div>' +
        '<div class="ev__acts"><button class="u-key k-edit" data-act="edit" aria-label="Edit ' + esc(e.name) + '">Edit</button>' +
        '<button class="u-key' + (armed === e.id ? ' is-armed' : '') + '" data-act="del" aria-label="Delete ' + esc(e.name) + '">' + delLbl + '</button></div></div>';
    }
    if (!S.all.length) h = '<p class="empty">No events yet. Add a birthday, trip or deadline.</p>';
    S.up.forEach(function (x) { h += row(x); });
    if (S.past.length) { h += '<div class="elist__past">Past</div>'; S.past.forEach(function (x) { h += row(x); }); }
    box.innerHTML = h;
    $('barMeta').textContent = state.events.length + (state.events.length === 1 ? ' event' : ' events');
    $('eventsMeta').textContent = S.up.length + ' upcoming' + (S.past.length ? ' · ' + S.past.length + ' past' : '');
  }

  function renderCal() {
    var t = today(), box = $('cal'), h = '<span></span>';
    for (var d = 1; d <= 31; d++) h += '<span class="cal__n">' + (d % 5 === 0 || d === 1 ? d : '') + '</span>';
    var marks = {};
    state.events.forEach(function (e) {
      var p = parseDate(e.date); if (!p) return;
      for (var k = 0; k < 12; k++) {
        var mm = (t.m + k) % 12, yy = t.y + Math.floor((t.m + k) / 12);
        if (e.yearly ? p.m === mm : (p.y === yy && p.m === mm)) { var dd = e.yearly ? clampDay(yy, mm, p.d) : p.d; (marks[yy + '-' + mm + '-' + dd] = marks[yy + '-' + mm + '-' + dd] || []).push(e); }
      }
    });
    var count = 0;
    for (var k = 0; k < 12; k++) {
      var m = (t.m + k) % 12, y = t.y + Math.floor((t.m + k) / 12), last = new Date(y, m + 1, 0).getDate();
      h += '<span class="cal__m">' + MONTHS[m] + (m === 0 ? ' ' + String(y).slice(2) : '') + '</span>';
      for (var dd = 1; dd <= 31; dd++) {
        if (dd > last) { h += '<span class="cal__d is-none"></span>'; continue; }
        var ev = marks[y + '-' + m + '-' + dd], isT = k === 0 && dd === t.d, past = k === 0 && dd < t.d;
        if (ev) count++;
        h += '<span class="cal__d' + (ev ? ' is-ev' : '') + (isT ? ' is-today' : '') + '"' + (past && !ev ? ' style="opacity:.45"' : '') + (ev ? ' data-id="' + ev[0].id + '" title="' + esc(ev.map(function (x) { return x.name; }).join(', ')) + '"' : '') + '></span>';
      }
    }
    box.innerHTML = h;
    $('calMeta').textContent = count + (count === 1 ? ' date' : ' dates');
  }

  function renderAll() { S = sorted(); renderHero(); renderList(); renderCal(); }

  /* ── browsing ── */
  function step(d) { var s = selected(); if (!s) return; var all = S.all; state.sel = all[(s.i + d + all.length) % all.length].e.id; renderHero(); renderList(); save(); }
  $('prev').addEventListener('click', function () { step(-1); });
  $('next').addEventListener('click', function () { step(1); });
  $('soonest').addEventListener('click', function () { if (S.up[0]) { state.sel = S.up[0].e.id; renderHero(); renderList(); save(); } });
  $('elist').addEventListener('click', function (ev) {
    var r = ev.target.closest('.ev'); if (!r) return; var id = r.dataset.id, act = ev.target.closest('[data-act]');
    if (act && act.dataset.act === 'del') {
      if (armed !== id) { armed = id; clearTimeout(armT); armT = setTimeout(function () { armed = null; renderList(); }, 2500); renderList(); return; }
      armed = null; clearTimeout(armT);
      state.events = state.events.filter(function (e) { return e.id !== id; });
      if (state.sel === id) state.sel = null; if (editing === id) cancelEdit();
      renderAll(); save(); return;
    }
    if (act && act.dataset.act === 'edit') { startEdit(id); return; }
    state.sel = id; renderHero(); renderList(); save();
  });
  $('elist').addEventListener('keydown', function (ev) { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList.contains('ev')) { ev.preventDefault(); ev.target.click(); } });
  $('cal').addEventListener('click', function (ev) { var c = ev.target.closest('[data-id]'); if (c) { state.sel = c.dataset.id; renderHero(); renderList(); save(); } });

  /* ── add / edit ── */
  var yearly = false, editing = null;
  var syncYearly = bindSwitch($('fYearly'), function () { return yearly; }, function (v) { yearly = v; });
  function resetForm() { $('fName').value = ''; $('fDate').value = ''; $('fTime').value = ''; yearly = false; syncYearly(); $('fErr').textContent = ''; }
  function startEdit(id) {
    var e = state.events.find(function (x) { return x.id === id; }); if (!e) return;
    editing = id; $('fName').value = e.name; $('fDate').value = e.date; $('fTime').value = e.time || ''; yearly = !!e.yearly; syncYearly();
    $('formTitle').textContent = 'Edit event'; $('fSave').textContent = 'Save'; $('fCancel').style.display = '';
    state.sel = id; renderHero(); renderList(); $('fName').focus();
  }
  function cancelEdit() { editing = null; resetForm(); $('formTitle').textContent = 'Add event'; $('fSave').textContent = 'Add event'; $('fCancel').style.display = 'none'; }
  $('fCancel').addEventListener('click', cancelEdit);
  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var name = $('fName').value.trim(), date = $('fDate').value, time = $('fTime').value;
    if (!name) { $('fErr').textContent = 'Give the event a name.'; $('fName').focus(); return; }
    if (!parseDate(date)) { $('fErr').textContent = 'Pick a date.'; $('fDate').focus(); return; }
    if (editing) {
      var e = state.events.find(function (x) { return x.id === editing; });
      if (e) { e.name = name; e.date = date; e.time = time; e.yearly = yearly; state.sel = e.id; }
      cancelEdit();
    } else {
      if (state.events.length >= 40) { $('fErr').textContent = 'That’s 40 events — remove one first.'; return; }
      var n = { id: uid(), name: name, date: date, time: time, yearly: yearly };
      state.events.push(n); state.sel = n.id; resetForm();
    }
    renderAll(); save();
  });

  document.addEventListener('keydown', function (e) {
    var t = e.target, inCtl = t.closest && t.closest('button, input, select, textarea, [role="button"]');
    if (inCtl) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
    else if (e.key === 's' || e.key === 'S') { $('soonest').click(); }
    else if (e.key === 'n' || e.key === 'N') { var f = $('fName'); if (f.offsetParent) { e.preventDefault(); f.focus(); } }
  });

  /* Tick: once a second while a clock is showing, else once a minute; re-sort at midnight */
  var lastDay = dayIndex(today().y, today().m, today().d);
  function tick() {
    var t = today(), di = dayIndex(t.y, t.m, t.d);
    if (di !== lastDay) { lastDay = di; renderAll(); }
    else renderHero();
    var clock = $('big').classList.contains('big--clock');
    setTimeout(tick, clock ? 1000 - (Date.now() % 1000) + 5 : 30000);
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) renderAll(); });

  renderAll(); save(); tick();
})();
</script>
</body>
</html>
