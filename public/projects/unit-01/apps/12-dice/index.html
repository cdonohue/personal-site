<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 01 — Dice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* ── Unit 01 tokens ─────────────────────────────────────────── */
:root, [data-theme="light"] {
  --chassis:#ffffff; --panel:#ffffff; --panel-sunk:#f0f0ee; --ink:#000000; --ink-muted:#5f5f5c; --line:#c8c8c4; --rule:var(--ink);
  --signal:#ff5a1f; --signal-text:#a83400; --on-signal:#000000; --blue:#3a63d8; --on-blue:#ffffff; --yellow:#f5c400; --on-yellow:#111111;
  --key:#e6e6e3; --lcd:#0b0b0b; --lcd-ink:#f2f2ef; --lcd-muted:#8f8f8a; --lcd-dim:#2a2a2a; --focus:var(--ink);
  --shadow-key:0 2px 0 #00000040; --shadow-key-pressed:0 0 0 #00000040;
}
[data-theme="dark"] {
  --chassis:#000000; --panel:#000000; --panel-sunk:#161616; --ink:#ffffff; --ink-muted:#9b9b97; --line:#3a3a3a; --key:#262626; --rule:var(--ink);
  --signal-text:#ff7a45; --shadow-key:0 2px 0 #ffffff26; --shadow-key-pressed:0 0 0 #ffffff26;
}
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-0:0; --radius-sm:2px; --radius-md:6px; --radius-full:9999px;
  --font-sans:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* ── Unit 01 components (vanilla port of the bundle) ────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); background: var(--chassis); color: var(--ink); -webkit-font-smoothing: antialiased; }
:where(button, input, [role="slider"]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.u-label { display: inline-flex; gap: var(--space-2); align-items: baseline; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.u-label b { font-weight: 700; color: var(--ink); }
.u-value { font-family: var(--font-mono); font-size: 13px; line-height: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
.u-led { display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--line); flex: none; }
.u-key .u-led, .u-selector__opt .u-led { background: var(--line); }
.is-on > .u-led, .u-led.is-lit { background: var(--signal); }

.u-key { appearance: none; position: relative; display: inline-flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  min-width: 0; padding: var(--space-2); border: 0; border-radius: var(--radius-0); background: var(--key); color: var(--ink);
  font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: left;
  box-shadow: var(--shadow-key); cursor: pointer; transition: transform 60ms linear, box-shadow 60ms linear; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.u-key:active, .u-key.is-hit, .u-key[aria-pressed="true"] { transform: translateY(2px); box-shadow: var(--shadow-key-pressed); }
.u-key--ink { background: var(--ink); color: var(--chassis); }
.u-key--signal { background: var(--signal); color: var(--on-signal); }
.u-key--blue { background: var(--blue); color: var(--on-blue); }
.u-key--yellow { background: var(--yellow); color: var(--on-yellow); }
.u-key__top { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: var(--space-1); }
.u-key__index { font-family: var(--font-mono); font-weight: 500; font-size: 9px; line-height: 12px; letter-spacing: .1em; opacity: .75; }
.u-key__glyph { align-self: center; display: flex; }
.u-key__glyph svg { width: 22px; height: 22px; fill: currentColor; }
.u-key--sm { width: 40px; height: 40px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; }

.u-panel { background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: var(--radius-0); min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
.u-panel__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-3); }
.u-panel__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel__body { padding: 0 0 var(--space-2); display: flex; flex-direction: column; gap: var(--space-4); flex: 1; }

.u-display { background: var(--lcd); color: var(--lcd-ink); border: 1px solid var(--line); border-radius: var(--radius-0); font-family: var(--font-mono); }
.u-display__label { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--lcd-muted); white-space: nowrap; }
.u-display__unit { font-size: 13px; line-height: 16px; color: var(--lcd-muted); text-transform: uppercase; letter-spacing: .08em; }

.u-selector { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-selector__row { display: flex; gap: 2px; border-radius: var(--radius-0); }
.u-selector__opt { appearance: none; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-2);
  background: var(--key); color: var(--ink); border: 0; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.u-selector__opt:first-child { border-left: 0; }
.u-selector__opt.is-on { background: var(--ink); color: var(--chassis); }
.u-selector__opt:focus-visible { outline-offset: -4px; }

.u-switch { appearance: none; display: inline-flex; align-items: center; gap: var(--space-3); padding: var(--space-1) 0; background: none; border: 0; color: var(--ink); cursor: pointer; }
.u-switch__track { position: relative; width: 40px; height: 20px; background: var(--panel-sunk); border: 1px solid var(--ink); border-radius: var(--radius-sm); flex: none; }
.u-switch__thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 14px; background: var(--ink); border-radius: var(--radius-sm); transition: left 80ms linear; }
.u-switch[aria-checked="true"] .u-switch__track { background: var(--signal); }
.u-switch[aria-checked="true"] .u-switch__thumb { left: 20px; background: var(--on-signal); }
.u-switch__state { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; min-width: 3ch; }

.u-fader { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-fader__head { display: flex; justify-content: space-between; align-items: baseline; }
.u-fader__input { appearance: none; -webkit-appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: ew-resize; }
.u-fader__input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-moz-range-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 28px; margin-top: -13px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }
.u-fader__input::-moz-range-thumb { width: 14px; height: 28px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }

.u-knob { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.u-knob__dial { border-radius: var(--radius-full); cursor: grab; touch-action: none; line-height: 0; }
.u-knob__tick { stroke: var(--line); stroke-width: 1.5; }
.u-knob__track { fill: none; stroke: var(--panel-sunk); stroke-width: 3; }
.u-knob__arc { fill: none; stroke: var(--signal); stroke-width: 3; }
.u-knob__cap { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.u-knob__ind { stroke: var(--ink); stroke-width: 3; stroke-linecap: square; }
.u-knob__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; }


/* ── Unit 01 app shell (shared) ── */
.shell { height: 100dvh; overflow: auto; container: shell / size; }
.device { min-height: 100%; display: grid; gap: var(--space-2); padding: var(--space-2); grid-template-columns: minmax(0, 1fr); }
.bar { display: none; grid-area: bar; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-1) var(--space-1) 0; container: bar / inline-size; min-width: 0; }
.bar__title { display: inline-flex; align-items: flex-start; gap: var(--space-2); font: 800 clamp(18px, 4.2cqi, 34px)/1 var(--font-sans); letter-spacing: -.025em; white-space: nowrap; }
.bar__idx { font: 500 9px/12px var(--font-mono); letter-spacing: .1em; color: var(--ink-muted); }
.bar__right { display: flex; align-items: center; gap: var(--space-4); }
.bar__meta { display: none; }
@container bar (min-width: 400px) { .bar__meta { display: inline-flex; } }
.sect { border-top: 2px solid var(--rule); padding-top: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; min-height: 0; }
.sect__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.hero { container: hero / inline-size; display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-2); padding: var(--space-3); min-height: 0; min-width: 0; overflow: hidden; }
.hero__top, .hero__bottom { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); min-width: 0; }
@container hero (min-width: 260px) { .hero { padding: var(--space-4); } }
.big { font-family: var(--font-sans); font-weight: 800; letter-spacing: -.045em; line-height: .9; font-variant-numeric: tabular-nums; }
.stepper { display: flex; align-items: center; gap: var(--space-2); }
.stepper__val { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 22px; line-height: 40px; height: 40px; background: var(--panel-sunk); font-variant-numeric: tabular-nums; }
.mini { padding: var(--space-3); display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.mini__num { font-family: var(--font-mono); font-size: 24px; line-height: 24px; font-variant-numeric: tabular-nums; }
.u-field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.u-field__input { width: 100%; padding: var(--space-2) var(--space-3); min-height: 40px; background: var(--panel-sunk); color: var(--ink); border: 0; border-bottom: 2px solid var(--ink); border-radius: var(--radius-0); font: 400 15px/22px var(--font-sans); resize: none; }
.u-field__input::placeholder { color: var(--ink-muted); }
.u-field__input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.note { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); margin: 0; }
.row { display: flex; gap: var(--space-2); align-items: stretch; }
.row > .u-key { height: 40px; align-items: center; justify-content: center; flex: 1; }
.row > .u-key--sm { flex: none; }
@container (max-width: 300px) { .u-selector__opt .u-led { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ── Dice ── */
.hero { grid-area: hero; } .tray { grid-area: tray; } .transport { grid-area: transport; }
.p-setup { grid-area: setup; } .p-history { grid-area: history; } .p-stats { grid-area: stats; }
.tray, .p-setup, .p-history, .p-stats { display: none; }
.device { grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "hero" "transport"; }

.hero__main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; text-align: center; }
.result { font-size: clamp(40px, min(30cqi, 24cqb), 260px); }
.result.is-word { font-size: clamp(28px, min(17cqi, 18cqb), 170px); }
.result.is-long { font-size: clamp(20px, min(10cqi, 12cqb), 110px); letter-spacing: -.03em; line-height: 1; overflow-wrap: anywhere; }
.result.is-idle { color: var(--lcd-muted); font-size: clamp(20px, min(8cqi, 10cqb), 64px); letter-spacing: 0; }
.hero.is-rolling .result { color: var(--lcd-muted); }
.hero__spec, .hero__extra { display: none; }
.hero__detail { font-family: var(--font-mono); font-size: 13px; line-height: 16px; color: var(--lcd-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@container hero (min-width: 260px) { .hero__spec { display: inline; } }
@container hero (min-width: 420px) { .hero__extra { display: inline; } }

/* tray: dice tiles, coin flips, pick items */
.tray { container: tray / inline-size; }
.tray__grid { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 112px)); gap: var(--space-2); }
.die { aspect-ratio: 1; height: auto; width: 100%; padding: 6px; }
.die .u-key__top { min-height: 12px; }
.die__face { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; }
.die__num { font: 800 clamp(16px, 7cqi, 40px)/1 var(--font-sans); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.pips { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 70%; aspect-ratio: 1; }
.pips i { place-self: center; width: 62%; aspect-ratio: 1; border-radius: var(--radius-full); background: currentColor; visibility: hidden; }
.pips i.on { visibility: visible; }
.die[aria-pressed="true"] { background: var(--ink); color: var(--chassis); }
.die.is-rolling .die__face { animation: jig 70ms steps(2) infinite; }
@keyframes jig { 50% { transform: translate(1px, -1px) rotate(4deg); } }
.flip { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--key); font: 800 clamp(12px, 4cqi, 22px)/1 var(--font-sans); }
.flip.is-h { background: var(--ink); color: var(--chassis); }
.tray__grid--coin, .tray__grid--pick { grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); }
.tray__grid--pick { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.chip { padding: var(--space-2); background: var(--key); font: 700 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.is-gone { background: transparent; color: var(--ink-muted); text-decoration: line-through; outline: 1px dashed var(--line); outline-offset: -1px; }
.chip.is-hit { background: var(--ink); color: var(--chassis); }
.tray__empty { margin: 0; }

/* transport */
.transport { container: transport / inline-size; display: flex; gap: var(--space-2); min-width: 0; }
.transport .u-key { flex: 1 1 0; height: clamp(56px, 20cqi, 104px); }
.transport .k-roll { flex-grow: 2; }
.transport .k-type { display: none; }
.k-roll .u-key__glyph svg { width: clamp(20px, 6cqi, 32px); height: clamp(20px, 6cqi, 32px); }
@container transport (max-width: 199px) { .transport .u-key__index { display: none; } }

/* setup panel */
.types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
.types .u-selector__opt { border-left: 0; }
.mode-dice, .mode-coin, .mode-pick { display: none; flex-direction: column; gap: var(--space-3); }
[data-mode="dice"] .mode-dice, [data-mode="coin"] .mode-coin, [data-mode="pick"] .mode-pick { display: flex; }
[data-mode="coin"] .k-type, [data-mode="pick"] .k-type { display: none !important; }
.sw-row { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); flex-wrap: wrap; }

/* history & stats */
.p-history .u-panel__body, .p-stats .u-panel__body { min-height: 0; }
.hist { list-style: none; margin: 0; padding: 0; flex: 1; height: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.hist li { display: flex; gap: var(--space-3); padding: 6px 0; border-bottom: 1px solid var(--line); font: 500 13px/16px var(--font-mono); font-variant-numeric: tabular-nums; min-width: 0; }
.hist li span:first-child { color: var(--ink-muted); flex: none; }
.hist li span:nth-child(2) { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist li b { font: 800 15px/16px var(--font-sans); }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding: var(--space-3); }
.bars__col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; min-width: 0; }
.bars__bar { width: 100%; background: var(--lcd-ink); min-height: 2px; }
.bars__lbl { font: 500 9px/12px var(--font-mono); color: var(--lcd-muted); }
.bars__col.is-max .bars__bar { background: var(--lcd-ink); }

/* ── Tiers ── */
@container shell (min-width: 300px) and (min-height: 360px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar" "hero" "transport"; }
  .bar { display: flex; }
}
@container shell (min-width: 300px) { .transport .k-type { display: inline-flex; } }
@container shell (min-width: 300px) and (min-height: 540px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar" "hero" "tray" "transport"; }
  .tray { display: flex; }
}
@container shell (min-width: 520px) and (min-height: 760px) {
  .device { gap: var(--space-4); padding: var(--space-4); grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: auto minmax(0, 1fr) auto auto minmax(180px, auto); grid-template-areas: "bar bar" "hero hero" "tray tray" "transport transport" "setup history"; }
  .p-setup, .p-history { display: flex; }
}
@container shell (min-width: 560px) and (max-height: 359px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(200px, 34cqi, 340px); grid-template-rows: minmax(0, 1fr); grid-template-areas: "hero transport"; }
}
@container shell (min-width: 560px) and (min-height: 360px) and (max-height: 539px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(220px, 34cqi, 360px); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "hero transport" "tray transport"; }
  .tray { display: flex; }
  .tray__grid { grid-template-columns: repeat(var(--n, 6), minmax(0, 64px)); }
}
@container shell (min-width: 560px) and (max-height: 539px) {
  .transport { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 2fr 1fr; grid-template-areas: "roll roll" "mode type"; }
  .transport .u-key { height: auto; }
  .k-roll { grid-area: roll; } .k-mode { grid-area: mode; } .k-type { grid-area: type; }
  [data-mode="coin"] .k-mode, [data-mode="pick"] .k-mode { grid-column: 1 / -1; }
}
@container shell (min-width: 820px) and (min-height: 540px) {
  .device { gap: var(--space-4); padding: var(--space-6); grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar bar" "hero setup" "tray history" "transport history"; }
  .tray, .p-setup, .p-history { display: flex; }
}
@container shell (min-width: 820px) and (max-height: 759px) {
  .device { padding: var(--space-4); }
  .u-panel__head { padding: var(--space-1) 0 var(--space-2); }
  .u-panel__body { padding: 0; gap: var(--space-3); }
}
@container shell (min-width: 1180px) and (min-height: 760px) {
  .device { padding: var(--space-8); grid-template-columns: minmax(260px, .8fr) minmax(0, 1.6fr) minmax(320px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar bar bar" "history hero setup" "history tray stats" "history transport stats"; }
  .tray, .p-setup, .p-history, .p-stats { display: flex; }
}
/* iOS zooms into any field under 16px: keep every text field at 16px or more */
textarea#items { font-size: 16px !important; }
</style>
</head>
<body>
<div class="shell">
<main class="device" id="device" data-mode="dice">

  <header class="bar">
    <span class="bar__title"><span class="bar__idx">12</span>Dice</span>
    <div class="bar__right">
      <span class="u-label bar__meta" id="barMeta">3 × D6</span>
      <button class="u-switch" role="switch" aria-checked="false" id="themeSw" aria-label="Dark theme">
        <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
        <span class="u-label">Dark</span>
      </button>
    </div>
  </header>

  <section class="hero u-display" id="hero" aria-label="Result">
    <div class="hero__top">
      <span class="u-display__label" id="heroLabel">Total</span>
      <span class="u-display__label hero__spec" id="heroSpec">3 × D6</span>
      <span class="u-display__label hero__extra" id="heroExtra">Held 0</span>
    </div>
    <div class="hero__main"><output class="big result is-idle" id="result" aria-live="polite">Roll</output></div>
    <div class="hero__bottom"><span class="hero__detail" id="detail">Space to roll</span></div>
  </section>

  <section class="sect tray" aria-label="Tray">
    <div class="sect__head"><span class="u-label"><b>01</b> <span id="trayTitle">Dice</span></span><span class="u-label" id="trayHint">Tap a die to hold</span></div>
    <div class="tray__grid" id="tray"></div>
  </section>

  <section class="transport" aria-label="Controls">
    <button class="u-key k-mode" id="modeKey"><span class="u-key__top"><span class="u-key__index">M</span></span><span class="u-key__text" id="modeText">Dice</span></button>
    <button class="u-key u-key--signal k-roll" id="roll">
      <span class="u-key__top"><span class="u-key__index">Space</span></span>
      <span class="u-key__glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 6.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm8 8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-4-4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z" fill-rule="evenodd"/></svg></span>
      <span class="u-key__text" id="rollText">Roll</span>
    </button>
    <button class="u-key u-key--blue k-type" id="typeKey"><span class="u-key__top"><span class="u-key__index">T</span></span><span class="u-key__text" id="typeText">D6</span></button>
  </section>

  <section class="u-panel p-setup" aria-label="Setup">
    <header class="u-panel__head"><span class="u-label"><b>02</b> Setup</span></header>
    <div class="u-panel__body">
      <div class="u-selector">
        <span class="u-label" id="modeLbl">Mode</span>
        <div class="u-selector__row" role="radiogroup" aria-labelledby="modeLbl" id="modeSel">
          <button class="u-selector__opt" role="radio" data-v="dice"><span class="u-led"></span>Dice</button>
          <button class="u-selector__opt" role="radio" data-v="coin"><span class="u-led"></span>Coin</button>
          <button class="u-selector__opt" role="radio" data-v="pick"><span class="u-led"></span>Pick</button>
        </div>
      </div>
      <div class="mode-dice">
        <div class="u-selector">
          <span class="u-label">Dice</span>
          <div class="stepper">
            <button class="u-key u-key--sm" id="cntMinus" aria-label="Fewer dice">−</button>
            <output class="stepper__val" id="cntVal">03</output>
            <button class="u-key u-key--sm" id="cntPlus" aria-label="More dice">+</button>
          </div>
        </div>
        <div class="u-selector">
          <span class="u-label" id="typeLbl">Type</span>
          <div class="types" role="radiogroup" aria-labelledby="typeLbl" id="typeSel"></div>
        </div>
      </div>
      <div class="mode-coin"><p class="note">Heads and tails, fair to the bit. The streak counts repeats of the same side.</p></div>
      <div class="mode-pick">
        <label class="u-field"><span class="u-label">Items · one per line</span>
          <textarea class="u-field__input" id="items" rows="4" placeholder="Pizza&#10;Tacos&#10;Ramen"></textarea></label>
        <div class="sw-row">
          <button class="u-switch" role="switch" aria-checked="false" id="removeSw">
            <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
            <span class="u-label">Remove after pick</span>
          </button>
          <button class="u-key" id="restore" style="height:40px;flex-direction:row;align-items:center">Restore all</button>
        </div>
      </div>
    </div>
  </section>

  <section class="u-panel p-history" aria-label="History">
    <header class="u-panel__head"><span class="u-label"><b>03</b> History</span><button class="u-key" id="clearHist" style="height:28px;padding:0 10px;flex-direction:row;align-items:center">Clear</button></header>
    <div class="u-panel__body"><ol class="hist" id="hist"></ol></div>
  </section>

  <section class="u-panel p-stats" aria-label="Stats">
    <header class="u-panel__head"><span class="u-label"><b>04</b> Stats</span><span class="u-label" id="statsMeta">D6 · 0 rolls</span></header>
    <div class="u-panel__body">
      <div class="u-display bars" id="bars" aria-hidden="true"></div>
      <p class="note" id="statsNote">How often each face has come up.</p>
    </div>
  </section>

</main>
</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n, w) { var neg = n < 0; n = String(Math.abs(Math.floor(n))); while (n.length < w) n = '0' + n; return (neg ? '−' : '') + n; };
  var clamp = function (n, a, b) { return Math.min(b, Math.max(a, n)); };
  var rand = function (n) { var a = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n, x; do { crypto.getRandomValues(a); x = a[0]; } while (x >= lim); return x % n; };
  function store(key, defaults) {
    var s = JSON.parse(JSON.stringify(defaults));
    try { var v = JSON.parse(localStorage.getItem(key) || 'null'); if (v && typeof v === 'object') Object.assign(s, v); } catch (e) {}
    Object.defineProperty(s, '__save', { enumerable: false, value: function () { try { localStorage.setItem(key, JSON.stringify(s)); } catch (e) {} } });
    return s;
  }
  function theme(state) {
    var sw = $('themeSw');
    function apply() {
      var dark = state.theme ? state.theme === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'; sw.setAttribute('aria-checked', String(dark));
    }
    sw.addEventListener('click', function () { state.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; apply(); state.__save(); });
    apply();
  }
  function selector(el, get, set) {
    var opts = Array.prototype.slice.call(el.querySelectorAll('[role=radio]'));
    function sync() { opts.forEach(function (o) { var on = o.dataset.v === String(get()); o.classList.toggle('is-on', on); o.setAttribute('aria-checked', String(on)); o.tabIndex = on ? 0 : -1; }); }
    opts.forEach(function (o, i) {
      o.addEventListener('click', function () { set(o.dataset.v); sync(); });
      o.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
        if (!d) return; e.preventDefault(); var j = (i + d + opts.length) % opts.length; opts[j].click(); opts[j].focus();
      });
    });
    sync(); return sync;
  }
  function bindSwitch(el, get, set) {
    var sync = function () { el.setAttribute('aria-checked', String(!!get())); };
    el.addEventListener('click', function () { set(!get()); sync(); });
    sync(); return sync;
  }
  function inControl(e) { return e.target.closest && e.target.closest('button, input, textarea, select, [role="slider"]'); }
  var THEME_SWITCH = '';

  var TYPES = [4, 6, 8, 10, 12, 20, 100];
  var MODES = ['dice', 'coin', 'pick'];
  var PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  var S = store('unit01-dice', { theme: null, mode: 'dice', count: 3, sides: 6, dice: [], held: [], history: [], faces: {}, coin: { h: 0, t: 0, last: '', streak: 0, flips: [] }, items: 'Pizza\nTacos\nRamen\nCurry\nSushi', gone: [], remove: false, pickCounts: {}, last: null });
  theme(S);
  var dev = $('device'), rolling = false;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fitDice() {
    S.count = clamp(S.count, 1, 6);
    while (S.dice.length < S.count) { S.dice.push(0); S.held.push(false); }
    S.dice.length = S.count; S.held.length = S.count;
  }
  function itemList() { return S.items.split('\n').map(function (x) { return x.trim(); }).filter(Boolean); }
  function available() { var all = itemList(); return S.remove ? all.filter(function (x) { return S.gone.indexOf(x) < 0; }) : all; }

  /* ── Rendering ── */
  function dieFace(v, sides) {
    if (sides === 6 && v >= 1) { var h = '<span class="pips">'; for (var i = 0; i < 9; i++) h += '<i class="' + (PIPS[v].indexOf(i) >= 0 ? 'on' : '') + '"></i>'; return h + '</span>'; }
    return '<span class="die__num">' + (v ? v : '–') + '</span>';
  }
  function setResult(text, kind) {
    var r = $('result'); r.textContent = text;
    r.className = 'big result' + (kind ? ' is-' + kind : '');
  }
  function renderHero() {
    var m = S.mode, spec;
    $('modeText').textContent = m; $('typeText').textContent = 'D' + S.sides;
    if (m === 'dice') {
      spec = S.count + ' × D' + S.sides;
      $('heroLabel').textContent = 'Total'; $('heroSpec').textContent = spec;
      $('heroExtra').textContent = 'Held ' + S.held.filter(Boolean).length;
      var rolled = S.dice.some(Boolean);
      if (rolled) { setResult(pad(S.dice.reduce(function (a, b) { return a + b; }, 0), S.sides * S.count >= 100 ? 3 : 2)); $('detail').textContent = S.dice.join(' · '); }
      else { setResult('Roll', 'idle'); $('detail').textContent = 'Space to roll'; }
      $('rollText').textContent = 'Roll';
    } else if (m === 'coin') {
      spec = 'Coin';
      $('heroLabel').textContent = 'Coin'; $('heroSpec').textContent = 'Streak ' + pad(S.coin.streak, 2);
      $('heroExtra').textContent = 'H ' + S.coin.h + ' · T ' + S.coin.t;
      if (S.coin.last) setResult(S.coin.last === 'H' ? 'Heads' : 'Tails', 'word'); else setResult('Flip', 'idle');
      $('detail').textContent = S.coin.last ? (S.coin.streak > 1 ? S.coin.streak + ' in a row' : 'Space to flip') : 'Space to flip';
      $('rollText').textContent = 'Flip';
    } else {
      var av = available(); spec = av.length + ' items';
      $('heroLabel').textContent = 'Pick'; $('heroSpec').textContent = pad(av.length, 2) + ' left';
      $('heroExtra').textContent = S.remove ? 'Remove on' : 'Keep all';
      if (S.last && S.last.m === 'pick') setResult(S.last.v, S.last.v.length <= 7 ? 'word' : 'long');
      else setResult(av.length ? 'Pick' : 'Add items', 'idle');
      $('detail').textContent = av.length ? 'Space to pick' : (itemList().length ? 'All picked · restore' : 'Add items in Setup');
      $('rollText').textContent = 'Pick';
    }
    $('barMeta').textContent = spec;
  }
  function renderTray() {
    var t = $('tray'), m = S.mode;
    t.className = 'tray__grid' + (m === 'dice' ? '' : ' tray__grid--' + m);
    t.innerHTML = '';
    if (m === 'dice') {
      $('trayTitle').textContent = 'Dice'; $('trayHint').textContent = 'Tap to hold · 1–6';
      t.style.setProperty('--n', S.count);
      S.dice.forEach(function (v, i) {
        var b = document.createElement('button');
        b.className = 'u-key die'; b.setAttribute('aria-pressed', String(!!S.held[i]));
        b.setAttribute('aria-label', 'Die ' + (i + 1) + ': ' + (v || 'not rolled') + (S.held[i] ? ', held' : ''));
        b.innerHTML = '<span class="u-key__top"><span class="u-key__index">' + pad(i + 1, 2) + '</span><span class="u-led' + (S.held[i] ? ' is-lit' : '') + '"></span></span><span class="die__face">' + dieFace(v, S.sides) + '</span>';
        b.addEventListener('click', function () { if (!v) return; S.held[i] = !S.held[i]; S.__save(); render(); });
        t.appendChild(b);
      });
    } else if (m === 'coin') {
      $('trayTitle').textContent = 'Flips'; $('trayHint').textContent = 'Newest first';
      var f = S.coin.flips.slice(0, 24);
      if (!f.length) t.innerHTML = '<p class="note tray__empty">No flips yet.</p>';
      f.forEach(function (x) { var d = document.createElement('span'); d.className = 'flip' + (x === 'H' ? ' is-h' : ''); d.textContent = x; t.appendChild(d); });
    } else {
      $('trayTitle').textContent = 'Items'; $('trayHint').textContent = S.remove ? 'Struck = picked' : '';
      var all = itemList();
      if (!all.length) t.innerHTML = '<p class="note tray__empty">Add items in Setup.</p>';
      all.slice(0, 18).forEach(function (x) {
        var d = document.createElement('span');
        d.className = 'chip' + (S.remove && S.gone.indexOf(x) >= 0 ? ' is-gone' : '') + (S.last && S.last.m === 'pick' && S.last.v === x ? ' is-hit' : '');
        d.textContent = x; t.appendChild(d);
      });
    }
  }
  function renderHistory() {
    var h = $('hist'); h.innerHTML = '';
    if (!S.history.length) { h.innerHTML = '<li><span>—</span><span>Nothing yet</span></li>'; return; }
    S.history.forEach(function (e, i) {
      var li = document.createElement('li'), txt, res;
      if (e.m === 'dice') { txt = e.v.length + '×D' + e.t + '  ' + e.v.join('·'); res = e.v.reduce(function (a, b) { return a + b; }, 0); }
      else if (e.m === 'coin') { txt = 'Coin'; res = e.v === 'H' ? 'Heads' : 'Tails'; }
      else { txt = 'Pick'; res = e.v; }
      li.innerHTML = '<span>' + pad(i + 1, 2) + '</span><span></span><b></b>';
      li.children[1].textContent = txt; li.children[2].textContent = res;
      h.appendChild(li);
    });
  }
  function renderStats() {
    var bars = $('bars'), data = [], note;
    if (S.mode === 'dice') {
      var c = S.faces[S.sides] || [], n = S.sides;
      if (n === 100) { for (var b = 0; b < 10; b++) { var s = 0; for (var k = b * 10; k < b * 10 + 10; k++) s += c[k] || 0; data.push([(b * 10 + 1) + '', s]); } }
      else for (var j = 0; j < n; j++) data.push([String(j + 1), c[j] || 0]);
      var tot = data.reduce(function (a, d) { return a + d[1]; }, 0);
      $('statsMeta').textContent = 'D' + n + ' · ' + tot + ' dice'; note = n === 100 ? 'Faces grouped in tens.' : 'How often each face has come up.';
    } else if (S.mode === 'coin') {
      data = [['H', S.coin.h], ['T', S.coin.t]]; $('statsMeta').textContent = (S.coin.h + S.coin.t) + ' flips'; note = 'Heads against tails, all time.';
    } else {
      itemList().slice(0, 12).forEach(function (x) { data.push([x.slice(0, 3).toUpperCase(), S.pickCounts[x] || 0]); });
      $('statsMeta').textContent = 'Picks'; note = 'Times each item was picked (first 12).';
    }
    var max = Math.max(1, Math.max.apply(null, data.map(function (d) { return d[1]; })));
    bars.innerHTML = data.map(function (d) { return '<span class="bars__col"><span class="bars__bar" style="height:' + (d[1] / max * 100) + '%"></span><span class="bars__lbl">' + d[0] + '</span></span>'; }).join('');
    $('statsNote').textContent = note;
  }
  var syncMode, syncType;
  function render() { dev.dataset.mode = S.mode; renderHero(); renderTray(); renderHistory(); renderStats(); $('cntVal').textContent = pad(S.count, 2); if (syncMode) syncMode(); if (syncType) syncType(); }

  function pushHistory(e) { S.history.unshift(e); if (S.history.length > 20) S.history.length = 20; S.last = e; }

  /* ── Actions ── */
  function finishDice() {
    S.faces[S.sides] = S.faces[S.sides] || [];
    S.dice.forEach(function (v, i) { if (!S.held[i]) S.faces[S.sides][v - 1] = (S.faces[S.sides][v - 1] || 0) + 1; });
    pushHistory({ m: 'dice', t: S.sides, v: S.dice.slice() });
  }
  function go() {
    if (rolling) return;
    if (S.mode === 'dice') {
      fitDice();
      var final = S.dice.map(function (v, i) { return S.held[i] && v ? v : rand(S.sides) + 1; });
      if (reduce) { S.dice = final; finishDice(); S.__save(); render(); return; }
      rolling = true; $('hero').classList.add('is-rolling');
      var ticks = 0, iv = setInterval(function () {
        ticks++;
        S.dice = S.dice.map(function (v, i) { return S.held[i] && v ? v : rand(S.sides) + 1; });
        renderHero(); renderTray();
        Array.prototype.forEach.call($('tray').children, function (d, i) { if (!S.held[i]) d.classList.add('is-rolling'); });
        if (ticks >= 5) { clearInterval(iv); rolling = false; $('hero').classList.remove('is-rolling'); S.dice = final; finishDice(); S.__save(); render(); }
      }, 50);
    } else if (S.mode === 'coin') {
      var side = rand(2) ? 'H' : 'T', c = S.coin;
      c.streak = c.last === side ? c.streak + 1 : 1; c.last = side; c[side === 'H' ? 'h' : 't']++;
      c.flips.unshift(side); if (c.flips.length > 48) c.flips.length = 48;
      pushHistory({ m: 'coin', v: side }); S.__save(); render();
    } else {
      var av = available(); if (!av.length) { render(); return; }
      var pick = av[rand(av.length)];
      if (S.remove) S.gone.push(pick);
      S.pickCounts[pick] = (S.pickCounts[pick] || 0) + 1;
      pushHistory({ m: 'pick', v: pick }); S.__save(); render();
    }
  }
  $('roll').addEventListener('click', go);
  $('modeKey').addEventListener('click', function () { S.mode = MODES[(MODES.indexOf(S.mode) + 1) % 3]; S.__save(); render(); });
  $('typeKey').addEventListener('click', function () { S.sides = TYPES[(TYPES.indexOf(S.sides) + 1) % TYPES.length]; S.dice = S.dice.map(function () { return 0; }); S.held = S.held.map(function () { return false; }); S.__save(); render(); });
  syncMode = selector($('modeSel'), function () { return S.mode; }, function (v) { S.mode = v; S.__save(); render(); });
  var ts = $('typeSel');
  TYPES.forEach(function (n) { var b = document.createElement('button'); b.className = 'u-selector__opt'; b.setAttribute('role', 'radio'); b.dataset.v = n; b.textContent = 'D' + n; ts.appendChild(b); });
  syncType = selector(ts, function () { return S.sides; }, function (v) { S.sides = +v; S.dice = S.dice.map(function () { return 0; }); S.held = S.held.map(function () { return false; }); S.__save(); render(); });
  $('cntMinus').addEventListener('click', function () { S.count = clamp(S.count - 1, 1, 6); fitDice(); S.__save(); render(); });
  $('cntPlus').addEventListener('click', function () { S.count = clamp(S.count + 1, 1, 6); fitDice(); S.__save(); render(); });
  $('items').value = S.items;
  $('items').addEventListener('input', function (e) { S.items = e.target.value; S.gone = S.gone.filter(function (x) { return itemList().indexOf(x) >= 0; }); S.__save(); renderHero(); renderTray(); renderStats(); });
  bindSwitch($('removeSw'), function () { return S.remove; }, function (v) { S.remove = v; S.gone = []; S.__save(); render(); });
  $('restore').addEventListener('click', function () { S.gone = []; S.__save(); render(); });
  $('clearHist').addEventListener('click', function () { S.history = []; S.faces = {}; S.coin = { h: 0, t: 0, last: '', streak: 0, flips: [] }; S.pickCounts = {}; S.last = null; S.dice = S.dice.map(function () { return 0; }); S.held = S.held.map(function () { return false; }); S.__save(); render(); });

  document.addEventListener('keydown', function (e) {
    if (inControl(e) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); go(); }
    else if (e.key === 'm' || e.key === 'M') $('modeKey').click();
    else if ((e.key === 't' || e.key === 'T') && S.mode === 'dice') $('typeKey').click();
    else if (S.mode === 'dice' && /^[1-6]$/.test(e.key)) { var i = +e.key - 1; if (i < S.count && S.dice[i]) { S.held[i] = !S.held[i]; S.__save(); render(); } }
  });

  fitDice(); render();
})();
</script>
</body>
</html>
