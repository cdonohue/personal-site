<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 01 — Intervals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* ── Unit 01 tokens ─────────────────────────────────────────── */
:root, [data-theme="light"] {
  --chassis:#ffffff; --panel:#ffffff; --panel-sunk:#f0f0ee; --ink:#000000; --ink-muted:#5f5f5c; --line:#c8c8c4; --rule:var(--ink);
  --signal:#ff5a1f; --signal-text:#a83400; --on-signal:#000000; --blue:#3a63d8; --on-blue:#ffffff; --yellow:#f5c400; --on-yellow:#111111;
  --key:#e6e6e3; --lcd:#0b0b0b; --lcd-ink:#f2f2ef; --lcd-muted:#8f8f8a; --lcd-dim:#2a2a2a; --focus:var(--ink);
  --shadow-key:0 2px 0 #00000040; --shadow-key-pressed:0 0 0 #00000040;
}
[data-theme="dark"] {
  --chassis:#000000; --panel:#000000; --panel-sunk:#161616; --ink:#ffffff; --ink-muted:#9b9b97; --line:#3a3a3a; --key:#262626; --rule:var(--ink);
  --signal-text:#ff7a45; --shadow-key:0 2px 0 #ffffff26; --shadow-key-pressed:0 0 0 #ffffff26;
}
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-0:0; --radius-sm:2px; --radius-md:6px; --radius-full:9999px;
  --font-sans:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* ── Unit 01 components (vanilla port of the bundle) ────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); background: var(--chassis); color: var(--ink); -webkit-font-smoothing: antialiased; }
:where(button, input, [role="slider"]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.u-label { display: inline-flex; gap: var(--space-2); align-items: baseline; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.u-label b { font-weight: 700; color: var(--ink); }
.u-value { font-family: var(--font-mono); font-size: 13px; line-height: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
.u-led { display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--line); flex: none; }
.u-key .u-led, .u-selector__opt .u-led { background: var(--line); }
.is-on > .u-led, .u-led.is-lit { background: var(--signal); }

.u-key { appearance: none; position: relative; display: inline-flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  min-width: 0; padding: var(--space-2); border: 0; border-radius: var(--radius-0); background: var(--key); color: var(--ink);
  font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: left;
  box-shadow: var(--shadow-key); cursor: pointer; transition: transform 60ms linear, box-shadow 60ms linear; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.u-key:active, .u-key.is-hit, .u-key[aria-pressed="true"] { transform: translateY(2px); box-shadow: var(--shadow-key-pressed); }
.u-key--ink { background: var(--ink); color: var(--chassis); }
.u-key--signal { background: var(--signal); color: var(--on-signal); }
.u-key--blue { background: var(--blue); color: var(--on-blue); }
.u-key--yellow { background: var(--yellow); color: var(--on-yellow); }
.u-key__top { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: var(--space-1); }
.u-key__index { font-family: var(--font-mono); font-weight: 500; font-size: 9px; line-height: 12px; letter-spacing: .1em; opacity: .75; }
.u-key__glyph { align-self: center; display: flex; }
.u-key__glyph svg { width: 22px; height: 22px; fill: currentColor; }
.u-key--sm { width: 40px; height: 40px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; }

.u-panel { background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: var(--radius-0); min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
.u-panel__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-3); }
.u-panel__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel__body { padding: 0 0 var(--space-2); display: flex; flex-direction: column; gap: var(--space-4); flex: 1; }

.u-display { background: var(--lcd); color: var(--lcd-ink); border: 1px solid var(--line); border-radius: var(--radius-0); font-family: var(--font-mono); }
.u-display__label { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--lcd-muted); white-space: nowrap; }
.u-display__unit { font-size: 13px; line-height: 16px; color: var(--lcd-muted); text-transform: uppercase; letter-spacing: .08em; }

.u-selector { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-selector__row { display: flex; gap: 2px; border-radius: var(--radius-0); }
.u-selector__opt { appearance: none; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-2);
  background: var(--key); color: var(--ink); border: 0; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.u-selector__opt:first-child { border-left: 0; }
.u-selector__opt.is-on { background: var(--ink); color: var(--chassis); }
.u-selector__opt:focus-visible { outline-offset: -4px; }

.u-switch { appearance: none; display: inline-flex; align-items: center; gap: var(--space-3); padding: var(--space-1) 0; background: none; border: 0; color: var(--ink); cursor: pointer; }
.u-switch__track { position: relative; width: 40px; height: 20px; background: var(--panel-sunk); border: 1px solid var(--ink); border-radius: var(--radius-sm); flex: none; }
.u-switch__thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 14px; background: var(--ink); border-radius: var(--radius-sm); transition: left 80ms linear; }
.u-switch[aria-checked="true"] .u-switch__track { background: var(--signal); }
.u-switch[aria-checked="true"] .u-switch__thumb { left: 20px; background: var(--on-signal); }
.u-switch__state { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; min-width: 3ch; }

.u-fader { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-fader__head { display: flex; justify-content: space-between; align-items: baseline; }
.u-fader__input { appearance: none; -webkit-appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: ew-resize; }
.u-fader__input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-moz-range-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 28px; margin-top: -13px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }
.u-fader__input::-moz-range-thumb { width: 14px; height: 28px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }

.u-knob { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.u-knob__dial { border-radius: var(--radius-full); cursor: grab; touch-action: none; line-height: 0; }
.u-knob__tick { stroke: var(--line); stroke-width: 1.5; }
.u-knob__track { fill: none; stroke: var(--panel-sunk); stroke-width: 3; }
.u-knob__arc { fill: none; stroke: var(--signal); stroke-width: 3; }
.u-knob__cap { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.u-knob__ind { stroke: var(--ink); stroke-width: 3; stroke-linecap: square; }
.u-knob__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; }


/* ── App shell ── */
.shell { height: 100dvh; overflow: auto; container: shell / size; }
.device { min-height: 100%; display: grid; gap: var(--space-2); padding: var(--space-2); grid-template-columns: minmax(0, 1fr); }
.bar { display: none; grid-area: bar; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-1) var(--space-1) 0; container: bar / inline-size; min-width: 0; }
.bar__title { display: inline-flex; align-items: flex-start; gap: var(--space-2); font: 800 clamp(18px, 4.2cqi, 34px)/1 var(--font-sans); letter-spacing: -.025em; white-space: nowrap; }
.bar__idx { font: 500 9px/12px var(--font-mono); letter-spacing: .1em; color: var(--ink-muted); }
.bar__right { display: flex; align-items: center; gap: var(--space-4); }
.bar__meta { display: none; }
@container bar (min-width: 420px) { .bar__meta { display: inline-flex; } }
.rowsec { border-top: 2px solid var(--rule); padding-top: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; min-height: 0; }
.rowsec__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); min-height: 16px; }
.hero { container: hero / inline-size; display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-2); padding: var(--space-3); min-height: 0; min-width: 0; overflow: hidden; transition: background 60ms linear; }
.hero__top, .hero__bottom { display: flex; justify-content: space-between; gap: var(--space-3); }
.hero__main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.hero .opt { display: none; }
@container hero (min-width: 260px) { .hero { padding: var(--space-4); } }
@container hero (min-width: 380px) { .hero .opt { display: inline; } }
.hero.is-flash { background: var(--signal); }
.hero.is-flash, .hero.is-flash .u-display__label, .hero.is-flash .u-display__unit { color: var(--on-signal); }
.transport { grid-area: transport; container: transport / inline-size; display: flex; gap: var(--space-2); min-width: 0; }
.transport .u-key { flex: 1 1 0; height: clamp(52px, 20cqi, 104px); }
.transport .k-main { flex-grow: 2; }
.transport .k-more { display: none; }
.u-key__glyph { font-size: clamp(16px, 5cqi, 26px); line-height: 1; }
@container transport (max-width: 199px) { .transport .u-key__text { font-size: 10px; } }
.stepper { display: flex; align-items: center; gap: var(--space-2); }
.stepper__val { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 20px; line-height: 40px; height: 40px; background: var(--panel-sunk); font-variant-numeric: tabular-nums; }
.mini { padding: var(--space-3); display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.mini__num { font-size: 24px; line-height: 24px; font-variant-numeric: tabular-nums; }
.u-key:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.u-key.is-sel { background: var(--ink); color: var(--chassis); }
@container (max-width: 300px) { .u-selector__opt .u-led { display: none; } }
@container shell (min-width: 300px) and (min-height: 360px) { .bar { display: flex; } }
@container shell (min-width: 300px) { .transport .k-more { display: inline-flex; } }
@container shell (min-width: 820px) and (max-height: 759px) {
  .device { padding: var(--space-4); }
  .u-panel__head { padding: var(--space-1) 0 var(--space-2); }
  .u-panel__body { padding: 0; gap: var(--space-3); }
}
@container shell (min-width: 820px) and (min-height: 540px) { .device { gap: var(--space-4); padding: var(--space-6); } }
@container shell (min-width: 1180px) and (min-height: 760px) { .device { padding: var(--space-8); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.device { grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "hero" "transport"; }
.hero { grid-area: hero; } .presets { grid-area: presets; } .p-set { grid-area: set; } .p-time { grid-area: time; }
.presets, .p-set, .p-time { display: none; }

.hero__main { flex-direction: column; gap: clamp(2px, 1cqi, 10px); }
.phase { font-family: var(--font-sans); font-weight: 800; font-size: clamp(20px, min(13cqi, 10cqb), 120px); line-height: .9; letter-spacing: -.035em; text-transform: uppercase; }
.clock { font-family: var(--font-mono); font-size: clamp(32px, min(24cqi, 19cqb), 240px); line-height: .9; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.meter { display: flex; gap: 2px; height: clamp(6px, 2.4cqi, 18px); }
.seg { position: relative; flex: 1 1 0; min-width: 2px; background: var(--lcd-dim); overflow: hidden; }
.seg.is-done { background: var(--lcd-ink); }
.seg__fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--lcd-ink); }
.hero.is-work { background: var(--signal); }
.hero.is-work, .hero.is-work .u-display__label { color: var(--on-signal); }
.hero.is-work .seg { background: #00000033; }
.hero.is-work .seg.is-done, .hero.is-work .seg__fill { background: var(--on-signal); }
.hero.is-paused .clock { opacity: .55; }
.hero.is-flash { background: var(--lcd-ink); }
.hero.is-flash, .hero.is-flash .u-display__label { color: var(--lcd); }

.presets { container: presets / inline-size; }
.presets__row { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); }
.presets__row .u-key { height: clamp(44px, 11cqi, 64px); }
.preset__sub { display: none; font-family: var(--font-mono); font-weight: 500; font-size: 9px; letter-spacing: .06em; opacity: .75; }
@container presets (min-width: 400px) { .preset__sub { display: block; } }

.fields { display: grid; grid-template-columns: 1fr; gap: var(--space-2) var(--space-4); }
.field { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); min-width: 0; }
.field .stepper { flex: none; }
.field .stepper__val { flex: none; width: 72px; font-size: 16px; height: 36px; line-height: 36px; }
.field .u-key--sm { width: 36px; height: 36px; }
.p-set .u-panel__body { gap: var(--space-3); }
@container (min-width: 460px) { .fields { grid-template-columns: 1fr 1fr; } }
.set-foot { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); flex-wrap: wrap; }

.p-time .u-panel__body { flex: 1; min-height: 0; position: relative; padding: 0; }
.tl { position: absolute; inset: 0 0 32px 0; overflow: auto; list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 28px 1fr auto; gap: var(--space-2); align-items: baseline; padding: 6px var(--space-2); border-bottom: 1px solid var(--line); font-size: 14px; line-height: 18px; }
.tl li .u-value { color: var(--ink-muted); }
.tl li .tl__n { font: 500 9px/12px var(--font-mono); color: var(--ink-muted); letter-spacing: .1em; }
.tl li.is-done { color: var(--ink-muted); }
.tl li.is-now { background: var(--ink); color: var(--chassis); }
.tl li.is-now .u-value, .tl li.is-now .tl__n { color: var(--chassis); }
.tl__foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center; height: 28px; border-top: 2px solid var(--rule); }

@container shell (max-height: 259px) { .hero__top { display: none; } .hero { padding: var(--space-2) var(--space-3); } }
/* Tiers */
@container shell (min-width: 300px) and (min-height: 360px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar" "hero" "transport"; }
}
@container shell (min-width: 300px) and (min-height: 540px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar" "hero" "presets" "transport"; }
  .presets { display: flex; }
}
@container shell (min-width: 520px) and (min-height: 760px) {
  .device { gap: var(--space-4); padding: var(--space-4); grid-template-rows: auto minmax(0, 1fr) auto auto auto; grid-template-areas: "bar" "hero" "presets" "transport" "set"; }
  .p-set { display: flex; }
}
@container shell (min-width: 560px) and (max-height: 359px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(200px, 34cqi, 340px); grid-template-rows: minmax(0, 1fr); grid-template-areas: "hero transport"; }
}
@container shell (min-width: 560px) and (min-height: 360px) and (max-height: 539px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(220px, 34cqi, 360px); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "hero transport" "presets transport"; }
  .presets { display: flex; }
}
@container shell (min-width: 560px) and (max-height: 539px) {
  .transport { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 2fr 1fr; grid-template-areas: "main main" "reset skip"; }
  .transport .u-key { height: auto; }
  .k-main { grid-area: main; } .k-reset { grid-area: reset; } .k-skip { grid-area: skip; }
}
@container shell (min-width: 820px) and (min-height: 540px) {
  .device { grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar bar" "hero set" "presets set" "transport set"; }
  .presets, .p-set { display: flex; }
}
@container shell (min-width: 1180px) and (min-height: 760px) {
  .device { grid-template-columns: minmax(260px, .8fr) minmax(0, 1.6fr) minmax(320px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar bar bar" "time hero set" "time presets set" "time transport set"; }
  .presets, .p-set, .p-time { display: flex; }
}
</style>
</head>
<body>
<div class="shell">
<main class="device">
  <header class="bar">
    <span class="bar__title"><span class="bar__idx">17</span>Intervals</span>
    <div class="bar__right">
      <span class="u-label bar__meta" id="barMeta">Tabata · 04:00</span>
      <button class="u-switch" role="switch" aria-checked="false" id="themeSw" aria-label="Dark theme">
        <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
        <span class="u-label">Dark</span>
      </button>
    </div>
  </header>

  <section class="hero u-display" id="hero" aria-label="Interval display">
    <div class="hero__top">
      <span class="u-display__label">Intervals</span>
      <span class="u-display__label opt" id="presetOut">Tabata</span>
      <span class="u-display__label" id="setOut">Set 1/1</span>
    </div>
    <div class="hero__main">
      <span class="phase" id="phaseOut" aria-live="polite">Ready</span>
      <output class="clock" id="clock" role="timer" aria-live="off">00:20</output>
    </div>
    <div class="meter" id="meter" aria-hidden="true"></div>
    <div class="hero__bottom">
      <span class="u-display__label" id="roundOut">Round 0/8</span>
      <span class="u-display__label opt" id="endsOut">Ends --:--</span>
      <span class="u-display__label" id="leftOut">Left 04:00</span>
    </div>
  </section>

  <section class="presets rowsec" aria-label="Presets">
    <div class="rowsec__head"><span class="u-label"><b>01</b> Presets</span><span class="u-label opt" id="presetMeta">Work / rest × rounds</span></div>
    <div class="presets__row" id="presets"></div>
  </section>

  <section class="transport" aria-label="Controls">
    <button class="u-key k-more k-reset" id="reset"><span class="u-key__top"><span class="u-key__index">R</span></span><span class="u-key__text">Reset</span></button>
    <button class="u-key u-key--signal k-main" id="start"><span class="u-key__top"><span class="u-key__index">Space</span></span><span class="u-key__text" id="startText">Start</span></button>
    <button class="u-key k-skip" id="skip" aria-label="Skip to next phase"><span class="u-key__top"><span class="u-key__index">→</span></span><span class="u-key__text">Skip</span></button>
  </section>

  <section class="u-panel p-set" aria-label="Setup">
    <header class="u-panel__head"><span class="u-label"><b>02</b> Setup</span><span class="u-label" id="setMeta">Total 04:00</span></header>
    <div class="u-panel__body">
      <div class="fields" id="fields"></div>
      <div class="set-foot">
        <button class="u-switch" role="switch" aria-checked="true" id="soundSw">
          <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
          <span class="u-label">Beeps</span>
        </button>
        <span class="u-label" id="lockNote"></span>
      </div>
    </div>
  </section>

  <section class="u-panel p-time" aria-label="Timeline">
    <header class="u-panel__head"><span class="u-label"><b>03</b> Timeline</span><span class="u-label" id="tlMeta">0 phases</span></header>
    <div class="u-panel__body">
      <ol class="tl" id="tl"></ol>
      <div class="tl__foot"><span class="u-label">Finish</span><span class="u-value" id="tlEnds">--:--</span></div>
    </div>
  </section>
</main>
</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n, w) { n = String(Math.max(0, Math.floor(n))); while (n.length < (w || 2)) n = '0' + n; return n; };
  var clamp = function (n, a, b) { return Math.min(b, Math.max(a, n)); };
  var mmss = function (sec) { sec = Math.max(0, Math.ceil(sec - 1e-6)); return pad(sec / 60) + ':' + pad(sec % 60); };
  function makeStore(key, defaults) {
    var s = JSON.parse(JSON.stringify(defaults));
    try { var v = JSON.parse(localStorage.getItem(key) || 'null'); if (v) Object.assign(s, v); } catch (e) {}
    s.save = function () { try { localStorage.setItem(key, JSON.stringify(s)); } catch (e) {} };
    return s;
  }
  function initTheme(state) {
    var sw = $('themeSw');
    function apply() {
      var dark = state.theme ? state.theme === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'; sw.setAttribute('aria-checked', String(dark));
    }
    sw.addEventListener('click', function () { state.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; apply(); state.save(); });
    apply();
  }
  var AC = null;
  function audio() {
    if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  /* A short enveloped tone at audio time t; returns the oscillator so it can be cancelled. */
  function tone(t, f, dur, peak, type) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak || .4, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .05);
    return o;
  }
  function inControl(e) { return e.target.closest && e.target.closest('button, input, select, textarea, [role="slider"]'); }
  function selector(el, get, set) {
    var opts = Array.prototype.slice.call(el.querySelectorAll('[role=radio]'));
    function sync() { opts.forEach(function (o) { var on = o.dataset.v === String(get()); o.classList.toggle('is-on', on); o.setAttribute('aria-checked', String(on)); o.tabIndex = on ? 0 : -1; }); }
    opts.forEach(function (o, i) {
      o.addEventListener('click', function () { set(o.dataset.v); sync(); });
      o.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
        if (!d) return; e.preventDefault(); var j = (i + d + opts.length) % opts.length; opts[j].click(); opts[j].focus();
      });
    });
    sync(); return sync;
  }
  function bindSwitch(el, get, set) {
    var sync = function () { el.setAttribute('aria-checked', String(!!get())); };
    el.addEventListener('click', function () { set(!get()); sync(); }); sync(); return sync;
  }
  var HEAD_SWITCH = '';

  var PRESETS = {
    tabata: { label: 'Tabata', sub: '20/10 ×8', cfg: { warm: 0, work: 20, rest: 10, rounds: 8, sets: 1, setRest: 60, cool: 0 } },
    emom: { label: 'EMOM', sub: '60 ×10', cfg: { warm: 0, work: 60, rest: 0, rounds: 10, sets: 1, setRest: 0, cool: 0 } },
    thirty: { label: '30/30', sub: '30/30 ×10', cfg: { warm: 0, work: 30, rest: 30, rounds: 10, sets: 1, setRest: 0, cool: 0 } },
    custom: { label: 'Custom', sub: 'Saved', cfg: null }
  };
  var FIELDS = [
    ['warm', 'Warm up', 0, 600, 5, true], ['work', 'Work', 5, 600, 5, true], ['rest', 'Rest', 0, 600, 5, true],
    ['rounds', 'Rounds', 1, 50, 1, false], ['sets', 'Sets', 1, 10, 1, false], ['setRest', 'Set rest', 0, 600, 5, true], ['cool', 'Cool down', 0, 600, 5, true]
  ];
  var NAMES = { warm: 'Warm up', work: 'Work', rest: 'Rest', setrest: 'Set rest', cool: 'Cool down' };
  var WORDS = { warm: 'Warm', work: 'Work', rest: 'Rest', setrest: 'Break', cool: 'Cool' };

  var state = makeStore('unit01-intervals', { theme: null, preset: 'tabata', sound: true,
    custom: { warm: 30, work: 40, rest: 20, rounds: 6, sets: 2, setRest: 60, cool: 30 }, run: null });
  initTheme(state);
  function cfg() { return state.preset === 'custom' ? state.custom : PRESETS[state.preset].cfg; }

  /* ── Plan ── */
  var plan = [], total = 0;
  function build() {
    var c = cfg(); plan = [];
    if (c.warm > 0) plan.push({ k: 'warm', d: c.warm });
    for (var s = 1; s <= c.sets; s++) {
      for (var r = 1; r <= c.rounds; r++) {
        plan.push({ k: 'work', d: c.work, r: r, s: s });
        if (c.rest > 0 && r < c.rounds) plan.push({ k: 'rest', d: c.rest, r: r, s: s });
      }
      if (s < c.sets && c.setRest > 0) plan.push({ k: 'setrest', d: c.setRest, s: s });
    }
    if (c.cool > 0) plan.push({ k: 'cool', d: c.cool });
    total = 0; plan.forEach(function (p) { p.at = total; total += p.d; });
    renderMeter(); renderTimeline(); renderFields();
    var meta = PRESETS[state.preset].label + ' · ' + mmss(total);
    $('barMeta').textContent = meta; $('presetOut').textContent = PRESETS[state.preset].label;
    $('setMeta').textContent = 'Total ' + mmss(total); $('tlMeta').textContent = plan.length + ' phases';
  }

  /* ── Run state (timestamps, survives reloads and background tabs) ── */
  function elapsed() { var r = state.run; if (!r) return 0; return (r.acc + (r.t0 ? Date.now() - r.t0 : 0)) / 1000; }
  function running() { return !!(state.run && state.run.t0); }
  function phaseAt(e) { for (var i = 0; i < plan.length; i++) if (e < plan[i].at + plan[i].d) return i; return plan.length; }

  /* ── Audio cues scheduled ahead on the audio clock ── */
  var nodes = [], schedUntil = 0, lastCtxSync = null;
  function cancelCues() { nodes.forEach(function (o) { try { o.stop(); } catch (e) {} }); nodes = []; schedUntil = 0; }
  function cueAt(sec, kind) {
    var t = AC.currentTime + (sec - elapsed()) + .03; if (t < AC.currentTime) return;
    if (kind === 'tick') nodes.push(tone(t, 880, .09, .25));
    else if (kind === 'work') { nodes.push(tone(t, 1320, .12, .4, 'square')); nodes.push(tone(t + .16, 1320, .2, .4, 'square')); }
    else if (kind === 'end') { [660, 880, 1320].forEach(function (f, i) { nodes.push(tone(t + i * .18, f, .3, .4)); }); }
    else nodes.push(tone(t, kind === 'warm' ? 880 : 587, .45, .35, 'triangle'));
  }
  function scheduleCues() {
    if (!state.sound || !running() || !AC) return;
    var e = elapsed(), horizon = e + 90;
    if (schedUntil >= horizon - 30) return;
    var from = Math.max(e, schedUntil);
    plan.forEach(function (p, i) {
      if (i > 0 && p.at >= from && p.at < horizon) cueAt(p.at, p.k);
      var end = p.at + p.d;
      if (p.d >= 4) for (var k = 3; k >= 1; k--) { var s = end - k; if (s >= from && s < horizon) cueAt(s, 'tick'); }
    });
    if (total >= from && total < horizon) cueAt(total, 'end');
    schedUntil = horizon;
  }

  /* ── Render ── */
  var hero = $('hero'), meter = $('meter');
  function renderMeter() {
    meter.innerHTML = '';
    plan.forEach(function (p) { var s = document.createElement('span'); s.className = 'seg'; s.style.flexGrow = p.d; s.innerHTML = '<span class="seg__fill"></span>'; meter.appendChild(s); });
  }
  function renderTimeline() {
    var tl = $('tl'); tl.innerHTML = '';
    plan.forEach(function (p, i) {
      var li = document.createElement('li');
      var tag = p.k === 'work' || p.k === 'rest' ? ' · R' + p.r + (cfg().sets > 1 ? ' S' + p.s : '') : p.k === 'setrest' ? ' · after set ' + p.s : '';
      li.innerHTML = '<span class="tl__n">' + pad(i + 1) + '</span><span>' + NAMES[p.k] + tag + '</span><span class="u-value">' + mmss(p.d) + '</span>';
      tl.appendChild(li);
    });
  }
  function clockTime(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  var lastIdx = -2;
  function render() {
    var e = elapsed(), i = phaseAt(e), done = state.run && e >= total, p = plan[i];
    if (done && running()) finish();
    var r = state.run, word, clk;
    if (!r) { word = 'Ready'; clk = mmss(plan[0] ? plan[0].d : 0); }
    else if (done) { word = 'Done'; clk = '00:00'; }
    else { word = WORDS[p.k]; clk = mmss(p.at + p.d - e); }
    $('phaseOut').textContent = word; $('clock').textContent = clk;
    hero.classList.toggle('is-work', !!(r && !done && p && p.k === 'work'));
    hero.classList.toggle('is-paused', !!(r && !r.t0 && !done));
    var c = cfg(), cur = p || plan[plan.length - 1] || {};
    var rr = !r ? 0 : done ? c.rounds : (cur.r || (cur.k === 'cool' ? c.rounds : cur.k === 'setrest' ? c.rounds : 0));
    $('roundOut').textContent = 'Round ' + rr + '/' + c.rounds;
    $('setOut').textContent = 'Set ' + (r ? (done ? c.sets : (cur.s || (cur.k === 'cool' ? c.sets : 1))) : 1) + '/' + c.sets;
    $('leftOut').textContent = 'Left ' + mmss(total - e);
    var ends = new Date(Date.now() + (total - e) * 1000);
    $('endsOut').textContent = 'Ends ' + (r && !done && running() ? clockTime(ends) : r && !done ? 'paused' : clockTime(new Date(Date.now() + total * 1000)));
    $('tlEnds').textContent = r && !done ? clockTime(ends) : clockTime(new Date(Date.now() + total * 1000));
    var segs = meter.children;
    for (var k = 0; k < segs.length; k++) {
      var isDone = r && (k < i || done), isNow = r && k === i && !done;
      segs[k].classList.toggle('is-done', !!isDone);
      segs[k].firstChild.style.width = isNow ? ((e - plan[k].at) / plan[k].d * 100).toFixed(2) + '%' : '0';
    }
    var key = i + ':' + (r ? 1 : 0) + ':' + (done ? 1 : 0);
    if (key !== lastIdx) {
      var lis = $('tl').children;
      for (var j = 0; j < lis.length; j++) { lis[j].classList.toggle('is-done', !!(r && (j < i || done))); lis[j].classList.toggle('is-now', !!(r && j === i && !done)); }
      var now = lis[i]; if (now && r && now.scrollIntoView) { var box = $('tl'); box.scrollTop = Math.max(0, now.offsetTop - box.clientHeight / 3); }
      lastIdx = key;
    }
    var st = !r ? 'Start' : done ? 'Again' : r.t0 ? 'Pause' : 'Resume';
    $('startText').textContent = st;
    $('start').classList.toggle('u-key--signal', !running());
    $('start').classList.toggle('u-key--ink', running());
    $('skip').disabled = !r || done;
    var locked = !!(r && !done);
    document.querySelectorAll('.field .u-key, .presets__row .u-key').forEach(function (b) { b.disabled = locked; });
    $('lockNote').textContent = locked ? 'Reset to edit' : '';
  }

  var flashT = 0;
  function finish() {
    var r = state.run; r.acc = total * 1000; r.t0 = null; state.save();
    hero.classList.add('is-flash'); clearTimeout(flashT); flashT = setTimeout(function () { hero.classList.remove('is-flash'); }, 600);
  }

  /* ── Actions ── */
  function start() {
    if (!audio()) { /* no audio: still run silently */ }
    var r = state.run;
    if (!r || elapsed() >= total) { state.run = { acc: 0, t0: Date.now() }; if (state.sound && AC && plan[0]) cueAt(0.05, plan[0].k === 'work' ? 'work' : plan[0].k); }
    else if (!r.t0) r.t0 = Date.now();
    else { r.acc += Date.now() - r.t0; r.t0 = null; cancelCues(); state.save(); render(); return; }
    state.save(); cancelCues(); scheduleCues(); render();
  }
  function skip() {
    var r = state.run; if (!r) return;
    var e = elapsed(), i = phaseAt(e); if (i >= plan.length) return;
    var to = plan[i].at + plan[i].d;
    r.acc = to * 1000 - .5; if (r.t0) r.t0 = Date.now();
    state.save(); cancelCues();
    if (state.sound && AC && running() && plan[i + 1]) cueAt(to + .01, plan[i + 1].k);
    scheduleCues(); render();
  }
  function reset() { state.run = null; state.save(); cancelCues(); hero.classList.remove('is-flash'); lastIdx = -2; render(); }
  $('start').addEventListener('click', start);
  $('skip').addEventListener('click', skip);
  $('reset').addEventListener('click', reset);

  /* Presets */
  var pr = $('presets');
  Object.keys(PRESETS).forEach(function (k, i) {
    var b = document.createElement('button'); b.className = 'u-key'; b.dataset.k = k;
    b.innerHTML = '<span class="u-key__top"><span class="u-key__index">' + pad(i + 1) + '</span></span><span><span class="u-key__text">' + PRESETS[k].label + '</span><span class="preset__sub">' + (k === 'custom' ? 'Your setup' : PRESETS[k].sub) + '</span></span>';
    b.addEventListener('click', function () { state.preset = k; state.run = null; state.save(); cancelCues(); syncPresets(); build(); render(); });
    pr.appendChild(b);
  });
  function syncPresets() { Array.prototype.forEach.call(pr.children, function (b) { b.classList.toggle('is-sel', b.dataset.k === state.preset); b.setAttribute('aria-pressed', String(b.dataset.k === state.preset)); }); }

  /* Setup fields (editing switches to Custom) */
  var fieldsEl = $('fields');
  FIELDS.forEach(function (f) {
    var row = document.createElement('div'); row.className = 'field';
    row.innerHTML = '<span class="u-label">' + f[1] + '</span><span class="stepper"><button class="u-key u-key--sm" aria-label="Less ' + f[1] + '">−</button><output class="stepper__val"></output><button class="u-key u-key--sm" aria-label="More ' + f[1] + '">+</button></span>';
    var bs = row.querySelectorAll('button');
    function bump(d) {
      if (state.preset !== 'custom') { state.custom = Object.assign({}, cfg()); state.preset = 'custom'; syncPresets(); }
      state.custom[f[0]] = clamp(state.custom[f[0]] + d * f[4], f[2], f[3]); state.run = null; state.save(); build(); render();
    }
    bs[0].addEventListener('click', function (e) { bump(e.shiftKey && f[5] ? -0.2 : -1); });
    bs[1].addEventListener('click', function (e) { bump(e.shiftKey && f[5] ? 0.2 : 1); });
    row.dataset.k = f[0]; row.dataset.t = f[5] ? '1' : '';
    fieldsEl.appendChild(row);
  });
  function renderFields() {
    var c = cfg();
    Array.prototype.forEach.call(fieldsEl.children, function (row) { var v = c[row.dataset.k]; row.querySelector('output').textContent = row.dataset.t ? mmss(v) : pad(v); });
  }
  bindSwitch($('soundSw'), function () { return state.sound; }, function (v) { state.sound = v; state.save(); cancelCues(); scheduleCues(); });

  document.addEventListener('keydown', function (e) {
    if (inControl(e)) return;
    if (e.key === ' ') { e.preventDefault(); start(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); skip(); }
    else if (e.key === 'r' || e.key === 'R') reset();
  });

  syncPresets(); build();
  if (state.run && state.run.t0) { /* resumed after reload: audio needs a tap, visuals continue */ }
  render();
  (function loop() { render(); requestAnimationFrame(loop); })();
  setInterval(function () { render(); scheduleCues(); }, 1000);
})();
</script>
</body>
</html>
