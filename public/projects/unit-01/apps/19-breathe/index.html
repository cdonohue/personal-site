<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 01 — Breathe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* ── Unit 01 tokens ─────────────────────────────────────────── */
:root, [data-theme="light"] {
  --chassis:#ffffff; --panel:#ffffff; --panel-sunk:#f0f0ee; --ink:#000000; --ink-muted:#5f5f5c; --line:#c8c8c4; --rule:var(--ink);
  --signal:#ff5a1f; --signal-text:#a83400; --on-signal:#000000; --blue:#3a63d8; --on-blue:#ffffff; --yellow:#f5c400; --on-yellow:#111111;
  --key:#e6e6e3; --lcd:#0b0b0b; --lcd-ink:#f2f2ef; --lcd-muted:#8f8f8a; --lcd-dim:#2a2a2a; --focus:var(--ink);
  --shadow-key:0 2px 0 #00000040; --shadow-key-pressed:0 0 0 #00000040;
}
[data-theme="dark"] {
  --chassis:#000000; --panel:#000000; --panel-sunk:#161616; --ink:#ffffff; --ink-muted:#9b9b97; --line:#3a3a3a; --key:#262626; --rule:var(--ink);
  --signal-text:#ff7a45; --shadow-key:0 2px 0 #ffffff26; --shadow-key-pressed:0 0 0 #ffffff26;
}
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;
  --radius-0:0; --radius-sm:2px; --radius-md:6px; --radius-full:9999px;
  --font-sans:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* ── Unit 01 components (vanilla port of the bundle) ────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); background: var(--chassis); color: var(--ink); -webkit-font-smoothing: antialiased; }
:where(button, input, [role="slider"]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.u-label { display: inline-flex; gap: var(--space-2); align-items: baseline; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.u-label b { font-weight: 700; color: var(--ink); }
.u-value { font-family: var(--font-mono); font-size: 13px; line-height: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
.u-led { display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--line); flex: none; }
.u-key .u-led, .u-selector__opt .u-led { background: var(--line); }
.is-on > .u-led, .u-led.is-lit { background: var(--signal); }

.u-key { appearance: none; position: relative; display: inline-flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  min-width: 0; padding: var(--space-2); border: 0; border-radius: var(--radius-0); background: var(--key); color: var(--ink);
  font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: left;
  box-shadow: var(--shadow-key); cursor: pointer; transition: transform 60ms linear, box-shadow 60ms linear; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.u-key:active, .u-key.is-hit, .u-key[aria-pressed="true"] { transform: translateY(2px); box-shadow: var(--shadow-key-pressed); }
.u-key--ink { background: var(--ink); color: var(--chassis); }
.u-key--signal { background: var(--signal); color: var(--on-signal); }
.u-key--blue { background: var(--blue); color: var(--on-blue); }
.u-key--yellow { background: var(--yellow); color: var(--on-yellow); }
.u-key__top { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: var(--space-1); }
.u-key__index { font-family: var(--font-mono); font-weight: 500; font-size: 9px; line-height: 12px; letter-spacing: .1em; opacity: .75; }
.u-key__glyph { align-self: center; display: flex; }
.u-key__glyph svg { width: 22px; height: 22px; fill: currentColor; }
.u-key--sm { width: 40px; height: 40px; padding: 0; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0; }

.u-panel { background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: var(--radius-0); min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
.u-panel__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-3); }
.u-panel__head .u-label:first-child { font-size: 13px; line-height: 16px; color: var(--ink); }
.u-panel__body { padding: 0 0 var(--space-2); display: flex; flex-direction: column; gap: var(--space-4); flex: 1; }

.u-display { background: var(--lcd); color: var(--lcd-ink); border: 1px solid var(--line); border-radius: var(--radius-0); font-family: var(--font-mono); }
.u-display__label { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--lcd-muted); white-space: nowrap; }
.u-display__unit { font-size: 13px; line-height: 16px; color: var(--lcd-muted); text-transform: uppercase; letter-spacing: .08em; }

.u-selector { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-selector__row { display: flex; gap: 2px; border-radius: var(--radius-0); }
.u-selector__opt { appearance: none; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-2);
  background: var(--key); color: var(--ink); border: 0; font-family: var(--font-sans); font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.u-selector__opt:first-child { border-left: 0; }
.u-selector__opt.is-on { background: var(--ink); color: var(--chassis); }
.u-selector__opt:focus-visible { outline-offset: -4px; }

.u-switch { appearance: none; display: inline-flex; align-items: center; gap: var(--space-3); padding: var(--space-1) 0; background: none; border: 0; color: var(--ink); cursor: pointer; }
.u-switch__track { position: relative; width: 40px; height: 20px; background: var(--panel-sunk); border: 1px solid var(--ink); border-radius: var(--radius-sm); flex: none; }
.u-switch__thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 14px; background: var(--ink); border-radius: var(--radius-sm); transition: left 80ms linear; }
.u-switch[aria-checked="true"] .u-switch__track { background: var(--signal); }
.u-switch[aria-checked="true"] .u-switch__thumb { left: 20px; background: var(--on-signal); }
.u-switch__state { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .06em; min-width: 3ch; }

.u-fader { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.u-fader__head { display: flex; justify-content: space-between; align-items: baseline; }
.u-fader__input { appearance: none; -webkit-appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: ew-resize; }
.u-fader__input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-moz-range-track { height: 4px; background: linear-gradient(to right, var(--signal) var(--t), var(--panel-sunk) var(--t)); border: 1px solid var(--ink); }
.u-fader__input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 28px; margin-top: -13px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }
.u-fader__input::-moz-range-thumb { width: 14px; height: 28px; background: var(--ink); border: 0; border-radius: var(--radius-sm); }

.u-knob { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.u-knob__dial { border-radius: var(--radius-full); cursor: grab; touch-action: none; line-height: 0; }
.u-knob__tick { stroke: var(--line); stroke-width: 1.5; }
.u-knob__track { fill: none; stroke: var(--panel-sunk); stroke-width: 3; }
.u-knob__arc { fill: none; stroke: var(--signal); stroke-width: 3; }
.u-knob__cap { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.u-knob__ind { stroke: var(--ink); stroke-width: 3; stroke-linecap: square; }
.u-knob__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; }


/* ── App shell ── */
.shell { height: 100dvh; overflow: auto; container: shell / size; }
.device { min-height: 100%; display: grid; gap: var(--space-2); padding: var(--space-2); grid-template-columns: minmax(0, 1fr); }
.bar { display: none; grid-area: bar; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-1) var(--space-1) 0; container: bar / inline-size; min-width: 0; }
.bar__title { display: inline-flex; align-items: flex-start; gap: var(--space-2); font: 800 clamp(18px, 4.2cqi, 34px)/1 var(--font-sans); letter-spacing: -.025em; white-space: nowrap; }
.bar__idx { font: 500 9px/12px var(--font-mono); letter-spacing: .1em; color: var(--ink-muted); }
.bar__right { display: flex; align-items: center; gap: var(--space-4); }
.bar__meta { display: none; }
@container bar (min-width: 420px) { .bar__meta { display: inline-flex; } }
.rowsec { border-top: 2px solid var(--rule); padding-top: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; min-height: 0; }
.rowsec__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); min-height: 16px; }
.hero { container: hero / inline-size; display: flex; flex-direction: column; justify-content: space-between; gap: var(--space-2); padding: var(--space-3); min-height: 0; min-width: 0; overflow: hidden; transition: background 60ms linear; }
.hero__top, .hero__bottom { display: flex; justify-content: space-between; gap: var(--space-3); }
.hero__main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.hero .opt { display: none; }
@container hero (min-width: 260px) { .hero { padding: var(--space-4); } }
@container hero (min-width: 380px) { .hero .opt { display: inline; } }
.hero.is-flash { background: var(--signal); }
.hero.is-flash, .hero.is-flash .u-display__label, .hero.is-flash .u-display__unit { color: var(--on-signal); }
.transport { grid-area: transport; container: transport / inline-size; display: flex; gap: var(--space-2); min-width: 0; }
.transport .u-key { flex: 1 1 0; height: clamp(52px, 20cqi, 104px); }
.transport .k-main { flex-grow: 2; }
.transport .k-more { display: none; }
.u-key__glyph { font-size: clamp(16px, 5cqi, 26px); line-height: 1; }
@container transport (max-width: 199px) { .transport .u-key__text { font-size: 10px; } }
.stepper { display: flex; align-items: center; gap: var(--space-2); }
.stepper__val { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 20px; line-height: 40px; height: 40px; background: var(--panel-sunk); font-variant-numeric: tabular-nums; }
.mini { padding: var(--space-3); display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.mini__num { font-size: 24px; line-height: 24px; font-variant-numeric: tabular-nums; }
.u-key:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.u-key.is-sel { background: var(--ink); color: var(--chassis); }
@container (max-width: 300px) { .u-selector__opt .u-led { display: none; } }
@container shell (min-width: 300px) and (min-height: 360px) { .bar { display: flex; } }
@container shell (min-width: 300px) { .transport .k-more { display: inline-flex; } }
@container shell (min-width: 820px) and (max-height: 759px) {
  .device { padding: var(--space-4); }
  .u-panel__head { padding: var(--space-1) 0 var(--space-2); }
  .u-panel__body { padding: 0; gap: var(--space-3); }
}
@container shell (min-width: 820px) and (min-height: 540px) { .device { gap: var(--space-4); padding: var(--space-6); } }
@container shell (min-width: 1180px) and (min-height: 760px) { .device { padding: var(--space-8); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.device { grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "hero" "transport"; }
.hero { grid-area: hero; } .pattern { grid-area: pattern; } .p-custom { grid-area: custom; } .p-session { grid-area: session; } .p-diag { grid-area: diag; } .p-log { grid-area: log; }
.pattern, .p-custom, .p-session, .p-diag, .p-log { display: none; }

/* The breathing square */
.hero__main { position: relative; }
.stage { position: relative; width: clamp(56px, min(46cqi, 34cqb), 440px); aspect-ratio: 1; display: grid; place-items: center; }
.stage__frame { position: absolute; inset: 0; box-shadow: inset 0 0 0 1px var(--lcd-dim); }
.sq { position: absolute; inset: 0; background: var(--lcd-ink); transform: scale(.3); transform-origin: center; will-change: transform; }
.word { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #fff; mix-blend-mode: difference; pointer-events: none; }
.word__w { font-family: var(--font-sans); font-weight: 800; font-size: clamp(16px, min(11cqi, 8cqb), 104px); line-height: .9; letter-spacing: -.035em; text-transform: uppercase; }
.word__n { font-family: var(--font-mono); font-size: clamp(11px, min(4cqi, 3cqb), 32px); line-height: 1; font-variant-numeric: tabular-nums; }
.bar-fill { display: none; position: absolute; left: 0; bottom: 0; height: 100%; width: 0; background: var(--lcd-ink); }
.hero.is-done .stage__frame { box-shadow: inset 0 0 0 2px var(--signal); }
@media (prefers-reduced-motion: reduce) {
  .sq { display: none; }
  .bar-fill { display: block; }
}

.pattern { container: pattern / inline-size; }
.pattern .u-selector__row { width: 100%; }

.steps { display: grid; gap: var(--space-2) var(--space-4); }
.field { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); min-width: 0; }
.field .stepper__val { flex: none; width: 56px; font-size: 16px; height: 36px; line-height: 36px; }
.field .u-key--sm { width: 36px; height: 36px; }
.steps { grid-template-columns: 1fr; }
@container (min-width: 520px) { .steps { grid-template-columns: 1fr 1fr; } }

.diag { display: flex; gap: 2px; height: 56px; align-items: flex-end; }
.diag__b { position: relative; background: var(--key); min-width: 2px; }
.diag__b.is-now { background: var(--ink); }
.diag__lbls { display: flex; gap: 2px; }
.diag__lbls span { overflow: hidden; white-space: nowrap; }
.p-log .u-panel__body { flex: 1; min-height: 0; position: relative; }
.log { position: absolute; inset: 56px 0 0 0; overflow: auto; list-style: none; margin: 0; padding: 0; }
.log li { display: flex; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 18px; }
.log li .u-value { color: var(--ink-muted); }
.log__empty { color: var(--ink-muted); font-size: 13px; }

@container shell (max-height: 259px) { .hero__top { display: none; } .hero { padding: var(--space-2) var(--space-3); } }
/* Tiers */
@container shell (min-width: 300px) and (min-height: 360px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar" "hero" "transport"; }
}
@container shell (min-width: 300px) and (min-height: 540px) {
  .device { grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar" "hero" "pattern" "transport"; }
  .pattern { display: flex; }
}
@container shell (min-width: 520px) and (min-height: 760px) {
  .device { gap: var(--space-4); padding: var(--space-4); grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: auto minmax(0, 1fr) auto auto auto; grid-template-areas: "bar bar" "hero hero" "pattern pattern" "transport transport" "custom session"; }
  .p-custom, .p-session { display: flex; }
}
@container shell (min-width: 560px) and (max-height: 359px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(200px, 34cqi, 340px); grid-template-rows: minmax(0, 1fr); grid-template-areas: "hero transport"; }
}
@container shell (min-width: 560px) and (min-height: 360px) and (max-height: 539px) {
  .device { grid-template-columns: minmax(0, 1fr) clamp(220px, 34cqi, 360px); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "hero transport" "pattern transport"; }
  .pattern { display: flex; }
}
@container shell (min-width: 560px) and (max-height: 539px) {
  .transport { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 2fr 1fr; grid-template-areas: "main main" "len pat"; }
  .transport .u-key { height: auto; }
  .k-main { grid-area: main; } .k-len { grid-area: len; } .k-pat { grid-area: pat; }
}
@container shell (min-width: 820px) and (min-height: 540px) {
  .device { grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "bar bar" "hero custom" "pattern session" "transport session"; }
  .pattern, .p-custom, .p-session { display: flex; }
}
@container shell (min-width: 1180px) and (min-height: 760px) {
  .device { grid-template-columns: minmax(260px, .8fr) minmax(0, 1.6fr) minmax(320px, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto auto; grid-template-areas: "bar bar bar" "diag hero custom" "log hero session" "log pattern session" "log transport session"; }
  .pattern, .p-custom, .p-session, .p-diag, .p-log { display: flex; }
}
</style>
</head>
<body>
<div class="shell">
<main class="device">
  <header class="bar">
    <span class="bar__title"><span class="bar__idx">19</span>Breathe</span>
    <div class="bar__right">
      <span class="u-label bar__meta" id="barMeta">Box · 5 min</span>
      <button class="u-switch" role="switch" aria-checked="false" id="themeSw" aria-label="Dark theme">
        <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
        <span class="u-label">Dark</span>
      </button>
    </div>
  </header>

  <section class="hero u-display" id="hero" aria-label="Breathing guide">
    <div class="hero__top">
      <span class="u-display__label">Breathe</span>
      <span class="u-display__label opt" id="patOut">Box 4·4·4·4</span>
      <span class="u-display__label" id="cycOut">Cycle 00</span>
    </div>
    <div class="hero__main">
      <div class="stage" aria-hidden="true">
        <span class="stage__frame"></span>
        <span class="sq" id="sq"></span>
        <span class="bar-fill" id="barFill"></span>
        <span class="word"><span class="word__w" id="wordOut">Ready</span><span class="word__n" id="numOut">&nbsp;</span></span>
      </div>
    </div>
    <div class="hero__bottom">
      <span class="u-display__label" id="leftOut">Left 05:00</span>
      <span class="u-display__label opt" id="nextOut">Next —</span>
      <span class="u-display__label" id="elOut">00:00</span>
    </div>
    <span class="sr-only" id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></span>
  </section>

  <section class="pattern rowsec" aria-label="Pattern">
    <div class="rowsec__head"><span class="u-label"><b>01</b> Pattern</span><span class="u-label opt" id="patMeta">In · hold · out · hold</span></div>
    <div class="u-selector__row" role="radiogroup" aria-label="Pattern" id="patSel">
      <button class="u-selector__opt" role="radio" data-v="box"><span class="u-led"></span>Box</button>
      <button class="u-selector__opt" role="radio" data-v="478"><span class="u-led"></span>4-7-8</button>
      <button class="u-selector__opt" role="radio" data-v="coherent"><span class="u-led"></span>Even</button>
      <button class="u-selector__opt" role="radio" data-v="custom"><span class="u-led"></span>Custom</button>
    </div>
  </section>

  <section class="transport" aria-label="Controls">
    <button class="u-key k-len" id="lenKey" aria-label="Session length"><span class="u-key__top"><span class="u-key__index">L</span></span><span class="u-key__text" id="lenText">5 min</span></button>
    <button class="u-key u-key--signal k-main" id="start"><span class="u-key__top"><span class="u-key__index">Space</span></span><span class="u-key__text" id="startText">Start</span></button>
    <button class="u-key k-more k-pat" id="patKey" aria-label="Next pattern"><span class="u-key__top"><span class="u-key__index">P</span></span><span class="u-key__text" id="patText">Box</span></button>
  </section>

  <section class="u-panel p-custom" aria-label="Custom pattern">
    <header class="u-panel__head"><span class="u-label"><b>02</b> Custom</span><span class="u-label">Seconds</span></header>
    <div class="u-panel__body"><div class="steps" id="steps"></div></div>
  </section>

  <section class="u-panel p-session" aria-label="Session">
    <header class="u-panel__head"><span class="u-label"><b>03</b> Session</span><span class="u-label" id="sessMeta">5 min</span></header>
    <div class="u-panel__body">
      <div class="u-selector">
        <span class="u-label" id="lenLbl">Length</span>
        <div class="u-selector__row" role="radiogroup" aria-labelledby="lenLbl" id="lenSel">
          <button class="u-selector__opt" role="radio" data-v="1">1</button>
          <button class="u-selector__opt" role="radio" data-v="3">3</button>
          <button class="u-selector__opt" role="radio" data-v="5">5</button>
          <button class="u-selector__opt" role="radio" data-v="10">10</button>
          <button class="u-selector__opt" role="radio" data-v="0">∞</button>
        </div>
      </div>
      <button class="u-switch" role="switch" aria-checked="true" id="toneSw">
        <span class="u-switch__track" aria-hidden="true"><span class="u-switch__thumb"></span></span>
        <span class="u-label">Tone cues</span>
      </button>
    </div>
  </section>

  <section class="u-panel p-diag" aria-label="Pattern diagram">
    <header class="u-panel__head"><span class="u-label"><b>04</b> Shape</span><span class="u-label" id="diagMeta">16 s cycle</span></header>
    <div class="u-panel__body">
      <div class="diag" id="diag"></div>
      <div class="diag__lbls" id="diagLbls"></div>
    </div>
  </section>

  <section class="u-panel p-log" aria-label="Today">
    <header class="u-panel__head"><span class="u-label"><b>05</b> Today</span><span class="u-label" id="logMeta">0 min</span></header>
    <div class="u-panel__body">
      <div class="u-display mini"><span class="u-display__label">Minutes today</span><span class="mini__num" id="todayMin">00.0</span></div>
      <ul class="log" id="log"></ul>
    </div>
  </section>
</main>
</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n, w) { n = String(Math.max(0, Math.floor(n))); while (n.length < (w || 2)) n = '0' + n; return n; };
  var clamp = function (n, a, b) { return Math.min(b, Math.max(a, n)); };
  var mmss = function (sec) { sec = Math.max(0, Math.ceil(sec - 1e-6)); return pad(sec / 60) + ':' + pad(sec % 60); };
  function makeStore(key, defaults) {
    var s = JSON.parse(JSON.stringify(defaults));
    try { var v = JSON.parse(localStorage.getItem(key) || 'null'); if (v) Object.assign(s, v); } catch (e) {}
    s.save = function () { try { localStorage.setItem(key, JSON.stringify(s)); } catch (e) {} };
    return s;
  }
  function initTheme(state) {
    var sw = $('themeSw');
    function apply() {
      var dark = state.theme ? state.theme === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'; sw.setAttribute('aria-checked', String(dark));
    }
    sw.addEventListener('click', function () { state.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; apply(); state.save(); });
    apply();
  }
  var AC = null;
  function audio() {
    if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  /* A short enveloped tone at audio time t; returns the oscillator so it can be cancelled. */
  function tone(t, f, dur, peak, type) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak || .4, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .05);
    return o;
  }
  function inControl(e) { return e.target.closest && e.target.closest('button, input, select, textarea, [role="slider"]'); }
  function selector(el, get, set) {
    var opts = Array.prototype.slice.call(el.querySelectorAll('[role=radio]'));
    function sync() { opts.forEach(function (o) { var on = o.dataset.v === String(get()); o.classList.toggle('is-on', on); o.setAttribute('aria-checked', String(on)); o.tabIndex = on ? 0 : -1; }); }
    opts.forEach(function (o, i) {
      o.addEventListener('click', function () { set(o.dataset.v); sync(); });
      o.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
        if (!d) return; e.preventDefault(); var j = (i + d + opts.length) % opts.length; opts[j].click(); opts[j].focus();
      });
    });
    sync(); return sync;
  }
  function bindSwitch(el, get, set) {
    var sync = function () { el.setAttribute('aria-checked', String(!!get())); };
    el.addEventListener('click', function () { set(!get()); sync(); }); sync(); return sync;
  }
  var HEAD_SWITCH = '';

  var PATTERNS = {
    box: { label: 'Box', p: [4, 4, 4, 4] },
    '478': { label: '4-7-8', p: [4, 7, 8, 0] },
    coherent: { label: 'Even', p: [5.5, 0, 5.5, 0] },
    custom: { label: 'Custom', p: null }
  };
  var ORDER = ['box', '478', 'coherent', 'custom'], LENS = [1, 3, 5, 10, 0];
  var PH = [{ k: 'in', w: 'In', n: 'Inhale' }, { k: 'hold', w: 'Hold', n: 'Hold' }, { k: 'out', w: 'Out', n: 'Exhale' }, { k: 'hold2', w: 'Hold', n: 'Hold' }];
  var state = makeStore('unit01-breathe', { theme: null, pattern: 'box', custom: [4, 2, 6, 2], len: 5, tones: true, log: [] });
  initTheme(state);
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function pat() { return state.pattern === 'custom' ? state.custom : PATTERNS[state.pattern].p; }
  function cycleLen() { return pat().reduce(function (a, b) { return a + b; }, 0); }
  function fmt(n) { return (Math.round(n * 10) / 10).toString().replace(/\.0$/, ''); }
  function patText() { return PATTERNS[state.pattern].label + ' ' + pat().map(fmt).join('·'); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  /* Session (timestamps) */
  var run = null; /* {t0} */
  function el() { return run ? (Date.now() - run.t0) / 1000 : 0; }
  function where(t) {
    var p = pat(), L = cycleLen(), c = Math.floor(t / L), x = t - c * L;
    for (var i = 0; i < 4; i++) { if (p[i] > 0 && x < p[i]) return { i: i, f: x / p[i], left: p[i] - x, cycle: c }; x -= p[i]; }
    return { i: 3, f: 1, left: 0, cycle: c };
  }
  function nextPhase(i) { var p = pat(); for (var k = 1; k <= 4; k++) { var j = (i + k) % 4; if (p[j] > 0) return j; } return i; }

  var hero = $('hero'), sq = $('sq'), barFill = $('barFill'), lastPh = -1, lastCycle = -1;
  function scaleFor(w) { var MIN = .3, s; if (w.i === 0) s = MIN + (1 - MIN) * w.f; else if (w.i === 1) s = 1; else if (w.i === 2) s = 1 - (1 - MIN) * w.f; else s = MIN; return s; }
  function render() {
    var lim = state.len * 60, t = el();
    if (run && lim && t >= lim) { stop(true); return; }
    if (!run) {
      $('wordOut').textContent = hero.classList.contains('is-done') ? 'Done' : 'Ready'; $('numOut').innerHTML = '&nbsp;';
      sq.style.transform = 'scale(.3)'; barFill.style.width = '0';
      $('leftOut').textContent = state.len ? 'Left ' + mmss(lim) : 'Open session';
      $('elOut').textContent = '00:00'; $('nextOut').textContent = 'Next ' + PH[0].n;
      return;
    }
    var w = where(t);
    $('wordOut').textContent = PH[w.i].w; $('numOut').textContent = Math.ceil(w.left - 1e-6);
    sq.style.transform = 'scale(' + scaleFor(w).toFixed(4) + ')';
    barFill.style.width = (w.i === 0 ? w.f : w.i === 1 ? 1 : w.i === 2 ? 1 - w.f : 0) * 100 + '%';
    $('cycOut').textContent = 'Cycle ' + pad(w.cycle + 1);
    $('leftOut').textContent = state.len ? 'Left ' + mmss(lim - t) : 'Open session';
    $('elOut').textContent = mmss(t);
    $('nextOut').textContent = 'Next ' + PH[nextPhase(w.i)].n;
    if (w.i !== lastPh || w.cycle !== lastCycle) {
      if (lastPh !== -1) cue(w.i);
      $('live').textContent = PH[w.i].n;
      lastPh = w.i; lastCycle = w.cycle; syncDiag(w.i);
    }
  }
  function cue(i) {
    if (!state.tones || !AC) return;
    var t = AC.currentTime + .01, f = { 0: 528, 1: 0, 2: 396, 3: 0 }[i];
    if (f) tone(t, f, 1.2, .12, 'sine'); else tone(t, 440, .5, .05, 'sine');
  }
  function start() {
    audio(); hero.classList.remove('is-done');
    run = { t0: Date.now() }; lastPh = -1; lastCycle = -1;
    if (state.tones && AC) tone(AC.currentTime + .01, 528, 1.2, .12);
    syncStart(); render();
  }
  function stop(completed) {
    var t = el();
    if (run && t >= 20) {
      state.log.push({ d: today(), at: Date.now(), sec: Math.round(state.len ? Math.min(t, state.len * 60) : t), p: state.pattern });
      state.log = state.log.slice(-200); state.save();
    }
    run = null; lastPh = -1; syncDiag(-1);
    if (completed) { hero.classList.add('is-done'); if (state.tones && AC) [396, 528, 660].forEach(function (f, i) { tone(AC.currentTime + i * .25, f, 1.4, .1); }); }
    syncStart(); renderLog(); render();
  }
  function toggle() { run ? stop(false) : start(); }
  function syncStart() {
    $('startText').textContent = run ? 'Stop' : 'Start';
    $('start').classList.toggle('u-key--signal', !run); $('start').classList.toggle('u-key--ink', !!run);
  }

  /* Pattern, length, custom */
  function syncAll() {
    $('patOut').textContent = patText(); $('patText').textContent = PATTERNS[state.pattern].label;
    $('lenText').textContent = state.len ? state.len + ' min' : 'Open';
    $('sessMeta').textContent = state.len ? state.len + ' min' : 'Open';
    $('barMeta').textContent = PATTERNS[state.pattern].label + ' · ' + (state.len ? state.len + ' min' : 'open');
    $('patMeta').textContent = pat().map(fmt).join(' · ') + ' s';
    syncPat(); syncLen(); renderSteps(); renderDiag(); render();
  }
  var syncPat = selector($('patSel'), function () { return state.pattern; }, function (v) { state.pattern = v; state.save(); restartIfRunning(); syncAll(); });
  var syncLen = selector($('lenSel'), function () { return state.len; }, function (v) { state.len = +v; state.save(); syncAll(); });
  function restartIfRunning() { if (run) { run.t0 = Date.now(); lastPh = -1; } }
  $('patKey').addEventListener('click', function () { state.pattern = ORDER[(ORDER.indexOf(state.pattern) + 1) % ORDER.length]; state.save(); restartIfRunning(); syncAll(); });
  $('lenKey').addEventListener('click', function () { state.len = LENS[(LENS.indexOf(state.len) + 1) % LENS.length]; state.save(); syncAll(); });
  $('start').addEventListener('click', toggle);
  bindSwitch($('toneSw'), function () { return state.tones; }, function (v) { state.tones = v; state.save(); if (v) audio(); });

  var stepsEl = $('steps');
  PH.forEach(function (ph, i) {
    var row = document.createElement('div'); row.className = 'field';
    row.innerHTML = '<span class="u-label">' + (i === 3 ? 'Hold (empty)' : ph.n) + '</span><span class="stepper"><button class="u-key u-key--sm" aria-label="Shorter ' + ph.n + '">−</button><output class="stepper__val"></output><button class="u-key u-key--sm" aria-label="Longer ' + ph.n + '">+</button></span>';
    var bs = row.querySelectorAll('button');
    function bump(d) {
      if (state.pattern !== 'custom') { state.custom = pat().slice(); state.pattern = 'custom'; }
      var min = i === 0 || i === 2 ? 1 : 0;
      state.custom[i] = clamp(Math.round((state.custom[i] + d) * 2) / 2, min, 20); state.save(); restartIfRunning(); syncAll();
    }
    bs[0].addEventListener('click', function () { bump(-.5); }); bs[1].addEventListener('click', function () { bump(.5); });
    stepsEl.appendChild(row);
  });
  function renderSteps() { var p = pat(); Array.prototype.forEach.call(stepsEl.children, function (row, i) { row.querySelector('output').textContent = fmt(p[i]) + 's'; }); }

  function renderDiag() {
    var p = pat(), L = cycleLen(), d = $('diag'), lb = $('diagLbls'); d.innerHTML = ''; lb.innerHTML = '';
    var H = [ [.3, 1], [1, 1], [1, .3], [.3, .3] ];
    p.forEach(function (s, i) {
      if (!s) return;
      var b = document.createElement('span'); b.className = 'diag__b'; b.dataset.i = i; b.style.flex = s + ' 1 0';
      b.style.height = (Math.max(H[i][0], H[i][1]) * 100) + '%';
      if (i === 0) b.style.clipPath = 'polygon(0 70%, 100% 0, 100% 100%, 0 100%)';
      if (i === 2) b.style.clipPath = 'polygon(0 0, 100% 70%, 100% 100%, 0 100%)';
      if (i === 3) b.style.height = '30%';
      d.appendChild(b);
      var l = document.createElement('span'); l.className = 'u-label'; l.style.flex = s + ' 1 0'; l.textContent = PH[i].w + ' ' + fmt(s); lb.appendChild(l);
    });
    $('diagMeta').textContent = fmt(L) + ' s cycle · ' + fmt(60 / L) + '/min';
    syncDiag(run ? lastPh : -1);
  }
  function syncDiag(i) { Array.prototype.forEach.call($('diag').children, function (b) { b.classList.toggle('is-now', +b.dataset.i === i); }); }

  function renderLog() {
    var t = today(), items = state.log.filter(function (x) { return x.d === t; }), ul = $('log'); ul.innerHTML = '';
    var sec = items.reduce(function (a, x) { return a + x.sec; }, 0);
    $('todayMin').textContent = (sec / 60).toFixed(1).padStart(4, '0'); $('logMeta').textContent = items.length + ' session' + (items.length === 1 ? '' : 's');
    if (!items.length) { ul.innerHTML = '<li class="log__empty">No sessions yet today.</li>'; return; }
    items.slice().reverse().forEach(function (x) {
      var d = new Date(x.at), li = document.createElement('li');
      li.innerHTML = '<span>' + (PATTERNS[x.p] ? PATTERNS[x.p].label : x.p) + '</span><span class="u-value">' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' · ' + mmss(x.sec) + '</span>';
      ul.appendChild(li);
    });
  }

  document.addEventListener('keydown', function (e) {
    if (inControl(e)) return;
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') $('lenKey').click();
    else if (e.key === 'p' || e.key === 'P') $('patKey').click();
  });

  syncAll(); syncStart(); renderLog();
  (function loop() { if (run) render(); requestAnimationFrame(loop); })();
  setInterval(function () { if (run) render(); }, 500);
})();
</script>
</body>
</html>
