<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!--
    The window from the desk scene, drawn on a 16px grid so it is real pixel art
    at the size a favicon is actually seen rather than a curve sampled down to
    one. crispEdges keeps the mullions hard at every zoom.

    The window rather than the monitor or a monogram: at 16px a monitor loses its
    stand and initials turn to mush, while a four-pane grid still reads. It is
    also the part of the scene that shows the real weather.

    #bacaff is the daylight glass from the art, which is also the site's accent.
  -->
  <rect width="16" height="16" fill="#32343c"/>
  <rect x="1" y="1" width="6" height="6" fill="#bacaff"/>
  <rect x="9" y="1" width="6" height="6" fill="#bacaff"/>
  <rect x="1" y="9" width="6" height="6" fill="#bacaff"/>
  <rect x="9" y="9" width="6" height="6" fill="#bacaff"/>
</svg>
