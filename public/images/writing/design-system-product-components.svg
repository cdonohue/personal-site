  <rect class="dot" x="54" y="68" width="12" height="12" rx="2" />
  <rect class="dot" x="74" y="68" width="12" height="12" rx="2" />
  <!-- Another container -->
  <rect class="container" x="46" y="108" width="128" height="36" rx="6" />
  <rect class="dot" x="54" y="118" width="12" height="12" rx="2" />
  <rect class="dot" x="74" y="118" width="12" height="12" rx="2" />
  <rect class="dot" x="94" y="118" width="12" height="12" rx="2" />
  <rect class="dot" x="114" y="118" width="12" height="12" rx="2" />
  <rect class="dot" x="134" y="118" width="12" height="12" rx="2" />
  <rect class="dot" x="154" y="118" width="12" height="12" rx="2" />

  <!-- Card 2 -->
