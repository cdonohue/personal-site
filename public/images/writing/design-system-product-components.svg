  <rect class="dot" x="234" y="118" width="12" height="12" rx="2" />
  <rect class="dot" x="254" y="118" width="12" height="12" rx="2" />
  <rect class="dot" x="274" y="118" width="12" height="12" rx="2" />
  <rect class="dot" x="294" y="118" width="12" height="12" rx="2" />
  <rect class="dot" x="314" y="118" width="12" height="12" rx="2" />
  <rect class="dot" x="334" y="118" width="12" height="12" rx="2" />
