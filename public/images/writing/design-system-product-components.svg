<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <style>
    .dot { fill: var(--gray-2, #ebe7e3); }
    .container { fill: var(--gray-5, #99917f); }
    .card { stroke: var(--gray-5, #99917f); stroke-width: 2; fill: none; }
  </style>
  <!-- App components: styled containers grouped into cards -->

  <!-- Card 1 -->
  <rect class="card" x="30" y="40" width="160" height="120" rx="10" />
  <!-- Container inside card -->
