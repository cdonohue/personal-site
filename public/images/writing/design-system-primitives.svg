<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <style>
    .dot { fill: var(--gray-5, #99917f); }
    .outline { stroke: var(--gray-5, #99917f); stroke-width: 2; fill: none; }
  </style>
  <!-- Primitives: hollow containers wrapping grouped dots -->
  <!-- Container 1 -->
  <rect class="outline" x="50" y="70" width="60" height="56" rx="6" />
  <rect class="dot" x="60" y="90" width="16" height="16" rx="3" />
  <rect class="dot" x="84" y="90" width="16" height="16" rx="3" />

  <!-- Container 2 -->
  <rect class="outline" x="130" y="70" width="84" height="56" rx="6" />
  <rect class="dot" x="140" y="90" width="16" height="16" rx="3" />
  <rect class="dot" x="164" y="90" width="16" height="16" rx="3" />
  <rect class="dot" x="188" y="90" width="16" height="16" rx="3" />

  <!-- Container 3 -->
  <rect class="outline" x="234" y="70" width="108" height="56" rx="6" />
  <rect class="dot" x="244" y="90" width="16" height="16" rx="3" />
  <rect class="dot" x="268" y="90" width="16" height="16" rx="3" />
  <rect class="dot" x="292" y="90" width="16" height="16" rx="3" />
  <rect class="dot" x="316" y="90" width="16" height="16" rx="3" />
</svg>
